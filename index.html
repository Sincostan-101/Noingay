const Sound = {
  ctx:null, master:null, nodes:[], cur:null, bufs:{},
  ensure(){
    if(!this.ctx){
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return false;
      const ctx = this.ctx = new C();
      this.analyser = ctx.createAnalyser(); this.analyser.fftSize = 256; this.analyser.smoothingTimeConstant = 0.8;
      this.bus = ctx.createGain();                       /* gom mọi nguồn nhạc */
      this.vol = ctx.createGain(); this.vol.gain.value = store.music.vol;  /* âm lượng đặt sau dải âm để dải âm không phụ thuộc âm lượng */
      this.bus.connect(this.analyser); this.analyser.connect(this.vol); this.vol.connect(ctx.destination);
      this.master = ctx.createGain(); this.master.connect(this.bus);
    }
    if(this.ctx.state === "suspended") this.ctx.resume();
    return true;
  },
  noise(type){
    if(this.bufs[type]) return this.bufs[type];
    const ctx = this.ctx, len = ctx.sampleRate * 6, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      if(type === "brown"){ last = (last + 0.02*w)/1.02; d[i] = last*3.5; }
      else { b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.969*b2+w*0.153852; b3=0.8665*b3+w*0.3104856; b4=0.55*b4+w*0.5329522; b5=-0.7616*b5-w*0.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; }
    }
    return this.bufs[type] = buf;
  },
  src(type){ const n = this.ctx.createBufferSource(); n.buffer = this.noise(type); n.loop = true; this.nodes.push(n); return n; },
  osc(freq, type){ const o = this.ctx.createOscillator(); o.type = type || "sine"; o.frequency.value = freq; this.nodes.push(o); return o; },
  gain(v){ const g = this.ctx.createGain(); g.gain.value = v; this.nodes.push(g); return g; },
  play(id){
    this.stop();
    if(!this.ensure()) return;
    const ctx = this.ctx, out = this.gain(0);
    out.connect(this.master);
    out.gain.setValueAtTime(0, ctx.currentTime); out.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.5);
    if(id === "brown" || id === "pink"){ const n = this.src(id); n.connect(this.gain(id==="brown"?0.9:0.6)).connect(out); n.start(); }
    if(id === "rain"){
      const n = this.src("pink"), hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g = this.gain(0.7);
      hp.type = "highpass"; hp.frequency.value = 500; lp.type = "lowpass"; lp.frequency.value = 7000; this.nodes.push(hp, lp);
      const lfo = this.osc(0.13), lg = this.gain(0.25); lfo.connect(lg).connect(g.gain);
      n.connect(hp).connect(lp).connect(g).connect(out);
      const b = this.src("brown"); b.connect(this.gain(0.35)).connect(out);
      n.start(); b.start(); lfo.start();
    }
    if(id === "alpha" || id === "beta"){
      const beat = id === "alpha" ? 10 : 16, base = 200, m = ctx.createChannelMerger(2); this.nodes.push(m);
      const l = this.osc(base), r = this.osc(base + beat);
      l.connect(this.gain(0.18)).connect(m, 0, 0); r.connect(this.gain(0.18)).connect(m, 0, 1);
      m.connect(out);
      const bed = this.src("pink"); bed.connect(this.gain(0.12)).connect(out);
      l.start(); r.start(); bed.start();
    }
    if(id === "hz432"){
      const pad = this.gain(1), lfo = this.osc(0.08), lg = this.gain(0.25);
      pad.gain.value = 0.75; lfo.connect(lg).connect(pad.gain);
      [[108,0.10],[216,0.12],[324,0.07],[432,0.06],[540,0.025]].forEach(([f,v]) => { const o = this.osc(f); o.connect(this.gain(v)).connect(pad); o.start(); });
      pad.connect(out); lfo.start();
    }
    this.out = out; this.cur = id;
    Viz.start();
  },
  stop(){
    for(const n of this.nodes){ try{ if(n.stop) n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }
    this.nodes = []; this.cur = null; this.out = null;
  },
  setVol(v){ store.music.vol = v; if(this.vol) this.vol.gain.setTargetAtTime(this.ducked ? v*0.15 : v, this.ctx.currentTime, 0.05); },
  duck(on){ this.ducked = on; if(this.vol) this.vol.gain.setTargetAtTime(on ? store.music.vol*0.15 : store.music.vol, this.ctx.currentTime, 0.1); }
};

const Viz = {
  raf:0, data:null,
  start(){ if(!this.raf) this.raf = requestAnimationFrame(() => this.draw()); },
  draw(){
    this.raf = 0;
    const c = document.getElementById("viz"), an = Sound.analyser;
    if(c && an){
      const g = c.getContext("2d"), w = c.width, h = c.height, n = 14, bw = w / n;
      if(!this.data) this.data = new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(this.data);
      g.clearRect(0, 0, w, h);
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#23944f";
      for(let i = 0; i < n; i++){
        const k = Math.min(this.data.length - 1, 1 + Math.floor(Math.pow(i / n, 1.6) * this.data.length * 0.6));
        const bh = Math.max(4, (this.data[k] / 255) * h);
        const x = i * bw + 2, y = (h - bh) / 2, r = Math.min(4, (bw - 4) / 2);
        g.beginPath(); if(g.roundRect) g.roundRect(x, y, bw - 4, bh, r); else g.rect(x, y, bw - 4, bh); g.fill();
      }
    }
    if(Sound.cur || Radio.cur) this.raf = requestAnimationFrame(() => this.draw());
  }
};

const TTS = {
  voices: [], current: null,
  load(){ try{ this.voices = speechSynthesis.getVoices() || []; }catch(e){ this.voices = []; } },
  list(lang){
    const base = LANG_INFO[lang].tts.toLowerCase().slice(0,2);
    return this.voices.filter(v => (v.lang||"").replace("_","-").toLowerCase().startsWith(base));
  },
  pick(lang){
    const pref = LANG_INFO[lang].tts.toLowerCase();
    const list = this.list(lang);
    if(!list.length) return null;
    const chosen = (store.prefs.voice || {})[lang];
    if(chosen){ const c = list.find(v => v.voiceURI === chosen); if(c) return c; }
    const exact = list.filter(v => v.lang.replace("_","-").toLowerCase() === pref);
    const pool = exact.length ? exact : list;
    return pool.find(v => /natural|google|neural|premium|enhanced/i.test(v.name)) || pool[0];
  },
  has(lang){ return !!this.pick(lang); },
  speak(text, lang, onend){
    if(!("speechSynthesis" in window)){ onend && onend(); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG_INFO[lang].tts;
      const v = this.pick(lang); if(v) u.voice = v;
      u.rate = store.prefs.slow ? 0.7 : 0.95;
      let done = false;
      const fin = () => { if(done) return; done = true; this.current = null; onend && onend(); };
      u.onend = fin; u.onerror = fin;
      this.current = u;
      speechSynthesis.speak(u);
    }catch(e){ onend && onend(); }
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};
if("speechSynthesis" in window){
  TTS.load();
  try{ speechSynthesis.onvoiceschanged = () => { TTS.load(); render(); }; }catch(e){}
}

/* ===================== NHẬN GIỌNG NÓI ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const Rec = {
  dict: null,            // dictation của Claude (khi mở trong Claude)
  dictBad: {},           // ngôn ngữ mà dictation báo không hỗ trợ
  srBlocked: false,      // trình duyệt chặn micro
  active: null,          // {key, lang, cb, buffer, timers}
  mode(lang){
    if(this.dict && !this.dictBad[lang]) return "claude";
    if(SR && !this.srBlocked) return "browser";
    return "none";
  },
  listen(key, lang, cb){
    const m = this.mode(lang);
    if(m === "claude") return this._dictStart(key, lang, cb);
    if(m === "browser") return this._srStart(key, lang, cb);
    cb({error:"none"});
  },
  stop(){
    const a = this.active; if(!a) return;
    if(a.kind === "claude"){ try{ this.dict.stop().catch(()=>{}); }catch(e){} }
    else if(a.sr){ try{ a.sr.stop(); }catch(e){} }
  },
  _finish(result){
    const a = this.active; if(!a) return;
    clearTimeout(a.idle); clearTimeout(a.max);
    this.active = null;
    a.cb(result);
  },
  _dictStart(key, lang, cb){
    const a = {key, lang, cb, kind:"claude", buffer:"", idle:null, max:null};
    this.active = a;
    // gọi start() ngay trong cú bấm, không await gì trước đó
    this.dict.start({language: LANG_INFO[lang].dict}).catch(err => {
      const code = err && err.code;
      if(this.active !== a) return;
      if(code === "unavailable"){ this.dictBad[lang] = true; this._finish({error:"switch"}); }
      else if(code === "not_granted"){ this.dictBad[lang] = true; this._finish({error:"denied"}); }
      else if(code === "stopped"){ this._finish({texts:[a.buffer.trim()].filter(Boolean)}); }
      else this._finish({error:"failed"});
    });
    a.max = setTimeout(() => this.stop(), 12000);
    renderMicStates();
  },
  _onFinal(text){
    const a = this.active; if(!a || a.kind !== "claude") return;
    a.buffer += text;
    clearTimeout(a.idle);
    a.idle = setTimeout(() => this.stop(), 1400);
  },
  _onState(e){
    const a = this.active; if(!a || a.kind !== "claude") return;
    if(e.state === "idle"){
      if(e.reason === "unavailable"){ this.dictBad[a.lang] = true; this._finish({error:"switch"}); return; }
      if(e.reason === "not_granted"){ this.dictBad[a.lang] = true; this._finish({error:"denied"}); return; }
      this._finish({texts:[a.buffer.trim()].filter(Boolean)});
    }
  },
  _srStart(key, lang, cb){
    let sr;
    try{ sr = new SR(); }catch(e){ this.srBlocked = true; cb({error:"switch"}); return; }
    const a = {key, lang, cb, kind:"browser", sr, texts:[], idle:null, max:null};
    this.active = a;
    sr.lang = LANG_INFO[lang].rec;
    sr.interimResults = false;
    sr.maxAlternatives = 3;
    sr.continuous = false;
    sr.onresult = (ev) => {
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const res = ev.results[i];
        for(let j = 0; j < res.length; j++) a.texts.push(res[j].transcript);
      }
    };
    sr.onerror = (ev) => {
      if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){ this.srBlocked = true; if(this.active===a) this._finish({error:"denied"}); }
      else if(ev.error === "no-speech"){ if(this.active===a) this._finish({texts:[]}); }
      else if(this.active===a) this._finish({error:"failed"});
    };
    sr.onend = () => { if(this.active === a) this._finish({texts:a.texts}); };
    try{ sr.start(); }catch(e){ this.srBlocked = true; this._finish({error:"switch"}); return; }
    a.max = setTimeout(() => this.stop(), 12000);
    renderMicStates();
  }
};

/* ===================== CHẤM ĐIỂM ===================== */
function expandEn(s){
  return s.toLowerCase()
    .replace(/[’`]/g,"'")
    .replace(/\bcan't\b/g,"can not").replace(/\bwon't\b/g,"will not")
    .replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are")
    .replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would")
    .replace(/'s\b/g," is");
}
function tokensEn(s){ return expandEn(s).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean); }
function isHan(ch){ return /[㐀-鿿]/.test(ch); }
function tokensZh(s){ return Array.from(s.toLowerCase()).filter(ch => isHan(ch) || /[a-z0-9]/.test(ch)); }
function stripTones(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ü/g,"u").replace(/v/g,"u").toLowerCase(); }
function lettersPy(s){ return Array.from(stripTones(s).replace(/[^a-z0-9]/g,"")); }
function lcsInfo(a, b){
  const n=a.length, m=b.length, dp=[];
  for(let i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); }
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const matched = new Array(n).fill(false);
  let i=n, j=m;
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  return {len: dp[n][m], matched};
}
function scoreOne(targetToks, heardToks){
  if(!targetToks.length || !heardToks.length) return {score:0, matched:new Array(targetToks.length).fill(false)};
  const r = lcsInfo(targetToks, heardToks);
  return {score: Math.round(200 * r.len / (targetToks.length + heardToks.length)), matched: r.matched};
}
/* Trả về {score, heard, html} — html là câu mẫu tô màu chỗ khớp/thiếu */
function evaluate(item, lang, texts, typed){
  const cands = (texts || []).filter(Boolean);
  if(!cands.length) return {score:0, heard:"", html:esc(item.t), empty:true};
  const targets = [item.t].concat(item.alt || []);
  let best = {score:-1};
  for(const h of cands){
    const pinyinTyped = lang==="zh" && typed && !/[㐀-鿿]/.test(h);
    for(const t of targets){
      let r;
      if(pinyinTyped){ r = scoreOne(lettersPy(item.p || ""), lettersPy(h)); r.pinyin = true; }
      else r = scoreOne(lang==="en" ? tokensEn(t) : tokensZh(t), lang==="en" ? tokensEn(h) : tokensZh(h));
      if(r.score > best.score) best = Object.assign({heard:h, isMain: t===item.t}, r);
    }
  }
  let html = esc(item.t);
  if(!best.pinyin && best.isMain) html = diffHtml(item.t, lang, best.matched);
  return {score: best.score, heard: best.heard, html, pinyin: !!best.pinyin};
}
function diffHtml(text, lang, matched){
  let k = 0, out = "";
  if(lang === "en"){
    const words = text.split(/(\s+)/);
    for(const w of words){
      if(/^\s+$/.test(w)){ out += w; continue; }
      const toks = tokensEn(w);
      if(!toks.length){ out += esc(w); continue; }
      let ok = true; for(let x=0;x<toks.length;x++){ if(!matched[k+x]) ok=false; }
      k += toks.length;
      out += `<span class="${ok?"ok":"miss"}">${esc(w)}</span>`;
    }
  } else {
    for(const ch of Array.from(text)){
      if(isHan(ch) || /[a-z0-9]/i.test(ch)){ out += `<span class="${matched[k]?"ok":"miss"}">${esc(ch)}</span>`; k++; }
      else out += esc(ch);
    }
  }
  return out;
}
function grade(score){ return score>=85 ? "good" : score>=60 ? "warn" : "bad"; }
function gradeText(score){ return score>=85 ? "Tuyệt vời!" : score>=60 ? "Khá tốt, nói lại cho rõ hơn nhé." : "Chưa khớp, nghe mẫu rồi thử lại."; }

}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pqStart(lesson){
  const items = lesson.pairs.map(pair => ({pair: Math.random()<.5 ? pair.slice() : pair.slice().reverse(), ans: Math.random()<.5 ? 0 : 1}));
  ui.pq = {items: shuffle(items), i:0, picked:null, correct:0};
  ui.playingKey = null;
}
function renderPronQuiz(lesson, lang){
  const q = ui.pq, p = pprog(lesson.id);
  if(!q){
    return `<div class="summary">
      <b>Nghe và chọn đúng từ</b>
      <span>Máy đọc một trong hai từ chỉ khác nhau một âm. Bạn chọn từ vừa nghe được. Có ${lesson.pairs.length} câu.</span>
      ${p.quiz!=null?`<span><span class="pill ${grade(p.quiz)}">Cao nhất: ${p.quiz} điểm</span></span>`:""}
      <div class="row"><button class="btn" data-act="pqstart">${ICON_PLAY} Bắt đầu</button></div></div>`;
  }
  if(q.i >= q.items.length){
    const sc = Math.round(100 * q.correct / q.items.length);
    return `<div class="summary">
      <span>Hoàn thành phần phân biệt</span>
      <span class="big">${q.correct}/${q.items.length} câu đúng</span>
      <span class="status">${sc>=85?"Tai bạn đã phân biệt tốt các âm này!":"Nghe lại các từ ví dụ ở bước 1 rồi làm thêm một lượt nhé."}</span>
      <div class="row"><button class="btn" data-act="step" data-v="3">Tiếp: Nói thử →</button>
      <button class="btn ghost" data-act="pqstart">Làm lại</button></div></div>`;
  }
  const it = q.items[q.i];
  const label = o => lang==="zh" ? o.p : o.t;
  const opts = it.pair.map((o, k) => {
    let cls = "";
    if(q.picked != null){ if(k === it.ans) cls = "right"; else if(k === q.picked) cls = "wrong"; }
    const sub = lang==="zh" ? `<span class="vi zh">${esc(o.t)}${store.prefs.showVi&&o.v?" · "+esc(o.v):""}</span>` : (q.picked!=null && store.prefs.showVi && o.v ? `<span class="vi">${esc(o.v)}</span>` : "");
    return `<button class="qopt ${cls}" data-act="pqpick" data-v="${k}" ${q.picked!=null?"disabled":""}><span class="t">${esc(label(o))}</span>${sub}</button>`;
  }).join("");
  let fb = "";
  if(q.picked != null){
    const ok = q.picked === it.ans;
    fb = `<div class="result ${ok?"good":"bad"}"><span class="score">${ok?"Chính xác!":"Chưa đúng."}</span>
      <span>Máy đọc “${esc(label(it.pair[it.ans]))}”. Bấm vào từng từ dưới đây để nghe lại và so sánh.</span></div>
      <div class="exs">${it.pair.map((o,k) => exBtn(o, lang, `Q${k}`)).join("")}</div>
      <div class="row"><button class="btn small" data-act="pqnext">${q.i+1<q.items.length?"Câu tiếp →":"Xem kết quả →"}</button></div>`;
  }
  return `<div class="turn">
    <h4>Câu ${q.i+1}/${q.items.length}</h4>
    <div class="row"><button class="btn small" data-act="say" data-key="Q">${ui.playingKey==="Q"?ICON_STOP:ICON_PLAY} Nghe lại</button><span class="status">Bạn nghe thấy từ nào?</span></div>
    <div class="qopts">${opts}</div>
    ${fb}</div>`;
}

function micStatus(lang){

  return `<span class="pill warn">Chưa dùng được micro</span> Bạn có thể gõ câu trả lời để tự kiểm tra${lang==="zh"?" (gõ chữ Hán hoặc bính âm đều được)":""}.`;

function renderLesson(){

  const stepBtns = STEP_NAMES.map((n,i) => {
    const locked = i===3 && !prog(lesson.id).role;

function lineHtml(line, lang, key, opts){
  opts = opts || {};
  const you = line.r === "B";
  const who = you ? "Bạn" : esc(curLesson().lesson.partner);
  const text = opts.hide ? `<div class="t ${lang} hidden-target" aria-hidden="true">${esc(line.t)}</div>` : `<div class="t ${lang}">${esc(line.t)}</div>`;
  const py = lang==="zh" && store.prefs.showPy && line.p && !opts.hide ? `<div class="py">${esc(line.p)}</div>` : "";
  const vi = store.prefs.showVi || opts.forceVi ? `<div class="vi">${esc(line.v)}</div>` : "";
  const playing = ui.playingKey === key;
  return `<div class="msg ${you?"you":""}">
    <button class="play" data-act="say" data-key="${key}" aria-label="Nghe câu này">${playing?ICON_STOP:ICON_PLAY}</button>
    <div><div class="who">${who}</div><div class="bubble ${playing?"playing":""}">${text}${py}${vi}</div></div></div>`;
}
function renderListen(lesson, lang){

function speakBlock(item, lang, key){
  const res = ui.results[key];
  const listening = Rec.active && Rec.active.key === key;
  let resHtml = "";
  if(res){
    if(res.error) resHtml = `<div class="result bad">${esc(res.error)}</div>`;
    else if(res.empty) resHtml = `<div class="result bad"><span class="score">Chưa nghe thấy gì</span><span>Hãy nói to, rõ và gần micro hơn rồi thử lại.</span></div>`;
    else resHtml = `<div class="result ${grade(res.score)}">
        <span class="score">${res.score} điểm · ${gradeText(res.score)}</span>
        <span class="diff">${res.html}</span>
        <span class="heard">${res.pinyin?"Bạn gõ":"Máy nghe được"}: “${esc(res.heard)}”</span></div>`;
  }
  const typing = ui.typing[key] || Rec.mode(lang) === "none";
  const typeBox = typing ? `<form class="typebox" data-act="typed" data-key="${key}">
      <input id="in-${key}" name="ans" autocomplete="off" placeholder="${lang==="zh"?"Gõ chữ Hán hoặc bính âm…":"Gõ câu bạn sẽ nói…"}" aria-label="Gõ câu trả lời">
      <button class="btn small" type="submit">Kiểm tra</button></form>` : "";
  const micBtn = Rec.mode(lang) !== "none"
    ? `<button class="mic ${listening?"listening":""}" data-act="mic" data-key="${key}">${ICON_MIC} ${listening?"Đang nghe… bấm để dừng":"Bấm và nói"}</button>` : "";
  const typeToggle = Rec.mode(lang) !== "none" ? `<button class="linkbtn" data-act="toggletype" data-key="${key}">${ui.typing[key]?"Ẩn ô gõ":"Gõ thay vì nói"}</button>` : "";
  return `<div class="row">${micBtn}${typeToggle}</div>${typeBox}${resHtml}`;
}

function renderRole(lesson, lang){
  const rp = ui.rp;

      <b>Bạn sẽ đóng vai người bên phải.</b>
      <span>${esc(lesson.partner)} nói trước bằng giọng đọc. Đến lượt bạn, màn hình chỉ hiện nghĩa tiếng Việt. Hãy tự nói câu tiếng ${lang==="zh"?"Trung":"Anh"}. Bí quá thì bấm “Gợi ý”.</span>

  let html = "";
  for(let i=0; i<rp.idx && i<lesson.lines.length; i++){

    if(lesson.lines[i].r==="B" && r) html += `<div class="status" style="align-self:flex-end">${r.skipped?'<span class="pill warn">Bỏ qua</span>':`<span class="pill ${grade(r.score)}">${r.score} điểm</span>`}</div>`;
  }
  let turn = "";
  if(rp.idx < lesson.lines.length){
    const ln = lesson.lines[rp.idx];
    if(ln.r === "A"){
      html += lineHtml(ln, lang, `R${rp.idx}`);
      turn = `<div class="status">${esc(lesson.partner)} đang nói…</div>`;
    } else {
      const key = `R${rp.idx}`;
      const res = ui.results[key];
      const passed = res && !res.error && !res.empty;
      turn = `<div class="turn">
        <h4>Đến lượt bạn</h4>
        <div class="prompt">${esc(ln.v)}</div>
        ${rp.revealed?`<div class="t ${lang}">${esc(ln.t)}</div>${lang==="zh"&&store.prefs.showPy?`<div class="py">${esc(ln.p)}</div>`:""}`:`<button class="linkbtn" data-act="reveal">Gợi ý: xem câu mẫu</button>`}
        ${speakBlock(ln, lang, key)}
        <div class="row">
          ${passed?`<button class="btn small" data-act="rpnext">Tiếp tục →</button>`:""}
          <button class="btn small ghost" data-act="say" data-key="${key}">${ICON_PLAY} Nghe câu mẫu</button>
          ${!passed?`<button class="linkbtn" data-act="rpskip">Bỏ qua câu này</button>`:""}
        </div></div>`;
    }
  } else {
    const scored = rp.results.filter(r => r && !r.skipped);
    const avg = scored.length ? Math.round(scored.reduce((s,r)=>s+r.score,0)/scored.length) : 0;
    turn = `<div class="summary">
      <span>Hoàn thành đóng vai</span>
      <span class="big">${avg} điểm</span>
      <span class="status">${scored.length}/${rp.results.filter(Boolean).length} câu đã nói. ${avg>=85?"Bạn đã sẵn sàng dùng tình huống này ngoài đời thật!":"Thử thêm một lượt để nói trôi chảy hơn nhé."}</span>
      <div class="row"><button class="btn" data-act="step" data-v="3">Mở phần “Vì sao nói vậy?” →</button>
      <button class="btn ghost" data-act="rpstart">Đóng vai lại</button></div></div>`;
  }
  return `<div class="chat">${html}</div>${turn}`;
}
function renderNotes(lesson, lang){
  if(!prog(lesson.id).role) return `<div class="locked">Hoàn thành bước Đóng vai để mở phần giải thích. Nói được trước, hiểu sau.</div>`;
  const notes = lesson.notes.map(n => `<div class="note"><h4 class="${lang}">${esc(n.h)}</h4><p class="${lang}">${esc(n.b)}</p></div>`).join("");
  return `<div class="list">${notes}</div>
    <div class="next"><button class="btn" data-act="step" data-v="4">Tiếp: Từ vựng →</button></div>`;
}
function renderVocab(lesson, lang){
  const p = prog(lesson.id); if(!p.vocab){ p.vocab = true; saveStore(); }
  const words = vocabOf(lesson.id);
  const L = lessonsOf(lang); const idx = L.findIndex(x => x.id===lesson.id); const nxt = L[idx+1];
  return `<div class="row"><button class="btn" data-act="vocaball">${ui.playAll?ICON_STOP+" Dừng":ICON_PLAY+" Nghe cả danh sách"}</button>
      <span class="status">${words.length} từ nên học sau bài này. Bấm vào từng từ để nghe.</span></div>
    <div class="vgrid">${words.map((w,i) => exBtn(w, lang, `V${i}`)).join("")}</div>
    <div class="next">${nxt?`<button class="btn" data-act="open" data-id="${nxt.id}">Bài tiếp theo: ${esc(nxt.title)} →</button>`:`<button class="btn ghost" data-act="home">Về danh sách bài</button>`}</div>`;
}
function playVocabFrom(i){
  const c = curLesson(); if(!ui.playAll || !c) return;
  const w = vocabOf(c.lesson.id);
  if(i >= w.length){ ui.playAll = false; render(); return; }
  sayKey(`V${i}`, () => { if(ui.playAll) setTimeout(() => playVocabFrom(i+1), 400); });
}
function renderVocabSection(){
  const L = store.prefs.lang, all = lessonsOf(L); let k = 0;
  const blocks = UNITS.map(u => { const part = all.slice(k, k + u.n); const start = k; k += u.n;
    return `<h3 class="grp-h">${esc(u.name)}</h3>` + part.map((les, j) => { const li = start + j;
      return `<div class="vblock"><div class="vhead"><b>${li+1}. ${esc(les.title)}</b><button class="linkbtn" data-act="open" data-id="${les.id}">Mở bài luyện nói</button></div>
        <div class="vgrid">${vocabOf(les.id).map((w,i) => exBtn(w, L, `W${li}_${i}`)).join("")}</div></div>`; }).join(""); }).join("");
  return `<section class="intro"><h2 class="intro-h">Từ vựng ${L==="zh"?"tiếng Trung":"tiếng Anh"} theo bài</h2>
      <p>${all.reduce((n, les) => n + vocabOf(les.id).length, 0)} từ cơ bản đi kèm ${all.length} bài luyện nói. Bấm vào từ để nghe phát âm.</p></section>
    <div class="page wide">${voiceWarn(L)}${blocks}</div>`;
}
function renderMicStates(){ render(); }
function voicePicker(lang){
  const list = TTS.list(lang);
  if(list.length < 2) return "";
  const cur = TTS.pick(lang);
  const opts = list.map(v => `<option value="${esc(v.voiceURI)}" ${cur && cur.voiceURI===v.voiceURI?"selected":""}>${esc(v.name.replace(/^(Microsoft|Google)\s+/,"").replace(/\s+Online \(Natural\)/," (Natural)"))} · ${esc(v.lang)}</option>`).join("");
  return `<label class="voicepick" for="voice-sel">Giọng đọc <select id="voice-sel" data-act="voice">${opts}</select></label>`;
}

/* ===================== HÀNH ĐỘNG ===================== */
function itemByKey(key){
  if(ui.section === "pron"){
    const c = curPron(); if(!c) return null;
    const lesson = c.lesson;
    if(key[0]==="X"){ const [s,e] = key.slice(1).split("_").map(Number); return lesson.sounds[s] && lesson.sounds[s].ex[e]; }
    if(key[0]==="S") return lesson.speak[parseInt(key.slice(1),10)];
    if(key[0]==="Q"){
      const q = ui.pq; if(!q || q.i >= q.items.length) return null;
      const it = q.items[q.i];
      return key.length > 1 ? it.pair[+key[1]] : it.pair[it.ans];
    }
    return null;
  }
  if(ui.section === "vocab"){
    const [li, i] = key.slice(1).split("_").map(Number), les = lessonsOf(store.prefs.lang)[li];
    return les ? vocabOf(les.id)[i] : null;
  }
  const c = curLesson(); if(!c) return null;
  const lesson = c.lesson;
  if(key[0]==="V") return vocabOf(lesson.id)[parseInt(key.slice(1), 10)];
  const n = parseInt(key.slice(1), 10);
  if(key[0]==="L" || key[0]==="R") return lesson.lines[n];
  if(key[0]==="P") return lesson.phrases[n];
}
function sayKey(key, onend){
  const lang = curLang();
  const item = itemByKey(key);
  if(!item){ onend && onend(); return; }
  if(ui.playingKey === key && !onend){ TTS.stop(); ui.playingKey = null; render(); return; }
  ui.playingKey = key; render();
  TTS.speak(item.t, lang, () => {
    if(ui.playingKey === key){ ui.playingKey = null; render(); }
    onend && onend();
  });
}
function playAllFrom(i){
  const {lesson} = curLesson();
  if(!ui.playAll) return;
  if(i >= lesson.lines.length){
    ui.playAll = false; prog(lesson.id).listen = true; saveStore(); render(); return;
  }
  sayKey(`L${i}`, () => { if(ui.playAll) setTimeout(() => playAllFrom(i+1), 350); });
}
function handleResult(key, out, typed){
  const lang = curLang();
  const item = itemByKey(key);
  if(!item) return;
  if(out.error === "switch"){ ui.results[key] = {error:"Không dùng được micro theo cách này. Hãy bấm micro lần nữa, hoặc gõ câu trả lời."}; render(); return; }
  if(out.error === "denied"){ ui.typing[key] = true; ui.results[key] = {error:"Micro đang bị chặn. Bạn hãy cho phép micro trong trình duyệt, hoặc gõ câu trả lời ở ô bên dưới."}; render(); return; }
  if(out.error === "failed"){ ui.results[key] = {error:"Micro gặp lỗi. Thử lại sau vài giây, hoặc gõ câu trả lời."}; render(); return; }
  if(out.error === "none"){ ui.typing[key] = true; render(); return; }
  const r = evaluate(item, lang, out.texts, typed);
  ui.results[key] = r;
  if(ui.section === "pron"){
    if(key[0]==="S" && !r.empty){
      const i = parseInt(key.slice(1),10), p = pprog(curPron().lesson.id);
      p.speak[i] = Math.max(p.speak[i] || 0, r.score); saveStore();
    }
    render(); return;
  }
  const {lesson} = curLesson();
  if(key[0]==="P" && !r.empty){
    const i = parseInt(key.slice(1),10), p = prog(lesson.id);
    p.phrases[i] = Math.max(p.phrases[i] || 0, r.score); saveStore();
  }
  if(key[0]==="R" && ui.rp && !r.empty){
    const i = parseInt(key.slice(1),10);
    ui.rp.results[i] = {score:r.score};
  }
  render();
}
function rpAdvance(){
  const {lesson} = curLesson();
  const rp = ui.rp; if(!rp) return;
  if(rp.idx >= lesson.lines.length){
    const scored = rp.results.filter(r => r && !r.skipped);
    const p = prog(lesson.id);
    p.role = true; p.roleScore = scored.length ? Math.round(scored.reduce((s,r)=>s+r.score,0)/scored.length) : 0;
    saveStore(); render(); return;
  }
  const ln = lesson.lines[rp.idx];
  rp.revealed = false;
  render();
  if(ln.r === "A"){
    const myIdx = rp.idx;
    sayKey(`R${myIdx}`, () => {
      if(ui.rp === rp && rp.idx === myIdx){ rp.idx++; setTimeout(rpAdvance, 300); }
    });
  }
}
document.addEventListener("click", (ev) => {
  if(ui.menuOpen && !ev.target.closest(".side")){
    ui.menuOpen = false;
    const list = document.getElementById("side-list"), tg = document.querySelector(".side-toggle");
    if(list){ list.classList.remove("open"); list.setAttribute("inert",""); }
    if(tg) tg.setAttribute("aria-expanded","false");
  }
  const el = ev.target.closest("[data-act]");
  if(ui.pomoOpen && !ev.target.closest(".pomo")){ ui.pomoOpen = false; ui.pomoMsg = null; if(!el) render(); }
  if(ui.musicOpen && !ev.target.closest(".music")){ ui.musicOpen = false; if(!el) render(); }
  if(!el || el.tagName === "FORM") return;
  const act = el.dataset.act;
  if(act === "pomo"){ ui.pomoOpen = !ui.pomoOpen; if(!ui.pomoOpen) ui.pomoMsg = null; render(); return; }
  if(act === "pomotoggle"){ if(store.pomo.running) Pomo.pause(); else Pomo.start(); ui.pomoMsg = null; render(); Pomo.tick(); return; }
  if(act === "pomoreset"){ Pomo.reset(); ui.pomoMsg = null; render(); Pomo.tick(); return; }
  if(act === "music"){ ui.musicOpen = !ui.musicOpen; render(); return; }
  if(act === "musictab"){ store.music.tab = el.dataset.v; saveStore(); render(); return; }
  if(act === "radio"){ if(Radio.cur === el.dataset.v) Radio.stop(); else Radio.play(el.dataset.v); render(); Viz.start(); return; }
  if(act === "sound"){ if(Sound.cur === el.dataset.v) Sound.stop(); else Sound.play(el.dataset.v); render(); Viz.start(); return; }
  if(act === "pomocfg"){ store.pomo.showCfg = !store.pomo.showCfg; saveStore(); render(); return; }
  if(act === "pomopreset"){ const pr = POMO_PRESETS.find(p => p.id === el.dataset.v); if(pr){ Pomo.setCfg(pr.cfg); render(); Pomo.tick(); } return; }
  if(act === "pomomode"){ Pomo.setMode(el.dataset.v); ui.pomoMsg = null; render(); Pomo.tick(); return; }
  if(act === "voice") return;
  if(act === "menu"){
    ui.menuOpen = !ui.menuOpen;
    const open = ui.menuOpen, list = document.getElementById("side-list");
    el.setAttribute("aria-expanded", String(open));
    if(list){ list.classList.toggle("open", open); if(open) list.removeAttribute("inert"); else list.setAttribute("inert",""); }
    return;
  }
  if(act === "section"){ ui.menuOpen = false; TTS.stop(); Rec.stop(); ui.section = el.dataset.v; ui.view = "home"; ui.rp = null; ui.pq = null; ui.playAll = false; ui.playingKey = null; render(); window.scrollTo(0,0); return; }
  if(act === "theme"){ store.prefs.theme = store.prefs.theme === "dark" ? "light" : "dark"; saveStore(); applyTheme(); render(); return; }
  if(act === "lang"){ store.prefs.lang = el.dataset.v; saveStore(); TTS.stop(); Rec.stop(); ui.view="home"; ui.rp=null; ui.pq=null; ui.playAll=false; ui.playingKey=null; render(); return; }
  if(act === "popen"){ TTS.stop(); Rec.stop(); ui.section="pron"; ui.view="lesson"; ui.pid=el.dataset.id; ui.step=0; ui.results={}; ui.typing={}; ui.pq=null; ui.playAll=false; ui.playingKey=null;
    const c = curPron(); if(c){ store.prefs.lang = c.lang; saveStore(); } render(); window.scrollTo(0,0); return; }
  if(act === "pqstart"){ TTS.stop(); const c = curPron(); if(!c) return; pqStart(c.lesson); render(); setTimeout(() => { if(ui.section==="pron" && ui.pq) sayKey("Q", () => {}); }, 250); return; }
  if(act === "pqpick"){
    const q = ui.pq; if(!q || q.picked != null) return;
    q.picked = +el.dataset.v;
    if(q.picked === q.items[q.i].ans) q.correct++;
    TTS.stop(); ui.playingKey = null; render(); return;
  }
  if(act === "pqnext"){
    const q = ui.pq; if(!q) return;
    TTS.stop(); ui.playingKey = null;
    q.i++; q.picked = null;
    if(q.i >= q.items.length){
      const c = curPron(), p = pprog(c.lesson.id);
      p.quiz = Math.max(p.quiz || 0, Math.round(100 * q.correct / q.items.length)); saveStore();
      render(); return;
    }
    render(); setTimeout(() => { if(ui.section==="pron" && ui.pq) sayKey("Q", () => {}); }, 250); return;
  }
  if(act === "open"){ TTS.stop(); Rec.stop(); ui.section="speak"; ui.view="lesson"; ui.lessonId=el.dataset.id; ui.step=0; ui.results={}; ui.typing={}; ui.rp=null; ui.playAll=false; ui.playingKey=null;
    const c = curLesson(); if(c){ store.prefs.lang = c.lang; saveStore(); } render(); window.scrollTo(0,0); return; }
  if(act === "home"){ TTS.stop(); Rec.stop(); ui.view="home"; ui.rp=null; ui.pq=null; ui.playAll=false; ui.playingKey=null; render(); window.scrollTo(0,0); return; }
  if(act === "step"){ TTS.stop(); Rec.stop(); ui.step = +el.dataset.v; ui.playAll=false; ui.playingKey=null; ui.pq=null; if(ui.step!==2) ui.rp=null; render(); window.scrollTo(0,0); return; }
  if(act === "pref"){ const k = el.dataset.v; store.prefs[k] = !store.prefs[k]; saveStore(); render(); return; }
  if(act === "say"){
    ui.playAll = false;
    const key = el.dataset.key;
    if(ui.section === "pron" && key[0] === "X"){
      const s = +key.slice(1).split("_")[0], c = curPron();
      if(c){ const p = pprog(c.lesson.id); if(!p.listen[s]){ p.listen[s] = true; saveStore(); } }
    }
    sayKey(key); return;
  }
  if(act === "vocaball"){
    if(ui.playAll){ ui.playAll=false; TTS.stop(); ui.playingKey=null; render(); return; }
    ui.playAll = true; playVocabFrom(0); return;
  }
  if(act === "playall"){
    if(ui.playAll){ ui.playAll=false; TTS.stop(); ui.playingKey=null; render(); return; }
    ui.playAll = true; playAllFrom(0); return;
  }
  if(act === "mic"){
    const key = el.dataset.key;
    if(Rec.active){ if(Rec.active.key === key){ Rec.stop(); } return; }
    TTS.stop(); ui.playingKey = null; ui.playAll = false;
    const lang = curLang();
    ui.results[key] = null;
    muteForMic(true);
    Rec.listen(key, lang, (out) => { muteForMic(false); handleResult(key, out, false); });
    return;
  }
  if(act === "toggletype"){ const k = el.dataset.key; ui.typing[k] = !ui.typing[k]; render(); const inp = document.getElementById("in-"+k); if(inp) inp.focus(); return; }
  if(act === "rpstart"){ TTS.stop(); Rec.stop(); ui.results = {}; ui.typing = {}; ui.rp = {idx:0, revealed:false, results:[]}; rpAdvance(); return; }
  if(act === "reveal"){ if(ui.rp){ ui.rp.revealed = true; render(); } return; }
  if(act === "rpnext"){ if(ui.rp){ ui.rp.idx++; rpAdvance(); } return; }
  if(act === "rpskip"){ if(ui.rp){ ui.rp.results[ui.rp.idx] = {skipped:true, score:0}; ui.rp.idx++; rpAdvance(); } return; }
});
document.addEventListener("input", (ev) => {
  const v = ev.target.closest("input[data-music-vol]");
  if(v){ Sound.setVol(+v.value); }
});
document.addEventListener("change", (ev) => {
  if(ev.target.closest("input[data-music-vol]")){ saveStore(); return; }
  const pc = ev.target.closest("input[data-pomo-cfg]");
  if(pc){ Pomo.setCfg({[pc.dataset.pomoCfg]: pc.value}); render(); Pomo.tick(); return; }
  const sel = ev.target.closest("select[data-act='voice']");
  if(!sel) return;
  const lang = curLang();
  store.prefs.voice = Object.assign({}, store.prefs.voice || {}, {[lang]: sel.value});
  saveStore();
  TTS.speak(lang==="zh" ? "你好，我是你的新声音。" : "Hi! This is your new voice.", lang);
});
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("form[data-act='typed']");
  if(!f) return;
  ev.preventDefault();
  const key = f.dataset.key;
  const val = (f.querySelector("input").value || "").trim();
  if(!val) return;
  handleResult(key, {texts:[val]}, true);
});

render();
