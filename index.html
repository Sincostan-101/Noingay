   Chủ đề và thứ tự tham khảo English Vocabulary in Use (Cambridge) và giáo trình chuẩn HSK / Hán ngữ;
   từ chọn theo Oxford 3000/5000 (CEFR) và HSK 3.0, nghĩa tiếng Việt do SFY biên soạn.
   Học bằng 3 cách: danh sách, thẻ ghi nhớ, kiểm tra. Điểm XP, chuỗi ngày học và bảng xếp hạng ở cuối. */
const VT_TOPICS = (() => {
  const out = [];
  for(const t of VT_RAW){
    const T = {id:t.id, icon:t.icon, name:t.name};
    for(const lang of ["en","zh"]) {
      T[lang] = {};
      for(const part of ["b","a"]){
        const lv = t[lang][part + "lv"];
        T[lang][part] = t[lang][part].split("|").map((x, i) => { const it = pItem(x, lang); it.lv = +lv[i]; return it; });
      }
    }
    out.push(T);
  }
  return out;
})();
const VT_PART = {b:"Cơ bản", a:"Nâng cao"};
function vtState(){
  const v = store.vocab = store.vocab || {};
  v.known = v.known || {}; v.days = v.days || {}; v.xp = v.xp || 0; v.badges = v.badges || {};
  if(!v.uid) v.uid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  return v;
}
function vtToday(d = new Date()){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function vtWeek(dstr){ const d = new Date(dstr + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return vtToday(d); }
function vtKey(lang, it){ return lang + ":" + it.t; }
function vtStreak(){
  const v = vtState(); let n = 0; const d = new Date();
  if(!v.days[vtToday(d)]) d.setDate(d.getDate() - 1);
  while(v.days[vtToday(d)]){ n++; d.setDate(d.getDate() - 1); }

function vtOrder(items, L){ const v = vtState(); const idx = items.map((_, i) => i); const un = shuffle(idx.filter(i => !v.known[vtKey(L, items[i])])), kn = shuffle(idx.filter(i => v.known[vtKey(L, items[i])])); return un.concat(kn); }

/* Bảng xếp hạng chung: dùng Supabase (bảng sfy_board). Điền BOARD_CFG.url và key (anon key) để bật.
   Khi chưa điền, bảng chỉ hiện điểm trên máy này. */
const BOARD_CFG = {url:"", key:""};
const Board = {
  rows:null, err:null, loading:false, last:0,
  on(){ return !!(BOARD_CFG.url && BOARD_CFG.key); },
  hdr(){ return {apikey:BOARD_CFG.key, Authorization:"Bearer " + BOARD_CFG.key, "Content-Type":"application/json"}; },
  async load(){
    if(!this.on() || this.loading) return; this.loading = true;
    try{ const r = await fetch(`${BOARD_CFG.url}/rest/v1/sfy_board?select=uid,name,xp,week,week_xp&order=xp.desc&limit=30`, {headers:this.hdr()}); this.rows = await r.json(); this.err = Array.isArray(this.rows) ? null : "Không đọc được bảng"; }
    catch(e){ this.err = "Không kết nối được máy chủ"; }
    this.loading = false; if(ui.section === "profile" && ui.prof === "rank") render();
  },
  push(){
    const v = vtState(); if(!this.on() || !v.name) return;
    if(Date.now() - this.last < 5000){ clearTimeout(this.t); this.t = setTimeout(() => this.push(), 5000); return; }
    this.last = Date.now();
    const wk = vtWeek(vtToday()); let wx = 0; for(const [d, x] of Object.entries(v.days)) if(vtWeek(d) === wk) wx += x;
    fetch(`${BOARD_CFG.url}/rest/v1/sfy_board`, {method:"POST", headers:Object.assign({Prefer:"resolution=merge-duplicates"}, this.hdr()),
      body:JSON.stringify({uid:v.uid, name:v.name.slice(0, 24), xp:v.xp, week:wk, week_xp:wx})}).catch(() => {});
  },
  view(){
    const v = vtState();
    const nameRow = ""; /* ô đặt tên hiển thị đã chuyển lên đầu trang Hồ sơ */
    if(!this.on()) return `${nameRow}<table class="vt-table"><tr class="me"><td>#1</td><td>${esc(v.name || "Bạn")}</td><td><b>${v.xp}</b> XP</td></tr></table>
      <p class="vt-note">Bảng xếp hạng chung giữa các người học sẽ ra mắt khi SFY có tài khoản người dùng. Hiện điểm chỉ lưu trên máy này.</p>`;
    if(!this.rows && !this.err){ this.load(); return nameRow + `<p class="vt-note">Đang tải bảng xếp hạng…</p>`; }
    if(this.err) return nameRow + `<p class="vt-note">${esc(this.err)}. <button class="linkbtn" data-act="vtreload">Thử lại</button></p>`;
    const list = this.rows.map((r, i) => `<tr class="${r.uid === v.uid ? "me" : ""}"><td>${["🥇","🥈","🥉"][i] || "#" + (i + 1)}</td><td>${esc(r.name || "Ẩn danh")}</td><td><b>${r.xp}</b> XP</td></tr>`).join("");
    return nameRow + `<table class="vt-table">${list}</table>${v.name ? "" : `<p class="vt-note">Đặt tên hiển thị để điểm của bạn xuất hiện trên bảng chung.</p>`}`;
  }
};
function vtAct(act, el){
  ui.vt = ui.vt || {topic:null, part:"b", mode:"list"};
  const v = vtState(), L = store.prefs.lang;
  if(act === "vtopen"){ ui.vt = {topic:el.dataset.v, part:"b", mode:"list"}; { const T = VT_TOPICS.find(x => x.id === el.dataset.v); if(T) Hist.add({kind:"vt", key:"v:" + T.id + L, id:T.id, lang:L, title:T.icon + " " + T.name}); } render(); window.scrollTo(0,0); return true; }
  if(act === "vthome"){ ui.vt = {topic:null, part:"b", mode:"list"}; render(); window.scrollTo(0,0); return true; }
  if(act === "vtnotebook"){ ui.vt = {view:"notebook"}; render(); window.scrollTo(0,0); return true; }
  if(act === "vtlessons"){ ui.vt = {view:"lessons"}; render(); window.scrollTo(0,0); return true; }
  if(act === "vtrank"){ ui.section = "profile"; ui.view = "home"; ui.prof = "rank"; Board.rows = null; Board.err = null; render(); window.scrollTo(0,0); return true; }
  if(act === "proftab"){ ui.section = "profile"; ui.prof = el.dataset.v === "rank" ? "rank" : "ach"; if(ui.prof === "rank"){ Board.rows = null; Board.err = null; } render(); return true; }
  if(act === "vtreload"){ Board.rows = null; Board.err = null; render(); return true; }
  if(act === "vtname"){ const inp = document.querySelector("[data-vt-name]"); v.name = (inp ? inp.value : "").trim().slice(0, 24); saveStore(); Board.last = 0; Board.push(); Board.rows = null; setTimeout(() => { Board.rows = null; render(); }, 800); render(); return true; }
  if(act === "vtpart"){ ui.vt.part = el.dataset.v; ui.vt.card = null; ui.vt.quiz = null; render(); return true; }
  if(act === "vtmode"){ ui.vt.mode = el.dataset.v; ui.vt.card = null; ui.vt.quiz = null; render(); return true; }
  const items = vtItems();
  if(act === "vtknow"){ const it = items[+el.dataset.v], k = vtKey(L, it); if(v.known[k]) delete v.known[k]; else { v.known[k] = 1; vtAddXP(2); } saveStore(); render(); return true; }
  if(act === "vtflip"){ const c = ui.vt.card; if(c){ c.flip = !c.flip; if(c.flip) sayKey(`T${ui.vt.part}${c.order[c.i]}`); else render(); } return true; }
  if(act === "vtcard"){ const c = ui.vt.card; if(!c) return true; const it = items[c.order[c.i]], k = vtKey(L, it);
    if(el.dataset.v === "1"){ if(!v.known[k]){ v.known[k] = 1; vtAddXP(2); } } else delete v.known[k];
    saveStore(); c.i++; c.flip = false; TTS.stop(); ui.playingKey = null; render(); return true; }
  if(act === "vtcardsreset"){ ui.vt.card = null; render(); return true; }
  if(act === "vtpick"){ const q = ui.vt.quiz; if(!q || q.picked != null) return true; q.picked = +el.dataset.v; const qq = q.qs[q.i];
    if(q.picked === qq.ans){ q.correct++; const k = vtKey(L, items[qq.idx]); v.known[k] = 1; vtAddXP(10); } render(); return true; }
  if(act === "vtnext"){ const q = ui.vt.quiz; if(q){ q.i++; q.picked = null; if(q.i >= q.qs.length){ const T = VT_TOPICS.find(x => x.id === ui.vt.topic); Hist.add({kind:"vtquiz", key:"vq:" + ui.vt.topic, id:ui.vt.topic, lang:L, title:T ? T.name : "", sub:`${q.correct}/${q.qs.length} câu đúng`}); } render(); if(q.i < q.qs.length) sayKey(`T${ui.vt.part}${q.qs[q.i].idx}`); } return true; }
  if(act === "vtquizreset"){ ui.vt.quiz = null; render(); return true; }
  return false;
}

function achCheck(){

    const st = achState(), first = !store.achInit; let changed = false;
    for(const a of ACH_LIST){
      if(st[a.id]) continue;

      if(p >= 1){ st[a.id] = vtToday(); changed = true; if(!first){ ACH.queue.push(a); Hist.add({kind:"ach", key:"a:" + a.id, lang:a.lang === "both" ? "" : a.lang, title:a.name}); } }

/* ===================== HÀNH ĐỘNG ===================== */
function itemByKey(key){
  if(ui.section === "pron"){
    const c = curPron(); if(!c) return null;
    const lesson = c.lesson;
    if(key[0]==="X"){ const [s,e] = key.slice(1).split("_").map(Number); return lesson.sounds[s] && lesson.sounds[s].ex[e]; }
    if(key[0]==="S") return lesson.speak[parseInt(key.slice(1),10)];
    if(key[0]==="Q"){
      const q = ui.pq; if(!q || q.i >= q.items.length) return null;
      const it = q.items[q.i];
      return key.length > 1 ? it.pair[+key[1]] : it.pair[it.ans];
    }
    return null;
  }
  if(ui.section === "vocab" && key[0] === "T"){ const T = VT_TOPICS.find(x => x.id === (ui.vt || {}).topic); return T ? T[store.prefs.lang][key[1]][+key.slice(2)] : null; }
  if(ui.section === "vocab"){
    const [li, i] = key.slice(1).split("_").map(Number), les = lessonsOf(store.prefs.lang)[li];
    return les ? vocabOf(les.id)[i] : null;
  }
  const c = curLesson(); if(!c) return null;
  const lesson = c.lesson;
  if(key[0]==="V") return vocabOf(lesson.id)[parseInt(key.slice(1), 10)];
  const n = parseInt(key.slice(1), 10);
  if(key[0]==="L" || key[0]==="R") return lesson.lines[n];
  if(key[0]==="P") return lesson.phrases[n];
}
function sayKey(key, onend){
  const lang = curLang();
  const item = itemByKey(key);
  if(!item){ onend && onend(); return; }
  if(ui.playingKey === key && !onend){ TTS.stop(); ui.playingKey = null; render(); return; }
  ui.playingKey = key; render();
  /* từ ví dụ trong phần Phát âm: đọc chậm hơn cho người mới (bật "Đọc chậm" thì chậm hơn nữa) */
  const exSlow = (ui.section === "pron" && /^X/.test(key)) || (ui.section === "vocab" && /^T/.test(key)) ? {rate: store.prefs.slow ? 0.25 : 0.5} : null;
  TTS.speak(item.t, lang, () => {
    if(ui.playingKey === key){ ui.playingKey = null; render(); }
    onend && onend();
  }, exSlow);
}
function playAllFrom(i){
  const {lesson} = curLesson();
  if(!ui.playAll) return;
  if(i >= lesson.lines.length){
    ui.playAll = false; prog(lesson.id).listen = true; saveStore(); render(); return;
  }
  sayKey(`L${i}`, () => { if(ui.playAll) setTimeout(() => playAllFrom(i+1), 350); });
}
function handleResult(key, out, typed){
  const lang = curLang();
  const item = itemByKey(key);
  if(!item) return;
  if(out.error === "switch"){ ui.results[key] = {error:"Không dùng được micro theo cách này. Hãy bấm micro lần nữa, hoặc gõ câu trả lời."}; render(); return; }
  if(out.error === "denied"){ ui.typing[key] = true; ui.results[key] = {error:"Micro đang bị chặn. Bạn hãy cho phép micro trong trình duyệt, hoặc gõ câu trả lời ở ô bên dưới."}; render(); return; }
  if(out.error === "failed"){ ui.results[key] = {error:"Micro gặp lỗi. Thử lại sau vài giây, hoặc gõ câu trả lời."}; render(); return; }

function normVi(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase(); }
let SEARCH_IDX = null;
function buildSearch(){
  const out = [];
  for(const lang of ["en", "zh"]){
    const L = lang === "zh" ? "中文" : "EN";
    PRON[lang].forEach(p => {
      const ex = (p.sounds[0].ex || []).map(e => e.t + " " + (e.p || "") + " " + (e.v || "")).join(" ");
      out.push({act:"popen", id:p.id, lang, L, kind:"Phát âm", title:`${p.title} · ${p.sub}`, sub:p.groupTitle,
        hi:normVi(p.title + " " + p.sub), lo:normVi(p.groupTitle + " " + ex)});
    });
    LESSONS[lang].forEach(l => {
      const ind = l.work ? (WORK_INDS[lang].find(i => i.id === l.ind) || {}).name || "" : "";
      const lines = l.lines.map(x => x.t + " " + (x.p || "") + " " + x.v).join(" ");
      const voc = (VOCAB_RAW[l.id] || "").replace(/[|=]/g, " ");
      out.push({act:"open", id:l.id, lang, L, kind:l.work ? `Công việc · ${ind}` : "Giao tiếp cơ bản", title:l.title, sub:l.scene,
        hi:normVi(l.title + " " + ind), mid:normVi(l.scene + " " + l.partner), lo:normVi(lines + " " + voc)});
    });
  }
  SECTIONS.filter(s => s.id !== "home").forEach(s => out.push({act:"section", id:s.id, L:"", kind:s.ready ? "Mục" : "Mục · sắp có", title:secName(s), sub:"", hi:normVi(secName(s)) + " " + normVi(s.name)}));
  return out;
}
function searchLessons(q){
  const words = normVi(q).split(/\s+/).filter(Boolean); if(!words.length) return [];
  if(!SEARCH_IDX) SEARCH_IDX = buildSearch();
  const res = [];
  for(const it of SEARCH_IDX){
    let sc = 0, ok = true;
    for(const w of words){
      if(it.hi && it.hi.includes(w)) sc += 6; else if(it.mid && it.mid.includes(w)) sc += 3; else if(it.lo && it.lo.includes(w)) sc += 1; else { ok = false; break; }
    }
    if(ok){ if(it.lang === store.prefs.lang) sc += 0.5; res.push([sc, it]); }
  }
  return res.sort((a, b) => b[0] - a[0]).slice(0, 12).map(x => x[1]);
}
function searchHtml(q){
  if(!q || !q.trim()) return "";
  const r = searchLessons(q);
  if(!r.length) return `<div class="sres-empty">Chưa tìm thấy bài nào khớp với “${esc(q)}”. Thử từ khác, ví dụ: khách sạn, phỏng vấn, ngân hàng, /æ/, 你好.</div>`;
  return `<div class="sres-list" role="listbox">${r.map((it, i) => `<button class="sres" data-act="${it.act}" ${it.act === "section" ? `data-v="${it.id}"` : `data-id="${it.id}"`} role="option">
      <span class="sres-k">${it.L ? `<b>${it.L}</b>` : ""}${esc(it.kind)}</span>
      <span class="sres-t">${esc(it.title)}</span>
      ${it.sub ? `<span class="sres-s">${esc(it.sub)}</span>` : ""}</button>`).join("")}</div>`;
}

    if(act === "pktoday"){ const t = ymd(new Date()); this.set(t); this.cur = t.slice(0, 8) + "01"; this.slide = ""; this.drawDate(); setTimeout(() => this.close(), 260); return; }
    if(act === "pkclear"){ this.set(""); this.close(); return; }
    if(act === "pkmode"){ this.mode = el.dataset.v; this.drawTime(); this.pop.querySelector(".pk-face").classList.add("swap"); return; }
    if(act === "pkface"){ this.face(el, ev); return; }
    if(act === "pkdone"){ if(this.val()) leafBurst(this.wrap.querySelector(".pk-btn")); this.close(); return; }
  }
};
window.addEventListener("resize", () => Picker.place());
/* đổi mọi ô chọn (select) của trình duyệt thành danh sách thả xuống kiểu SFY */
function enhanceSelects(root){
  (root || document).querySelectorAll("select:not([data-enh])").forEach(sel => {
    sel.setAttribute("data-enh", "");
    const w = document.createElement("span"); w.className = "pk pksel"; w.dataset.pk = "select";
    sel.parentNode.insertBefore(w, sel); w.appendChild(sel); sel.tabIndex = -1; sel.classList.add("pk-native");
    const o = sel.options[sel.selectedIndex];
    w.insertAdjacentHTML("beforeend", `<button type="button" class="pk-btn" data-act="pkopen" aria-haspopup="listbox"${sel.id ? ` id="${sel.id}-btn"` : ""}><b>${esc(o ? o.textContent : "")}</b><svg class="pk-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>`);
  });
}
new MutationObserver(() => enhanceSelects()).observe(document.documentElement, {childList:true, subtree:true});
document.addEventListener("scroll", () => Picker.place(), true);

/* ===================== HIỆU ỨNG LÁ KHI DI CHUỘT / BẤM ===================== */
const LEAF_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3C10 3 4 8.5 4 15.5c0 1.8.5 3.4 1.3 4.7C6.8 13.8 11 9.6 16 7.5c-4.3 3-7.6 7.2-9 12.4 1.2.7 2.7 1.1 4.3 1.1C18.4 21 21 13 20 3z" fill="currentColor"/></svg>';
const LEAF_COLORS = ["#2f9e5b", "#4cc27a", "#6ee39a", "#1a7a40", "#9bd8a6", "#86c66b"];
const Leaves = {
  layer:null, n:0, lastT:0, lx:-99, ly:-99,
  on(){ return store.prefs.leaves !== false && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); },
  ensure(){ if(!this.layer){ this.layer = document.createElement("div"); this.layer.className = "leaf-layer"; this.layer.setAttribute("aria-hidden", "true"); document.body.appendChild(this.layer); } return this.layer; },
  spawn(x, y, kf, dur, size){
    if(this.n > 60) return;
    const el = document.createElement("i"); el.className = "leaf"; el.innerHTML = LEAF_SVG;
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;color:${LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)]}`;
    this.ensure().appendChild(el); this.n++;
    const a = el.animate(kf, {duration:dur, easing:"cubic-bezier(.2,.6,.4,1)", fill:"forwards"});
    a.onfinish = () => { el.remove(); this.n--; };
  },
  trail(x, y){
    const r0 = Math.random() * 360, dx = (Math.random() - .5) * 40, dr = (Math.random() - .5) * 240;
    this.spawn(x, y, [
      {transform:`translate(-50%,-50%) rotate(${r0}deg) scale(.4)`, opacity:0},
      {transform:`translate(calc(-50% + ${dx * .3}px),calc(-50% + 8px)) rotate(${r0 + dr * .3}deg) scale(1)`, opacity:.95, offset:.15},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + 70px)) rotate(${r0 + dr}deg) scale(.7)`, opacity:0}
    ], 1100 + Math.random() * 500, 9 + Math.random() * 7);
  },
  burst(x, y, k){
    for(let i = 0; i < (k || 9); i++){
      const ang = (i / (k || 9)) * Math.PI * 2 + Math.random() * .5, dist = 34 + Math.random() * 40, r0 = Math.random() * 360;
      const tx = Math.cos(ang) * dist, ty = Math.sin(ang) * dist;
      this.spawn(x, y, [
        {transform:`translate(-50%,-50%) rotate(${r0}deg) scale(.3)`, opacity:1},
        {transform:`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(${r0 + 180}deg) scale(1)`, opacity:1, offset:.45},
        {transform:`translate(calc(-50% + ${tx * 1.2}px),calc(-50% + ${ty + 55}px)) rotate(${r0 + 320}deg) scale(.8)`, opacity:0}
      ], 900 + Math.random() * 400, 10 + Math.random() * 8);
    }
  }
};
function leafBurst(el){ if(!Leaves.on() || !el) return; const r = el.getBoundingClientRect(); Leaves.burst(r.left + r.width / 2, r.top + r.height / 2, 12); }
document.addEventListener("pointermove", ev => {
  if(ev.pointerType !== "mouse" || !Leaves.on()) return;
  const t = performance.now(), d = Math.hypot(ev.clientX - Leaves.lx, ev.clientY - Leaves.ly);
  if(t - Leaves.lastT < 70 || d < 28) return;
  Leaves.lastT = t; Leaves.lx = ev.clientX; Leaves.ly = ev.clientY;
  Leaves.trail(ev.clientX, ev.clientY);
}, {passive:true});
document.addEventListener("pointerdown", ev => { if(Leaves.on()) Leaves.burst(ev.clientX, ev.clientY); }, {passive:true});

document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if(ev.key === "Enter" && t.matches && t.matches("input[data-home-search]")){ const f = document.querySelector("#searchRes .sres"); if(f){ ev.preventDefault(); f.click(); } return; }
  if(ev.key === "Enter" && t.matches && t.matches("input[data-plan-quick]")){ ev.preventDefault(); const v = t.value; t.value = ""; Plan.quickAdd(v); return; }
  if(ev.key === "Enter" && t.closest && t.closest("[data-plan-form]") && t.tagName === "INPUT"){ ev.preventDefault(); const b = document.querySelector('[data-plan-form] [data-act="plansave"]'); if(b) b.click(); return; }
  if(ev.key === "Enter" && t.matches && t.matches("input[data-plan-dayadd],input[data-plan-daytime]")){ ev.preventDefault(); Plan.dayAdd(); return; }
  if(ev.key === "Escape" && Picker.pop){ Picker.close(); return; }
  if(ev.key === "Escape" && ui.searchOpen){ ui.searchOpen = false; ui.q = ""; render(); return; }
  if(ev.key === "Escape" && ui.menuOpen){ ui.menuOpen = false; render(); return; }
  if(ev.key === "Escape" && ui.plan && (ui.plan.edit || ui.plan.day)){ if(ui.plan.edit) ui.plan.edit = null; else ui.plan.day = null; render(); return; }
  if(ev.key === "Enter" && t.matches && t.matches('.brand .logo')){ t.click(); }
});
/* ===================== GIỮ CHỖ KHI TẢI LẠI TRANG =====================
   Ghi trang đang mở lên địa chỉ (#phần/bài/bước). Tải lại trang (F5) thì mở lại đúng chỗ đó thay vì về trang chủ. */
const Route = {
  last:null,
  hash(){
    if(ui.view === "lesson" && ui.section === "pron" && ui.pid) return `#pron/${ui.pid}/${ui.step}`;
    if(ui.view === "lesson" && (ui.section === "speak" || ui.section === "work") && ui.lessonId) return `#${ui.section}/${ui.lessonId}/${ui.step}`;
    if(ui.section === "profile") return ui.prof === "rank" ? "#profile/rank" : "#profile";
    if(ui.section === "news" && ui.news && ui.news.id) return `#news/${ui.news.id}`;
    if(ui.section === "news" && ui.news && ui.news.view === "paste") return "#news/paste";
    if(ui.section === "vocab" && ui.vt && ui.vt.view === "notebook") return "#vocab/notebook";
    if(ui.section === "vocab" && ui.vt && ui.vt.topic) return `#vocab/${ui.vt.topic}`;
    return ui.section && ui.section !== "home" ? `#${ui.section}` : "";
  },
  save(){
    const h = this.hash(); if(h === this.last) return;
    const first = this.last === null; this.last = h;
    /* mỗi lần chuyển trang thì thêm một mục vào lịch sử, để nút Back của trình duyệt quay về trang trước trong web */
    try{ history[first ? "replaceState" : "pushState"](null, "", h || location.pathname + location.search); }catch(e){}
  },
  restore(){
    const m = (location.hash || "").slice(1).split("/").map(decodeURIComponent);
    let sec = m[0] || "home";
    /* địa chỉ cũ: #achieve và #vocab/rank giờ nằm trong Hồ sơ */
    if(sec === "achieve"){ sec = "profile"; m[1] = "ach"; }
    if(sec === "vocab" && m[1] === "rank"){ sec = "profile"; }
    const legacy = sec === "profile" && m[0] !== "profile";
    const ok = sec === "home" || SECTIONS.some(x => x.id === sec) || sec === "plan";
    ui.section = ok ? sec : "home"; ui.view = "home"; ui.step = 0;
    if(!ok){ this.last = this.hash(); return; }
    const step = Math.max(0, parseInt(m[2], 10) || 0);
    if(sec === "pron" && m[1]){ for(const l of ["en","zh"]) if(PRON[l].some(x => x.id === m[1])){ store.prefs.lang = l; ui.pid = m[1]; ui.view = "lesson"; ui.step = Math.min(step, PSTEP_NAMES.length - 1); } }
    if((sec === "speak" || sec === "work") && m[1]){ for(const l of ["en","zh"]) if(LESSONS[l].some(x => x.id === m[1])){ store.prefs.lang = l; ui.lessonId = m[1]; ui.view = "lesson"; ui.step = Math.min(step, STEP_NAMES.length - 1); } }
    ui.vt = {topic:null, part:"b", mode:"list"};
    ui.prof = sec === "profile" && m[1] === "rank" ? "rank" : "ach";
    ui.news = {id:null, view:null, tr:{}, showTr:false};
    if(sec === "news" && m[1] === "paste") ui.news.view = "paste";
    else if(sec === "news" && m[1]){ const a = newsAll().find(x => x.id === m[1]); if(a){ ui.news.id = a.id; store.prefs.lang = a.lang; } }
    if(sec === "vocab" && m[1] === "notebook") ui.vt = {view:"notebook"};
    else if(sec === "vocab" && m[1] && VT_TOPICS.some(x => x.id === m[1])) ui.vt = {topic:m[1], part:"b", mode:"list"};
    this.last = this.hash();
    if(legacy) try{ history.replaceState(null, "", this.last); }catch(e){}
  }
};
Route.restore();
/* nút Back/Forward của trình duyệt: mở lại trang tương ứng trong web */
window.addEventListener("popstate", () => {
  try{ TTS.stop(); Rec.stop(); }catch(e){}
  ui.menuOpen = false; ui.results = {}; ui.typing = {}; ui.rp = null; ui.pq = null; ui.playAll = false; ui.playingKey = null;
  Route.restore(); render(); window.scrollTo(0, 0);
});
render();
</script>
