 {id:"zh-w-ecom-sale",title:"Lên kế hoạch ngày siêu sale",scene:"Nhóm bán hàng online chuẩn bị cho đợt sale 11/11.",partner:"组长",ind:"ecom",work:true,lines:[{r:"A",t:"下周就是双十一了，准备好了吗？",p:"Xià zhōu jiù shì Shuāng Shíyī le, zhǔnbèi hǎo le ma?",v:"Tuần sau là ngày 11/11 rồi, chuẩn bị xong chưa?"},{r:"B",t:"差不多了，我们选了二十个产品做秒杀。",p:"Chàbuduō le, wǒmen xuǎnle èrshí ge chǎnpǐn zuò miǎoshā.",v:"Gần xong rồi, mình chọn hai mươi sản phẩm để bán chớp nhoáng."},{r:"A",t:"折扣是多少？",p:"Zhékòu shì duōshao?",v:"Giảm giá bao nhiêu?"},{r:"B",t:"最低五折，满两百块包邮。",p:"Zuì dī wǔ zhé, mǎn liǎngbǎi kuài bāoyóu.",v:"Giảm đến năm mươi phần trăm, đơn từ hai trăm tệ miễn phí vận chuyển."},{r:"A",t:"库存够吗？",p:"Kùcún gòu ma?",v:"Hàng tồn có đủ không?"},{r:"B",t:"前十名的产品我们多备了货。",p:"Qián shí míng de chǎnpǐn wǒmen duō bèile huò.",v:"Mười sản phẩm bán chạy nhất mình đã chuẩn bị thêm hàng."},{r:"A",t:"客服呢？",p:"Kèfú ne?",v:"Còn chăm sóc khách hàng?"},{r:"B",t:"晚上八点到十二点多加两个人回消息。",p:"Wǎnshang bā diǎn dào shí'èr diǎn duō jiā liǎng ge rén huí xiāoxi.",v:"Từ tám giờ tối đến mười hai giờ thêm hai người trả lời tin nhắn."}],phrases:[{t:"差不多了，我们选了二十个产品做秒杀。",p:"Chàbuduō le, wǒmen xuǎnle èrshí ge chǎnpǐn zuò miǎoshā.",v:"Gần xong rồi, mình chọn hai mươi sản phẩm để bán chớp nhoáng."},{t:"最低五折，满两百块包邮。",p:"Zuì dī wǔ zhé, mǎn liǎngbǎi kuài bāoyóu.",v:"Giảm đến năm mươi phần trăm, đơn từ hai trăm tệ miễn phí vận chuyển."},{t:"前十名的产品我们多备了货。",p:"Qián shí míng de chǎnpǐn wǒmen duō bèile huò.",v:"Mười sản phẩm bán chạy nhất mình đã chuẩn bị thêm hàng."},{t:"晚上八点到十二点多加两个人回消息。",p:"Wǎnshang bā diǎn dào shí'èr diǎn duō jiā liǎng ge rén huí xiāoxi.",v:"Từ tám giờ tối đến mười hai giờ thêm hai người trả lời tin nhắn."}],notes:[{h:"双十一 là ngày 11/11",b:"Ngày mua sắm lớn nhất ở Trung Quốc. 秒杀 là bán chớp nhoáng, giá rất rẻ trong thời gian ngắn."},{h:"满…包邮",b:"满两百块包邮 là đơn đủ hai trăm tệ thì miễn phí vận chuyển. 满 là đủ, đạt mức."}]},
 {id:"zh-w-mfg-tour",title:"Giới thiệu dây chuyền sản xuất",scene:"Bạn dẫn khách hàng nước ngoài tham quan nhà máy may.",partner:"客户",ind:"mfg",work:true,lines:[{r:"A",t:"谢谢您带我们参观。",p:"Xièxie nín dài wǒmen cānguān.",v:"Cảm ơn anh đã dẫn chúng tôi tham quan."},{r:"B",t:"不客气。这是我们的主要生产线。",p:"Bú kèqi. Zhè shì wǒmen de zhǔyào shēngchǎnxiàn.",v:"Không có gì. Đây là dây chuyền sản xuất chính của chúng tôi."},{r:"A",t:"你们有多少工人？",p:"Nǐmen yǒu duōshao gōngrén?",v:"Các anh có bao nhiêu công nhân?"},{r:"B",t:"大概五百个工人，分两班。",p:"Dàgài wǔbǎi ge gōngrén, fēn liǎng bān.",v:"Khoảng năm trăm công nhân, chia hai ca."},{r:"A",t:"每个月的产能是多少？",p:"Měi ge yuè de chǎnnéng shì duōshao?",v:"Công suất mỗi tháng là bao nhiêu?"},{r:"B",t:"我们每个月能生产十万件衬衫左右。",p:"Wǒmen měi ge yuè néng shēngchǎn shíwàn jiàn chènshān zuǒyòu.",v:"Mỗi tháng chúng tôi sản xuất được khoảng một trăm nghìn áo sơ mi."},{r:"A",t:"你们怎么检查质量？",p:"Nǐmen zěnme jiǎnchá zhìliàng?",v:"Các anh kiểm tra chất lượng thế nào?"},{r:"B",t:"每件产品都检查两次，我们还有ISO 9001认证。",p:"Měi jiàn chǎnpǐn dōu jiǎnchá liǎng cì, wǒmen hái yǒu ISO 9001 rènzhèng.",v:"Mỗi sản phẩm đều kiểm tra hai lần, chúng tôi còn có chứng nhận ISO 9001."}],phrases:[{t:"不客气。这是我们的主要生产线。",p:"Bú kèqi. Zhè shì wǒmen de zhǔyào shēngchǎnxiàn.",v:"Không có gì. Đây là dây chuyền sản xuất chính của chúng tôi."},{t:"大概五百个工人，分两班。",p:"Dàgài wǔbǎi ge gōngrén, fēn liǎng bān.",v:"Khoảng năm trăm công nhân, chia hai ca."},{t:"我们每个月能生产十万件衬衫左右。",p:"Wǒmen měi ge yuè néng shēngchǎn shíwàn jiàn chènshān zuǒyòu.",v:"Mỗi tháng chúng tôi sản xuất được khoảng một trăm nghìn áo sơ mi."},{t:"每件产品都检查两次，我们还有ISO 9001认证。",p:"Měi jiàn chǎnpǐn dōu jiǎnchá liǎng cì, wǒmen hái yǒu ISO 9001 rènzhèng.",v:"Mỗi sản phẩm đều kiểm tra hai lần, chúng tôi còn có chứng nhận ISO 9001."}],notes:[{h:"带…参观",b:"带我们参观 là dẫn chúng tôi đi tham quan."},{h:"每…都…",b:"每件产品都检查两次 là sản phẩm nào cũng kiểm tra hai lần. 每 thường đi với 都."}]},
 {id:"zh-w-mfg-problem",title:"Báo sự cố máy móc",scene:"Một máy trên dây chuyền bị hỏng. Bạn là tổ trưởng báo cho quản lý.",partner:"生产经理",ind:"mfg",work:true,lines:[{r:"A",t:"三号线怎么了？",p:"Sān hào xiàn zěnme le?",v:"Dây chuyền số ba bị sao vậy?"},{r:"B",t:"五号机器一个小时前坏了。",p:"Wǔ hào jīqì yí ge xiǎoshí qián huài le.",v:"Máy số năm hỏng cách đây một tiếng."},{r:"A",t:"知道原因吗？",p:"Zhīdào yuányīn ma?",v:"Biết nguyên nhân không?"},{r:"B",t:"技术员说一个零件磨损了，他正在换。",p:"Jìshùyuán shuō yí ge língjiàn mósǔn le, tā zhèngzài huàn.",v:"Kỹ thuật viên nói một linh kiện bị mòn, anh ấy đang thay."},{r:"A",t:"要多久？",p:"Yào duō jiǔ?",v:"Mất bao lâu?"},{r:"B",t:"大概两个小时。我先把工人调到二号线了。",p:"Dàgài liǎng ge xiǎoshí. Wǒ xiān bǎ gōngrén diào dào èr hào xiàn le.",v:"Khoảng hai tiếng. Tôi đã chuyển công nhân sang dây chuyền số hai trước."},{r:"A",t:"今天能完成任务吗？",p:"Jīntiān néng wánchéng rènwu ma?",v:"Hôm nay hoàn thành chỉ tiêu được không?"},{r:"B",t:"会差百分之五左右，加班一个小时就能补上。",p:"Huì chà bǎi fēn zhī wǔ zuǒyòu, jiābān yí ge xiǎoshí jiù néng bǔshàng.",v:"Sẽ thiếu khoảng năm phần trăm, tăng ca một tiếng là bù kịp."}],phrases:[{t:"五号机器一个小时前坏了。",p:"Wǔ hào jīqì yí ge xiǎoshí qián huài le.",v:"Máy số năm hỏng cách đây một tiếng."},{t:"技术员说一个零件磨损了，他正在换。",p:"Jìshùyuán shuō yí ge língjiàn mósǔn le, tā zhèngzài huàn.",v:"Kỹ thuật viên nói một linh kiện bị mòn, anh ấy đang thay."},{t:"大概两个小时。我先把工人调到二号线了。",p:"Dàgài liǎng ge xiǎoshí. Wǒ xiān bǎ gōngrén diào dào èr hào xiàn le.",v:"Khoảng hai tiếng. Tôi đã chuyển công nhân sang dây chuyền số hai trước."},{t:"会差百分之五左右，加班一个小时就能补上。",p:"Huì chà bǎi fēn zhī wǔ zuǒyòu, jiābān yí ge xiǎoshí jiù néng bǔshàng.",v:"Sẽ thiếu khoảng năm phần trăm, tăng ca một tiếng là bù kịp."}],notes:[{h:"正在 + động từ",b:"他正在换 là anh ấy đang thay. 正在 chỉ hành động đang diễn ra."},{h:"Báo sự cố đủ ba ý",b:"Nói rõ: chuyện gì xảy ra, đang xử lý thế nào, ảnh hưởng ra sao."}]},
 {id:"zh-w-mfg-order",title:"Trao đổi đơn hàng với khách",scene:"Khách hàng muốn thay đổi đơn hàng đang sản xuất.",partner:"客户",ind:"mfg",work:true,lines:[{r:"A",t:"我们的订单能把蓝色改成绿色吗？",p:"Wǒmen de dìngdān néng bǎ lánsè gǎichéng lǜsè ma?",v:"Đơn hàng của chúng tôi đổi từ màu xanh dương sang xanh lá được không?"},{r:"B",t:"我查一下。一半的布已经裁好了。",p:"Wǒ chá yíxià. Yíbàn de bù yǐjīng cáihǎo le.",v:"Để tôi kiểm tra. Một nửa số vải đã cắt xong rồi."},{r:"A",t:"另一半呢？",p:"Lìng yíbàn ne?",v:"Còn nửa kia?"},{r:"B",t:"那一半可以改，但是要先买新布。",p:"Nà yíbàn kěyǐ gǎi, dànshì yào xiān mǎi xīn bù.",v:"Nửa đó đổi được, nhưng phải mua vải mới trước."},{r:"A",t:"会推迟交货吗？",p:"Huì tuīchí jiāohuò ma?",v:"Có làm chậm giao hàng không?"},{r:"B",t:"会推迟十天左右，新布还有额外的费用。",p:"Huì tuīchí shí tiān zuǒyòu, xīn bù hái yǒu éwài de fèiyòng.",v:"Sẽ chậm khoảng mười ngày, vải mới còn có chi phí phát sinh."},{r:"A",t:"好，请把新的价格和日期发给我。",p:"Hǎo, qǐng bǎ xīn de jiàgé hé rìqī fā gěi wǒ.",v:"Được, gửi tôi giá và ngày mới nhé."},{r:"B",t:"好的。开始以前请您用邮件确认一下。",p:"Hǎo de. Kāishǐ yǐqián qǐng nín yòng yóujiàn quèrèn yíxià.",v:"Vâng. Trước khi bắt đầu, anh xác nhận qua email giúp tôi."}],phrases:[{t:"我查一下。一半的布已经裁好了。",p:"Wǒ chá yíxià. Yíbàn de bù yǐjīng cáihǎo le.",v:"Để tôi kiểm tra. Một nửa số vải đã cắt xong rồi."},{t:"那一半可以改，但是要先买新布。",p:"Nà yíbàn kěyǐ gǎi, dànshì yào xiān mǎi xīn bù.",v:"Nửa đó đổi được, nhưng phải mua vải mới trước."},{t:"会推迟十天左右，新布还有额外的费用。",p:"Huì tuīchí shí tiān zuǒyòu, xīn bù hái yǒu éwài de fèiyòng.",v:"Sẽ chậm khoảng mười ngày, vải mới còn có chi phí phát sinh."},{t:"好的。开始以前请您用邮件确认一下。",p:"Hǎo de. Kāishǐ yǐqián qǐng nín yòng yóujiàn quèrèn yíxià.",v:"Vâng. Trước khi bắt đầu, anh xác nhận qua email giúp tôi."}],notes:[{h:"把 A 改成 B",b:"把蓝色改成绿色 là đổi màu xanh dương thành xanh lá."},{h:"Xác nhận bằng văn bản",b:"用邮件确认 là xác nhận qua email, giúp tránh tranh cãi sau này."}]},
 {id:"zh-w-cons-site",title:"Họp tại công trường",scene:"Bạn là kỹ sư giám sát, báo cáo tiến độ cho chủ đầu tư.",partner:"业主",ind:"cons",work:true,lines:[{r:"A",t:"项目进展怎么样？",p:"Xiàngmù jìnzhǎn zěnmeyàng?",v:"Dự án tiến triển thế nào?"},{r:"B",t:"地基和前三层已经完成了。",p:"Dìjī hé qián sān céng yǐjīng wánchéng le.",v:"Phần móng và ba tầng đầu đã xong."},{r:"A",t:"按计划进行吗？",p:"Àn jìhuà jìnxíng ma?",v:"Có đúng kế hoạch không?"},{r:"B",t:"因为下大雨，慢了大概一个星期。",p:"Yīnwèi xià dàyǔ, mànle dàgài yí ge xīngqī.",v:"Vì mưa lớn nên chậm khoảng một tuần."},{r:"A",t:"能赶上吗？",p:"Néng gǎnshàng ma?",v:"Có bắt kịp được không?"},{r:"B",t:"能，我们会加一个队周末施工。",p:"Néng, wǒmen huì jiā yí ge duì zhōumò shīgōng.",v:"Được, chúng tôi sẽ thêm một đội thi công cuối tuần."},{r:"A",t:"安全方面呢？",p:"Ānquán fāngmiàn ne?",v:"Còn về an toàn?"},{r:"B",t:"工地上每个人都要戴安全帽、穿安全鞋，我们每天早上检查。",p:"Gōngdì shang měi ge rén dōu yào dài ānquánmào, chuān ānquánxié, wǒmen měi tiān zǎoshang jiǎnchá.",v:"Trên công trường mọi người đều phải đội mũ bảo hộ, đi giày bảo hộ, sáng nào chúng tôi cũng kiểm tra."}],phrases:[{t:"地基和前三层已经完成了。",p:"Dìjī hé qián sān céng yǐjīng wánchéng le.",v:"Phần móng và ba tầng đầu đã xong."},{t:"因为下大雨，慢了大概一个星期。",p:"Yīnwèi xià dàyǔ, mànle dàgài yí ge xīngqī.",v:"Vì mưa lớn nên chậm khoảng một tuần."},{t:"能，我们会加一个队周末施工。",p:"Néng, wǒmen huì jiā yí ge duì zhōumò shīgōng.",v:"Được, chúng tôi sẽ thêm một đội thi công cuối tuần."},{t:"工地上每个人都要戴安全帽、穿安全鞋，我们每天早上检查。",p:"Gōngdì shang měi ge rén dōu yào dài ānquánmào, chuān ānquánxié, wǒmen měi tiān zǎoshang jiǎnchá.",v:"Trên công trường mọi người đều phải đội mũ bảo hộ, đi giày bảo hộ, sáng nào chúng tôi cũng kiểm tra."}],notes:[{h:"因为…，…",b:"因为下大雨，慢了一个星期: vì mưa lớn nên chậm một tuần. Nguyên nhân đặt trước."},{h:"戴 và 穿",b:"戴 dùng cho mũ, kính, đồng hồ; 穿 dùng cho quần áo, giày."}]},
 {id:"zh-w-cons-design",title:"Trao đổi bản thiết kế với khách",scene:"Bạn là kiến trúc sư, trình bày bản thiết kế nhà cho khách hàng.",partner:"客户",ind:"cons",work:true,lines:[{r:"A",t:"能给我看看新的设计吗？",p:"Néng gěi wǒ kànkan xīn de shèjì ma?",v:"Cho tôi xem bản thiết kế mới được không?"},{r:"B",t:"当然。这是一楼的平面图。",p:"Dāngrán. Zhè shì yī lóu de píngmiàntú.",v:"Tất nhiên. Đây là mặt bằng tầng một."},{r:"A",t:"客厅看起来有点小。",p:"Kètīng kàn qǐlai yǒudiǎn xiǎo.",v:"Phòng khách trông hơi nhỏ."},{r:"B",t:"我们可以拆掉这面墙，和餐厅连在一起。",p:"Wǒmen kěyǐ chāidiào zhè miàn qiáng, hé cāntīng lián zài yìqǐ.",v:"Chúng ta có thể bỏ bức tường này, nối liền với phòng ăn."},{r:"A",t:"好主意。采光呢？",p:"Hǎo zhǔyi. Cǎiguāng ne?",v:"Ý hay. Còn ánh sáng?"},{r:"B",t:"我们会加几扇朝南的大窗户。",p:"Wǒmen huì jiā jǐ shàn cháo nán de dà chuānghu.",v:"Chúng tôi sẽ thêm vài cửa sổ lớn hướng nam."},{r:"A",t:"费用会变吗？",p:"Fèiyòng huì biàn ma?",v:"Chi phí có thay đổi không?"},{r:"B",t:"会多一点。星期五以前我更新图纸和预算。",p:"Huì duō yìdiǎn. Xīngqīwǔ yǐqián wǒ gēngxīn túzhǐ hé yùsuàn.",v:"Sẽ tăng một chút. Trước thứ Sáu tôi cập nhật bản vẽ và dự toán."}],phrases:[{t:"当然。这是一楼的平面图。",p:"Dāngrán. Zhè shì yī lóu de píngmiàntú.",v:"Tất nhiên. Đây là mặt bằng tầng một."},{t:"我们可以拆掉这面墙，和餐厅连在一起。",p:"Wǒmen kěyǐ chāidiào zhè miàn qiáng, hé cāntīng lián zài yìqǐ.",v:"Chúng ta có thể bỏ bức tường này, nối liền với phòng ăn."},{t:"我们会加几扇朝南的大窗户。",p:"Wǒmen huì jiā jǐ shàn cháo nán de dà chuānghu.",v:"Chúng tôi sẽ thêm vài cửa sổ lớn hướng nam."},{t:"会多一点。星期五以前我更新图纸和预算。",p:"Huì duō yìdiǎn. Xīngqīwǔ yǐqián wǒ gēngxīn túzhǐ hé yùsuàn.",v:"Sẽ tăng một chút. Trước thứ Sáu tôi cập nhật bản vẽ và dự toán."}],notes:[{h:"看起来",b:"看起来有点小 là \"trông có vẻ hơi nhỏ\", dùng để nêu cảm nhận."},{h:"朝 + hướng",b:"朝南 là hướng nam. 朝东 hướng đông, 朝北 hướng bắc."}]},
 {id:"zh-w-cons-supply",title:"Đặt vật liệu xây dựng",scene:"Bạn gọi nhà cung cấp để đặt xi măng và thép.",partner:"供应商",ind:"cons",work:true,lines:[{r:"A",t:"喂，明发建材。",p:"Wéi, Míngfā Jiàncái.",v:"A lô, Vật liệu Minh Phát."},{r:"B",t:"你好，我想订两百袋水泥和五吨钢筋。",p:"Nǐ hǎo, wǒ xiǎng dìng liǎngbǎi dài shuǐní hé wǔ dūn gāngjīn.",v:"Chào anh, tôi muốn đặt hai trăm bao xi măng và năm tấn thép."},{r:"A",t:"什么规格的钢筋？",p:"Shénme guīgé de gāngjīn?",v:"Thép quy cách nào?"},{r:"B",t:"十二毫米的。能送到七郡的工地吗？",p:"Shí'èr háomǐ de. Néng sòng dào Qī Jùn de gōngdì ma?",v:"Loại mười hai li. Giao đến công trường ở Quận 7 được không?"},{r:"A",t:"可以。什么时候要？",p:"Kěyǐ. Shénme shíhou yào?",v:"Được. Khi nào cần?"},{r:"B",t:"星期一早上八点以前，九点以后卡车进不去。",p:"Xīngqīyī zǎoshang bā diǎn yǐqián, jiǔ diǎn yǐhòu kǎchē jìn bu qù.",v:"Trước tám giờ sáng thứ Hai, sau chín giờ xe tải không vào được."},{r:"A",t:"没问题。十五天内付款，对吧？",p:"Méi wèntí. Shíwǔ tiān nèi fùkuǎn, duì ba?",v:"Không vấn đề. Thanh toán trong mười lăm ngày, đúng không?"},{r:"B",t:"对。请把发票和送货单一起发过来。",p:"Duì. Qǐng bǎ fāpiào hé sònghuòdān yìqǐ fā guòlai.",v:"Đúng. Anh gửi hóa đơn cùng phiếu giao hàng nhé."}],phrases:[{t:"你好，我想订两百袋水泥和五吨钢筋。",p:"Nǐ hǎo, wǒ xiǎng dìng liǎngbǎi dài shuǐní hé wǔ dūn gāngjīn.",v:"Chào anh, tôi muốn đặt hai trăm bao xi măng và năm tấn thép."},{t:"十二毫米的。能送到七郡的工地吗？",p:"Shí'èr háomǐ de. Néng sòng dào Qī Jùn de gōngdì ma?",v:"Loại mười hai li. Giao đến công trường ở Quận 7 được không?"},{t:"星期一早上八点以前，九点以后卡车进不去。",p:"Xīngqīyī zǎoshang bā diǎn yǐqián, jiǔ diǎn yǐhòu kǎchē jìn bu qù.",v:"Trước tám giờ sáng thứ Hai, sau chín giờ xe tải không vào được."},{t:"对。请把发票和送货单一起发过来。",p:"Duì. Qǐng bǎ fāpiào hé sònghuòdān yìqǐ fā guòlai.",v:"Đúng. Anh gửi hóa đơn cùng phiếu giao hàng nhé."}],notes:[{h:"Động từ + 不去",b:"进不去 là không vào được. 进得去 là vào được."},{h:"…，对吧？",b:"Câu hỏi xác nhận: thanh toán trong mười lăm ngày, đúng không?"}]},
 {id:"zh-w-re-view",title:"Dẫn khách xem căn hộ",scene:"Bạn là môi giới, dẫn khách xem căn hộ để bán.",partner:"客户",ind:"re",work:true,lines:[{r:"A",t:"这套房子多大？",p:"Zhè tào fángzi duō dà?",v:"Căn nhà này rộng bao nhiêu?"},{r:"B",t:"七十五平方米，两室两卫。",p:"Qīshíwǔ píngfāngmǐ, liǎng shì liǎng wèi.",v:"Bảy mươi lăm mét vuông, hai phòng ngủ hai phòng vệ sinh."},{r:"A",t:"阳台朝哪边？",p:"Yángtái cháo nǎ biān?",v:"Ban công hướng nào?"},{r:"B",t:"朝东，早上有阳光，下午很凉快。",p:"Cháo dōng, zǎoshang yǒu yángguāng, xiàwǔ hěn liángkuai.",v:"Hướng đông, buổi sáng có nắng, buổi chiều mát."},{r:"A",t:"多少钱？",p:"Duōshao qián?",v:"Bao nhiêu tiền?"},{r:"B",t:"三十二亿越南盾，包括家具。",p:"Sānshí'èr yì Yuènán dùn, bāokuò jiājù.",v:"Ba tỷ hai đồng, bao gồm nội thất."},{r:"A",t:"价格能商量吗？",p:"Jiàgé néng shāngliang ma?",v:"Giá thương lượng được không?"},{r:"B",t:"房东比较灵活。如果您真的有兴趣，我可以安排您和他见面。",p:"Fángdōng bǐjiào línghuó. Rúguǒ nín zhēn de yǒu xìngqù, wǒ kěyǐ ānpái nín hé tā jiànmiàn.",v:"Chủ nhà khá linh hoạt. Nếu anh thật sự quan tâm, tôi có thể sắp xếp anh gặp chủ nhà."}],phrases:[{t:"七十五平方米，两室两卫。",p:"Qīshíwǔ píngfāngmǐ, liǎng shì liǎng wèi.",v:"Bảy mươi lăm mét vuông, hai phòng ngủ hai phòng vệ sinh."},{t:"朝东，早上有阳光，下午很凉快。",p:"Cháo dōng, zǎoshang yǒu yángguāng, xiàwǔ hěn liángkuai.",v:"Hướng đông, buổi sáng có nắng, buổi chiều mát."},{t:"三十二亿越南盾，包括家具。",p:"Sānshí'èr yì Yuènán dùn, bāokuò jiājù.",v:"Ba tỷ hai đồng, bao gồm nội thất."},{t:"房东比较灵活。如果您真的有兴趣，我可以安排您和他见面。",p:"Fángdōng bǐjiào línghuó. Rúguǒ nín zhēn de yǒu xìngqù, wǒ kěyǐ ānpái nín hé tā jiànmiàn.",v:"Chủ nhà khá linh hoạt. Nếu anh thật sự quan tâm, tôi có thể sắp xếp anh gặp chủ nhà."}],notes:[{h:"两室两卫",b:"Cách nói gọn: 两室 (hai phòng ngủ), 两卫 (hai phòng vệ sinh), 一厅 (một phòng khách)."},{h:"亿 là trăm triệu",b:"三十二亿 là 32 × 100.000.000 = 3,2 tỷ."}]},
 {id:"zh-w-re-contract",title:"Giải thích hợp đồng mua bán",scene:"Khách hàng đã đồng ý mua. Bạn giải thích các bước thanh toán.",partner:"客户",ind:"re",work:true,lines:[{r:"A",t:"下一步怎么办？",p:"Xià yí bù zěnme bàn?",v:"Bước tiếp theo thế nào?"},{r:"B",t:"首先签定金协议，您付百分之十。",p:"Shǒuxiān qiān dìngjīn xiéyì, nín fù bǎi fēn zhī shí.",v:"Trước tiên ký thỏa thuận đặt cọc, anh trả mười phần trăm."},{r:"A",t:"然后呢？",p:"Ránhòu ne?",v:"Sau đó thì sao?"},{r:"B",t:"三十天内在公证处签买卖合同。",p:"Sānshí tiān nèi zài gōngzhèngchù qiān mǎimài hétong.",v:"Trong ba mươi ngày ký hợp đồng mua bán ở phòng công chứng."},{r:"A",t:"剩下的钱什么时候付？",p:"Shèngxià de qián shénme shíhou fù?",v:"Tiền còn lại khi nào trả?"},{r:"B",t:"同一天付。然后办理过户，房产证写您的名字。",p:"Tóng yì tiān fù. Ránhòu bànlǐ guòhù, fángchǎnzhèng xiě nín de míngzi.",v:"Trả cùng ngày. Sau đó làm thủ tục sang tên, sổ đỏ ghi tên anh."},{r:"A",t:"税和费谁付？",p:"Shuì hé fèi shéi fù?",v:"Thuế và phí ai trả?"},{r:"B",t:"一般卖方付所得税，买方付登记费。",p:"Yìbān màifāng fù suǒdéshuì, mǎifāng fù dēngjìfèi.",v:"Thường bên bán trả thuế thu nhập, bên mua trả lệ phí trước bạ."}],phrases:[{t:"首先签定金协议，您付百分之十。",p:"Shǒuxiān qiān dìngjīn xiéyì, nín fù bǎi fēn zhī shí.",v:"Trước tiên ký thỏa thuận đặt cọc, anh trả mười phần trăm."},{t:"三十天内在公证处签买卖合同。",p:"Sānshí tiān nèi zài gōngzhèngchù qiān mǎimài hétong.",v:"Trong ba mươi ngày ký hợp đồng mua bán ở phòng công chứng."},{t:"同一天付。然后办理过户，房产证写您的名字。",p:"Tóng yì tiān fù. Ránhòu bànlǐ guòhù, fángchǎnzhèng xiě nín de míngzi.",v:"Trả cùng ngày. Sau đó làm thủ tục sang tên, sổ đỏ ghi tên anh."},{t:"一般卖方付所得税，买方付登记费。",p:"Yìbān màifāng fù suǒdéshuì, mǎifāng fù dēngjìfèi.",v:"Thường bên bán trả thuế thu nhập, bên mua trả lệ phí trước bạ."}],notes:[{h:"首先…然后…",b:"Liệt kê các bước theo thứ tự giúp khách dễ hiểu quy trình."},{h:"过户",b:"过户 là sang tên quyền sở hữu. 房产证 là giấy chứng nhận quyền sở hữu nhà."}]},
 {id:"zh-w-re-rent",title:"Cho thuê văn phòng",scene:"Một công ty nước ngoài muốn thuê văn phòng. Bạn là nhân viên cho thuê.",partner:"租客",ind:"re",work:true,lines:[{r:"A",t:"我们需要一个能坐三十个人的办公室。",p:"Wǒmen xūyào yí ge néng zuò sānshí ge rén de bàngōngshì.",v:"Chúng tôi cần văn phòng ngồi được ba mươi người."},{r:"B",t:"十楼有一个两百平方米的空间。",p:"Shí lóu yǒu yí ge liǎngbǎi píngfāngmǐ de kōngjiān.",v:"Tầng mười có một mặt bằng hai trăm mét vuông."},{r:"A",t:"租金是多少？",p:"Zūjīn shì duōshao?",v:"Tiền thuê bao nhiêu?"},{r:"B",t:"每平方米每月二十美元，另外加物业费。",p:"Měi píngfāngmǐ měi yuè èrshí Měiyuán, lìngwài jiā wùyèfèi.",v:"Mỗi mét vuông mỗi tháng hai mươi đô, cộng thêm phí quản lý."},{r:"A",t:"物业费包括什么？",p:"Wùyèfèi bāokuò shénme?",v:"Phí quản lý bao gồm những gì?"},{r:"B",t:"空调、清洁、保安和摩托车停车位。",p:"Kōngtiáo, qīngjié, bǎo'ān hé mótuōchē tíngchēwèi.",v:"Điều hòa, vệ sinh, bảo vệ và chỗ đỗ xe máy."},{r:"A",t:"最少租多久？",p:"Zuì shǎo zū duō jiǔ?",v:"Thuê ít nhất bao lâu?"},{r:"B",t:"两年，押金是三个月的租金。",p:"Liǎng nián, yājīn shì sān ge yuè de zūjīn.",v:"Hai năm, tiền cọc là ba tháng tiền thuê."}],phrases:[{t:"十楼有一个两百平方米的空间。",p:"Shí lóu yǒu yí ge liǎngbǎi píngfāngmǐ de kōngjiān.",v:"Tầng mười có một mặt bằng hai trăm mét vuông."},{t:"每平方米每月二十美元，另外加物业费。",p:"Měi píngfāngmǐ měi yuè èrshí Měiyuán, lìngwài jiā wùyèfèi.",v:"Mỗi mét vuông mỗi tháng hai mươi đô, cộng thêm phí quản lý."},{t:"空调、清洁、保安和摩托车停车位。",p:"Kōngtiáo, qīngjié, bǎo'ān hé mótuōchē tíngchēwèi.",v:"Điều hòa, vệ sinh, bảo vệ và chỗ đỗ xe máy."},{t:"两年，押金是三个月的租金。",p:"Liǎng nián, yājīn shì sān ge yuè de zūjīn.",v:"Hai năm, tiền cọc là ba tháng tiền thuê."}],notes:[{h:"物业费",b:"Phí quản lý tòa nhà. 物业 là ban quản lý tòa nhà."},{h:"最少",b:"最少租多久 là thuê tối thiểu bao lâu. 最多 là tối đa."}]},
 {id:"zh-w-air-checkin",title:"Làm thủ tục tại quầy",scene:"Bạn là nhân viên mặt đất, làm thủ tục cho hành khách.",partner:"乘客",ind:"air",work:true,lines:[{r:"A",t:"你好，我去新加坡。",p:"Nǐ hǎo, wǒ qù Xīnjiāpō.",v:"Chào chị, tôi đi Singapore."},{r:"B",t:"请出示您的护照和机票。",p:"Qǐng chūshì nín de hùzhào hé jīpiào.",v:"Xin anh xuất trình hộ chiếu và vé máy bay."},{r:"A",t:"给你。",p:"Gěi nǐ.",v:"Đây."},{r:"B",t:"您要靠窗的座位还是靠过道的？",p:"Nín yào kào chuāng de zuòwèi háishi kào guòdào de?",v:"Anh muốn ghế cạnh cửa sổ hay cạnh lối đi?"},{r:"A",t:"靠过道的，谢谢。",p:"Kào guòdào de, xièxie.",v:"Cạnh lối đi, cảm ơn."},{r:"B",t:"请把行李放在秤上，您可以免费托运二十公斤。",p:"Qǐng bǎ xíngli fàng zài chèng shang, nín kěyǐ miǎnfèi tuōyùn èrshí gōngjīn.",v:"Anh đặt hành lý lên cân, anh được ký gửi miễn phí hai mươi ký."},{r:"A",t:"没超重吧？",p:"Méi chāozhòng ba?",v:"Không quá cân chứ?"},{r:"B",t:"没有，十八公斤。这是登机牌，九点四十在十二号登机口登机。",p:"Méiyǒu, shíbā gōngjīn. Zhè shì dēngjīpái, jiǔ diǎn sìshí zài shí'èr hào dēngjīkǒu dēngjī.",v:"Không, mười tám ký. Đây là thẻ lên máy bay, 9 giờ 40 lên máy bay ở cửa số 12."}],phrases:[{t:"请出示您的护照和机票。",p:"Qǐng chūshì nín de hùzhào hé jīpiào.",v:"Xin anh xuất trình hộ chiếu và vé máy bay."},{t:"您要靠窗的座位还是靠过道的？",p:"Nín yào kào chuāng de zuòwèi háishi kào guòdào de?",v:"Anh muốn ghế cạnh cửa sổ hay cạnh lối đi?"},{t:"请把行李放在秤上，您可以免费托运二十公斤。",p:"Qǐng bǎ xíngli fàng zài chèng shang, nín kěyǐ miǎnfèi tuōyùn èrshí gōngjīn.",v:"Anh đặt hành lý lên cân, anh được ký gửi miễn phí hai mươi ký."},{t:"没有，十八公斤。这是登机牌，九点四十在十二号登机口登机。",p:"Méiyǒu, shíbā gōngjīn. Zhè shì dēngjīpái, jiǔ diǎn sìshí zài shí'èr hào dēngjīkǒu dēngjī.",v:"Không, mười tám ký. Đây là thẻ lên máy bay, 9 giờ 40 lên máy bay ở cửa số 12."}],notes:[{h:"靠窗 và 靠过道",b:"靠 là sát, cạnh. 靠窗 cạnh cửa sổ, 靠过道 cạnh lối đi."},{h:"托运 là ký gửi hành lý",b:"托运行李 là hành lý ký gửi, 手提行李 là hành lý xách tay."}]},
 {id:"zh-w-air-cabin",title:"Phục vụ trên máy bay",scene:"Bạn là tiếp viên, phục vụ hành khách trên chuyến bay.",partner:"乘客",ind:"air",work:true,lines:[{r:"A",t:"你好，能给我一点水吗？",p:"Nǐ hǎo, néng gěi wǒ yìdiǎn shuǐ ma?",v:"Chào chị, cho tôi xin ít nước được không?"},{r:"B",t:"当然，起飞以后我们会提供饮料。",p:"Dāngrán, qǐfēi yǐhòu wǒmen huì tígōng yǐnliào.",v:"Tất nhiên, sau khi cất cánh chúng tôi sẽ phục vụ đồ uống."},{r:"A",t:"好。我的包找不到地方放。",p:"Hǎo. Wǒ de bāo zhǎo bu dào dìfang fàng.",v:"Được. Túi của tôi không tìm được chỗ để."},{r:"B",t:"我来帮您，那边的行李架还有空间。",p:"Wǒ lái bāng nín, nàbiān de xínglijià hái yǒu kōngjiān.",v:"Để tôi giúp anh, giá hành lý đằng kia còn chỗ."},{r:"A",t:"谢谢。什么时候降落？",p:"Xièxie. Shénme shíhou jiàngluò?",v:"Cảm ơn. Khi nào hạ cánh?"},{r:"B",t:"当地时间两点十五分到新加坡。",p:"Dāngdì shíjiān liǎng diǎn shíwǔ fēn dào Xīnjiāpō.",v:"Hai giờ mười lăm giờ địa phương đến Singapore."},{r:"A",t:"好的。",p:"Hǎo de.",v:"Được."},{r:"B",t:"请系好安全带，我们马上要起飞了。",p:"Qǐng jìhǎo ānquándài, wǒmen mǎshàng yào qǐfēi le.",v:"Xin anh thắt dây an toàn, chúng ta sắp cất cánh."}],phrases:[{t:"当然，起飞以后我们会提供饮料。",p:"Dāngrán, qǐfēi yǐhòu wǒmen huì tígōng yǐnliào.",v:"Tất nhiên, sau khi cất cánh chúng tôi sẽ phục vụ đồ uống."},{t:"我来帮您，那边的行李架还有空间。",p:"Wǒ lái bāng nín, nàbiān de xínglijià hái yǒu kōngjiān.",v:"Để tôi giúp anh, giá hành lý đằng kia còn chỗ."},{t:"当地时间两点十五分到新加坡。",p:"Dāngdì shíjiān liǎng diǎn shíwǔ fēn dào Xīnjiāpō.",v:"Hai giờ mười lăm giờ địa phương đến Singapore."},{t:"请系好安全带，我们马上要起飞了。",p:"Qǐng jìhǎo ānquándài, wǒmen mǎshàng yào qǐfēi le.",v:"Xin anh thắt dây an toàn, chúng ta sắp cất cánh."}],notes:[{h:"马上要…了",b:"马上要起飞了 là sắp cất cánh ngay. Cấu trúc 要…了 chỉ việc sắp xảy ra."},{h:"系 đọc là jì",b:"Trong 系安全带 (thắt dây an toàn), 系 đọc là jì, không đọc xì."}]},
 {id:"zh-w-air-delay",title:"Thông báo chuyến bay bị hoãn",scene:"Chuyến bay bị hoãn. Bạn là nhân viên hãng, giải thích với hành khách.",partner:"乘客",ind:"air",work:true,lines:[{r:"A",t:"我的航班为什么延误了？",p:"Wǒ de hángbān wèishénme yánwù le?",v:"Sao chuyến bay của tôi bị hoãn?"},{r:"B",t:"非常抱歉，飞机出了技术问题。",p:"Fēicháng bàoqiàn, fēijī chūle jìshù wèntí.",v:"Rất xin lỗi, máy bay gặp sự cố kỹ thuật."},{r:"A",t:"要等多久？",p:"Yào děng duō jiǔ?",v:"Phải chờ bao lâu?"},{r:"B",t:"大概三个小时，新的起飞时间是六点半。",p:"Dàgài sān ge xiǎoshí, xīn de qǐfēi shíjiān shì liù diǎn bàn.",v:"Khoảng ba tiếng, giờ cất cánh mới là sáu rưỡi."},{r:"A",t:"我会赶不上转机的航班。",p:"Wǒ huì gǎn bu shàng zhuǎnjī de hángbān.",v:"Tôi sẽ lỡ chuyến bay nối chuyến."},{r:"B",t:"别担心，我免费帮您改到下一班。",p:"Bié dānxīn, wǒ miǎnfèi bāng nín gǎi dào xià yì bān.",v:"Đừng lo, tôi đổi miễn phí cho anh sang chuyến sau."},{r:"A",t:"谢谢。",p:"Xièxie.",v:"Cảm ơn."},{r:"B",t:"这是餐券，可以在二楼的餐厅用。",p:"Zhè shì cānquàn, kěyǐ zài èr lóu de cāntīng yòng.",v:"Đây là phiếu ăn, dùng được ở nhà hàng tầng hai."}],phrases:[{t:"非常抱歉，飞机出了技术问题。",p:"Fēicháng bàoqiàn, fēijī chūle jìshù wèntí.",v:"Rất xin lỗi, máy bay gặp sự cố kỹ thuật."},{t:"大概三个小时，新的起飞时间是六点半。",p:"Dàgài sān ge xiǎoshí, xīn de qǐfēi shíjiān shì liù diǎn bàn.",v:"Khoảng ba tiếng, giờ cất cánh mới là sáu rưỡi."},{t:"别担心，我免费帮您改到下一班。",p:"Bié dānxīn, wǒ miǎnfèi bāng nín gǎi dào xià yì bān.",v:"Đừng lo, tôi đổi miễn phí cho anh sang chuyến sau."},{t:"这是餐券，可以在二楼的餐厅用。",p:"Zhè shì cānquàn, kěyǐ zài èr lóu de cāntīng yòng.",v:"Đây là phiếu ăn, dùng được ở nhà hàng tầng hai."}],notes:[{h:"赶不上",b:"赶不上 là không kịp. 赶得上 là kịp."},{h:"Xin lỗi và đưa giải pháp",b:"非常抱歉 + giải thích ngắn + giải pháp cụ thể (改签, 餐券)."}]},
 {id:"zh-w-pharma-rep",title:"Trình dược viên gặp bác sĩ",scene:"Bạn là trình dược viên, giới thiệu thuốc mới cho bác sĩ.",partner:"医生",ind:"pharma",work:true,lines:[{r:"A",t:"你有五分钟，有什么新药？",p:"Nǐ yǒu wǔ fēnzhōng, yǒu shénme xīn yào?",v:"Anh có năm phút, có thuốc gì mới?"},{r:"B",t:"谢谢医生。我们刚推出一种治疗高血压的新药。",p:"Xièxie yīshēng. Wǒmen gāng tuīchū yì zhǒng zhìliáo gāoxuèyā de xīn yào.",v:"Cảm ơn bác sĩ. Bên em vừa ra mắt một loại thuốc mới điều trị cao huyết áp."},{r:"A",t:"有什么不一样？",p:"Yǒu shénme bù yíyàng?",v:"Có gì khác?"},{r:"B",t:"病人每天只需要吃一片。",p:"Bìngrén měi tiān zhǐ xūyào chī yí piàn.",v:"Bệnh nhân mỗi ngày chỉ cần uống một viên."},{r:"A",t:"副作用呢？",p:"Fùzuòyòng ne?",v:"Còn tác dụng phụ?"},{r:"B",t:"临床试验中副作用很轻，也很少见。这是研究报告。",p:"Línchuáng shìyàn zhōng fùzuòyòng hěn qīng, yě hěn shǎo jiàn. Zhè shì yánjiū bàogào.",v:"Trong thử nghiệm lâm sàng tác dụng phụ nhẹ và hiếm gặp. Đây là báo cáo nghiên cứu."},{r:"A",t:"我会看的。",p:"Wǒ huì kàn de.",v:"Tôi sẽ đọc."},{r:"B",t:"谢谢。我可以留一些样品给您的病人。",p:"Xièxie. Wǒ kěyǐ liú yìxiē yàngpǐn gěi nín de bìngrén.",v:"Cảm ơn bác sĩ. Em có thể để lại ít mẫu cho bệnh nhân."}],phrases:[{t:"谢谢医生。我们刚推出一种治疗高血压的新药。",p:"Xièxie yīshēng. Wǒmen gāng tuīchū yì zhǒng zhìliáo gāoxuèyā de xīn yào.",v:"Cảm ơn bác sĩ. Bên em vừa ra mắt một loại thuốc mới điều trị cao huyết áp."},{t:"病人每天只需要吃一片。",p:"Bìngrén měi tiān zhǐ xūyào chī yí piàn.",v:"Bệnh nhân mỗi ngày chỉ cần uống một viên."},{t:"临床试验中副作用很轻，也很少见。这是研究报告。",p:"Línchuáng shìyàn zhōng fùzuòyòng hěn qīng, yě hěn shǎo jiàn. Zhè shì yánjiū bàogào.",v:"Trong thử nghiệm lâm sàng tác dụng phụ nhẹ và hiếm gặp. Đây là báo cáo nghiên cứu."},{t:"谢谢。我可以留一些样品给您的病人。",p:"Xièxie. Wǒ kěyǐ liú yìxiē yàngpǐn gěi nín de bìngrén.",v:"Cảm ơn bác sĩ. Em có thể để lại ít mẫu cho bệnh nhân."}],notes:[{h:"刚 là vừa mới",b:"我们刚推出… là bên em vừa mới ra mắt…"},{h:"只需要",b:"只需要吃一片 là chỉ cần uống một viên, nhấn mạnh sự tiện lợi."}]},
 {id:"zh-w-pharma-lab",title:"Báo cáo kết quả kiểm nghiệm",scene:"Bạn làm ở phòng kiểm nghiệm, báo cáo một lô thuốc không đạt.",partner:"质量经理",ind:"pharma",work:true,lines:[{r:"A",t:"二三零五批次有问题吗？",p:"Èr sān líng wǔ pīcì yǒu wèntí ma?",v:"Lô 2305 có vấn đề không?"},{r:"B",t:"有。检测结果显示药片溶解太慢。",p:"Yǒu. Jiǎncè jiéguǒ xiǎnshì yàopiàn róngjiě tài màn.",v:"Có. Kết quả kiểm nghiệm cho thấy viên thuốc tan quá chậm."},{r:"A",t:"慢多少？",p:"Màn duōshao?",v:"Chậm bao nhiêu?"},{r:"B",t:"三十分钟只溶解了百分之七十，标准是百分之八十五。",p:"Sānshí fēnzhōng zhǐ róngjiěle bǎi fēn zhī qīshí, biāozhǔn shì bǎi fēn zhī bāshíwǔ.",v:"Ba mươi phút chỉ tan bảy mươi phần trăm, tiêu chuẩn là tám mươi lăm."},{r:"A",t:"重新测了吗？",p:"Chóngxīn cèle ma?",v:"Đã đo lại chưa?"},{r:"B",t:"测了三次，结果都一样。",p:"Cèle sān cì, jiéguǒ dōu yíyàng.",v:"Đo ba lần, kết quả đều như nhau."},{r:"A",t:"那不能放行。",p:"Nà bù néng fàngxíng.",v:"Vậy không được xuất xưởng."},{r:"B",t:"我同意。我先把这批货封存，然后写报告。",p:"Wǒ tóngyì. Wǒ xiān bǎ zhè pī huò fēngcún, ránhòu xiě bàogào.",v:"Em đồng ý. Em tạm niêm phong lô này trước rồi viết báo cáo."}],phrases:[{t:"有。检测结果显示药片溶解太慢。",p:"Yǒu. Jiǎncè jiéguǒ xiǎnshì yàopiàn róngjiě tài màn.",v:"Có. Kết quả kiểm nghiệm cho thấy viên thuốc tan quá chậm."},{t:"三十分钟只溶解了百分之七十，标准是百分之八十五。",p:"Sānshí fēnzhōng zhǐ róngjiěle bǎi fēn zhī qīshí, biāozhǔn shì bǎi fēn zhī bāshíwǔ.",v:"Ba mươi phút chỉ tan bảy mươi phần trăm, tiêu chuẩn là tám mươi lăm."},{t:"测了三次，结果都一样。",p:"Cèle sān cì, jiéguǒ dōu yíyàng.",v:"Đo ba lần, kết quả đều như nhau."},{t:"我同意。我先把这批货封存，然后写报告。",p:"Wǒ tóngyì. Wǒ xiān bǎ zhè pī huò fēngcún, ránhòu xiě bàogào.",v:"Em đồng ý. Em tạm niêm phong lô này trước rồi viết báo cáo."}],notes:[{h:"So với tiêu chuẩn",b:"标准是… giúp người nghe hiểu ngay lô thuốc không đạt."},{h:"批 là lượng từ cho lô hàng",b:"这批货 là lô hàng này. 批次 là số lô."}]},
 {id:"zh-w-pharma-counter",title:"Bán thuốc theo đơn",scene:"Bạn là dược sĩ ở nhà thuốc, bán thuốc theo đơn của bác sĩ.",partner:"顾客",ind:"pharma",work:true,lines:[{r:"A",t:"你好，这是医生开的处方。",p:"Nǐ hǎo, zhè shì yīshēng kāi de chǔfāng.",v:"Chào chị, đây là đơn thuốc bác sĩ kê."},{r:"B",t:"谢谢，我看一下。这个抗生素要吃七天。",p:"Xièxie, wǒ kàn yíxià. Zhège kàngshēngsù yào chī qī tiān.",v:"Cảm ơn, để tôi xem. Thuốc kháng sinh này uống bảy ngày."},{r:"A",t:"怎么吃？",p:"Zěnme chī?",v:"Uống thế nào?"},{r:"B",t:"一天两次，一次一粒，早饭和晚饭后吃。",p:"Yì tiān liǎng cì, yí cì yí lì, zǎofàn hé wǎnfàn hòu chī.",v:"Ngày hai lần, mỗi lần một viên, uống sau bữa sáng và bữa tối."},{r:"A",t:"可以喝酒吗？",p:"Kěyǐ hē jiǔ ma?",v:"Uống rượu được không?"},{r:"B",t:"不可以，吃药期间不要喝酒。",p:"Bù kěyǐ, chī yào qījiān bú yào hē jiǔ.",v:"Không được, trong thời gian uống thuốc đừng uống rượu."},{r:"A",t:"如果三天就好了呢？",p:"Rúguǒ sān tiān jiù hǎo le ne?",v:"Nếu ba ngày đã khỏi thì sao?"},{r:"B",t:"就算好了，也要把药吃完。",p:"Jiùsuàn hǎo le, yě yào bǎ yào chīwán.",v:"Dù đã khỏi cũng phải uống hết thuốc."}],phrases:[{t:"谢谢，我看一下。这个抗生素要吃七天。",p:"Xièxie, wǒ kàn yíxià. Zhège kàngshēngsù yào chī qī tiān.",v:"Cảm ơn, để tôi xem. Thuốc kháng sinh này uống bảy ngày."},{t:"一天两次，一次一粒，早饭和晚饭后吃。",p:"Yì tiān liǎng cì, yí cì yí lì, zǎofàn hé wǎnfàn hòu chī.",v:"Ngày hai lần, mỗi lần một viên, uống sau bữa sáng và bữa tối."},{t:"不可以，吃药期间不要喝酒。",p:"Bù kěyǐ, chī yào qījiān bú yào hē jiǔ.",v:"Không được, trong thời gian uống thuốc đừng uống rượu."},{t:"就算好了，也要把药吃完。",p:"Jiùsuàn hǎo le, yě yào bǎ yào chīwán.",v:"Dù đã khỏi cũng phải uống hết thuốc."}],notes:[{h:"就算…也…",b:"就算好了，也要吃完 là dù đã khỏi cũng phải uống hết."},{h:"粒 và 片",b:"粒 dùng cho viên con nhộng, viên tròn nhỏ; 片 dùng cho viên dẹt."}]},
 {id:"zh-w-edu-parent",title:"Họp phụ huynh",scene:"Bạn là giáo viên chủ nhiệm, trao đổi với phụ huynh về việc học của con.",partner:"家长",ind:"edu",work:true,lines:[{r:"A",t:"老师，我儿子在班里学得怎么样？",p:"Lǎoshī, wǒ érzi zài bān li xué de zěnmeyàng?",v:"Thưa cô, con trai tôi học trên lớp thế nào?"},{r:"B",t:"他数学学得很好，但是英语还需要努力。",p:"Tā shùxué xué de hěn hǎo, dànshì Yīngyǔ hái xūyào nǔlì.",v:"Cháu học toán rất tốt, nhưng tiếng Anh còn cần cố gắng."},{r:"A",t:"英语有什么问题？",p:"Yīngyǔ yǒu shénme wèntí?",v:"Tiếng Anh có vấn đề gì?"},{r:"B",t:"他常常忘记做作业，词汇量也比较少。",p:"Tā chángcháng wàngjì zuò zuòyè, cíhuìliàng yě bǐjiào shǎo.",v:"Cháu hay quên làm bài tập, vốn từ cũng khá ít."},{r:"A",t:"在家我们怎么帮他？",p:"Zài jiā wǒmen zěnme bāng tā?",v:"Ở nhà chúng tôi giúp cháu thế nào?"},{r:"B",t:"请每天晚上检查他的作业，让他读十五分钟英文故事。",p:"Qǐng měi tiān wǎnshang jiǎnchá tā de zuòyè, ràng tā dú shíwǔ fēnzhōng Yīngwén gùshi.",v:"Anh chị kiểm tra bài tập mỗi tối, cho cháu đọc truyện tiếng Anh mười lăm phút."},{r:"A",t:"好，我们试试。",p:"Hǎo, wǒmen shìshi.",v:"Vâng, chúng tôi thử xem."},{r:"B",t:"谢谢您。期中考试以后我们再聊。",p:"Xièxie nín. Qīzhōng kǎoshì yǐhòu wǒmen zài liáo.",v:"Cảm ơn anh chị. Sau kỳ thi giữa kỳ mình trao đổi tiếp."}],phrases:[{t:"他数学学得很好，但是英语还需要努力。",p:"Tā shùxué xué de hěn hǎo, dànshì Yīngyǔ hái xūyào nǔlì.",v:"Cháu học toán rất tốt, nhưng tiếng Anh còn cần cố gắng."},{t:"他常常忘记做作业，词汇量也比较少。",p:"Tā chángcháng wàngjì zuò zuòyè, cíhuìliàng yě bǐjiào shǎo.",v:"Cháu hay quên làm bài tập, vốn từ cũng khá ít."},{t:"请每天晚上检查他的作业，让他读十五分钟英文故事。",p:"Qǐng měi tiān wǎnshang jiǎnchá tā de zuòyè, ràng tā dú shíwǔ fēnzhōng Yīngwén gùshi.",v:"Anh chị kiểm tra bài tập mỗi tối, cho cháu đọc truyện tiếng Anh mười lăm phút."},{t:"谢谢您。期中考试以后我们再聊。",p:"Xièxie nín. Qīzhōng kǎoshì yǐhòu wǒmen zài liáo.",v:"Cảm ơn anh chị. Sau kỳ thi giữa kỳ mình trao đổi tiếp."}],notes:[{h:"Khen trước, góp ý sau",b:"他数学学得很好，但是… giúp phụ huynh dễ tiếp nhận."},{h:"Bổ ngữ trạng thái 得",b:"学得很好 là học tốt. Cấu trúc: động từ + 得 + đánh giá."}]},
 {id:"zh-w-edu-class",title:"Điều hành lớp học",scene:"Bạn là giáo viên tiếng Trung, hướng dẫn hoạt động nhóm trên lớp.",partner:"学生",ind:"edu",work:true,lines:[{r:"A",t:"老师，现在做什么？",p:"Lǎoshī, xiànzài zuò shénme?",v:"Thưa cô, giờ làm gì ạ?"},{r:"B",t:"请四个人一组，每组拿一张图片。",p:"Qǐng sì ge rén yì zǔ, měi zǔ ná yì zhāng túpiàn.",v:"Bốn người một nhóm, mỗi nhóm lấy một bức tranh."},{r:"A",t:"图片做什么用？",p:"Túpiàn zuò shénme yòng?",v:"Tranh để làm gì ạ?"},{r:"B",t:"一起描述图片，写五个句子。你们有十分钟。",p:"Yìqǐ miáoshù túpiàn, xiě wǔ ge jùzi. Nǐmen yǒu shí fēnzhōng.",v:"Cùng mô tả tranh, viết năm câu. Các em có mười phút."},{r:"A",t:"可以查词典吗？",p:"Kěyǐ chá cídiǎn ma?",v:"Tra từ điển được không ạ?"},{r:"B",t:"可以，但是先试试用学过的词。",p:"Kěyǐ, dànshì xiān shìshi yòng xuéguo de cí.",v:"Được, nhưng trước hết thử dùng từ đã học."},{r:"A",t:"我们写完了！",p:"Wǒmen xiěwán le!",v:"Chúng em viết xong rồi!"},{r:"B",t:"很好！现在每组请一个同学大声读一下。",p:"Hěn hǎo! Xiànzài měi zǔ qǐng yí ge tóngxué dàshēng dú yíxià.",v:"Rất tốt! Giờ mỗi nhóm mời một bạn đọc to lên."}],phrases:[{t:"请四个人一组，每组拿一张图片。",p:"Qǐng sì ge rén yì zǔ, měi zǔ ná yì zhāng túpiàn.",v:"Bốn người một nhóm, mỗi nhóm lấy một bức tranh."},{t:"一起描述图片，写五个句子。你们有十分钟。",p:"Yìqǐ miáoshù túpiàn, xiě wǔ ge jùzi. Nǐmen yǒu shí fēnzhōng.",v:"Cùng mô tả tranh, viết năm câu. Các em có mười phút."},{t:"可以，但是先试试用学过的词。",p:"Kěyǐ, dànshì xiān shìshi yòng xuéguo de cí.",v:"Được, nhưng trước hết thử dùng từ đã học."},{t:"很好！现在每组请一个同学大声读一下。",p:"Hěn hǎo! Xiànzài měi zǔ qǐng yí ge tóngxué dàshēng dú yíxià.",v:"Rất tốt! Giờ mỗi nhóm mời một bạn đọc to lên."}],notes:[{h:"学过的词",b:"Động từ + 过 + 的 + danh từ: 学过的词 là từ đã học."},{h:"Khen học sinh",b:"很好！/ 太棒了！/ 不错！ giúp học sinh tự tin."}]},
 {id:"zh-w-edu-enroll",title:"Tư vấn khóa học",scene:"Bạn là tư vấn viên của trung tâm ngoại ngữ, tư vấn khóa học cho người lớn.",partner:"学员",ind:"edu",work:true,lines:[{r:"A",t:"我想提高中文，为了工作。",p:"Wǒ xiǎng tígāo Zhōngwén, wèile gōngzuò.",v:"Tôi muốn nâng cao tiếng Trung để đi làm."},{r:"B",t:"好的。请先做一个分班测试，了解您的水平。",p:"Hǎo de. Qǐng xiān zuò yí ge fēnbān cèshì, liǎojiě nín de shuǐpíng.",v:"Vâng. Trước tiên anh làm bài kiểm tra xếp lớp để biết trình độ."},{r:"A",t:"课程多长时间？",p:"Kèchéng duō cháng shíjiān?",v:"Khóa học bao lâu?"},{r:"B",t:"三个月，每周三个晚上，每次两个小时。",p:"Sān ge yuè, měi zhōu sān ge wǎnshang, měi cì liǎng ge xiǎoshí.",v:"Ba tháng, mỗi tuần ba buổi tối, mỗi buổi hai tiếng."},{r:"A",t:"一个班有多少学员？",p:"Yí ge bān yǒu duōshao xuéyuán?",v:"Một lớp bao nhiêu học viên?"},{r:"B",t:"不超过十二个，每个人都有机会说。",p:"Bù chāoguò shí'èr ge, měi ge rén dōu yǒu jīhuì shuō.",v:"Không quá mười hai, ai cũng có cơ hội nói."},{r:"A",t:"学费多少？",p:"Xuéfèi duōshao?",v:"Học phí bao nhiêu?"},{r:"B",t:"六百万越南盾。这个星期报名可以打九折。",p:"Liùbǎi wàn Yuènán dùn. Zhège xīngqī bàomíng kěyǐ dǎ jiǔ zhé.",v:"Sáu triệu đồng. Đăng ký tuần này được giảm 10%."}],phrases:[{t:"好的。请先做一个分班测试，了解您的水平。",p:"Hǎo de. Qǐng xiān zuò yí ge fēnbān cèshì, liǎojiě nín de shuǐpíng.",v:"Vâng. Trước tiên anh làm bài kiểm tra xếp lớp để biết trình độ."},{t:"三个月，每周三个晚上，每次两个小时。",p:"Sān ge yuè, měi zhōu sān ge wǎnshang, měi cì liǎng ge xiǎoshí.",v:"Ba tháng, mỗi tuần ba buổi tối, mỗi buổi hai tiếng."},{t:"不超过十二个，每个人都有机会说。",p:"Bù chāoguò shí'èr ge, měi ge rén dōu yǒu jīhuì shuō.",v:"Không quá mười hai, ai cũng có cơ hội nói."},{t:"六百万越南盾。这个星期报名可以打九折。",p:"Liùbǎi wàn Yuènán dùn. Zhège xīngqī bàomíng kěyǐ dǎ jiǔ zhé.",v:"Sáu triệu đồng. Đăng ký tuần này được giảm 10%."}],notes:[{h:"打九折",b:"打九折 là giảm còn 90% giá, tức giảm 10%. 打八折 là giảm 20%."},{h:"不超过",b:"不超过十二个 là không quá mười hai."}]},
 {id:"zh-w-law-consult",title:"Tư vấn pháp lý lần đầu",scene:"Bạn là luật sư, gặp khách hàng lần đầu về tranh chấp hợp đồng.",partner:"客户",ind:"law",work:true,lines:[{r:"A",t:"我已经付款了，可是供应商没有发货。",p:"Wǒ yǐjīng fùkuǎn le, kěshì gōngyìngshāng méiyǒu fāhuò.",v:"Tôi đã trả tiền rồi mà nhà cung cấp không giao hàng."},{r:"B",t:"明白了。你们有书面合同吗？",p:"Míngbai le. Nǐmen yǒu shūmiàn hétong ma?",v:"Tôi hiểu. Hai bên có hợp đồng bằng văn bản không?"},{r:"A",t:"有，在这儿。",p:"Yǒu, zài zhèr.",v:"Có, đây ạ."},{r:"B",t:"好。第七条规定他们必须在三十天内交货。",p:"Hǎo. Dì qī tiáo guīdìng tāmen bìxū zài sānshí tiān nèi jiāohuò.",v:"Tốt. Điều bảy quy định họ phải giao hàng trong ba mươi ngày."},{r:"A",t:"已经六十天了。",p:"Yǐjīng liùshí tiān le.",v:"Đã sáu mươi ngày rồi."},{r:"B",t:"那他们违约了。我们先给他们发一封正式的律师函。",p:"Nà tāmen wéiyuē le. Wǒmen xiān gěi tāmen fā yì fēng zhèngshì de lǜshīhán.",v:"Vậy họ đã vi phạm hợp đồng. Trước tiên ta gửi họ một thư luật sư chính thức."},{r:"A",t:"如果他们不回复呢？",p:"Rúguǒ tāmen bù huífù ne?",v:"Nếu họ không trả lời thì sao?"},{r:"B",t:"那我们可以起诉，或者申请仲裁。",p:"Nà wǒmen kěyǐ qǐsù, huòzhě shēnqǐng zhòngcái.",v:"Thì chúng ta có thể khởi kiện hoặc yêu cầu trọng tài."}],phrases:[{t:"明白了。你们有书面合同吗？",p:"Míngbai le. Nǐmen yǒu shūmiàn hétong ma?",v:"Tôi hiểu. Hai bên có hợp đồng bằng văn bản không?"},{t:"好。第七条规定他们必须在三十天内交货。",p:"Hǎo. Dì qī tiáo guīdìng tāmen bìxū zài sānshí tiān nèi jiāohuò.",v:"Tốt. Điều bảy quy định họ phải giao hàng trong ba mươi ngày."},{t:"那他们违约了。我们先给他们发一封正式的律师函。",p:"Nà tāmen wéiyuē le. Wǒmen xiān gěi tāmen fā yì fēng zhèngshì de lǜshīhán.",v:"Vậy họ đã vi phạm hợp đồng. Trước tiên ta gửi họ một thư luật sư chính thức."},{t:"那我们可以起诉，或者申请仲裁。",p:"Nà wǒmen kěyǐ qǐsù, huòzhě shēnqǐng zhòngcái.",v:"Thì chúng ta có thể khởi kiện hoặc yêu cầu trọng tài."}],notes:[{h:"第…条",b:"第七条 là điều thứ bảy. 规定 là quy định."},{h:"违约",b:"违约 là vi phạm hợp đồng. 违约金 là tiền phạt vi phạm."}]},
 {id:"zh-w-law-company",title:"Thành lập công ty",scene:"Một nhà đầu tư nước ngoài hỏi bạn về thủ tục thành lập công ty.",partner:"投资者",ind:"law",work:true,lines:[{r:"A",t:"我想在越南开一家公司。",p:"Wǒ xiǎng zài Yuènán kāi yì jiā gōngsī.",v:"Tôi muốn mở một công ty ở Việt Nam."},{r:"B",t:"您打算做什么业务？",p:"Nín dǎsuàn zuò shénme yèwù?",v:"Anh định kinh doanh lĩnh vực gì?"},{r:"A",t:"软件公司。",p:"Ruǎnjiàn gōngsī.",v:"Công ty phần mềm."},{r:"B",t:"好的。对您来说，有限责任公司是最常见的类型。",p:"Hǎo de. Duì nín lái shuō, yǒuxiàn zérèn gōngsī shì zuì chángjiàn de lèixíng.",v:"Vâng. Với anh, công ty trách nhiệm hữu hạn là loại hình phổ biến nhất."},{r:"A",t:"需要什么材料？",p:"Xūyào shénme cáiliào?",v:"Cần những giấy tờ gì?"},{r:"B",t:"护照、地址证明，还有银行出具的资金证明。",p:"Hùzhào, dìzhǐ zhèngmíng, hái yǒu yínháng chūjù de zījīn zhèngmíng.",v:"Hộ chiếu, giấy xác nhận địa chỉ và xác nhận vốn do ngân hàng cấp."},{r:"A",t:"要多长时间？",p:"Yào duō cháng shíjiān?",v:"Mất bao lâu?"},{r:"B",t:"投资证和营业执照大概要六到八个星期。",p:"Tóuzīzhèng hé yíngyè zhízhào dàgài yào liù dào bā ge xīngqī.",v:"Giấy chứng nhận đầu tư và giấy phép kinh doanh mất khoảng sáu đến tám tuần."}],phrases:[{t:"您打算做什么业务？",p:"Nín dǎsuàn zuò shénme yèwù?",v:"Anh định kinh doanh lĩnh vực gì?"},{t:"好的。对您来说，有限责任公司是最常见的类型。",p:"Hǎo de. Duì nín lái shuō, yǒuxiàn zérèn gōngsī shì zuì chángjiàn de lèixíng.",v:"Vâng. Với anh, công ty trách nhiệm hữu hạn là loại hình phổ biến nhất."},{t:"护照、地址证明，还有银行出具的资金证明。",p:"Hùzhào, dìzhǐ zhèngmíng, hái yǒu yínháng chūjù de zījīn zhèngmíng.",v:"Hộ chiếu, giấy xác nhận địa chỉ và xác nhận vốn do ngân hàng cấp."},{t:"投资证和营业执照大概要六到八个星期。",p:"Tóuzīzhèng hé yíngyè zhízhào dàgài yào liù dào bā ge xīngqī.",v:"Giấy chứng nhận đầu tư và giấy phép kinh doanh mất khoảng sáu đến tám tuần."}],notes:[{h:"对…来说",b:"对您来说 là đối với anh. Dùng để nêu góc nhìn."},{h:"有限责任公司",b:"Công ty TNHH. 股份有限公司 là công ty cổ phần."}]},
 {id:"zh-w-law-labor",title:"Tư vấn luật lao động",scene:"Một nhân viên hỏi bạn về quyền lợi khi bị cho nghỉ việc.",partner:"员工",ind:"law",work:true,lines:[{r:"A",t:"公司没有提前通知就把我辞退了，这合法吗？",p:"Gōngsī méiyǒu tíqián tōngzhī jiù bǎ wǒ cítuì le, zhè héfǎ ma?",v:"Công ty không báo trước đã cho tôi nghỉ, như vậy có hợp pháp không?"},{r:"B",t:"要看您的合同。您签的是无固定期限合同吗？",p:"Yào kàn nín de hétong. Nín qiān de shì wú gùdìng qīxiàn hétong ma?",v:"Phải xem hợp đồng của anh. Anh ký hợp đồng không xác định thời hạn phải không?"},{r:"A",t:"是的，我在那儿工作四年了。",p:"Shì de, wǒ zài nàr gōngzuò sì nián le.",v:"Đúng, tôi làm ở đó bốn năm rồi."},{r:"B",t:"那公司至少要提前四十五天通知您。",p:"Nà gōngsī zhìshǎo yào tíqián sìshíwǔ tiān tōngzhī nín.",v:"Vậy công ty phải báo trước anh ít nhất bốn mươi lăm ngày."},{r:"A",t:"他们没有。",p:"Tāmen méiyǒu.",v:"Họ không báo."},{r:"B",t:"这种情况下，您可以要求赔偿。",p:"Zhè zhǒng qíngkuàng xià, nín kěyǐ yāoqiú péicháng.",v:"Trong trường hợp này, anh có thể yêu cầu bồi thường."},{r:"A",t:"我现在该怎么做？",p:"Wǒ xiànzài gāi zěnme zuò?",v:"Giờ tôi nên làm gì?"},{r:"B",t:"保留所有的邮件和文件，我帮您写投诉书。",p:"Bǎoliú suǒyǒu de yóujiàn hé wénjiàn, wǒ bāng nín xiě tóusùshū.",v:"Giữ lại toàn bộ email và tài liệu, tôi giúp anh viết đơn khiếu nại."}],phrases:[{t:"要看您的合同。您签的是无固定期限合同吗？",p:"Yào kàn nín de hétong. Nín qiān de shì wú gùdìng qīxiàn hétong ma?",v:"Phải xem hợp đồng của anh. Anh ký hợp đồng không xác định thời hạn phải không?"},{t:"那公司至少要提前四十五天通知您。",p:"Nà gōngsī zhìshǎo yào tíqián sìshíwǔ tiān tōngzhī nín.",v:"Vậy công ty phải báo trước anh ít nhất bốn mươi lăm ngày."},{t:"这种情况下，您可以要求赔偿。",p:"Zhè zhǒng qíngkuàng xià, nín kěyǐ yāoqiú péicháng.",v:"Trong trường hợp này, anh có thể yêu cầu bồi thường."},{t:"保留所有的邮件和文件，我帮您写投诉书。",p:"Bǎoliú suǒyǒu de yóujiàn hé wénjiàn, wǒ bāng nín xiě tóusùshū.",v:"Giữ lại toàn bộ email và tài liệu, tôi giúp anh viết đơn khiếu nại."}],notes:[{h:"要看…",b:"要看您的合同 là còn tùy hợp đồng của anh."},{h:"提前",b:"提前通知 là thông báo trước. 提前 là trước thời hạn."}]},
 {id:"zh-w-media-interview",title:"Phỏng vấn nhân vật",scene:"Bạn là phóng viên, phỏng vấn một doanh nhân trẻ.",partner:"企业家",ind:"media",work:true,lines:[{r:"A",t:"谢谢你们邀请我。",p:"Xièxie nǐmen yāoqǐng wǒ.",v:"Cảm ơn đã mời tôi."},{r:"B",t:"谢谢您抽时间。能跟我们说说您是怎么开始创业的吗？",p:"Xièxie nín chōu shíjiān. Néng gēn wǒmen shuōshuo nín shì zěnme kāishǐ chuàngyè de ma?",v:"Cảm ơn anh đã dành thời gian. Anh kể chúng tôi nghe anh bắt đầu khởi nghiệp thế nào được không?"},{r:"A",t:"我上大学的时候开始在网上卖咖啡。",p:"Wǒ shàng dàxué de shíhou kāishǐ zài wǎngshang mài kāfēi.",v:"Khi học đại học tôi bắt đầu bán cà phê trên mạng."},{r:"B",t:"最大的困难是什么？",p:"Zuì dà de kùnnan shì shénme?",v:"Khó khăn lớn nhất là gì?"},{r:"A",t:"找钱。银行不相信一个学生。",p:"Zhǎo qián. Yínháng bù xiāngxìn yí ge xuésheng.",v:"Tìm vốn. Ngân hàng không tin một sinh viên."},{r:"B",t:"您是怎么解决的？",p:"Nín shì zěnme jiějué de?",v:"Anh đã giải quyết thế nào?"},{r:"A",t:"我跟家人借钱，每一分钱都省着用。",p:"Wǒ gēn jiārén jiè qián, měi yì fēn qián dōu shěngzhe yòng.",v:"Tôi vay gia đình, từng đồng đều tiêu tiết kiệm."},{r:"B",t:"很有意思。您对年轻人有什么建议？",p:"Hěn yǒu yìsi. Nín duì niánqīngrén yǒu shénme jiànyì?",v:"Rất thú vị. Anh có lời khuyên gì cho người trẻ?"}],phrases:[{t:"谢谢您抽时间。能跟我们说说您是怎么开始创业的吗？",p:"Xièxie nín chōu shíjiān. Néng gēn wǒmen shuōshuo nín shì zěnme kāishǐ chuàngyè de ma?",v:"Cảm ơn anh đã dành thời gian. Anh kể chúng tôi nghe anh bắt đầu khởi nghiệp thế nào được không?"},{t:"最大的困难是什么？",p:"Zuì dà de kùnnan shì shénme?",v:"Khó khăn lớn nhất là gì?"},{t:"您是怎么解决的？",p:"Nín shì zěnme jiějué de?",v:"Anh đã giải quyết thế nào?"},{t:"很有意思。您对年轻人有什么建议？",p:"Hěn yǒu yìsi. Nín duì niánqīngrén yǒu shénme jiànyì?",v:"Rất thú vị. Anh có lời khuyên gì cho người trẻ?"}],notes:[{h:"是…的",b:"您是怎么解决的？ Cấu trúc 是…的 nhấn mạnh cách thức của việc đã xảy ra."},{h:"抽时间",b:"抽时间 là dành ra thời gian (dù bận)."}]},
 {id:"zh-w-media-pr",title:"Lên kế hoạch truyền thông",scene:"Bạn làm PR, họp với khách hàng về chiến dịch ra mắt sản phẩm.",partner:"客户",ind:"media",work:true,lines:[{r:"A",t:"我们下个月推出一款新手机。",p:"Wǒmen xià ge yuè tuīchū yì kuǎn xīn shǒujī.",v:"Tháng sau chúng tôi ra mắt một mẫu điện thoại mới."},{r:"B",t:"你们的目标客户是谁？",p:"Nǐmen de mùbiāo kèhù shì shéi?",v:"Khách hàng mục tiêu là ai?"},{r:"A",t:"大学生和刚工作的年轻人。",p:"Dàxuéshēng hé gāng gōngzuò de niánqīngrén.",v:"Sinh viên và người trẻ mới đi làm."},{r:"B",t:"那我们应该主攻抖音，和几个热门网红合作。",p:"Nà wǒmen yīnggāi zhǔgōng Dǒuyīn, hé jǐ ge rèmén wǎnghóng hézuò.",v:"Vậy nên tập trung vào TikTok, hợp tác với vài người nổi tiếng trên mạng."},{r:"A",t:"媒体方面呢？",p:"Méitǐ fāngmiàn ne?",v:"Còn về báo chí?"},{r:"B",t:"我们办一场发布会，再给二十家科技网站发新闻稿。",p:"Wǒmen bàn yì chǎng fābùhuì, zài gěi èrshí jiā kējì wǎngzhàn fā xīnwéngǎo.",v:"Chúng ta tổ chức một buổi họp báo, rồi gửi thông cáo cho hai mươi trang công nghệ."},{r:"A",t:"怎么衡量效果？",p:"Zěnme héngliáng xiàoguǒ?",v:"Đo lường hiệu quả thế nào?"},{r:"B",t:"看浏览量、互动量和预订数量。",p:"Kàn liúlǎnliàng, hùdòngliàng hé yùdìng shùliàng.",v:"Xem lượt xem, lượt tương tác và số đơn đặt trước."}],phrases:[{t:"你们的目标客户是谁？",p:"Nǐmen de mùbiāo kèhù shì shéi?",v:"Khách hàng mục tiêu là ai?"},{t:"那我们应该主攻抖音，和几个热门网红合作。",p:"Nà wǒmen yīnggāi zhǔgōng Dǒuyīn, hé jǐ ge rèmén wǎnghóng hézuò.",v:"Vậy nên tập trung vào TikTok, hợp tác với vài người nổi tiếng trên mạng."},{t:"我们办一场发布会，再给二十家科技网站发新闻稿。",p:"Wǒmen bàn yì chǎng fābùhuì, zài gěi èrshí jiā kējì wǎngzhàn fā xīnwéngǎo.",v:"Chúng ta tổ chức một buổi họp báo, rồi gửi thông cáo cho hai mươi trang công nghệ."},{t:"看浏览量、互动量和预订数量。",p:"Kàn liúlǎnliàng, hùdòngliàng hé yùdìng shùliàng.",v:"Xem lượt xem, lượt tương tác và số đơn đặt trước."}],notes:[{h:"抖音",b:"抖音 là phiên bản TikTok ở Trung Quốc. 网红 là người nổi tiếng trên mạng."},{h:"发布会",b:"新闻发布会 là họp báo, nơi ra mắt sản phẩm với báo chí."}]},
 {id:"zh-w-media-news",title:"Họp tòa soạn",scene:"Bạn là biên tập viên, phân công tin bài trong buổi họp sáng.",partner:"记者",ind:"media",work:true,lines:[{r:"A",t:"今天的主要新闻有哪些？",p:"Jīntiān de zhǔyào xīnwén yǒu nǎxiē?",v:"Hôm nay có những tin chính nào?"},{r:"B",t:"最大的是中部的洪水。阿兰，你去报道好吗？",p:"Zuì dà de shì zhōngbù de hóngshuǐ. Ā Lán, nǐ qù bàodào hǎo ma?",v:"Tin lớn nhất là lũ ở miền Trung. Lan, em đi đưa tin nhé?"},{r:"A",t:"好的。要去现场吗？",p:"Hǎo de. Yào qù xiànchǎng ma?",v:"Vâng. Có cần đến hiện trường không ạ?"},{r:"B",t:"要，带一个摄影记者。下午三点前要照片。",p:"Yào, dài yí ge shèyǐng jìzhě. Xiàwǔ sān diǎn qián yào zhàopiàn.",v:"Có, dẫn theo một phóng viên ảnh. Trước ba giờ chiều cần ảnh."},{r:"A",t:"经济新闻呢？",p:"Jīngjì xīnwén ne?",v:"Còn tin kinh tế?"},{r:"B",t:"阿南写新的利率。数据要跟央行核实。",p:"Ā Nán xiě xīn de lìlǜ. Shùjù yào gēn yāngháng héshí.",v:"Nam viết về lãi suất mới. Số liệu phải kiểm chứng với ngân hàng trung ương."},{r:"A",t:"截稿时间是几点？",p:"Jiégǎo shíjiān shì jǐ diǎn?",v:"Hạn nộp bài mấy giờ ạ?"},{r:"B",t:"网络版下午五点，报纸版晚上八点。",p:"Wǎngluòbǎn xiàwǔ wǔ diǎn, bàozhǐbǎn wǎnshang bā diǎn.",v:"Bản online năm giờ chiều, bản báo in tám giờ tối."}],phrases:[{t:"最大的是中部的洪水。阿兰，你去报道好吗？",p:"Zuì dà de shì zhōngbù de hóngshuǐ. Ā Lán, nǐ qù bàodào hǎo ma?",v:"Tin lớn nhất là lũ ở miền Trung. Lan, em đi đưa tin nhé?"},{t:"要，带一个摄影记者。下午三点前要照片。",p:"Yào, dài yí ge shèyǐng jìzhě. Xiàwǔ sān diǎn qián yào zhàopiàn.",v:"Có, dẫn theo một phóng viên ảnh. Trước ba giờ chiều cần ảnh."},{t:"阿南写新的利率。数据要跟央行核实。",p:"Ā Nán xiě xīn de lìlǜ. Shùjù yào gēn yāngháng héshí.",v:"Nam viết về lãi suất mới. Số liệu phải kiểm chứng với ngân hàng trung ương."},{t:"网络版下午五点，报纸版晚上八点。",p:"Wǎngluòbǎn xiàwǔ wǔ diǎn, bàozhǐbǎn wǎnshang bā diǎn.",v:"Bản online năm giờ chiều, bản báo in tám giờ tối."}],notes:[{h:"核实",b:"核实 là kiểm chứng, xác minh thông tin, việc quan trọng nhất của nhà báo."},{h:"现场",b:"现场 là hiện trường, nơi sự việc xảy ra."}]},
 {id:"zh-w-design-brief",title:"Nhận yêu cầu thiết kế",scene:"Bạn là nhà thiết kế, nhận yêu cầu làm logo từ khách hàng.",partner:"客户",ind:"design",work:true,lines:[{r:"A",t:"我们的咖啡店需要一个新标志。",p:"Wǒmen de kāfēidiàn xūyào yí ge xīn biāozhì.",v:"Quán cà phê của chúng tôi cần một logo mới."},{r:"B",t:"好的。能介绍一下你们的品牌和客人吗？",p:"Hǎo de. Néng jièshào yíxià nǐmen de pǐnpái hé kèrén ma?",v:"Vâng. Anh giới thiệu chút về thương hiệu và khách của quán được không?"},{r:"A",t:"我们是一家小店，客人大多是大学生。",p:"Wǒmen shì yì jiā xiǎo diàn, kèrén dàduō shì dàxuéshēng.",v:"Chúng tôi là quán nhỏ, khách phần lớn là sinh viên."},{r:"B",t:"你希望大家看到标志时有什么感觉？",p:"Nǐ xīwàng dàjiā kàndào biāozhì shí yǒu shénme gǎnjué?",v:"Anh muốn mọi người có cảm giác gì khi nhìn logo?"},{r:"A",t:"温暖、亲切，还要有点儿现代感。",p:"Wēnnuǎn, qīnqiè, hái yào yǒudiǎnr xiàndàigǎn.",v:"Ấm áp, thân thiện, và có chút hiện đại."},{r:"B",t:"你有喜欢的颜色吗？",p:"Nǐ yǒu xǐhuan de yánsè ma?",v:"Anh có màu yêu thích không?"},{r:"A",t:"也许咖啡色和米色。",p:"Yěxǔ kāfēisè hé mǐsè.",v:"Có lẽ màu nâu và màu kem."},{r:"B",t:"好。下周三我发给你三个方案。",p:"Hǎo. Xià zhōusān wǒ fā gěi nǐ sān ge fāng'àn.",v:"Được. Thứ Tư tuần sau tôi gửi anh ba phương án."}],phrases:[{t:"好的。能介绍一下你们的品牌和客人吗？",p:"Hǎo de. Néng jièshào yíxià nǐmen de pǐnpái hé kèrén ma?",v:"Vâng. Anh giới thiệu chút về thương hiệu và khách của quán được không?"},{t:"你希望大家看到标志时有什么感觉？",p:"Nǐ xīwàng dàjiā kàndào biāozhì shí yǒu shénme gǎnjué?",v:"Anh muốn mọi người có cảm giác gì khi nhìn logo?"},{t:"你有喜欢的颜色吗？",p:"Nǐ yǒu xǐhuan de yánsè ma?",v:"Anh có màu yêu thích không?"},{t:"好。下周三我发给你三个方案。",p:"Hǎo. Xià zhōusān wǒ fā gěi nǐ sān ge fāng'àn.",v:"Được. Thứ Tư tuần sau tôi gửi anh ba phương án."}],notes:[{h:"方案",b:"方案 là phương án. Nhà thiết kế thường gửi 2–3 方案 để khách chọn."},{h:"…感",b:"现代感 là cảm giác hiện đại. 高级感 là cảm giác cao cấp."}]},
 {id:"zh-w-design-feedback",title:"Nhận góp ý và chỉnh sửa",scene:"Khách hàng xem bản nháp và góp ý. Bạn ghi nhận và đề xuất chỉnh sửa.",partner:"客户",ind:"design",work:true,lines:[{r:"A",t:"我喜欢第二个设计，但是字不太清楚。",p:"Wǒ xǐhuan dì-èr ge shèjì, dànshì zì bú tài qīngchu.",v:"Tôi thích mẫu thứ hai, nhưng chữ không rõ lắm."},{r:"B",t:"谢谢您的意见。我可以把字放大、加粗。",p:"Xièxie nín de yìjiàn. Wǒ kěyǐ bǎ zì fàngdà, jiācū.",v:"Cảm ơn góp ý. Tôi có thể phóng to và làm đậm chữ."},{r:"A",t:"还有，咖啡色太深了。",p:"Hái yǒu, kāfēisè tài shēn le.",v:"Ngoài ra, màu nâu đậm quá."},{r:"B",t:"我试试浅一点的颜色，发给您两个选择。",p:"Wǒ shìshi qiǎn yìdiǎn de yánsè, fā gěi nín liǎng ge xuǎnzé.",v:"Tôi thử màu nhạt hơn, gửi anh hai lựa chọn."},{r:"A",t:"可以修改几次？",p:"Kěyǐ xiūgǎi jǐ cì?",v:"Được sửa mấy lần?"},{r:"B",t:"价格里包括三次修改。",p:"Jiàgé li bāokuò sān cì xiūgǎi.",v:"Giá đã bao gồm ba lần sửa."},{r:"A",t:"好。什么时候能看到？",p:"Hǎo. Shénme shíhou néng kàndào?",v:"Được. Khi nào xem được?"},{r:"B",t:"星期五下午以前。您确认以后，我把所有的源文件发给您。",p:"Xīngqīwǔ xiàwǔ yǐqián. Nín quèrèn yǐhòu, wǒ bǎ suǒyǒu de yuán wénjiàn fā gěi nín.",v:"Trước chiều thứ Sáu. Sau khi anh xác nhận, tôi gửi toàn bộ file gốc."}],phrases:[{t:"谢谢您的意见。我可以把字放大、加粗。",p:"Xièxie nín de yìjiàn. Wǒ kěyǐ bǎ zì fàngdà, jiācū.",v:"Cảm ơn góp ý. Tôi có thể phóng to và làm đậm chữ."},{t:"我试试浅一点的颜色，发给您两个选择。",p:"Wǒ shìshi qiǎn yìdiǎn de yánsè, fā gěi nín liǎng ge xuǎnzé.",v:"Tôi thử màu nhạt hơn, gửi anh hai lựa chọn."},{t:"价格里包括三次修改。",p:"Jiàgé li bāokuò sān cì xiūgǎi.",v:"Giá đã bao gồm ba lần sửa."},{t:"星期五下午以前。您确认以后，我把所有的源文件发给您。",p:"Xīngqīwǔ xiàwǔ yǐqián. Nín quèrèn yǐhòu, wǒ bǎ suǒyǒu de yuán wénjiàn fā gěi nín.",v:"Trước chiều thứ Sáu. Sau khi anh xác nhận, tôi gửi toàn bộ file gốc."}],notes:[{h:"深 và 浅",b:"深 là đậm (màu), 浅 là nhạt. 太深了 là đậm quá."},{h:"把字放大",b:"Câu 把: 把 + tân ngữ + động từ + kết quả: phóng to chữ lên."}]},
 {id:"zh-w-design-pitch",title:"Trình bày ý tưởng sáng tạo",scene:"Bạn trình bày ý tưởng chiến dịch quảng cáo cho khách hàng.",partner:"客户",ind:"design",work:true,lines:[{r:"A",t:"你们的创意是什么？",p:"Nǐmen de chuàngyì shì shénme?",v:"Ý tưởng của các bạn là gì?"},{r:"B",t:"我们的创意叫“小时刻”，展示真实的人在日常生活中喝你们的茶。",p:"Wǒmen de chuàngyì jiào \"Xiǎo Shíkè\", zhǎnshì zhēnshí de rén zài rìcháng shēnghuó zhōng hē nǐmen de chá.",v:"Ý tưởng của chúng tôi gọi là \"Khoảnh khắc nhỏ\", cho thấy người thật uống trà của anh trong đời sống hằng ngày."},{r:"A",t:"为什么用真实的人？",p:"Wèishénme yòng zhēnshí de rén?",v:"Tại sao dùng người thật?"},{r:"B",t:"年轻客户更相信真实的故事，而不是完美的广告。",p:"Niánqīng kèhù gèng xiāngxìn zhēnshí de gùshi, ér bú shì wánměi de guǎnggào.",v:"Khách hàng trẻ tin câu chuyện thật hơn là quảng cáo hoàn hảo."},{r:"A",t:"要做哪些东西？",p:"Yào zuò nǎxiē dōngxi?",v:"Phải làm những gì?"},{r:"B",t:"六个短视频、一套海报，还有一个照片比赛。",p:"Liù ge duǎn shìpín, yí tào hǎibào, hái yǒu yí ge zhàopiàn bǐsài.",v:"Sáu video ngắn, một bộ áp phích và một cuộc thi ảnh."},{r:"A",t:"我喜欢。预算多少？",p:"Wǒ xǐhuan. Yùsuàn duōshao?",v:"Tôi thích. Ngân sách bao nhiêu?"},{r:"B",t:"大概四亿越南盾，今天我发详细的预算表给您。",p:"Dàgài sì yì Yuènán dùn, jīntiān wǒ fā xiángxì de yùsuànbiǎo gěi nín.",v:"Khoảng bốn trăm triệu đồng, hôm nay tôi gửi bảng ngân sách chi tiết."}],phrases:[{t:"我们的创意叫“小时刻”，展示真实的人在日常生活中喝你们的茶。",p:"Wǒmen de chuàngyì jiào \"Xiǎo Shíkè\", zhǎnshì zhēnshí de rén zài rìcháng shēnghuó zhōng hē nǐmen de chá.",v:"Ý tưởng của chúng tôi gọi là \"Khoảnh khắc nhỏ\", cho thấy người thật uống trà của anh trong đời sống hằng ngày."},{t:"年轻客户更相信真实的故事，而不是完美的广告。",p:"Niánqīng kèhù gèng xiāngxìn zhēnshí de gùshi, ér bú shì wánměi de guǎnggào.",v:"Khách hàng trẻ tin câu chuyện thật hơn là quảng cáo hoàn hảo."},{t:"六个短视频、一套海报，还有一个照片比赛。",p:"Liù ge duǎn shìpín, yí tào hǎibào, hái yǒu yí ge zhàopiàn bǐsài.",v:"Sáu video ngắn, một bộ áp phích và một cuộc thi ảnh."},{t:"大概四亿越南盾，今天我发详细的预算表给您。",p:"Dàgài sì yì Yuènán dùn, jīntiān wǒ fā xiángxì de yùsuànbiǎo gěi nín.",v:"Khoảng bốn trăm triệu đồng, hôm nay tôi gửi bảng ngân sách chi tiết."}],notes:[{h:"更…而不是…",b:"更相信真实的故事，而不是完美的广告: tin cái này hơn chứ không phải cái kia."},{h:"创意",b:"创意 là ý tưởng sáng tạo. 广告公司 là công ty quảng cáo."}]},

 {id:"zh-w-beauty-book",title:"Đặt lịch hẹn spa",scene:"Bạn là lễ tân spa, nhận cuộc gọi đặt lịch.",partner:"客人",ind:"beauty",work:true,lines:[{r:"A",t:"你好，我想预约按摩。",p:"Nǐ hǎo, wǒ xiǎng yùyuē ànmó.",v:"Chào em, chị muốn đặt lịch mát-xa."},{r:"B",t:"好的。您想做全身按摩还是足疗？",p:"Hǎo de. Nín xiǎng zuò quánshēn ànmó háishi zúliáo?",v:"Vâng. Chị muốn mát-xa toàn thân hay mát-xa chân?"},{r:"A",t:"全身按摩。",p:"Quánshēn ànmó.",v:"Mát-xa toàn thân."},{r:"B",t:"有六十分钟和九十分钟的，您选哪个？",p:"Yǒu liùshí fēnzhōng hé jiǔshí fēnzhōng de, nín xuǎn nǎge?",v:"Có loại sáu mươi phút và chín mươi phút, chị chọn loại nào?"},{r:"A",t:"九十分钟。星期六下午有空吗？",p:"Jiǔshí fēnzhōng. Xīngqīliù xiàwǔ yǒu kòng ma?",v:"Chín mươi phút. Chiều thứ Bảy có trống không?"},{r:"B",t:"下午三点有位置。您要男技师还是女技师？",p:"Xiàwǔ sān diǎn yǒu wèizhi. Nín yào nán jìshī háishi nǚ jìshī?",v:"Ba giờ chiều còn chỗ. Chị muốn kỹ thuật viên nam hay nữ?"},{r:"A",t:"女的，谢谢。",p:"Nǚ de, xièxie.",v:"Nữ, cảm ơn."},{r:"B",t:"好的，帮您约了星期六下午三点，请提前十分钟到。",p:"Hǎo de, bāng nín yuēle xīngqīliù xiàwǔ sān diǎn, qǐng tíqián shí fēnzhōng dào.",v:"Dạ, em đã đặt cho chị ba giờ chiều thứ Bảy, chị đến sớm mười phút nhé."}],phrases:[{t:"好的。您想做全身按摩还是足疗？",p:"Hǎo de. Nín xiǎng zuò quánshēn ànmó háishi zúliáo?",v:"Vâng. Chị muốn mát-xa toàn thân hay mát-xa chân?"},{t:"有六十分钟和九十分钟的，您选哪个？",p:"Yǒu liùshí fēnzhōng hé jiǔshí fēnzhōng de, nín xuǎn nǎge?",v:"Có loại sáu mươi phút và chín mươi phút, chị chọn loại nào?"},{t:"下午三点有位置。您要男技师还是女技师？",p:"Xiàwǔ sān diǎn yǒu wèizhi. Nín yào nán jìshī háishi nǚ jìshī?",v:"Ba giờ chiều còn chỗ. Chị muốn kỹ thuật viên nam hay nữ?"},{t:"好的，帮您约了星期六下午三点，请提前十分钟到。",p:"Hǎo de, bāng nín yuēle xīngqīliù xiàwǔ sān diǎn, qǐng tíqián shí fēnzhōng dào.",v:"Dạ, em đã đặt cho chị ba giờ chiều thứ Bảy, chị đến sớm mười phút nhé."}],notes:[{h:"…还是…？",b:"Câu hỏi lựa chọn: 全身按摩还是足疗？"},{h:"有空",b:"有空 là rảnh, còn trống. 有位置 là còn chỗ."}]},
 {id:"zh-w-beauty-skin",title:"Tư vấn chăm sóc da",scene:"Bạn là chuyên viên da, tư vấn cho khách bị da dầu và mụn.",partner:"客人",ind:"beauty",work:true,lines:[{r:"A",t:"我的皮肤很油，常常长痘痘。",p:"Wǒ de pífū hěn yóu, chángcháng zhǎng dòudou.",v:"Da chị rất dầu, hay nổi mụn."},{r:"B",t:"我看一下。是的，您的毛孔有点儿堵。",p:"Wǒ kàn yíxià. Shì de, nín de máokǒng yǒudiǎnr dǔ.",v:"Để em xem. Vâng, lỗ chân lông chị hơi bị bít."},{r:"A",t:"我该怎么办？",p:"Wǒ gāi zěnme bàn?",v:"Chị nên làm sao?"},{r:"B",t:"我建议您每两个星期做一次深层清洁。",p:"Wǒ jiànyì nín měi liǎng ge xīngqī zuò yí cì shēncéng qīngjié.",v:"Em khuyên chị hai tuần làm sạch sâu một lần."},{r:"A",t:"在家呢？",p:"Zài jiā ne?",v:"Còn ở nhà?"},{r:"B",t:"每天用温和的洗面奶洗两次脸，一定要涂防晒霜。",p:"Měi tiān yòng wēnhé de xǐmiànnǎi xǐ liǎng cì liǎn, yídìng yào tú fángshàishuāng.",v:"Mỗi ngày rửa mặt hai lần với sữa rửa mặt dịu nhẹ, nhất định phải bôi kem chống nắng."},{r:"A",t:"我要不要停用面霜？",p:"Wǒ yào bu yào tíngyòng miànshuāng?",v:"Chị có nên ngừng dùng kem dưỡng không?"},{r:"B",t:"不用。油性皮肤也需要保湿，选清爽无油的就行。",p:"Búyòng. Yóuxìng pífū yě xūyào bǎoshī, xuǎn qīngshuǎng wú yóu de jiù xíng.",v:"Không cần. Da dầu cũng cần dưỡng ẩm, chọn loại mỏng nhẹ không dầu là được."}],phrases:[{t:"我看一下。是的，您的毛孔有点儿堵。",p:"Wǒ kàn yíxià. Shì de, nín de máokǒng yǒudiǎnr dǔ.",v:"Để em xem. Vâng, lỗ chân lông chị hơi bị bít."},{t:"我建议您每两个星期做一次深层清洁。",p:"Wǒ jiànyì nín měi liǎng ge xīngqī zuò yí cì shēncéng qīngjié.",v:"Em khuyên chị hai tuần làm sạch sâu một lần."},{t:"每天用温和的洗面奶洗两次脸，一定要涂防晒霜。",p:"Měi tiān yòng wēnhé de xǐmiànnǎi xǐ liǎng cì liǎn, yídìng yào tú fángshàishuāng.",v:"Mỗi ngày rửa mặt hai lần với sữa rửa mặt dịu nhẹ, nhất định phải bôi kem chống nắng."},{t:"不用。油性皮肤也需要保湿，选清爽无油的就行。",p:"Búyòng. Yóuxìng pífū yě xūyào bǎoshī, xuǎn qīngshuǎng wú yóu de jiù xíng.",v:"Không cần. Da dầu cũng cần dưỡng ẩm, chọn loại mỏng nhẹ không dầu là được."}],notes:[{h:"我建议…",b:"我建议您… là em khuyên chị…, lời khuyên chuyên môn lịch sự."},{h:"长痘痘",b:"长 đọc là zhǎng (mọc). 长痘痘 là nổi mụn."}]},
 {id:"zh-w-beauty-hair",title:"Tư vấn kiểu tóc",scene:"Bạn là thợ làm tóc, tư vấn kiểu tóc cho khách.",partner:"客人",ind:"beauty",work:true,lines:[{r:"A",t:"我想换个发型，但是不知道换什么。",p:"Wǒ xiǎng huàn ge fàxíng, dànshì bù zhīdào huàn shénme.",v:"Tôi muốn đổi kiểu tóc nhưng chưa biết đổi kiểu gì."},{r:"B",t:"您每天早上花多长时间弄头发？",p:"Nín měi tiān zǎoshang huā duō cháng shíjiān nòng tóufa?",v:"Mỗi sáng chị mất bao lâu làm tóc?"},{r:"A",t:"不多，五分钟吧。",p:"Bù duō, wǔ fēnzhōng ba.",v:"Không nhiều, chắc năm phút."},{r:"B",t:"那剪个齐肩的层次发很适合您，好打理。",p:"Nà jiǎn ge qí jiān de céngcì fà hěn shìhé nín, hǎo dǎlǐ.",v:"Vậy cắt tóc tỉa tầng ngang vai rất hợp với chị, dễ chăm sóc."},{r:"A",t:"颜色呢？",p:"Yánsè ne?",v:"Còn màu?"},{r:"B",t:"浅棕色很配您的肤色。",p:"Qiǎn zōngsè hěn pèi nín de fūsè.",v:"Màu nâu nhạt rất hợp tông da của chị."},{r:"A",t:"染发会伤头发吗？",p:"Rǎnfà huì shāng tóufa ma?",v:"Nhuộm có làm hư tóc không?"},{r:"B",t:"我们用温和的染发剂，还会加一个护理保护头发。",p:"Wǒmen yòng wēnhé de rǎnfàjì, hái huì jiā yí ge hùlǐ bǎohù tóufa.",v:"Bên em dùng thuốc nhuộm dịu nhẹ, còn thêm hấp dưỡng để bảo vệ tóc."}],phrases:[{t:"您每天早上花多长时间弄头发？",p:"Nín měi tiān zǎoshang huā duō cháng shíjiān nòng tóufa?",v:"Mỗi sáng chị mất bao lâu làm tóc?"},{t:"那剪个齐肩的层次发很适合您，好打理。",p:"Nà jiǎn ge qí jiān de céngcì fà hěn shìhé nín, hǎo dǎlǐ.",v:"Vậy cắt tóc tỉa tầng ngang vai rất hợp với chị, dễ chăm sóc."},{t:"浅棕色很配您的肤色。",p:"Qiǎn zōngsè hěn pèi nín de fūsè.",v:"Màu nâu nhạt rất hợp tông da của chị."},{t:"我们用温和的染发剂，还会加一个护理保护头发。",p:"Wǒmen yòng wēnhé de rǎnfàjì, hái huì jiā yí ge hùlǐ bǎohù tóufa.",v:"Bên em dùng thuốc nhuộm dịu nhẹ, còn thêm hấp dưỡng để bảo vệ tóc."}],notes:[{h:"好打理",b:"好 + động từ: dễ làm. 好打理 là dễ chăm sóc."},{h:"适合 và 配",b:"适合您 là hợp với chị; 配您的肤色 là hợp với tông da."}]},
 {id:"zh-w-agri-buy",title:"Thu mua nông sản",scene:"Bạn là nhân viên thu mua, đàm phán mua sầu riêng với chủ vườn.",partner:"果园主",ind:"agri",work:true,lines:[{r:"A",t:"今年的榴莲大丰收。",p:"Jīnnián de liúlián dà fēngshōu.",v:"Sầu riêng năm nay được mùa lớn."},{r:"B",t:"太好了。您能卖给我们多少吨？",p:"Tài hǎo le. Nín néng mài gěi wǒmen duōshao dūn?",v:"Tốt quá. Anh bán cho chúng tôi được bao nhiêu tấn?"},{r:"A",t:"二十吨左右。",p:"Èrshí dūn zuǒyòu.",v:"Khoảng hai mươi tấn."},{r:"B",t:"我们需要达到出口标准的榴莲，不能有化学药品。",p:"Wǒmen xūyào dádào chūkǒu biāozhǔn de liúlián, bù néng yǒu huàxué yàopǐn.",v:"Chúng tôi cần sầu riêng đạt chuẩn xuất khẩu, không được có hóa chất."},{r:"A",t:"我的都是用有机肥种的。",p:"Wǒ de dōu shì yòng yǒujīféi zhòng de.",v:"Của tôi đều trồng bằng phân hữu cơ."},{r:"B",t:"您的果园有种植区域码吗？",p:"Nín de guǒyuán yǒu zhòngzhí qūyù mǎ ma?",v:"Vườn của anh có mã số vùng trồng không?"},{r:"A",t:"有，去年拿到的。",p:"Yǒu, qùnián nádào de.",v:"Có, năm ngoái được cấp."},{r:"B",t:"太好了。我们每公斤付七万越南盾，下星期来收。",p:"Tài hǎo le. Wǒmen měi gōngjīn fù qīwàn Yuènán dùn, xià xīngqī lái shōu.",v:"Tuyệt. Chúng tôi trả bảy mươi nghìn đồng mỗi ký, tuần sau đến thu."}],phrases:[{t:"太好了。您能卖给我们多少吨？",p:"Tài hǎo le. Nín néng mài gěi wǒmen duōshao dūn?",v:"Tốt quá. Anh bán cho chúng tôi được bao nhiêu tấn?"},{t:"我们需要达到出口标准的榴莲，不能有化学药品。",p:"Wǒmen xūyào dádào chūkǒu biāozhǔn de liúlián, bù néng yǒu huàxué yàopǐn.",v:"Chúng tôi cần sầu riêng đạt chuẩn xuất khẩu, không được có hóa chất."},{t:"您的果园有种植区域码吗？",p:"Nín de guǒyuán yǒu zhòngzhí qūyù mǎ ma?",v:"Vườn của anh có mã số vùng trồng không?"},{t:"太好了。我们每公斤付七万越南盾，下星期来收。",p:"Tài hǎo le. Wǒmen měi gōngjīn fù qīwàn Yuènán dùn, xià xīngqī lái shōu.",v:"Tuyệt. Chúng tôi trả bảy mươi nghìn đồng mỗi ký, tuần sau đến thu."}],notes:[{h:"左右",b:"二十吨左右 là khoảng hai mươi tấn. 左右 đứng sau số."},{h:"种 có hai cách đọc",b:"种 zhòng là trồng (động từ), 种 zhǒng là loại (lượng từ)."}]},
 {id:"zh-w-agri-tech",title:"Tư vấn kỹ thuật canh tác",scene:"Bạn là kỹ sư nông nghiệp, tư vấn cho nông dân về cây lúa bị bệnh.",partner:"农民",ind:"agri",work:true,lines:[{r:"A",t:"我的水稻叶子变黄了。",p:"Wǒ de shuǐdào yèzi biàn huáng le.",v:"Lá lúa của tôi bị vàng rồi."},{r:"B",t:"我看看。可能是病害，也可能是缺氮。",p:"Wǒ kànkan. Kěnéng shì bìnghài, yě kěnéng shì quē dàn.",v:"Để tôi xem. Có thể là bệnh, cũng có thể là thiếu đạm."},{r:"A",t:"怎么区分？",p:"Zěnme qūfēn?",v:"Làm sao phân biệt?"},{r:"B",t:"如果有褐色斑点就是病害。这里没有，所以是缺氮。",p:"Rúguǒ yǒu hèsè bāndiǎn jiù shì bìnghài. Zhèlǐ méiyǒu, suǒyǐ shì quē dàn.",v:"Nếu có đốm nâu thì là bệnh. Ở đây không có, nên là thiếu đạm."},{r:"A",t:"该用什么？",p:"Gāi yòng shénme?",v:"Nên dùng gì?"},{r:"B",t:"施尿素，每一千平方米大约五公斤。",p:"Shī niàosù, měi yìqiān píngfāngmǐ dàyuē wǔ gōngjīn.",v:"Bón urê, mỗi nghìn mét vuông khoảng năm ký."},{r:"A",t:"什么时候施？",p:"Shénme shíhou shī?",v:"Khi nào bón?"},{r:"B",t:"早上，田里有少量水的时候。",p:"Zǎoshang, tián li yǒu shǎoliàng shuǐ de shíhou.",v:"Buổi sáng, lúc ruộng có ít nước."}],phrases:[{t:"我看看。可能是病害，也可能是缺氮。",p:"Wǒ kànkan. Kěnéng shì bìnghài, yě kěnéng shì quē dàn.",v:"Để tôi xem. Có thể là bệnh, cũng có thể là thiếu đạm."},{t:"如果有褐色斑点就是病害。这里没有，所以是缺氮。",p:"Rúguǒ yǒu hèsè bāndiǎn jiù shì bìnghài. Zhèlǐ méiyǒu, suǒyǐ shì quē dàn.",v:"Nếu có đốm nâu thì là bệnh. Ở đây không có, nên là thiếu đạm."},{t:"施尿素，每一千平方米大约五公斤。",p:"Shī niàosù, měi yìqiān píngfāngmǐ dàyuē wǔ gōngjīn.",v:"Bón urê, mỗi nghìn mét vuông khoảng năm ký."},{t:"早上，田里有少量水的时候。",p:"Zǎoshang, tián li yǒu shǎoliàng shuǐ de shíhou.",v:"Buổi sáng, lúc ruộng có ít nước."}],notes:[{h:"如果…就…",b:"如果有斑点就是病害: nếu có đốm thì là bệnh."},{h:"施肥",b:"施 là bón (phân). 施肥 là bón phân."}]},
 {id:"zh-w-agri-farm",title:"Giới thiệu trang trại",scene:"Bạn giới thiệu trang trại rau sạch cho đoàn khách nước ngoài.",partner:"参观者",ind:"agri",work:true,lines:[{r:"A",t:"这个农场有多大？",p:"Zhège nóngchǎng yǒu duō dà?",v:"Nông trại này rộng bao nhiêu?"},{r:"B",t:"大约五公顷，我们种蔬菜和香草。",p:"Dàyuē wǔ gōngqǐng, wǒmen zhòng shūcài hé xiāngcǎo.",v:"Khoảng năm héc-ta, chúng tôi trồng rau và rau thơm."},{r:"A",t:"你们用农药吗？",p:"Nǐmen yòng nóngyào ma?",v:"Các bạn có dùng thuốc trừ sâu không?"},{r:"B",t:"不用。我们用自然的方法，比如防虫网和益虫。",p:"Búyòng. Wǒmen yòng zìrán de fāngfǎ, bǐrú fángchóngwǎng hé yìchóng.",v:"Không. Chúng tôi dùng phương pháp tự nhiên, ví dụ lưới chắn côn trùng và côn trùng có ích."},{r:"A",t:"怎么浇水？",p:"Zěnme jiāo shuǐ?",v:"Tưới nước thế nào?"},{r:"B",t:"用滴灌系统，可以节约百分之四十的水。",p:"Yòng dīguàn xìtǒng, kěyǐ jiéyuē bǎi fēn zhī sìshí de shuǐ.",v:"Dùng hệ thống tưới nhỏ giọt, tiết kiệm được bốn mươi phần trăm nước."},{r:"A",t:"蔬菜卖到哪里？",p:"Shūcài mài dào nǎlǐ?",v:"Rau bán đi đâu?"},{r:"B",t:"卖给胡志明市的超市，也在网上直接卖给家庭。",p:"Mài gěi Hú Zhìmíng Shì de chāoshì, yě zài wǎngshang zhíjiē mài gěi jiātíng.",v:"Bán cho siêu thị ở TP. Hồ Chí Minh, cũng bán online trực tiếp cho các gia đình."}],phrases:[{t:"大约五公顷，我们种蔬菜和香草。",p:"Dàyuē wǔ gōngqǐng, wǒmen zhòng shūcài hé xiāngcǎo.",v:"Khoảng năm héc-ta, chúng tôi trồng rau và rau thơm."},{t:"不用。我们用自然的方法，比如防虫网和益虫。",p:"Búyòng. Wǒmen yòng zìrán de fāngfǎ, bǐrú fángchóngwǎng hé yìchóng.",v:"Không. Chúng tôi dùng phương pháp tự nhiên, ví dụ lưới chắn côn trùng và côn trùng có ích."},{t:"用滴灌系统，可以节约百分之四十的水。",p:"Yòng dīguàn xìtǒng, kěyǐ jiéyuē bǎi fēn zhī sìshí de shuǐ.",v:"Dùng hệ thống tưới nhỏ giọt, tiết kiệm được bốn mươi phần trăm nước."},{t:"卖给胡志明市的超市，也在网上直接卖给家庭。",p:"Mài gěi Hú Zhìmíng Shì de chāoshì, yě zài wǎngshang zhíjiē mài gěi jiātíng.",v:"Bán cho siêu thị ở TP. Hồ Chí Minh, cũng bán online trực tiếp cho các gia đình."}],notes:[{h:"比如",b:"比如 là ví dụ như, dùng để liệt kê ví dụ."},{h:"公顷",b:"一公顷 = một héc-ta = mười nghìn mét vuông."}]},
 {id:"zh-w-energy-solar",title:"Tư vấn lắp điện mặt trời",scene:"Bạn tư vấn lắp điện mặt trời áp mái cho một nhà máy.",partner:"厂长",ind:"energy",work:true,lines:[{r:"A",t:"我们的电费很高。",p:"Wǒmen de diànfèi hěn gāo.",v:"Tiền điện của chúng tôi rất cao."},{r:"B",t:"屋顶太阳能系统可以帮您省大约百分之三十的电费。",p:"Wūdǐng tàiyángnéng xìtǒng kěyǐ bāng nín shěng dàyuē bǎi fēn zhī sānshí de diànfèi.",v:"Hệ thống năng lượng mặt trời áp mái có thể giúp anh tiết kiệm khoảng ba mươi phần trăm tiền điện."},{r:"A",t:"系统要多大？",p:"Xìtǒng yào duō dà?",v:"Hệ thống cần lớn cỡ nào?"},{r:"B",t:"您的屋顶大约五千平方米，可以装八百千瓦左右。",p:"Nín de wūdǐng dàyuē wǔqiān píngfāngmǐ, kěyǐ zhuāng bābǎi qiānwǎ zuǒyòu.",v:"Mái nhà của anh khoảng năm nghìn mét vuông, lắp được khoảng tám trăm ki-lô-oát."},{r:"A",t:"要花多少钱？",p:"Yào huā duōshao qián?",v:"Tốn bao nhiêu tiền?"},{r:"B",t:"大约一百亿越南盾，五到六年就能回本。",p:"Dàyuē yìbǎi yì Yuènán dùn, wǔ dào liù nián jiù néng huíběn.",v:"Khoảng mười tỷ đồng, năm đến sáu năm là hoàn vốn."},{r:"A",t:"太阳能板能用多久？",p:"Tàiyángnéngbǎn néng yòng duō jiǔ?",v:"Tấm pin dùng được bao lâu?"},{r:"B",t:"至少二十五年，质保十二年。",p:"Zhìshǎo èrshíwǔ nián, zhìbǎo shí'èr nián.",v:"Ít nhất hai mươi lăm năm, bảo hành mười hai năm."}],phrases:[{t:"屋顶太阳能系统可以帮您省大约百分之三十的电费。",p:"Wūdǐng tàiyángnéng xìtǒng kěyǐ bāng nín shěng dàyuē bǎi fēn zhī sānshí de diànfèi.",v:"Hệ thống năng lượng mặt trời áp mái có thể giúp anh tiết kiệm khoảng ba mươi phần trăm tiền điện."},{t:"您的屋顶大约五千平方米，可以装八百千瓦左右。",p:"Nín de wūdǐng dàyuē wǔqiān píngfāngmǐ, kěyǐ zhuāng bābǎi qiānwǎ zuǒyòu.",v:"Mái nhà của anh khoảng năm nghìn mét vuông, lắp được khoảng tám trăm ki-lô-oát."},{t:"大约一百亿越南盾，五到六年就能回本。",p:"Dàyuē yìbǎi yì Yuènán dùn, wǔ dào liù nián jiù néng huíběn.",v:"Khoảng mười tỷ đồng, năm đến sáu năm là hoàn vốn."},{t:"至少二十五年，质保十二年。",p:"Zhìshǎo èrshíwǔ nián, zhìbǎo shí'èr nián.",v:"Ít nhất hai mươi lăm năm, bảo hành mười hai năm."}],notes:[{h:"回本",b:"回本 là hoàn vốn. 回本期 là thời gian hoàn vốn."},{h:"一百亿",b:"一百亿 = 100 × 100.000.000 = 10 tỷ."}]},
 {id:"zh-w-energy-plant",title:"Vận hành nhà máy điện",scene:"Bạn là kỹ sư vận hành, báo cáo tình hình ca trực tại nhà máy điện gió.",partner:"值班长",ind:"energy",work:true,lines:[{r:"A",t:"夜班怎么样？",p:"Yèbān zěnmeyàng?",v:"Ca đêm thế nào?"},{r:"B",t:"基本正常。风很大，所以发电量很高。",p:"Jīběn zhèngcháng. Fēng hěn dà, suǒyǐ fādiànliàng hěn gāo.",v:"Về cơ bản bình thường. Gió to nên sản lượng điện cao."},{r:"A",t:"有什么问题吗？",p:"Yǒu shénme wèntí ma?",v:"Có vấn đề gì không?"},{r:"B",t:"六号风机凌晨两点因为传感器故障停了。",p:"Liù hào fēngjī língchén liǎng diǎn yīnwèi chuángǎnqì gùzhàng tíng le.",v:"Tua-bin số sáu dừng lúc hai giờ sáng vì cảm biến bị lỗi."},{r:"A",t:"现在运行了吗？",p:"Xiànzài yùnxíng le ma?",v:"Giờ chạy lại chưa?"},{r:"B",t:"还没有。维修组今天上午换传感器。",p:"Hái méiyǒu. Wéixiūzǔ jīntiān shàngwǔ huàn chuángǎnqì.",v:"Chưa ạ. Tổ sửa chữa sáng nay thay cảm biến."},{r:"A",t:"总发电量是多少？",p:"Zǒng fādiànliàng shì duōshao?",v:"Tổng sản lượng điện là bao nhiêu?"},{r:"B",t:"大约三百兆瓦时。我都写在值班记录里了。",p:"Dàyuē sānbǎi zhàowǎshí. Wǒ dōu xiě zài zhíbān jìlù li le.",v:"Khoảng ba trăm megawatt giờ. Em đã ghi hết vào sổ trực ca."}],phrases:[{t:"基本正常。风很大，所以发电量很高。",p:"Jīběn zhèngcháng. Fēng hěn dà, suǒyǐ fādiànliàng hěn gāo.",v:"Về cơ bản bình thường. Gió to nên sản lượng điện cao."},{t:"六号风机凌晨两点因为传感器故障停了。",p:"Liù hào fēngjī língchén liǎng diǎn yīnwèi chuángǎnqì gùzhàng tíng le.",v:"Tua-bin số sáu dừng lúc hai giờ sáng vì cảm biến bị lỗi."},{t:"还没有。维修组今天上午换传感器。",p:"Hái méiyǒu. Wéixiūzǔ jīntiān shàngwǔ huàn chuángǎnqì.",v:"Chưa ạ. Tổ sửa chữa sáng nay thay cảm biến."},{t:"大约三百兆瓦时。我都写在值班记录里了。",p:"Dàyuē sānbǎi zhàowǎshí. Wǒ dōu xiě zài zhíbān jìlù li le.",v:"Khoảng ba trăm megawatt giờ. Em đã ghi hết vào sổ trực ca."}],notes:[{h:"凌晨",b:"凌晨 là rạng sáng, khoảng 0 đến 5 giờ sáng."},{h:"Báo cáo ca trực",b:"Tình hình chung → sự cố → khắc phục → số liệu → đã ghi sổ."}]},
 {id:"zh-w-energy-save",title:"Tư vấn tiết kiệm năng lượng",scene:"Bạn là chuyên gia kiểm toán năng lượng, trình bày kết quả cho một khách sạn.",partner:"酒店经理",ind:"energy",work:true,lines:[{r:"A",t:"审计发现了什么？",p:"Shěnjì fāxiànle shénme?",v:"Kiểm toán phát hiện ra gì?"},{r:"B",t:"空调用了酒店百分之六十的能源。",p:"Kōngtiáo yòngle jiǔdiàn bǎi fēn zhī liùshí de néngyuán.",v:"Điều hòa dùng sáu mươi phần trăm năng lượng của khách sạn."},{r:"A",t:"真多。我们能做什么？",p:"Zhēn duō. Wǒmen néng zuò shénme?",v:"Nhiều thật. Chúng tôi làm được gì?"},{r:"B",t:"首先，空房间的温度设定在二十六度。",p:"Shǒuxiān, kōng fángjiān de wēndù shèdìng zài èrshíliù dù.",v:"Trước tiên, đặt nhiệt độ phòng trống ở hai mươi sáu độ."},{r:"A",t:"还有呢？",p:"Hái yǒu ne?",v:"Còn gì nữa?"},{r:"B",t:"把旧灯换成LED灯，每个房间装插卡取电开关。",p:"Bǎ jiù dēng huànchéng LED dēng, měi ge fángjiān zhuāng chākǎ qǔdiàn kāiguān.",v:"Thay đèn cũ bằng đèn LED, mỗi phòng lắp công tắc cắm thẻ lấy điện."},{r:"A",t:"能省多少？",p:"Néng shěng duōshao?",v:"Tiết kiệm được bao nhiêu?"},{r:"B",t:"每年大约百分之二十，客人也感觉不到区别。",p:"Měi nián dàyuē bǎi fēn zhī èrshí, kèrén yě gǎnjué bu dào qūbié.",v:"Mỗi năm khoảng hai mươi phần trăm, khách cũng không cảm thấy khác biệt."}],phrases:[{t:"空调用了酒店百分之六十的能源。",p:"Kōngtiáo yòngle jiǔdiàn bǎi fēn zhī liùshí de néngyuán.",v:"Điều hòa dùng sáu mươi phần trăm năng lượng của khách sạn."},{t:"首先，空房间的温度设定在二十六度。",p:"Shǒuxiān, kōng fángjiān de wēndù shèdìng zài èrshíliù dù.",v:"Trước tiên, đặt nhiệt độ phòng trống ở hai mươi sáu độ."},{t:"把旧灯换成LED灯，每个房间装插卡取电开关。",p:"Bǎ jiù dēng huànchéng LED dēng, měi ge fángjiān zhuāng chākǎ qǔdiàn kāiguān.",v:"Thay đèn cũ bằng đèn LED, mỗi phòng lắp công tắc cắm thẻ lấy điện."},{t:"每年大约百分之二十，客人也感觉不到区别。",p:"Měi nián dàyuē bǎi fēn zhī èrshí, kèrén yě gǎnjué bu dào qūbié.",v:"Mỗi năm khoảng hai mươi phần trăm, khách cũng không cảm thấy khác biệt."}],notes:[{h:"换成",b:"把旧灯换成LED灯 là thay đèn cũ thành đèn LED."},{h:"感觉不到",b:"Bổ ngữ khả năng: 感觉不到 là không cảm thấy được."}]}

  /* phát chuông n lần, vặn nhỏ nhạc nền trong lúc chuông kêu */

const Player = {
  el:null, cur:null, playing:false, loading:false, err:false, seeking:false,
  ensureEl(){
    if(this.el) return true;
    if(!Sound.ensure()) return false;
    const a = this.el = new Audio(); a.crossOrigin = "anonymous"; a.preload = "metadata";
    try{ Sound.ctx.createMediaElementSource(a).connect(Sound.bus); }catch(e){}
    a.addEventListener("playing", () => { this.playing = true; this.loading = false; this.err = false; render(); Viz.start(); });
    a.addEventListener("pause", () => { this.playing = false; render(); });
    a.addEventListener("waiting", () => { this.loading = true; this.paint(); });
    a.addEventListener("timeupdate", () => this.paint());
    a.addEventListener("loadedmetadata", () => this.paint());
    a.addEventListener("ended", () => { if(store.music.repeat === "one"){ a.currentTime = 0; a.play().catch(() => {}); } else this.next(true); });
    a.addEventListener("error", () => { if(this.cur !== null){ this.err = true; this.loading = false; this.playing = false; render(); } });
    return true;
  },
  play(i){
    if(!this.ensureEl()) return;
    if(i === undefined) i = this.cur === null ? store.music.track : this.cur;
    i = (i + TRACKS.length) % TRACKS.length;
    if(this.cur !== i){ this.el.src = TRACKS[i].url; this.cur = i; store.music.track = i; saveStore(); }
    this.err = false; this.loading = true;
    this.el.playbackRate = store.music.rate;
    this.el.play().catch(() => { this.err = true; this.loading = false; render(); });
  },
  pause(){ if(this.el) this.el.pause(); },
  toggle(){ if(this.playing) this.pause(); else this.play(); },
  restart(){ if(this.cur === null){ this.play(); return; } this.el.currentTime = 0; if(!this.playing) this.play(); },
  /* Thứ tự phát: tuần tự, hoặc trộn bài (mỗi bài phát một lần rồi mới trộn lại) */
  order:null, hist:[],
  shuffled(start){ const o = TRACKS.map((_, i) => i).filter(i => i !== start); for(let i = o.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return [start, ...o]; },
  next(auto){
    const m = store.music, c = this.cur === null ? m.track : this.cur;
    let n;
    if(m.shuffle){
      if(!this.order || !this.order.includes(c)) this.order = this.shuffled(c);
      let k = this.order.indexOf(c) + 1;
      if(k >= this.order.length){
        if(auto && m.repeat === "off"){ this.stopEnd(); return; }

      }

  prev(){

  /* Hết danh sách ở chế độ "không lặp": dừng, quay về bài đầu */

  cycleRepeat(){ const m = store.music, seq = ["all", "one", "off"]; m.repeat = seq[(seq.indexOf(m.repeat) + 1) % seq.length]; saveStore(); },
  seek(t){ if(this.el && isFinite(this.el.duration)) this.el.currentTime = Math.max(0, Math.min(this.el.duration - 0.2, t)); },
  setRate(r){ store.music.rate = r; saveStore(); if(this.el) this.el.playbackRate = r; },
  stop(){ if(this.el){ this.el.pause(); this.el.removeAttribute("src"); this.el.load(); } this.cur = null; this.playing = false; this.loading = false; },
  /* cập nhật thời gian và thanh tua mà không dựng lại cả trang */

  }
};
function fmtTime(x){ x = Math.max(0, Math.floor(x)); return Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0"); }
/* Dải âm cạnh logo: vẽ theo sóng âm thật của nhạc đang phát */
const Viz = {
  raf:0, data:null,
  start(){ if(!this.raf) this.raf = requestAnimationFrame(() => this.draw()); },
  draw(){
    this.raf = 0;
    const c = document.getElementById("viz"), an = Sound.analyser;
    if(c && an){
      const g = c.getContext("2d"), w = c.width, h = c.height, n = 14, bw = w / n;
      if(!this.data) this.data = new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(this.data);
      g.clearRect(0, 0, w, h);
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#23944f";
      for(let i = 0; i < n; i++){
        const k = Math.min(this.data.length - 1, 1 + Math.floor(Math.pow(i / n, 1.6) * this.data.length * 0.6));
        const bh = Math.max(4, (this.data[k] / 255) * h);
        const x = i * bw + 2, y = (h - bh) / 2, r = Math.min(4, (bw - 4) / 2);
        g.beginPath(); if(g.roundRect) g.roundRect(x, y, bw - 4, bh, r); else g.rect(x, y, bw - 4, bh); g.fill();
      }
    }
    if(Sound.cur || Player.playing) this.raf = requestAnimationFrame(() => this.draw());
  }
};

/* ===================== ĐỌC TO (TTS) ===================== */
const TTS = {
  voices: [], current: null,
  load(){ try{ this.voices = speechSynthesis.getVoices() || []; }catch(e){ this.voices = []; } },
  list(lang){
    const base = LANG_INFO[lang].tts.toLowerCase().slice(0,2);
    return this.voices.filter(v => (v.lang||"").replace("_","-").toLowerCase().startsWith(base));
  },
  pick(lang){
    const pref = LANG_INFO[lang].tts.toLowerCase();
    const list = this.list(lang);
    if(!list.length) return null;
    const chosen = (store.prefs.voice || {})[lang];
    if(chosen){ const c = list.find(v => v.voiceURI === chosen); if(c) return c; }
    const exact = list.filter(v => v.lang.replace("_","-").toLowerCase() === pref);
    const pool = exact.length ? exact : list;
    return pool.find(v => /natural|google|neural|premium|enhanced/i.test(v.name)) || pool[0];
  },
  has(lang){ return !!this.pick(lang); },
  speak(text, lang, onend){
    if(!("speechSynthesis" in window)){ onend && onend(); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG_INFO[lang].tts;
      const v = this.pick(lang); if(v) u.voice = v;
      u.rate = store.prefs.slow ? 0.7 : 0.95;
      let done = false;
      const fin = () => { if(done) return; done = true; this.current = null; onend && onend(); };
      u.onend = fin; u.onerror = fin;
      this.current = u;
      speechSynthesis.speak(u);
    }catch(e){ onend && onend(); }
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};

    if(!parts.length) return;

        const si = Math.floor((sg.s + j / sr) * r0); if(si >= src.length) break;

};
/* Tách bính âm thành từng âm tiết, khớp số chữ Hán */
const PY_INIT = ["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w",""];
const PY_FIN = ["iang","iong","uang","ueng","ang","eng","ing","ong","ian","iao","uai","uan","üan","van","ai","ei","ao","ou","an","en","in","un","ün","ia","ie","iu","ua","uo","ui","üe","ue","ve","er","a","o","e","i","u","ü","v","n","ng","m"];
function pyBase(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, m => m === "̈" ? "̈" : "").normalize("NFC").toLowerCase(); }
function pyIsSyl(raw){
  const b = pyBase(raw).replace(/r$/, x => raw.length > 2 ? "" : x);
  for(const i of PY_INIT){ if(b.startsWith(i) && PY_FIN.includes(b.slice(i.length)) && (i || b.length < 5)) return true; }
  return false;
}
function pySplitWord(w, n){
  /* tìm cách tách w thành đúng n âm tiết hợp lệ */
  const memo = {};
  const go = (pos, left) => {
    const key = pos + ":" + left; if(key in memo) return memo[key];
    if(pos === w.length) return memo[key] = left === 0 ? [] : null;
    if(left === 0) return memo[key] = null;
    for(let L = Math.min(7, w.length - pos); L >= 1; L--){
      const part = w.slice(pos, pos + L);
      if(pyIsSyl(part)){ const rest = go(pos + L, left - 1); if(rest){ return memo[key] = [part].concat(rest); } }
    }
    return memo[key] = null;
  };
  return go(0, n);
}
const PY_CACHE = {};
function pyAlign(t, p){
  const ck = t + "|" + p; if(ck in PY_CACHE) return PY_CACHE[ck];
  const chars = [...t];
  const latin = (t.match(/[A-Za-z0-9]+/g) || []).map(x => x.toLowerCase());
  const words = (p || "").replace(/[，。！？、,.!?;:；：“”"()（）…\-—]/g, " ").split(/[\s']+/).filter(x => x && !latin.includes(x.toLowerCase()));
  const sylls = [];
  for(const w of words){
    let got = null;
    for(let n = 1; n <= 6 && !got; n++) got = pySplitWord(w, n);
    if(!got) return PY_CACHE[ck] = null;
    sylls.push(...got);
  }
  /* 儿 hóa: “diǎnr” đi với hai chữ 点儿 */
  const out = []; let k = 0;
  for(let i = 0; i < chars.length; i++){
    const ch = chars[i];
    if(!isHan(ch)){ out.push([ch, null]); continue; }
    if(ch === "儿" && k > 0 && /r$/.test(sylls[k-1]) && sylls[k-1].length > 2 && !(k < sylls.length && pyBase(sylls[k]) === "er")){ out.push([ch, ""]); continue; }
    if(k >= sylls.length) return PY_CACHE[ck] = null;
    out.push([ch, sylls[k++]]);
  }
  if(k !== sylls.length) return PY_CACHE[ck] = null;
  return PY_CACHE[ck] = out;
}
function ipaOf(word){
  const w = word.toLowerCase().replace(/[’]/g, "'").replace(/^[^a-z']+|[^a-z']+$/g, "");
  if(!w) return null;
  const one = x => IPA_DICT[x] || (x.endsWith("'s") && IPA_DICT[x.slice(0,-2)] ? IPA_DICT[x.slice(0,-2)] + " z" : null);
  let r = one(w);
  if(!r && w.includes("-")){ const parts = w.split("-").filter(Boolean).map(one); if(parts.length && parts.every(Boolean)) r = parts.join(" "); }
  return r ? r.split(" ") : null;
}
function phonOn(lang){ return lang === "zh" ? store.prefs.showPy : store.prefs.showIpa; }
/* Vẽ chữ kèm phiên âm bấm được. key: khóa của câu/từ (giống data-key của nút nghe) */
function phonText(t, p, lang, key){

  }).join("")}</span>`;

/* Bấm một âm: thêm/bỏ khỏi lựa chọn (tối đa 3) rồi phát các âm đang chọn theo thứ tự trong từ */
