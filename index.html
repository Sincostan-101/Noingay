<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<title>Study for yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: logo trái, ngôn ngữ + chế độ đêm phải; tiêu đề giữa; bài học lưới 2 cột bám lề trái */
  --bg:#faf1d9;
  --surface:#e5f2df;
  --ink:#123524;
  --muted:#4d6d5b;
  --line:#d2e4cc;
  --accent:#23944f;
  --accent-soft:#c8e8c6;
  --btn:#a5e6bc;
  --btn-ink:#0c3d21;
  --sun:#f4b400;
  --good:#15803d;
  --good-soft:#dcf3e4;
  --warn:#a86500;
  --warn-soft:#fff1d2;
  --bad:#c93a32;
  --bad-soft:#fde6e4;
  --font-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-zh:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --radius:14px;
  color-scheme: only light;
}
:root[data-theme="dark"]{
  --bg:#0b1410; --surface:#15281d; --ink:#e4f1e8; --muted:#97b0a1; --line:#25402f;
  --accent:#6ee39a; --accent-soft:#1d4a30; --btn:#2f7a4c; --btn-ink:#eafff1; --sun:#fbbf24;
  --good:#4ade80; --good-soft:#153524; --warn:#f0b24a; --warn-soft:#3a2d12;
  --bad:#ff7a70; --bad-soft:#3d1b1a; color-scheme: only dark;
}
.topright{display:flex;align-items:center;gap:10px}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.themebtn svg{width:16px;height:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.zh{font-family:var(--font-zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{--gut:clamp(16px,3vw,40px);--edge:24px;padding:20px var(--edge) 64px;display:flex;flex-direction:column;gap:22px}
.page{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.page.wide{max-width:1200px;align-self:center}
.list.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.list.grid2{grid-template-columns:1fr}}
.voicepick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.voicepick select{border:0;background:transparent;color:var(--ink);font:inherit;max-width:190px;padding:3px 2px}

/* Header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.top .brand{justify-self:start;white-space:nowrap}
.top-main{display:contents}
.top-main .section-title{grid-column:2;margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.02em;color:var(--accent);white-space:nowrap}
.top-main .topright{grid-column:3;justify-self:end}
@media (max-width:860px){
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
  .top-main .topright{order:2}
  .top-main .section-title{order:3;flex-basis:100%;text-align:center}
}
.layout{position:relative}
/* Mục lục nổi: không chiếm chỗ, mở ra thì đè lên nội dung */
.side{position:absolute;left:0;top:0;z-index:20}
.side button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap;width:100%}
.side button:hover{background:var(--surface)}
.side button[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.side .side-toggle{justify-content:flex-start;gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px;width:auto}
.side .side-toggle svg{width:14px;height:14px;transition:transform .25s ease}
.side .side-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.side-list{position:absolute;top:calc(100% + 6px);left:0;width:250px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 18px 40px rgba(16,40,25,.16);visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .2s ease, transform .2s ease, visibility 0s linear .2s}
.side-list.open{visibility:visible;opacity:1;transform:none;transition:opacity .2s ease, transform .2s ease, visibility 0s}
.side-inner{display:flex;flex-direction:column;gap:4px}
.side-inner button{opacity:0;transform:translateY(-14px)}
.side-list.open .side-inner button{animation:wave .5s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes wave{0%{opacity:0;transform:translateY(-14px) scaleY(.85)}60%{opacity:1;transform:translateY(3px) scaleY(1.02)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .side-list,.side .side-toggle svg{transition:none}
  .side-inner button{opacity:1;transform:none}
  .side-list.open .side-inner button{animation:none}
}
.side .soon{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.main{min-width:0;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.main > .page{align-self:center}
@media (max-width:1560px){.layout{padding-top:48px}}
.coming{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:640px}
.coming h2{margin:0 0 6px;font-size:22px}
.coming p{margin:0 0 14px;color:var(--muted)}
@media (max-width:860px){ .wrap{padding-left:var(--gut);padding-right:var(--gut)} }
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark{min-width:34px;padding:0 8px;font-size:14px;letter-spacing:.04em;height:34px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

.intro{text-align:center;max-width:1200px;width:100%;align-self:center;padding:8px 0 4px}
.intro .intro-h{font-size:clamp(24px,3.2vw,34px);line-height:1.25;margin:0 0 8px;text-wrap:balance;letter-spacing:-.02em}
.intro p{margin:0 auto;color:var(--muted);max-width:80ch;text-wrap:balance}

/* Lesson list */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.num{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.card h3{margin:0;font-size:17px}
.card .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.tip{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--muted);font-size:14px}

/* Lesson */
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.lesson-head h2{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.lesson-head p{margin:4px 0 0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.steps button .n{font-size:12px;font-weight:700}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.steps button.done .n::after{content:" ✓";color:var(--good)}
.steps button:disabled{opacity:.5;cursor:not-allowed}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.status{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.you{align-self:flex-end;flex-direction:row-reverse}
.who{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
.msg.you .bubble{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble.playing{box-shadow:0 0 0 3px var(--sun)}
.t{font-size:17px;font-weight:600}
.t.zh{font-size:20px;font-weight:500}
.py{font-size:14px;color:var(--accent);margin-top:2px}
.vi{font-size:14px;color:var(--muted);margin-top:4px}
.play{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}

/* Phrase cards */
.phr{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.mic{border:0;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.mic svg{width:16px;height:16px}
.mic.listening{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,58,50,.45)}100%{box-shadow:0 0 0 12px rgba(201,58,50,0)}}
@media (prefers-reduced-motion: reduce){.mic.listening{animation:none}}
.result{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.result.good{background:var(--good-soft)}
.result.warn{background:var(--warn-soft)}
.result.bad{background:var(--bad-soft)}
.result .score{font-weight:800;font-size:15px}
.diff span{padding:0 1px;border-radius:3px}
.diff .ok{color:var(--good);font-weight:700}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:3px}
.heard{color:var(--muted)}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}

/* Roleplay */
.turn{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.turn h4{margin:0;font-size:14px;color:var(--accent)}
.prompt{font-size:16px;font-weight:600}
.hidden-target{filter:blur(6px);user-select:none}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}

/* Notes */
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:10px;padding:14px 16px}
.note h4{margin:0 0 4px;font-size:16px}
.note p{margin:0;color:var(--muted)}
.locked{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.next{display:flex;justify-content:flex-end}
@media (max-width:420px){
  .steps button{font-size:12px;padding:8px 2px}
  .t{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* ===================== NỘI DUNG BÀI HỌC ===================== */
const LESSONS = {
en: [
 { id:"en-meet", title:"Làm quen với người mới", scene:"Bạn gặp Anna ở một buổi giao lưu.", partner:"Anna",
   lines:[
    {r:"A",t:"Hi! I'm Anna. What's your name?",v:"Chào! Mình là Anna. Bạn tên gì?"},
    {r:"B",t:"Hi Anna, I'm Minh. Nice to meet you.",v:"Chào Anna, mình là Minh. Rất vui được gặp bạn."},
    {r:"A",t:"Nice to meet you too. Where are you from?",v:"Mình cũng rất vui được gặp bạn. Bạn đến từ đâu?"},
    {r:"B",t:"I'm from Vietnam. How about you?",v:"Mình đến từ Việt Nam. Còn bạn thì sao?"},
    {r:"A",t:"I'm from Australia. What do you do?",v:"Mình đến từ Úc. Bạn làm nghề gì?"},
    {r:"B",t:"I work in sales. And you?",v:"Mình làm bán hàng. Còn bạn?"},
    {r:"A",t:"I'm a teacher. It was great talking to you!",v:"Mình là giáo viên. Nói chuyện với bạn vui lắm!"},
    {r:"B",t:"You too. See you around!",v:"Bạn cũng vậy. Hẹn gặp lại nhé!"}],
   phrases:[
    {t:"Nice to meet you.",v:"Rất vui được gặp bạn."},
    {t:"Where are you from?",v:"Bạn đến từ đâu?"},
    {t:"How about you?",v:"Còn bạn thì sao?"},
    {t:"What do you do?",v:"Bạn làm nghề gì?"},
    {t:"See you around!",v:"Hẹn gặp lại nhé!"}],
   notes:[
    {h:"“What do you do?” là hỏi nghề nghiệp",b:"Không phải “Bạn đang làm gì?” (câu đó là “What are you doing?”). Trả lời bằng “I work in…” hoặc “I'm a/an + nghề”."},
    {h:"“Nice to meet you” chỉ dùng lần đầu gặp",b:"Những lần sau gặp lại thì nói “Nice to see you”. Đáp lại lời chào lần đầu: “Nice to meet you too.”"},
    {h:"“How about you?” và “And you?”",b:"Hai cách hỏi lại thật nhanh để cuộc trò chuyện không bị một chiều."}]},
 { id:"en-cafe", title:"Gọi đồ uống ở quán cà phê", scene:"Bạn gọi một ly latte đá mang đi.", partner:"Nhân viên",
   lines:[
    {r:"A",t:"Hi there! What can I get for you?",v:"Chào bạn! Bạn muốn dùng gì?"},
    {r:"B",t:"Can I have an iced latte, please?",v:"Cho mình một ly latte đá nhé?"},
    {r:"A",t:"Sure. What size would you like?",v:"Được ạ. Bạn muốn cỡ nào?"},
    {r:"B",t:"Medium, please.",v:"Cỡ vừa nhé."},
    {r:"A",t:"For here or to go?",v:"Uống tại quán hay mang đi ạ?"},
    {r:"B",t:"To go, please. How much is it?",v:"Mang đi nhé. Bao nhiêu tiền vậy?"},
    {r:"A",t:"That's four fifty.",v:"Của bạn là bốn đô năm mươi xu."},
    {r:"B",t:"Here you go. Thanks!",v:"Gửi bạn. Cảm ơn nhé!"}],
   phrases:[
    {t:"Can I have an iced latte, please?",v:"Cho mình một ly latte đá nhé?"},
    {t:"Medium, please.",v:"Cỡ vừa nhé."},
    {t:"To go, please.",v:"Mang đi nhé."},
    {t:"How much is it?",v:"Bao nhiêu tiền vậy?"},
    {t:"Here you go.",v:"Gửi bạn (khi đưa tiền hoặc đồ)."}],
   notes:[
    {h:"“Can I have…, please?” lịch sự hơn “I want…”",b:"“I want” nghe khá cụt khi gọi món. Thay tên món vào khung câu: “Can I have a green tea, please?”"},
    {h:"“For here or to go?”",b:"Câu nhân viên hỏi rất thường gặp. “For here” là dùng tại quán, “to go” là mang đi."},
    {h:"Cách đọc giá tiền",b:"“Four fifty” nghĩa là $4.50. Người bản xứ thường bỏ chữ “dollars” và “cents” khi nói giá."}]},
 { id:"en-directions", title:"Hỏi đường", scene:"Bạn cần tìm ga tàu và hỏi một người đi đường.", partner:"Người đi đường",
   lines:[
    {r:"B",t:"Excuse me, how do I get to the train station?",v:"Xin lỗi, cho mình hỏi đường ra ga tàu đi thế nào?"},
    {r:"A",t:"Go straight and turn left at the traffic lights.",v:"Đi thẳng rồi rẽ trái ở chỗ đèn giao thông."},
    {r:"B",t:"Is it far from here?",v:"Có xa đây không ạ?"},
    {r:"A",t:"Not really. It's about five minutes on foot.",v:"Không xa lắm. Đi bộ khoảng năm phút."},
    {r:"B",t:"Great. Thank you so much!",v:"Tuyệt quá. Cảm ơn bạn nhiều!"},
    {r:"A",t:"No problem. Have a good day!",v:"Không có gì. Chúc bạn một ngày tốt lành!"}],
   phrases:[
    {t:"Excuse me, how do I get to the train station?",v:"Xin lỗi, đường ra ga tàu đi thế nào?"},
    {t:"Is it far from here?",v:"Có xa đây không?"},
    {t:"Turn left at the traffic lights.",v:"Rẽ trái ở chỗ đèn giao thông."},
    {t:"Thank you so much!",v:"Cảm ơn bạn rất nhiều!"}],
   notes:[
    {h:"“Excuse me” để mở lời với người lạ",b:"Dùng trước khi hỏi, không phải để xin lỗi. Khi làm sai điều gì thì mới nói “Sorry”."},
    {h:"“How do I get to + nơi?”",b:"Khung câu hỏi đường dùng được cho mọi địa điểm: the airport, this hotel, the nearest ATM…"},
    {h:"“On foot” là đi bộ",b:"“Five minutes on foot” cũng có thể nói là “a five-minute walk”. Đi xe thì dùng “by car”, “by bus”."}]},
 { id:"en-shopping", title:"Mua quần áo", scene:"Bạn muốn đổi một chiếc áo khoác sang cỡ nhỏ hơn.", partner:"Nhân viên",
   lines:[
    {r:"A",t:"Hi, can I help you with anything?",v:"Chào bạn, mình giúp gì được cho bạn không?"},
    {r:"B",t:"Yes, do you have this jacket in a smaller size?",v:"Có, áo khoác này có cỡ nhỏ hơn không?"},
    {r:"A",t:"Let me check. Here's a small.",v:"Để mình kiểm tra. Đây là cỡ S."},
    {r:"B",t:"Can I try it on?",v:"Mình mặc thử được không?"},
    {r:"A",t:"Of course. The fitting room is over there.",v:"Tất nhiên. Phòng thử đồ ở đằng kia."},
    {r:"B",t:"It fits perfectly. I'll take it.",v:"Vừa khít luôn. Mình lấy cái này."},
    {r:"A",t:"Great! Cash or card?",v:"Tuyệt! Bạn trả tiền mặt hay thẻ?"},
    {r:"B",t:"Card, please.",v:"Thẻ nhé."}],

const LANG_INFO = {
  en:{name:"Tiếng Anh", tts:"en-US", rec:"en-US", dict:"en"},
  zh:{name:"Tiếng Trung", tts:"zh-CN", rec:"zh-CN", dict:"zh"}
};
const STEP_NAMES = ["Nghe hội thoại","Câu then chốt","Đóng vai","Vì sao nói vậy?"];

/* ===================== LƯU TIẾN ĐỘ ===================== */
const STORE_KEY = "noingay.v1";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
let store = loadStore();
store.progress = store.progress || {};
store.prefs = Object.assign({lang:"en", slow:false, showVi:true, showPy:true, theme:"light"}, store.prefs || {});
function applyTheme(){
  const dark = store.prefs.theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const m = document.querySelector('meta[name="color-scheme"]'); if(m) m.setAttribute("content", dark ? "only dark" : "only light");
}
applyTheme();
function prog(id){ return store.progress[id] || (store.progress[id] = {listen:false, phrases:{}, role:false, roleScore:null}); }

/* ===================== ĐỌC TO (TTS) ===================== */
const TTS = {
  voices: [], current: null,
  load(){ try{ this.voices = speechSynthesis.getVoices() || []; }catch(e){ this.voices = []; } },
  list(lang){
    const base = LANG_INFO[lang].tts.toLowerCase().slice(0,2);
    return this.voices.filter(v => (v.lang||"").replace("_","-").toLowerCase().startsWith(base));
  },
  pick(lang){
    const pref = LANG_INFO[lang].tts.toLowerCase();
    const list = this.list(lang);
    if(!list.length) return null;
    const chosen = (store.prefs.voice || {})[lang];
    if(chosen){ const c = list.find(v => v.voiceURI === chosen); if(c) return c; }
    const exact = list.filter(v => v.lang.replace("_","-").toLowerCase() === pref);
    const pool = exact.length ? exact : list;
    return pool.find(v => /natural|google|neural|premium|enhanced/i.test(v.name)) || pool[0];
  },
  has(lang){ return !!this.pick(lang); },
  speak(text, lang, onend){
    if(!("speechSynthesis" in window)){ onend && onend(); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG_INFO[lang].tts;
      const v = this.pick(lang); if(v) u.voice = v;
      u.rate = store.prefs.slow ? 0.7 : 0.95;
      let done = false;
      const fin = () => { if(done) return; done = true; this.current = null; onend && onend(); };
      u.onend = fin; u.onerror = fin;
      this.current = u;
      speechSynthesis.speak(u);
    }catch(e){ onend && onend(); }
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};
if("speechSynthesis" in window){
  TTS.load();
  try{ speechSynthesis.onvoiceschanged = () => { TTS.load(); render(); }; }catch(e){}
}

/* ===================== NHẬN GIỌNG NÓI ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const Rec = {
  dict: null,            // dictation của Claude (khi mở trong Claude)
  dictBad: {},           // ngôn ngữ mà dictation báo không hỗ trợ
  srBlocked: false,      // trình duyệt chặn micro
  active: null,          // {key, lang, cb, buffer, timers}
  mode(lang){
    if(this.dict && !this.dictBad[lang]) return "claude";
    if(SR && !this.srBlocked) return "browser";
    return "none";
  },
  listen(key, lang, cb){
    const m = this.mode(lang);
    if(m === "claude") return this._dictStart(key, lang, cb);
    if(m === "browser") return this._srStart(key, lang, cb);
    cb({error:"none"});
  },
  stop(){
    const a = this.active; if(!a) return;
    if(a.kind === "claude"){ try{ this.dict.stop().catch(()=>{}); }catch(e){} }
    else if(a.sr){ try{ a.sr.stop(); }catch(e){} }
  },
  _finish(result){
    const a = this.active; if(!a) return;
    clearTimeout(a.idle); clearTimeout(a.max);
    this.active = null;
    a.cb(result);
  },
  _dictStart(key, lang, cb){
    const a = {key, lang, cb, kind:"claude", buffer:"", idle:null, max:null};
    this.active = a;
    // gọi start() ngay trong cú bấm, không await gì trước đó
    this.dict.start({language: LANG_INFO[lang].dict}).catch(err => {
      const code = err && err.code;
      if(this.active !== a) return;
      if(code === "unavailable"){ this.dictBad[lang] = true; this._finish({error:"switch"}); }
      else if(code === "not_granted"){ this.dictBad[lang] = true; this._finish({error:"denied"}); }
      else if(code === "stopped"){ this._finish({texts:[a.buffer.trim()].filter(Boolean)}); }
      else this._finish({error:"failed"});
    });
    a.max = setTimeout(() => this.stop(), 12000);
    renderMicStates();
  },
  _onFinal(text){
    const a = this.active; if(!a || a.kind !== "claude") return;
    a.buffer += text;
    clearTimeout(a.idle);
    a.idle = setTimeout(() => this.stop(), 1400);
  },
  _onState(e){
    const a = this.active; if(!a || a.kind !== "claude") return;
    if(e.state === "idle"){
      if(e.reason === "unavailable"){ this.dictBad[a.lang] = true; this._finish({error:"switch"}); return; }
      if(e.reason === "not_granted"){ this.dictBad[a.lang] = true; this._finish({error:"denied"}); return; }
      this._finish({texts:[a.buffer.trim()].filter(Boolean)});
    }
  },
  _srStart(key, lang, cb){
    let sr;
    try{ sr = new SR(); }catch(e){ this.srBlocked = true; cb({error:"switch"}); return; }
    const a = {key, lang, cb, kind:"browser", sr, texts:[], idle:null, max:null};
    this.active = a;
    sr.lang = LANG_INFO[lang].rec;
    sr.interimResults = false;
    sr.maxAlternatives = 3;
    sr.continuous = false;
    sr.onresult = (ev) => {
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const res = ev.results[i];
        for(let j = 0; j < res.length; j++) a.texts.push(res[j].transcript);
      }
    };
    sr.onerror = (ev) => {
      if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){ this.srBlocked = true; if(this.active===a) this._finish({error:"denied"}); }
      else if(ev.error === "no-speech"){ if(this.active===a) this._finish({texts:[]}); }
      else if(this.active===a) this._finish({error:"failed"});
    };
    sr.onend = () => { if(this.active === a) this._finish({texts:a.texts}); };
    try{ sr.start(); }catch(e){ this.srBlocked = true; this._finish({error:"switch"}); return; }
    a.max = setTimeout(() => this.stop(), 12000);
    renderMicStates();
  }
};

/* ===================== CHẤM ĐIỂM ===================== */
function expandEn(s){
  return s.toLowerCase()
    .replace(/[’`]/g,"'")
    .replace(/\bcan't\b/g,"can not").replace(/\bwon't\b/g,"will not")
    .replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are")
    .replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would")
    .replace(/'s\b/g," is");
}
function tokensEn(s){ return expandEn(s).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean); }
function isHan(ch){ return /[㐀-鿿]/.test(ch); }
function tokensZh(s){ return Array.from(s.toLowerCase()).filter(ch => isHan(ch) || /[a-z0-9]/.test(ch)); }
function stripTones(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ü/g,"u").replace(/v/g,"u").toLowerCase(); }
function lettersPy(s){ return Array.from(stripTones(s).replace(/[^a-z0-9]/g,"")); }
function lcsInfo(a, b){
  const n=a.length, m=b.length, dp=[];
  for(let i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); }
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const matched = new Array(n).fill(false);
  let i=n, j=m;
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  return {len: dp[n][m], matched};
}
function scoreOne(targetToks, heardToks){
  if(!targetToks.length || !heardToks.length) return {score:0, matched:new Array(targetToks.length).fill(false)};
  const r = lcsInfo(targetToks, heardToks);
  return {score: Math.round(200 * r.len / (targetToks.length + heardToks.length)), matched: r.matched};
}
/* Trả về {score, heard, html} — html là câu mẫu tô màu chỗ khớp/thiếu */
function evaluate(item, lang, texts, typed){
  const cands = (texts || []).filter(Boolean);
  if(!cands.length) return {score:0, heard:"", html:esc(item.t), empty:true};
  const targets = [item.t].concat(item.alt || []);
  let best = {score:-1};
  for(const h of cands){
    const pinyinTyped = lang==="zh" && typed && !/[㐀-鿿]/.test(h);
    for(const t of targets){
      let r;
      if(pinyinTyped){ r = scoreOne(lettersPy(item.p || ""), lettersPy(h)); r.pinyin = true; }
      else r = scoreOne(lang==="en" ? tokensEn(t) : tokensZh(t), lang==="en" ? tokensEn(h) : tokensZh(h));
      if(r.score > best.score) best = Object.assign({heard:h, isMain: t===item.t}, r);
    }
  }
  let html = esc(item.t);
  if(!best.pinyin && best.isMain) html = diffHtml(item.t, lang, best.matched);
  return {score: best.score, heard: best.heard, html, pinyin: !!best.pinyin};
}
function diffHtml(text, lang, matched){
  let k = 0, out = "";
  if(lang === "en"){
    const words = text.split(/(\s+)/);
    for(const w of words){
      if(/^\s+$/.test(w)){ out += w; continue; }
      const toks = tokensEn(w);
      if(!toks.length){ out += esc(w); continue; }
      let ok = true; for(let x=0;x<toks.length;x++){ if(!matched[k+x]) ok=false; }
      k += toks.length;
      out += `<span class="${ok?"ok":"miss"}">${esc(w)}</span>`;
    }
  } else {
    for(const ch of Array.from(text)){
      if(isHan(ch) || /[a-z0-9]/i.test(ch)){ out += `<span class="${matched[k]?"ok":"miss"}">${esc(ch)}</span>`; k++; }
      else out += esc(ch);
    }
  }
  return out;
}
function grade(score){ return score>=85 ? "good" : score>=60 ? "warn" : "bad"; }
function gradeText(score){ return score>=85 ? "Tuyệt vời!" : score>=60 ? "Khá tốt, nói lại cho rõ hơn nhé." : "Chưa khớp, nghe mẫu rồi thử lại."; }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stepDone(lesson, i){
  const p = prog(lesson.id);

}

      <span>Hoàn thành đóng vai</span>
      <span class="big">${avg} điểm</span>
      <span class="status">${scored.length}/${rp.results.filter(Boolean).length} câu đã nói. ${avg>=85?"Bạn đã sẵn sàng dùng tình huống này ngoài đời thật!":"Thử thêm một lượt để nói trôi chảy hơn nhé."}</span>
      <div class="row"><button class="btn" data-act="step" data-v="3">Mở phần “Vì sao nói vậy?” →</button>
      <button class="btn ghost" data-act="rpstart">Đóng vai lại</button></div></div>`;
  }
  return `<div class="chat">${html}</div>${turn}`;
}
function renderNotes(lesson, lang){
  if(!prog(lesson.id).role) return `<div class="locked">Hoàn thành bước Đóng vai để mở phần giải thích. Nói được trước, hiểu sau.</div>`;
  const notes = lesson.notes.map(n => `<div class="note"><h4 class="${lang}">${esc(n.h)}</h4><p class="${lang}">${esc(n.b)}</p></div>`).join("");
  const L = lessonsOf(lang); const idx = L.findIndex(x => x.id===lesson.id);
  const nxt = L[idx+1];
  return `<div class="list">${notes}</div>
    <div class="next">${nxt?`<button class="btn" data-act="open" data-id="${nxt.id}">Bài tiếp theo: ${esc(nxt.title)} →</button>`:`<button class="btn ghost" data-act="home">Về danh sách bài</button>`}</div>`;
}
function renderMicStates(){ render(); }
function voicePicker(lang){
  const list = TTS.list(lang);
  if(list.length < 2) return "";
  const cur = TTS.pick(lang);
  const opts = list.map(v => `<option value="${esc(v.voiceURI)}" ${cur && cur.voiceURI===v.voiceURI?"selected":""}>${esc(v.name.replace(/^(Microsoft|Google)\s+/,"").replace(/\s+Online \(Natural\)/," (Natural)"))} · ${esc(v.lang)}</option>`).join("");
  return `<label class="voicepick" for="voice-sel">Giọng đọc <select id="voice-sel" data-act="voice">${opts}</select></label>`;
}

/* ===================== HÀNH ĐỘNG ===================== */
function itemByKey(key){
  const {lesson} = curLesson();
  const n = parseInt(key.slice(1), 10);
  if(key[0]==="L" || key[0]==="R") return lesson.lines[n];
  if(key[0]==="P") return lesson.phrases[n];
}
function sayKey(key, onend){
  const {lang} = curLesson();
  const item = itemByKey(key);
  if(!item){ onend && onend(); return; }
  if(ui.playingKey === key && !onend){ TTS.stop(); ui.playingKey = null; render(); return; }
  ui.playingKey = key; render();
  TTS.speak(item.t, lang, () => {
    if(ui.playingKey === key){ ui.playingKey = null; render(); }
    onend && onend();
  });
}
function playAllFrom(i){
  const {lesson} = curLesson();
  if(!ui.playAll) return;
  if(i >= lesson.lines.length){
    ui.playAll = false; prog(lesson.id).listen = true; saveStore(); render(); return;
  }
  sayKey(`L${i}`, () => { if(ui.playAll) setTimeout(() => playAllFrom(i+1), 350); });
}
function handleResult(key, out, typed){
  const {lesson, lang} = curLesson();
  const item = itemByKey(key);
  if(out.error === "switch"){ ui.results[key] = {error:"Không dùng được micro theo cách này. Hãy bấm micro lần nữa, hoặc gõ câu trả lời."}; render(); return; }
  if(out.error === "denied"){ ui.typing[key] = true; ui.results[key] = {error:"Micro đang bị chặn. Bạn hãy cho phép micro trong trình duyệt, hoặc gõ câu trả lời ở ô bên dưới."}; render(); return; }
  if(out.error === "failed"){ ui.results[key] = {error:"Micro gặp lỗi. Thử lại sau vài giây, hoặc gõ câu trả lời."}; render(); return; }
  if(out.error === "none"){ ui.typing[key] = true; render(); return; }
  const r = evaluate(item, lang, out.texts, typed);
  ui.results[key] = r;
  if(key[0]==="P" && !r.empty){
    const i = parseInt(key.slice(1),10), p = prog(lesson.id);
    p.phrases[i] = Math.max(p.phrases[i] || 0, r.score); saveStore();
  }
  if(key[0]==="R" && ui.rp && !r.empty){
    const i = parseInt(key.slice(1),10);
    ui.rp.results[i] = {score:r.score};
  }
  render();
}
function rpAdvance(){
  const {lesson} = curLesson();
  const rp = ui.rp; if(!rp) return;
  if(rp.idx >= lesson.lines.length){
    const scored = rp.results.filter(r => r && !r.skipped);
    const p = prog(lesson.id);
    p.role = true; p.roleScore = scored.length ? Math.round(scored.reduce((s,r)=>s+r.score,0)/scored.length) : 0;
    saveStore(); render(); return;
  }
  const ln = lesson.lines[rp.idx];
  rp.revealed = false;
  render();
  if(ln.r === "A"){
    const myIdx = rp.idx;
    sayKey(`R${myIdx}`, () => {
      if(ui.rp === rp && rp.idx === myIdx){ rp.idx++; setTimeout(rpAdvance, 300); }
    });
  }
}
document.addEventListener("click", (ev) => {
  if(ui.menuOpen && !ev.target.closest(".side")){
    ui.menuOpen = false;
    const list = document.getElementById("side-list"), tg = document.querySelector(".side-toggle");
    if(list){ list.classList.remove("open"); list.setAttribute("inert",""); }
    if(tg) tg.setAttribute("aria-expanded","false");
  }
  const el = ev.target.closest("[data-act]");
  if(!el || el.tagName === "FORM") return;
  const act = el.dataset.act;
  if(act === "voice") return;
  if(act === "menu"){
    ui.menuOpen = !ui.menuOpen;
    const open = ui.menuOpen, list = document.getElementById("side-list");
    el.setAttribute("aria-expanded", String(open));
    if(list){ list.classList.toggle("open", open); if(open) list.removeAttribute("inert"); else list.setAttribute("inert",""); }
    return;
  }
  if(act === "section"){ ui.menuOpen = false; TTS.stop(); Rec.stop(); ui.section = el.dataset.v; ui.view = "home"; ui.rp = null; ui.playAll = false; ui.playingKey = null; render(); window.scrollTo(0,0); return; }
  if(act === "theme"){ store.prefs.theme = store.prefs.theme === "dark" ? "light" : "dark"; saveStore(); applyTheme(); render(); return; }
  if(act === "lang"){ store.prefs.lang = el.dataset.v; saveStore(); TTS.stop(); Rec.stop(); ui.section="speak"; ui.view="home"; ui.rp=null; ui.playAll=false; ui.playingKey=null; render(); return; }
  if(act === "open"){ TTS.stop(); Rec.stop(); ui.view="lesson"; ui.lessonId=el.dataset.id; ui.step=0; ui.results={}; ui.typing={}; ui.rp=null; ui.playAll=false; ui.playingKey=null;
    const c = curLesson(); if(c){ store.prefs.lang = c.lang; saveStore(); } render(); window.scrollTo(0,0); return; }
  if(act === "home"){ TTS.stop(); Rec.stop(); ui.view="home"; ui.rp=null; ui.playAll=false; ui.playingKey=null; render(); window.scrollTo(0,0); return; }
  if(act === "step"){ TTS.stop(); Rec.stop(); ui.step = +el.dataset.v; ui.playAll=false; ui.playingKey=null; if(ui.step!==2) ui.rp=null; render(); window.scrollTo(0,0); return; }
  if(act === "pref"){ const k = el.dataset.v; store.prefs[k] = !store.prefs[k]; saveStore(); render(); return; }
  if(act === "say"){ ui.playAll = false; sayKey(el.dataset.key); return; }
  if(act === "playall"){
    if(ui.playAll){ ui.playAll=false; TTS.stop(); ui.playingKey=null; render(); return; }
    ui.playAll = true; playAllFrom(0); return;
  }
  if(act === "mic"){
    const key = el.dataset.key;
    if(Rec.active){ if(Rec.active.key === key){ Rec.stop(); } return; }
    TTS.stop(); ui.playingKey = null; ui.playAll = false;
    const {lang} = curLesson();
    ui.results[key] = null;
    Rec.listen(key, lang, (out) => handleResult(key, out, false));
    return;
  }
  if(act === "toggletype"){ const k = el.dataset.key; ui.typing[k] = !ui.typing[k]; render(); const inp = document.getElementById("in-"+k); if(inp) inp.focus(); return; }
  if(act === "rpstart"){ TTS.stop(); Rec.stop(); ui.results = {}; ui.typing = {}; ui.rp = {idx:0, revealed:false, results:[]}; rpAdvance(); return; }
  if(act === "reveal"){ if(ui.rp){ ui.rp.revealed = true; render(); } return; }
  if(act === "rpnext"){ if(ui.rp){ ui.rp.idx++; rpAdvance(); } return; }
  if(act === "rpskip"){ if(ui.rp){ ui.rp.results[ui.rp.idx] = {skipped:true, score:0}; ui.rp.idx++; rpAdvance(); } return; }
});
document.addEventListener("change", (ev) => {
  const sel = ev.target.closest("select[data-act='voice']");
  if(!sel) return;
  const c = curLesson(); if(!c) return;
  store.prefs.voice = Object.assign({}, store.prefs.voice || {}, {[c.lang]: sel.value});
  saveStore();
  TTS.speak(c.lang==="zh" ? "你好，我是你的新声音。" : "Hi! This is your new voice.", c.lang);
});
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("form[data-act='typed']");
  if(!f) return;
  ev.preventDefault();
  const key = f.dataset.key;
  const val = (f.querySelector("input").value || "").trim();
  if(!val) return;
  handleResult(key, {texts:[val]}, true);
});

render();
</script>
