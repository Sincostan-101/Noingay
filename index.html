<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<title>Study for yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: logo trái, ngôn ngữ + chế độ đêm phải; tiêu đề giữa; bài học lưới 2 cột bám lề trái */
  --bg:#faf1d9;
  --surface:#e5f2df;
  --ink:#123524;
  --muted:#4d6d5b;
  --line:#d2e4cc;
  --accent:#1a7a40;
  --accent-soft:#c8e8c6;
  --btn:#a5e6bc;
  --btn-ink:#0c3d21;
  --sun:#f4b400;
  --good:#15803d;
  --good-soft:#dcf3e4;
  --warn:#a86500;
  --warn-soft:#fff1d2;
  --bad:#c93a32;
  --bad-soft:#fde6e4;
  --font-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-zh:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --radius:14px;
  color-scheme: only light;
}
:root[data-theme="dark"]{
  --bg:#0b1410; --surface:#15281d; --ink:#e4f1e8; --muted:#97b0a1; --line:#25402f;
  --accent:#6ee39a; --accent-soft:#1d4a30; --btn:#2f7a4c; --btn-ink:#eafff1; --sun:#fbbf24;
  --good:#4ade80; --good-soft:#153524; --warn:#f0b24a; --warn-soft:#3a2d12;
  --bad:#ff7a70; --bad-soft:#3d1b1a; color-scheme: only dark;
}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg button,.themebtn{white-space:nowrap}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.themebtn svg{width:16px;height:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.zh{font-family:var(--font-zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{--gut:clamp(16px,3vw,40px);--edge:24px;padding:20px var(--edge) 64px;display:flex;flex-direction:column;gap:22px}
.page{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.page.wide{max-width:1200px;align-self:center}
.list.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.list.grid2{grid-template-columns:1fr}}
.voicepick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.voicepick select{border:0;background:transparent;color:var(--ink);font:inherit;max-width:190px;padding:3px 2px}

/* Header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.top .brand{justify-self:start;white-space:nowrap}
.top-main{display:contents}
.top-main .section-title{grid-column:2;margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.02em;color:var(--accent);white-space:nowrap}
.top-main .topright{grid-column:3;justify-self:end}
@media (max-width:860px){
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
  .top-main .topright{order:2}
  .top-main .section-title{order:3;flex-basis:100%;text-align:center}
}
.layout{position:relative;padding-top:56px}
/* Mục lục: một hàng ngang phía trên tiêu đề, mở ra theo chiều ngang, không đẩy nội dung */
.side{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:44px}
.side button{border:0;background:transparent;text-align:left;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.side button:hover{background:var(--surface)}
.side button[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.side .side-toggle{gap:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px}
.side .side-toggle svg{width:14px;height:14px;transition:transform .25s ease}
.side .side-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.side-list{min-width:0;overflow-x:auto;scrollbar-width:none;visibility:hidden;transition:visibility 0s linear .25s}
.side-list::-webkit-scrollbar{display:none}
.side-list.open{visibility:visible;transition:visibility 0s}
.side-inner{display:flex;flex-direction:row;align-items:center;gap:6px;padding:2px}
.side-inner button{opacity:0;transform:translateX(-18px);transition:opacity .2s ease, transform .2s ease}
.side-inner button:not([aria-current="page"]){border:1px solid var(--line);background:var(--surface)}
.side-list.open .side-inner button{animation:wave .5s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes wave{0%{opacity:0;transform:translateX(-18px) scale(.92)}60%{opacity:1;transform:translateX(3px) scale(1.03)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .side-list,.side .side-toggle svg,.side-inner button{transition:none}
  .side-inner button{opacity:1;transform:none}
  .side-list.open .side-inner button{animation:none}
}
.side .soon{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.main{min-width:0;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.main > .page{align-self:center}

.coming{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:640px}
.coming h2{margin:0 0 6px;font-size:22px}
.coming p{margin:0 0 14px;color:var(--muted)}
@media (max-width:860px){ .wrap{padding-left:var(--gut);padding-right:var(--gut)} }
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark{min-width:34px;padding:0 8px;font-size:14px;letter-spacing:.04em;height:34px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

.intro{text-align:center;max-width:1200px;width:100%;align-self:center;padding:8px 0 4px}
.intro .intro-h{font-size:clamp(24px,3.2vw,34px);line-height:1.25;margin:0 0 8px;text-wrap:balance;letter-spacing:-.02em}
.intro p{margin:0 auto;color:var(--muted);max-width:80ch;text-wrap:balance}

/* Lesson list */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.num{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.card h3{margin:0;font-size:17px}
.card .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.tip{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--muted);font-size:14px}

/* Lesson */
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.lesson-head h2{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.lesson-head p{margin:4px 0 0;color:var(--muted)}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.steps button .n{font-size:12px;font-weight:700}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.steps button.done .n::after{content:" ✓";color:var(--good)}
.steps button:disabled{opacity:.5;cursor:not-allowed}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn{white-space:nowrap;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.status{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.you{align-self:flex-end;flex-direction:row-reverse}
.who{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
.msg.you .bubble{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble.playing{box-shadow:0 0 0 3px var(--sun)}
.t{font-size:17px;font-weight:600}
.t.zh{font-size:20px;font-weight:500}
.py{font-size:14px;color:var(--accent);margin-top:2px}
.vi{font-size:14px;color:var(--muted);margin-top:4px}
.play{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}

/* Phrase cards */
.phr{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.mic{border:0;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.mic svg{width:16px;height:16px}
.mic.listening{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,58,50,.45)}100%{box-shadow:0 0 0 12px rgba(201,58,50,0)}}
@media (prefers-reduced-motion: reduce){.mic.listening{animation:none}}
.result{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.result.good{background:var(--good-soft)}
.result.warn{background:var(--warn-soft)}
.result.bad{background:var(--bad-soft)}
.result .score{font-weight:800;font-size:15px}
.diff span{padding:0 1px;border-radius:3px}
.diff .ok{color:var(--good);font-weight:700}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:3px}
.heard{color:var(--muted)}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}

/* Roleplay */
.turn{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.turn h4{margin:0;font-size:14px;color:var(--accent)}
.prompt{font-size:16px;font-weight:600}
.hidden-target{filter:blur(6px);user-select:none}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}

/* Notes */
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:10px;padding:14px 16px}
.note h4{margin:0 0 4px;font-size:16px}
.note p{margin:0;color:var(--muted)}
.locked{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.next{display:flex;justify-content:flex-end}
/* Pomodoro */
.pomo{position:relative}
.pomo-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pomo-btn svg{width:16px;height:16px;flex:none}
.pomo-btn.run{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pomo-btn.brk{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pomo-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:310px;max-height:calc(100vh - 90px);overflow-y:auto;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px;display:flex;flex-direction:column;gap:12px}
.pomo-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:999px;padding:4px}
.pomo-modes button{border:0;background:transparent;border-radius:999px;padding:6px 4px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.pomo-modes button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.pomo-big{font-size:46px;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pomo-msg{font-size:13px;color:var(--muted);text-align:center}
.pomo-tip{font-size:13px;line-height:1.45;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 10px}
.pomo-cfg{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pomo-sub{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pomo-presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pomo-presets button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 6px;font-size:12px;font-weight:700;color:var(--ink)}
.pomo-presets button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.pomo-field{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.pomo-num{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.pomo-num input{width:64px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;text-align:right}
.pomo-alert{font-size:14px;font-weight:700;text-align:center;background:var(--good-soft);color:var(--good);border-radius:10px;padding:8px}
/* Từ vựng */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.vgrid .ex{width:100%}
.vblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* Nhạc nền */
.music{position:relative}
.music-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:330px;max-width:calc(100vw - 32px);max-height:calc(100vh - 90px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px;display:flex;flex-direction:column;gap:10px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:1px}
.mitem b{font-size:14px}
.mitem span{font-size:12px;color:var(--muted)}
.mitem:hover{border-color:var(--accent)}
.mitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mitem[aria-pressed="true"] b::before{content:"▶ ";color:var(--accent)}
.mvol{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.mvol input{flex:1;accent-color:var(--accent)}
.viz{border:0;background:transparent;padding:2px 4px;border-radius:8px;display:inline-flex;align-items:center;margin-left:2px}
.viz:hover{background:var(--surface)}
.viz canvas{width:72px;height:26px;display:block}
.merr{font-size:12px;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:7px 10px}
/* Phát âm */
.grp-h{margin:14px 0 -4px;font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.01em}
.card h3.ipa{font-size:21px;letter-spacing:.01em}
.lesson-head .grp-tag{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.lesson-head h2.ipa-big{font-size:40px;line-height:1.15;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 14px}
.hz{font-family:var(--font-zh);font-weight:500;color:var(--accent);margin-left:12px}
.ipa-big .hz{margin-left:0;font-size:40px}
.hz-py{font-size:16px;font-weight:600;color:var(--muted)}
.snd{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.snd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sym{min-width:56px;height:44px;padding:0 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;font-weight:800;white-space:nowrap}
.snd-vn{color:var(--ink);font-weight:600;font-size:15px;flex:1;min-width:180px}
.exs{display:flex;flex-wrap:wrap;gap:8px}
.ex{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px 8px 10px;display:inline-flex;align-items:center;gap:8px;text-align:left}
.ex svg{width:14px;height:14px;flex:none;color:var(--accent)}
.ex:hover{border-color:var(--accent)}
.ex.playing{box-shadow:0 0 0 3px var(--sun)}
.ex .t{font-size:16px}
.ex .t.zh{font-size:19px}
.ex .py{display:inline;font-size:13px;margin:0 0 0 4px}
.ex .vi{display:block;font-size:12px;margin-top:0}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopt{border:2px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.qopt .t{font-size:22px}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt:disabled{cursor:default;color:var(--ink)}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:420px){
  .steps button{font-size:12px;padding:8px 2px}
  .t{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* ===================== NỘI DUNG BÀI HỌC ===================== */
const LESSONS = {
en: [
 { id:"en-meet", title:"Làm quen với người mới", scene:"Bạn gặp Anna ở một buổi giao lưu.", partner:"Anna",
   lines:[
    {r:"A",t:"Hi! I'm Anna. What's your name?",v:"Chào! Mình là Anna. Bạn tên gì?"},
    {r:"B",t:"Hi Anna, I'm Minh. Nice to meet you.",v:"Chào Anna, mình là Minh. Rất vui được gặp bạn."},
    {r:"A",t:"Nice to meet you too. Where are you from?",v:"Mình cũng rất vui được gặp bạn. Bạn đến từ đâu?"},
    {r:"B",t:"I'm from Vietnam. How about you?",v:"Mình đến từ Việt Nam. Còn bạn thì sao?"},
    {r:"A",t:"I'm from Australia. What do you do?",v:"Mình đến từ Úc. Bạn làm nghề gì?"},
    {r:"B",t:"I work in sales. And you?",v:"Mình làm bán hàng. Còn bạn?"},
    {r:"A",t:"I'm a teacher. It was great talking to you!",v:"Mình là giáo viên. Nói chuyện với bạn vui lắm!"},
    {r:"B",t:"You too. See you around!",v:"Bạn cũng vậy. Hẹn gặp lại nhé!"}],
   phrases:[
    {t:"Nice to meet you.",v:"Rất vui được gặp bạn."},
    {t:"Where are you from?",v:"Bạn đến từ đâu?"},
    {t:"How about you?",v:"Còn bạn thì sao?"},
    {t:"What do you do?",v:"Bạn làm nghề gì?"},
    {t:"See you around!",v:"Hẹn gặp lại nhé!"}],
   notes:[
    {h:"“What do you do?” là hỏi nghề nghiệp",b:"Không phải “Bạn đang làm gì?” (câu đó là “What are you doing?”). Trả lời bằng “I work in…” hoặc “I'm a/an + nghề”."},
    {h:"“Nice to meet you” chỉ dùng lần đầu gặp",b:"Những lần sau gặp lại thì nói “Nice to see you”. Đáp lại lời chào lần đầu: “Nice to meet you too.”"},
    {h:"“How about you?” và “And you?”",b:"Hai cách hỏi lại thật nhanh để cuộc trò chuyện không bị một chiều."}]},
 { id:"en-cafe", title:"Gọi đồ uống ở quán cà phê", scene:"Bạn gọi một ly latte đá mang đi.", partner:"Nhân viên",
   lines:[
    {r:"A",t:"Hi there! What can I get for you?",v:"Chào bạn! Bạn muốn dùng gì?"},
    {r:"B",t:"Can I have an iced latte, please?",v:"Cho mình một ly latte đá nhé?"},
    {r:"A",t:"Sure. What size would you like?",v:"Được ạ. Bạn muốn cỡ nào?"},
    {r:"B",t:"Medium, please.",v:"Cỡ vừa nhé."},
    {r:"A",t:"For here or to go?",v:"Uống tại quán hay mang đi ạ?"},
    {r:"B",t:"To go, please. How much is it?",v:"Mang đi nhé. Bao nhiêu tiền vậy?"},
    {r:"A",t:"That's four fifty.",v:"Của bạn là bốn đô năm mươi xu."},
    {r:"B",t:"Here you go. Thanks!",v:"Gửi bạn. Cảm ơn nhé!"}],
   phrases:[
    {t:"Can I have an iced latte, please?",v:"Cho mình một ly latte đá nhé?"},
    {t:"Medium, please.",v:"Cỡ vừa nhé."},
    {t:"To go, please.",v:"Mang đi nhé."},
    {t:"How much is it?",v:"Bao nhiêu tiền vậy?"},
    {t:"Here you go.",v:"Gửi bạn (khi đưa tiền hoặc đồ)."}],
   notes:[
    {h:"“Can I have…, please?” lịch sự hơn “I want…”",b:"“I want” nghe khá cụt khi gọi món. Thay tên món vào khung câu: “Can I have a green tea, please?”"},
    {h:"“For here or to go?”",b:"Câu nhân viên hỏi rất thường gặp. “For here” là dùng tại quán, “to go” là mang đi."},
    {h:"Cách đọc giá tiền",b:"“Four fifty” nghĩa là $4.50. Người bản xứ thường bỏ chữ “dollars” và “cents” khi nói giá."}]},
 { id:"en-directions", title:"Hỏi đường", scene:"Bạn cần tìm ga tàu và hỏi một người đi đường.", partner:"Người đi đường",
   lines:[
    {r:"B",t:"Excuse me, how do I get to the train station?",v:"Xin lỗi, cho mình hỏi đường ra ga tàu đi thế nào?"},
    {r:"A",t:"Go straight and turn left at the traffic lights.",v:"Đi thẳng rồi rẽ trái ở chỗ đèn giao thông."},
    {r:"B",t:"Is it far from here?",v:"Có xa đây không ạ?"},
    {r:"A",t:"Not really. It's about five minutes on foot.",v:"Không xa lắm. Đi bộ khoảng năm phút."},
    {r:"B",t:"Great. Thank you so much!",v:"Tuyệt quá. Cảm ơn bạn nhiều!"},
    {r:"A",t:"No problem. Have a good day!",v:"Không có gì. Chúc bạn một ngày tốt lành!"}],
   phrases:[
    {t:"Excuse me, how do I get to the train station?",v:"Xin lỗi, đường ra ga tàu đi thế nào?"},
    {t:"Is it far from here?",v:"Có xa đây không?"},
    {t:"Turn left at the traffic lights.",v:"Rẽ trái ở chỗ đèn giao thông."},
    {t:"Thank you so much!",v:"Cảm ơn bạn rất nhiều!"}],
   notes:[
    {h:"“Excuse me” để mở lời với người lạ",b:"Dùng trước khi hỏi, không phải để xin lỗi. Khi làm sai điều gì thì mới nói “Sorry”."},
    {h:"“How do I get to + nơi?”",b:"Khung câu hỏi đường dùng được cho mọi địa điểm: the airport, this hotel, the nearest ATM…"},
    {h:"“On foot” là đi bộ",b:"“Five minutes on foot” cũng có thể nói là “a five-minute walk”. Đi xe thì dùng “by car”, “by bus”."}]},
 { id:"en-shopping", title:"Mua quần áo", scene:"Bạn muốn đổi một chiếc áo khoác sang cỡ nhỏ hơn.", partner:"Nhân viên",
   lines:[
    {r:"A",t:"Hi, can I help you with anything?",v:"Chào bạn, mình giúp gì được cho bạn không?"},
    {r:"B",t:"Yes, do you have this jacket in a smaller size?",v:"Có, áo khoác này có cỡ nhỏ hơn không?"},
    {r:"A",t:"Let me check. Here's a small.",v:"Để mình kiểm tra. Đây là cỡ S."},
    {r:"B",t:"Can I try it on?",v:"Mình mặc thử được không?"},
    {r:"A",t:"Of course. The fitting room is over there.",v:"Tất nhiên. Phòng thử đồ ở đằng kia."},
    {r:"B",t:"It fits perfectly. I'll take it.",v:"Vừa khít luôn. Mình lấy cái này."},
    {r:"A",t:"Great! Cash or card?",v:"Tuyệt! Bạn trả tiền mặt hay thẻ?"},
    {r:"B",t:"Card, please.",v:"Thẻ nhé."}],
   phrases:[
    {t:"Do you have this in a smaller size?",v:"Cái này có cỡ nhỏ hơn không?"},
    {t:"Can I try it on?",v:"Mình mặc thử được không?"},
    {t:"It fits perfectly.",v:"Vừa khít luôn."},
    {t:"I'll take it.",v:"Mình lấy cái này."},
    {t:"Card, please.",v:"Trả bằng thẻ nhé."}],
   notes:[
    {h:"“Try it on” là mặc thử",b:"Với quần (danh từ số nhiều) thì nói “try them on”. Phòng thử đồ là “fitting room”."},
    {h:"“I'll take it.” là câu chốt mua",b:"Chưa muốn mua thì nói “I'll think about it.”, nghe lịch sự hơn là im lặng bỏ đi."},
    {h:"“Fit” và “suit” khác nhau",b:"“It fits” là vừa cỡ. “It suits you” là hợp với bạn, trông đẹp."}]},
 { id:"en-hotel", title:"Nhận phòng khách sạn", scene:"Bạn đến khách sạn đã đặt trước hai đêm.", partner:"Lễ tân",
   lines:[
    {r:"A",t:"Good evening. How can I help you?",v:"Chào buổi tối. Tôi có thể giúp gì cho anh/chị?"},
    {r:"B",t:"Hi, I have a reservation under the name Minh Nguyen.",v:"Chào, tôi đã đặt phòng dưới tên Minh Nguyen."},
    {r:"A",t:"Let me see... Yes, two nights, right?",v:"Để tôi xem... Vâng, hai đêm đúng không ạ?"},
    {r:"B",t:"That's right. What time is breakfast?",v:"Đúng rồi. Bữa sáng mấy giờ vậy?"},
    {r:"A",t:"From six thirty to ten.",v:"Từ sáu rưỡi đến mười giờ."},
    {r:"B",t:"Could I get a late checkout?",v:"Tôi trả phòng muộn được không?"},
    {r:"A",t:"Sure, until one o'clock.",v:"Được ạ, đến một giờ chiều."},
    {r:"B",t:"Perfect. Thank you!",v:"Tuyệt quá. Cảm ơn nhé!"}],
   phrases:[
    {t:"I have a reservation.",v:"Tôi đã đặt phòng trước."},
    {t:"That's right.",v:"Đúng vậy."},
    {t:"What time is breakfast?",v:"Bữa sáng mấy giờ?"},
    {t:"Could I get a late checkout?",v:"Tôi trả phòng muộn được không?"}],
   notes:[
    {h:"“Under the name…”",b:"Cách nói đặt chỗ đứng tên ai. Dùng được cả ở nhà hàng: “a table under the name Minh”."},
    {h:"“Could I…?” lịch sự hơn “Can I…?”",b:"Dùng khi nhờ vả nhân viên hoặc người lạ."},
    {h:"“checkout” và “check out”",b:"Danh từ viết liền (a late checkout), động từ viết rời (I want to check out)."}]},
 { id:"en-phone", title:"Hẹn gặp qua điện thoại", scene:"Bạn gọi cho Jake để rủ đi cà phê cuối tuần.", partner:"Jake",
   lines:[
    {r:"A",t:"Hello?",v:"A lô?"},
    {r:"B",t:"Hi Jake, it's Minh. Are you free this Saturday?",v:"Chào Jake, mình là Minh đây. Thứ Bảy này bạn rảnh không?"},
    {r:"A",t:"I think so. What's up?",v:"Chắc là rảnh. Có chuyện gì thế?"},
    {r:"B",t:"Do you want to grab coffee?",v:"Bạn có muốn đi cà phê không?"},
    {r:"A",t:"Sure! What time works for you?",v:"Được chứ! Mấy giờ thì tiện cho bạn?"},
    {r:"B",t:"How about ten in the morning?",v:"Mười giờ sáng thì sao?",alt:["How about 10 in the morning?"]},
    {r:"A",t:"Sounds good. Where should we meet?",v:"Nghe ổn đấy. Mình gặp nhau ở đâu?"},
    {r:"B",t:"Let's meet at the café near the park.",v:"Gặp ở quán cà phê gần công viên nhé."},
    {r:"A",t:"Great, see you then!",v:"Tuyệt, hẹn gặp lúc đó nhé!"}],
   phrases:[
    {t:"Are you free this Saturday?",v:"Thứ Bảy này bạn rảnh không?"},
    {t:"Do you want to grab coffee?",v:"Bạn có muốn đi cà phê không?"},
    {t:"How about ten in the morning?",v:"Mười giờ sáng thì sao?",alt:["How about 10 in the morning?"]},
    {t:"Let's meet at the café near the park.",v:"Gặp ở quán cà phê gần công viên nhé."}],
   notes:[
    {h:"Trên điện thoại nói “It's Minh”",b:"Khi gọi điện, người bản xứ giới thiệu mình bằng “It's + tên” hoặc “This is + tên”, không nói “I am Minh”."},
    {h:"“Grab coffee” là đi cà phê",b:"“Grab” ở đây là làm nhanh, thân mật: grab lunch (đi ăn trưa), grab a drink (đi uống gì đó)."},
    {h:"Hẹn giờ: “How about…?” và “Sounds good”",b:"Đề xuất bằng “How about + thời gian/địa điểm?”. Đồng ý bằng “Sounds good.” hoặc “Works for me.”"}]},
 { id:"en-doctor", title:"Đi khám bệnh", scene:"Bạn bị đau đầu, đau họng và đi gặp bác sĩ.", partner:"Bác sĩ",
   lines:[
    {r:"A",t:"Hi, what seems to be the problem?",v:"Chào bạn, bạn thấy không khỏe ở đâu?"},
    {r:"B",t:"I have a headache and a sore throat.",v:"Tôi bị đau đầu và đau họng."},
    {r:"A",t:"How long have you had these symptoms?",v:"Bạn bị những triệu chứng này bao lâu rồi?"},
    {r:"B",t:"Since yesterday morning.",v:"Từ sáng hôm qua."},
    {r:"A",t:"Do you have a fever?",v:"Bạn có sốt không?"},
    {r:"B",t:"Yes, a little.",v:"Có, hơi sốt."},
    {r:"A",t:"It looks like a cold. Take this medicine twice a day.",v:"Có vẻ là bị cảm. Uống thuốc này ngày hai lần."},
    {r:"B",t:"Should I take it after meals?",v:"Tôi có nên uống sau bữa ăn không?"},
    {r:"A",t:"Yes, and drink plenty of water.",v:"Có, và nhớ uống nhiều nước."},
    {r:"B",t:"Thank you, doctor.",v:"Cảm ơn bác sĩ."}],
   phrases:[
    {t:"I have a headache.",v:"Tôi bị đau đầu."},
    {t:"I have a sore throat.",v:"Tôi bị đau họng."},
    {t:"Since yesterday morning.",v:"Từ sáng hôm qua."},
    {t:"Should I take it after meals?",v:"Tôi có nên uống sau bữa ăn không?"}],
   notes:[
    {h:"“I have a + bệnh” để kể triệu chứng",b:"I have a headache (đau đầu), a stomachache (đau bụng), a cold (cảm), a fever (sốt). Đau một chỗ cụ thể: “My back hurts.”"},
    {h:"“Since” đi với mốc thời gian",b:"Since yesterday, since Monday là “từ mốc đó đến giờ”. Nếu nói khoảng thời gian thì dùng “for”: for two days."},
    {h:"Liều thuốc: once, twice, three times",b:"Một lần là once, hai lần là twice, từ ba lần trở đi dùng “times”: three times a day (ngày ba lần)."}]},
 { id:"en-taxi", title:"Đi taxi", scene:"Bạn bắt taxi ra sân bay và đang hơi muộn.", partner:"Tài xế",
   lines:[
    {r:"B",t:"Hi, can you take me to the airport, please?",v:"Chào anh, anh chở tôi ra sân bay được không?"},
    {r:"A",t:"Sure. Which terminal?",v:"Được. Nhà ga nào ạ?"},
    {r:"B",t:"Terminal two, please. How long will it take?",v:"Nhà ga số hai. Mất bao lâu vậy anh?",alt:["Terminal 2, please. How long will it take?"]},
    {r:"A",t:"About thirty minutes, depending on traffic.",v:"Khoảng ba mươi phút, tùy tình hình giao thông."},
    {r:"B",t:"Can you go a bit faster? I'm running late.",v:"Anh đi nhanh hơn chút được không? Tôi đang bị muộn."},
    {r:"A",t:"I'll do my best.",v:"Tôi sẽ cố hết sức."},
    {r:"A",t:"Here we are. That's twenty-five dollars.",v:"Đến rồi. Hết hai mươi lăm đô."},
    {r:"B",t:"Here's thirty. Keep the change.",v:"Gửi anh ba mươi. Anh cứ giữ tiền thừa.",alt:["Here's 30. Keep the change."]}],
   phrases:[
    {t:"Can you take me to the airport, please?",v:"Anh chở tôi ra sân bay được không?"},
    {t:"How long will it take?",v:"Mất bao lâu vậy?"},
    {t:"I'm running late.",v:"Tôi đang bị muộn."},
    {t:"Keep the change.",v:"Cứ giữ tiền thừa."}],
   notes:[
    {h:"“Take me to + nơi”",b:"Câu gọn nhất khi lên xe: “To the airport, please.” Lịch sự hơn: “Can you take me to…, please?”"},
    {h:"“I'm running late” là đang bị muộn",b:"Khác với “I'm late” (đã muộn rồi). Câu này hay dùng khi báo cho người khác biết mình sắp đến trễ."},
    {h:"“Keep the change”",b:"Nghĩa là không cần trả lại tiền thừa, coi như tiền boa. Ở Mỹ thường boa tài xế khoảng 10–20%."}]},
 { id:"en-interview", title:"Phỏng vấn xin việc", scene:"Bạn phỏng vấn cho vị trí thực tập ở một công ty.", partner:"Người phỏng vấn",
   lines:[
    {r:"A",t:"Please have a seat. Can you tell me a little about yourself?",v:"Mời bạn ngồi. Bạn giới thiệu đôi chút về bản thân nhé?"},
    {r:"B",t:"Sure. I'm a university student, and I'm good at working with numbers.",v:"Vâng. Tôi là sinh viên đại học và tôi giỏi làm việc với số liệu."},
    {r:"A",t:"Why do you want to work here?",v:"Vì sao bạn muốn làm việc ở đây?"},
    {r:"B",t:"I'd like to learn from a professional team.",v:"Tôi muốn học hỏi từ một đội ngũ chuyên nghiệp."},
    {r:"A",t:"What is your greatest strength?",v:"Điểm mạnh lớn nhất của bạn là gì?"},
    {r:"B",t:"I'm hard-working and I learn quickly.",v:"Tôi chăm chỉ và học nhanh."},
    {r:"A",t:"Do you have any questions for us?",v:"Bạn có câu hỏi nào cho chúng tôi không?"},
    {r:"B",t:"Yes. What does a typical day look like in this role?",v:"Có ạ. Một ngày làm việc ở vị trí này thường như thế nào?"},
    {r:"A",t:"Good question. We'll get back to you next week.",v:"Câu hỏi hay. Tuần sau chúng tôi sẽ liên lạc lại với bạn."},
    {r:"B",t:"Thank you for your time.",v:"Cảm ơn anh/chị đã dành thời gian."}],
   phrases:[
    {t:"I'm good at working with numbers.",v:"Tôi giỏi làm việc với số liệu."},
    {t:"I'd like to learn from a professional team.",v:"Tôi muốn học hỏi từ một đội ngũ chuyên nghiệp."},
    {t:"I'm hard-working and I learn quickly.",v:"Tôi chăm chỉ và học nhanh."},
    {t:"Thank you for your time.",v:"Cảm ơn anh/chị đã dành thời gian."}],
   notes:[
    {h:"“I'm good at + V-ing hoặc danh từ”",b:"I'm good at working with numbers, I'm good at teamwork. Sau “at” động từ phải thêm -ing."},
    {h:"“I'd like to” lịch sự hơn “I want to”",b:"Trong phỏng vấn và công việc, “I'd like to…” nghe chuyên nghiệp và mềm mỏng hơn."},
    {h:"Luôn chuẩn bị một câu hỏi ngược lại",b:"Khi được hỏi “Do you have any questions?”, đừng nói “No”. Một câu hỏi về công việc hằng ngày cho thấy bạn thật sự quan tâm."}]},
 { id:"en-hobby", title:"Nói về sở thích", scene:"Bạn trò chuyện với Lily về chuyện làm gì cuối tuần.", partner:"Lily",
   lines:[
    {r:"A",t:"What do you usually do on weekends?",v:"Cuối tuần bạn thường làm gì?"},
    {r:"B",t:"I usually play badminton with my friends.",v:"Mình thường chơi cầu lông với bạn bè."},
    {r:"A",t:"That sounds fun! How often do you play?",v:"Nghe vui đấy! Bạn chơi bao lâu một lần?"},
    {r:"B",t:"About twice a week. What about you?",v:"Khoảng hai lần một tuần. Còn bạn?"},
    {r:"A",t:"I love reading and cooking.",v:"Mình thích đọc sách và nấu ăn."},
    {r:"B",t:"Really? What kind of food do you cook?",v:"Thật à? Bạn hay nấu món gì?"},
    {r:"A",t:"Mostly Italian food. I'm not very good at it yet, though.",v:"Chủ yếu là đồ Ý. Nhưng mình nấu chưa giỏi lắm."},
    {r:"B",t:"I'd love to try it someday!",v:"Hôm nào mình muốn ăn thử lắm!"},
    {r:"A",t:"Sure, come over next weekend!",v:"Được chứ, cuối tuần sau qua nhà mình nhé!"}],
   phrases:[
    {t:"What do you usually do on weekends?",v:"Cuối tuần bạn thường làm gì?"},
    {t:"I usually play badminton with my friends.",v:"Mình thường chơi cầu lông với bạn bè."},
    {t:"How often do you play?",v:"Bạn chơi bao lâu một lần?"},
    {t:"I'd love to try it someday!",v:"Hôm nào mình muốn thử lắm!"}],
   notes:[
    {h:"“Usually” đứng trước động từ thường",b:"I usually play, I often read. Nhưng đứng sau “to be”: I'm usually busy."},
    {h:"Hỏi tần suất bằng “How often…?”",b:"Trả lời: once a week (một lần một tuần), twice a month (hai lần một tháng), every day (mỗi ngày)."},
    {h:"“I'd love to…” thể hiện rất muốn",b:"Mạnh và thân thiện hơn “I want to”. Đáp lại lời mời cũng dùng: “I'd love to!”"}]},
 { id:"en-family", title:"Nói về gia đình", scene:"Tom hỏi thăm về gia đình bạn.", partner:"Tom",
   lines:[
    {r:"A",t:"Do you have any brothers or sisters?",v:"Bạn có anh chị em không?"},
    {r:"B",t:"Yes, I have an older sister and a younger brother.",v:"Có, mình có một chị gái và một em trai."},
    {r:"A",t:"What does your sister do?",v:"Chị bạn làm nghề gì?"},
    {r:"B",t:"She's a nurse. She works at a hospital in Hanoi.",v:"Chị ấy là y tá. Chị làm ở một bệnh viện ở Hà Nội."},
    {r:"A",t:"How old is your brother?",v:"Em trai bạn bao nhiêu tuổi?"},
    {r:"B",t:"He's fifteen. He's still in high school.",v:"Em ấy mười lăm tuổi. Vẫn đang học cấp ba.",alt:["He's 15. He's still in high school."]},
    {r:"A",t:"Do you live with your parents?",v:"Bạn sống cùng bố mẹ à?"},
    {r:"B",t:"No, I live in a dorm near my university.",v:"Không, mình ở ký túc xá gần trường."}],
   phrases:[
    {t:"Do you have any brothers or sisters?",v:"Bạn có anh chị em không?"},
    {t:"I have an older sister and a younger brother.",v:"Mình có một chị gái và một em trai."},
    {t:"She's a nurse.",v:"Chị ấy là y tá."},
    {t:"I live in a dorm near my university.",v:"Mình ở ký túc xá gần trường."}],
   notes:[
    {h:"Older/younger thay cho “anh, chị, em”",b:"Tiếng Anh không phân biệt anh với em: older brother là anh trai, younger sister là em gái."},
    {h:"“What does she do?” là hỏi nghề",b:"Trả lời bằng “She's a/an + nghề” hoặc “She works at/in + nơi làm”."},
    {h:"Nói tuổi: “He's fifteen.”",b:"Không cần thêm “years old”. Hỏi tuổi: “How old is he?”"}]},
 { id:"en-routine", title:"Thói quen hằng ngày", scene:"Sarah hỏi về một ngày bình thường của bạn.", partner:"Sarah",
   lines:[
    {r:"A",t:"What time do you usually get up?",v:"Bạn thường dậy lúc mấy giờ?"},
    {r:"B",t:"I get up at six thirty on weekdays.",v:"Ngày thường mình dậy lúc sáu rưỡi.",alt:["I get up at 6:30 on weekdays."]},
    {r:"A",t:"That's early! What do you do in the morning?",v:"Sớm thế! Buổi sáng bạn làm gì?"},
    {r:"B",t:"I take a shower, have breakfast, and go to class.",v:"Mình tắm, ăn sáng rồi đi học."},
    {r:"A",t:"When do you finish class?",v:"Mấy giờ bạn tan học?"},
    {r:"B",t:"Around four in the afternoon. Then I go to the gym.",v:"Khoảng bốn giờ chiều. Sau đó mình đi tập gym.",alt:["Around 4 in the afternoon. Then I go to the gym."]},
    {r:"A",t:"What do you do in the evening?",v:"Buổi tối bạn làm gì?"},
    {r:"B",t:"I do my homework and go to bed at eleven.",v:"Mình làm bài tập rồi đi ngủ lúc mười một giờ.",alt:["I do my homework and go to bed at 11."]}],
   phrases:[
    {t:"What time do you usually get up?",v:"Bạn thường dậy lúc mấy giờ?"},
    {t:"I take a shower and have breakfast.",v:"Mình tắm và ăn sáng."},
    {t:"Then I go to the gym.",v:"Sau đó mình đi tập gym."},
    {t:"I go to bed at eleven.",v:"Mình đi ngủ lúc mười một giờ.",alt:["I go to bed at 11."]}],
   notes:[
    {h:"Thói quen dùng thì hiện tại đơn",b:"I get up, I go to class. Với he/she thêm -s: She gets up at seven."},
    {h:"Các cụm “have”, “take”, “do”",b:"Have breakfast (ăn sáng), take a shower (tắm), do homework (làm bài tập). Học nguyên cụm, đừng dịch từng chữ."},
    {h:"Nói giờ: “six thirty”",b:"6:30 đọc là “six thirty” hoặc “half past six”. 4:15 là “four fifteen” hoặc “a quarter past four”."}]},
 { id:"en-weather", title:"Nói chuyện thời tiết", scene:"Bạn nói chuyện phiếm với Mark ở chỗ làm.", partner:"Mark",
   lines:[
    {r:"A",t:"It's really hot today, isn't it?",v:"Hôm nay nóng thật, nhỉ?"},
    {r:"B",t:"Yes, it's boiling! What's the weather like tomorrow?",v:"Ừ, nóng như đổ lửa! Mai thời tiết thế nào?"},
    {r:"A",t:"I heard it's going to rain.",v:"Nghe nói mai sẽ mưa."},
    {r:"B",t:"Really? I should bring an umbrella.",v:"Thật à? Mình nên mang ô."},
    {r:"A",t:"Good idea. Do you like the rainy season?",v:"Ý hay đấy. Bạn có thích mùa mưa không?"},
    {r:"B",t:"Not really. I prefer cool, dry weather.",v:"Không lắm. Mình thích thời tiết mát và khô hơn."},
    {r:"A",t:"Me too. Autumn is my favorite season.",v:"Mình cũng vậy. Mùa thu là mùa mình thích nhất."},
    {r:"B",t:"Mine too!",v:"Mình cũng thế!"}],
   phrases:[
    {t:"It's really hot today, isn't it?",v:"Hôm nay nóng thật, nhỉ?"},
    {t:"What's the weather like tomorrow?",v:"Mai thời tiết thế nào?"},
    {t:"I should bring an umbrella.",v:"Mình nên mang ô."},
    {t:"I prefer cool, dry weather.",v:"Mình thích thời tiết mát và khô hơn."}],
   notes:[
    {h:"“…, isn't it?” để mở đầu chuyện phiếm",b:"Câu hỏi đuôi này không cần câu trả lời đúng sai, chỉ để bắt chuyện. Trả lời “Yes, it is!” là đủ."},
    {h:"“What's the weather like?”",b:"Đây là cách hỏi thời tiết tự nhiên nhất. Trả lời: It's sunny, rainy, cloudy, windy…"},
    {h:"“Me too” và “Mine too”",b:"“Me too” đáp lại câu kể về mình. “Mine too” đáp lại câu có “my”: My favorite is autumn. Mine too!"}]},
 { id:"en-return", title:"Đổi trả hàng", scene:"Chiếc áo bạn mua bị chật và có lỗ thủng.", partner:"Nhân viên",
   lines:[
    {r:"B",t:"Hi, I'd like to return this shirt.",v:"Chào bạn, tôi muốn trả lại chiếc áo này."},
    {r:"A",t:"Sure. What's wrong with it?",v:"Vâng. Áo bị sao vậy ạ?"},
    {r:"B",t:"It's too small, and there's a hole here.",v:"Áo chật quá, mà chỗ này còn bị thủng."},
    {r:"A",t:"I'm sorry about that. Do you have the receipt?",v:"Thành thật xin lỗi. Bạn có mang hóa đơn không?"},
    {r:"B",t:"Yes, here it is.",v:"Có, đây ạ."},
    {r:"A",t:"Would you like a refund or an exchange?",v:"Bạn muốn hoàn tiền hay đổi cái khác?"},
    {r:"B",t:"Can I exchange it for a bigger size?",v:"Tôi đổi sang cỡ to hơn được không?"},
    {r:"A",t:"Of course. Here's a medium.",v:"Tất nhiên. Đây là cỡ M."},
    {r:"B",t:"Perfect, thanks!",v:"Tuyệt, cảm ơn nhé!"}],
   phrases:[
    {t:"I'd like to return this shirt.",v:"Tôi muốn trả lại chiếc áo này."},
    {t:"It's too small.",v:"Nó chật quá."},
    {t:"Here it is.",v:"Đây ạ (khi đưa đồ)."},
    {t:"Can I exchange it for a bigger size?",v:"Tôi đổi sang cỡ to hơn được không?"}],
   notes:[
    {h:"Return, refund, exchange",b:"Return là trả hàng, refund là hoàn tiền, exchange là đổi sang món khác."},
    {h:"“Too + tính từ” là “quá…”",b:"Too small (chật quá), too expensive (đắt quá). “Too” mang ý không vừa ý."},
    {h:"Nhớ giữ “receipt”",b:"Receipt là hóa đơn. Hầu hết cửa hàng chỉ cho đổi trả khi có hóa đơn và còn trong thời hạn."}]},
 { id:"en-train", title:"Mua vé tàu", scene:"Bạn mua vé tàu khứ hồi đi Boston.", partner:"Nhân viên bán vé",
   lines:[
    {r:"B",t:"Hi, I'd like a ticket to Boston, please.",v:"Chào bạn, cho tôi một vé đi Boston."},
    {r:"A",t:"One way or round trip?",v:"Một chiều hay khứ hồi ạ?"},
    {r:"B",t:"Round trip, please.",v:"Khứ hồi."},
    {r:"A",t:"When would you like to come back?",v:"Bạn muốn về ngày nào?"},
    {r:"B",t:"This Sunday evening.",v:"Tối Chủ nhật này."},
    {r:"A",t:"That's eighty-five dollars.",v:"Hết tám mươi lăm đô."},
    {r:"B",t:"Is there a discount for students?",v:"Sinh viên có được giảm giá không?"},
    {r:"A",t:"Yes, with your student ID it's sixty dollars.",v:"Có, nếu có thẻ sinh viên thì còn sáu mươi đô."},
    {r:"B",t:"Great. What time does the next train leave?",v:"Tuyệt. Chuyến tàu tiếp theo chạy lúc mấy giờ?"},
    {r:"A",t:"At ten fifteen, from platform three.",v:"Lúc mười giờ mười lăm, ở sân ga số ba."}],
   phrases:[
    {t:"I'd like a ticket to Boston, please.",v:"Cho tôi một vé đi Boston."},
    {t:"Round trip, please.",v:"Khứ hồi."},
    {t:"Is there a discount for students?",v:"Sinh viên có được giảm giá không?"},
    {t:"What time does the next train leave?",v:"Chuyến tàu tiếp theo chạy lúc mấy giờ?"}],
   notes:[
    {h:"One way và round trip",b:"One way là vé một chiều, round trip là khứ hồi. Người Anh hay nói single và return."},
    {h:"“What time does … leave/arrive?”",b:"Hỏi giờ tàu, xe chạy hoặc đến: What time does the bus arrive?"},
    {h:"Platform là sân ga",b:"Ở sân bay thì là gate (cửa ra máy bay): Gate 12."}]},
 { id:"en-weekend", title:"Kể chuyện cuối tuần", scene:"Lily hỏi bạn cuối tuần vừa rồi làm gì.", partner:"Lily",
   lines:[
    {r:"A",t:"How was your weekend?",v:"Cuối tuần của bạn thế nào?"},
    {r:"B",t:"It was great! I went to the beach with my family.",v:"Tuyệt lắm! Mình đi biển với gia đình."},
    {r:"A",t:"Sounds nice! Where did you go?",v:"Nghe hay quá! Bạn đi đâu?"},
    {r:"B",t:"We went to Vung Tau.",v:"Nhà mình đi Vũng Tàu."},
    {r:"A",t:"What did you do there?",v:"Ở đó bạn làm gì?"},
    {r:"B",t:"We swam in the sea and ate a lot of seafood.",v:"Nhà mình bơi ở biển và ăn rất nhiều hải sản."},
    {r:"A",t:"Lucky you! I just stayed home and studied.",v:"Sướng thế! Mình chỉ ở nhà học bài."},
    {r:"B",t:"Oh no! Next time, come with us.",v:"Ôi không! Lần sau đi cùng nhà mình nhé."}],
   phrases:[
    {t:"How was your weekend?",v:"Cuối tuần của bạn thế nào?"},
    {t:"I went to the beach with my family.",v:"Mình đi biển với gia đình."},
    {t:"We ate a lot of seafood.",v:"Nhà mình ăn rất nhiều hải sản."},
    {t:"Next time, come with us.",v:"Lần sau đi cùng nhà mình nhé."}],
   notes:[
    {h:"Kể chuyện đã qua dùng thì quá khứ",b:"Nhiều động từ hay dùng là bất quy tắc: go → went, eat → ate, swim → swam, have → had."},
    {h:"“How was…?” để hỏi trải nghiệm",b:"How was your trip / the movie / the exam? Trả lời: It was great / OK / terrible."},
    {h:"“Lucky you!”",b:"Câu cảm thán vui vẻ: “Sướng nhỉ!”. Không mang ý ghen tị khó chịu."}]},
 { id:"en-plans", title:"Kế hoạch du lịch", scene:"Anna hỏi về kế hoạch nghỉ hè của bạn.", partner:"Anna",
   lines:[
    {r:"A",t:"Do you have any plans for the summer?",v:"Bạn có kế hoạch gì cho mùa hè chưa?"},
    {r:"B",t:"Yes, I'm going to travel to Japan.",v:"Có, mình sẽ đi du lịch Nhật Bản."},
    {r:"A",t:"Wow! How long are you going to stay?",v:"Wow! Bạn định ở bao lâu?"},
    {r:"B",t:"About ten days.",v:"Khoảng mười ngày.",alt:["About 10 days."]},
    {r:"A",t:"What are you going to do there?",v:"Bạn định làm gì ở đó?"},
    {r:"B",t:"I'm going to visit Tokyo and Kyoto and try lots of Japanese food.",v:"Mình sẽ đi Tokyo, Kyoto và thử thật nhiều món Nhật."},
    {r:"A",t:"Have you booked your hotel yet?",v:"Bạn đặt khách sạn chưa?"},
    {r:"B",t:"Not yet. I'm going to do it this week.",v:"Chưa. Tuần này mình sẽ đặt."},
    {r:"A",t:"Have a great trip!",v:"Chúc bạn có chuyến đi vui vẻ!"}],
   phrases:[
    {t:"I'm going to travel to Japan.",v:"Mình sẽ đi du lịch Nhật Bản."},
    {t:"How long are you going to stay?",v:"Bạn định ở bao lâu?"},
    {t:"Not yet.",v:"Chưa."},
    {t:"Have a great trip!",v:"Chúc bạn có chuyến đi vui vẻ!"}],
   notes:[
    {h:"“Be going to” cho kế hoạch đã định",b:"I'm going to travel… dùng khi đã quyết định từ trước. Quyết định ngay lúc nói thì dùng “I'll…”."},
    {h:"“Have you … yet?” và “Not yet”",b:"Hỏi việc gì đã làm chưa. Trả lời: Yes, I have hoặc Not yet (chưa)."},
    {h:"Lời chúc khi ai đó sắp đi",b:"Have a great trip! / Have fun! / Enjoy your vacation!"}]},
 { id:"en-bank", title:"Đổi tiền", scene:"Bạn đổi tiền Việt sang đô la Mỹ ở ngân hàng.", partner:"Nhân viên ngân hàng",
   lines:[
    {r:"B",t:"Excuse me, can I exchange money here?",v:"Xin lỗi, ở đây có đổi tiền không ạ?"},
    {r:"A",t:"Yes. What currency do you have?",v:"Có. Bạn có tiền gì?"},
    {r:"B",t:"I'd like to change Vietnamese dong into US dollars.",v:"Tôi muốn đổi tiền Việt sang đô la Mỹ."},
    {r:"A",t:"Sure. How much would you like to change?",v:"Được. Bạn muốn đổi bao nhiêu?"},
    {r:"B",t:"Five million dong, please.",v:"Năm triệu đồng ạ.",alt:["5 million dong, please."]},
    {r:"A",t:"Could I see your passport, please?",v:"Cho tôi xem hộ chiếu của bạn nhé?"},
    {r:"B",t:"Here you are. What's the exchange rate today?",v:"Đây ạ. Tỷ giá hôm nay là bao nhiêu?"},
    {r:"A",t:"It's on the screen behind me.",v:"Tỷ giá ở trên màn hình phía sau tôi."},
    {r:"B",t:"Thanks. Could I have some small bills, please?",v:"Cảm ơn. Cho tôi ít tiền mệnh giá nhỏ được không?"},
    {r:"A",t:"Of course.",v:"Tất nhiên rồi."}],
   phrases:[
    {t:"Can I exchange money here?",v:"Ở đây có đổi tiền không?"},
    {t:"I'd like to change dong into US dollars.",v:"Tôi muốn đổi tiền Việt sang đô la Mỹ."},
    {t:"What's the exchange rate today?",v:"Tỷ giá hôm nay là bao nhiêu?"},
    {t:"Could I have some small bills, please?",v:"Cho tôi ít tiền mệnh giá nhỏ được không?"}],
   notes:[
    {h:"Change/exchange A into B",b:"Đổi tiền A sang tiền B: change euros into dollars. Tỷ giá là exchange rate."},
    {h:"“Here you are” khi đưa đồ",b:"Dùng khi đưa giấy tờ, tiền hoặc đồ vật cho người khác. Giống “Here it is”."},
    {h:"Small bills là tiền lẻ",b:"Bills là tiền giấy (người Anh nói notes), coins là tiền xu. Đi du lịch nên đổi thêm ít tiền lẻ để trả taxi, boa."}]},
 { id:"en-rent", title:"Thuê nhà", scene:"Bạn gọi hỏi thuê một căn hộ gần trường.", partner:"Chủ nhà",
   lines:[
    {r:"B",t:"Hi, I'm calling about the apartment for rent. Is it still available?",v:"Chào anh, tôi gọi hỏi về căn hộ cho thuê. Căn đó còn trống không ạ?"},
    {r:"A",t:"Yes, it is.",v:"Vẫn còn."},
    {r:"B",t:"How much is the rent?",v:"Tiền thuê bao nhiêu ạ?"},
    {r:"A",t:"It's four hundred dollars a month.",v:"Bốn trăm đô một tháng."},
    {r:"B",t:"Are utilities included?",v:"Đã gồm tiền điện nước chưa ạ?"},
    {r:"A",t:"Water is included, but electricity is not.",v:"Gồm tiền nước, còn tiền điện thì chưa."},
    {r:"B",t:"Is it near a bus stop?",v:"Gần trạm xe buýt không ạ?"},
    {r:"A",t:"Yes, it's just two minutes away.",v:"Có, chỉ cách hai phút đi bộ."},
    {r:"B",t:"Great. Can I come and see it tomorrow?",v:"Tuyệt. Mai tôi đến xem nhà được không?"},
    {r:"A",t:"Sure. How about three p.m.?",v:"Được. Ba giờ chiều nhé?"}],
   phrases:[
    {t:"Is it still available?",v:"Còn trống không ạ?"},
    {t:"How much is the rent?",v:"Tiền thuê bao nhiêu ạ?"},
    {t:"Are utilities included?",v:"Đã gồm tiền điện nước chưa?"},
    {t:"Can I come and see it tomorrow?",v:"Mai tôi đến xem được không?"}],
   notes:[
    {h:"“I'm calling about…” để mở đầu cuộc gọi",b:"Nói ngay lý do gọi: I'm calling about the job ad / your message."},
    {h:"Utilities là các khoản điện, nước, gas",b:"Hỏi “Are utilities included?” để biết giá thuê đã gồm các khoản này chưa."},
    {h:"“Still available?”",b:"Hỏi còn hàng, còn chỗ, còn phòng hay không. Dùng được cả khi mua đồ cũ trên mạng."}]},
 { id:"en-lost", title:"Nhờ giúp khi mất đồ", scene:"Bạn làm rơi ví trong trung tâm thương mại.", partner:"Nhân viên",
   lines:[
    {r:"B",t:"Excuse me, could you help me? I think I lost my wallet.",v:"Xin lỗi, anh giúp tôi được không? Hình như tôi mất ví rồi."},
    {r:"A",t:"Oh no. Where did you last see it?",v:"Ôi. Lần cuối bạn thấy nó ở đâu?"},
    {r:"B",t:"I had it at the café on the second floor.",v:"Lúc ở quán cà phê tầng hai tôi vẫn còn cầm."},
    {r:"A",t:"What does it look like?",v:"Ví trông như thế nào?"},
    {r:"B",t:"It's a small black wallet with a red stripe.",v:"Ví nhỏ màu đen, có một sọc đỏ."},
    {r:"A",t:"Let me check the lost and found.",v:"Để tôi xem ở quầy đồ thất lạc."},
    {r:"A",t:"Is this it?",v:"Có phải cái này không?"},
    {r:"B",t:"Yes, that's it! Thank you so much!",v:"Đúng rồi! Cảm ơn anh rất nhiều!"},
    {r:"A",t:"You're welcome. Please be careful next time.",v:"Không có gì. Lần sau bạn cẩn thận nhé."}],
   phrases:[
    {t:"Could you help me?",v:"Bạn giúp tôi được không?"},
    {t:"I think I lost my wallet.",v:"Hình như tôi mất ví rồi."},
    {t:"It's a small black wallet.",v:"Đó là một chiếc ví nhỏ màu đen."},
    {t:"That's it! Thank you so much!",v:"Đúng rồi! Cảm ơn rất nhiều!"}],
   notes:[
    {h:"“Could you help me?” lịch sự hơn “Help me!”",b:"Mở đầu bằng “Excuse me” rồi mới nhờ. “Help!” chỉ dùng khi thật sự nguy hiểm."},
    {h:"Tả đồ vật: cỡ, màu rồi đến chi tiết",b:"Thứ tự quen thuộc: a small black wallet (nhỏ, đen, ví). Chi tiết thêm vào sau bằng “with…”."},
    {h:"Lost and found",b:"Nơi giữ đồ thất lạc ở sân bay, nhà ga, trung tâm thương mại, trường học."}]}
],
zh: [
 { id:"zh-meet", title:"Làm quen với người mới", scene:"Bạn gặp Tiểu Vương lần đầu.", partner:"小王",
   lines:[
    {r:"A",t:"你好！我叫小王。你叫什么名字？",p:"Nǐ hǎo! Wǒ jiào Xiǎo Wáng. Nǐ jiào shénme míngzi?",v:"Xin chào! Mình là Tiểu Vương. Bạn tên gì?"},
    {r:"B",t:"你好，我叫阿明。很高兴认识你。",p:"Nǐ hǎo, wǒ jiào Ā Míng. Hěn gāoxìng rènshi nǐ.",v:"Chào bạn, mình là A Minh. Rất vui được làm quen."},
    {r:"A",t:"我也很高兴认识你。你是哪国人？",p:"Wǒ yě hěn gāoxìng rènshi nǐ. Nǐ shì nǎ guó rén?",v:"Mình cũng rất vui. Bạn là người nước nào?"},
    {r:"B",t:"我是越南人。你呢？",p:"Wǒ shì Yuènán rén. Nǐ ne?",v:"Mình là người Việt Nam. Còn bạn?"},
    {r:"A",t:"我是中国人。你是做什么工作的？",p:"Wǒ shì Zhōngguó rén. Nǐ shì zuò shénme gōngzuò de?",v:"Mình là người Trung Quốc. Bạn làm nghề gì?"},
    {r:"B",t:"我做生意。",p:"Wǒ zuò shēngyi.",v:"Mình làm kinh doanh."},
    {r:"A",t:"太好了！以后多联系。",p:"Tài hǎo le! Yǐhòu duō liánxì.",v:"Tốt quá! Sau này giữ liên lạc nhé."},
    {r:"B",t:"好的，再见！",p:"Hǎo de, zàijiàn!",v:"Được, tạm biệt!"}],
   phrases:[
    {t:"很高兴认识你。",p:"Hěn gāoxìng rènshi nǐ.",v:"Rất vui được làm quen."},
    {t:"你是哪国人？",p:"Nǐ shì nǎ guó rén?",v:"Bạn là người nước nào?"},
    {t:"我是越南人。",p:"Wǒ shì Yuènán rén.",v:"Tôi là người Việt Nam."},
    {t:"你呢？",p:"Nǐ ne?",v:"Còn bạn?"},
    {t:"以后多联系。",p:"Yǐhòu duō liánxì.",v:"Sau này giữ liên lạc nhé."}],
   notes:[
    {h:"你呢？nghĩa là “còn bạn thì sao?”",b:"Chỉ cần thêm 呢 (ne) để hỏi lại, không phải lặp lại cả câu hỏi."},
    {h:"哪国人 là “người nước nào”",b:"哪 (nǎ) là “nào”. Trả lời bằng tên nước + 人: 越南人, 中国人, 美国人."},
    {h:"以后多联系",b:"Câu chào cuối rất hay dùng khi mới quen, nhất là trong làm ăn: “sau này liên lạc nhiều nhé”."}]},
 { id:"zh-restaurant", title:"Gọi món ở quán ăn", scene:"Bạn và một người bạn vào quán mì.", partner:"服务员",
   lines:[
    {r:"A",t:"欢迎光临！几位？",p:"Huānyíng guānglín! Jǐ wèi?",v:"Chào mừng quý khách! Mấy người ạ?"},
    {r:"B",t:"两位。",p:"Liǎng wèi.",v:"Hai người."},
    {r:"A",t:"这是菜单。你们想吃什么？",p:"Zhè shì càidān. Nǐmen xiǎng chī shénme?",v:"Đây là thực đơn. Mọi người muốn ăn gì?"},
    {r:"B",t:"我要一碗牛肉面，不要辣。",p:"Wǒ yào yì wǎn niúròu miàn, bú yào là.",v:"Cho tôi một bát mì bò, không cay."},
    {r:"A",t:"好的。喝点儿什么？",p:"Hǎo de. Hē diǎnr shénme?",v:"Vâng. Uống gì ạ?"},
    {r:"B",t:"两杯茶，谢谢。",p:"Liǎng bēi chá, xièxie.",v:"Hai cốc trà, cảm ơn."},
    {r:"A",t:"好，请稍等。",p:"Hǎo, qǐng shāo děng.",v:"Vâng, xin chờ một lát."},
    {r:"B",t:"服务员，买单！",p:"Fúwùyuán, mǎidān!",v:"Em ơi, tính tiền!"}],
   phrases:[
    {t:"我要一碗牛肉面。",p:"Wǒ yào yì wǎn niúròu miàn.",v:"Cho tôi một bát mì bò."},
    {t:"不要辣。",p:"Bú yào là.",v:"Không cay."},
    {t:"两杯茶。",p:"Liǎng bēi chá.",v:"Hai cốc trà."},
    {t:"服务员，买单！",p:"Fúwùyuán, mǎidān!",v:"Em ơi, tính tiền!"}],
   notes:[
    {h:"两 hay 二?",b:"Khi đếm số lượng thì dùng 两 (liǎng): 两位, 两杯. Khi đọc con số thì dùng 二 (èr): 十二."},
    {h:"不要辣 là “không cay”",b:"Muốn hơi cay thì nói 微辣 (wēi là). Bỏ thứ gì thì dùng 不要 + thứ đó: 不要香菜 (không rau mùi)."},
    {h:"买单 là “tính tiền”",b:"Gọi nhân viên bằng 服务员. Ở miền Nam Trung Quốc còn hay viết 埋单 (máidān), cùng nghĩa."}]},
 { id:"zh-bargain", title:"Mua sắm và mặc cả", scene:"Bạn mặc cả một chiếc áo ở chợ.", partner:"老板",
   lines:[
    {r:"B",t:"老板，这件衣服多少钱？",p:"Lǎobǎn, zhè jiàn yīfu duōshao qián?",v:"Chủ shop ơi, cái áo này bao nhiêu tiền?"},
    {r:"A",t:"一百五十块。",p:"Yìbǎi wǔshí kuài.",v:"150 tệ."},
    {r:"B",t:"太贵了！便宜一点儿吧。",p:"Tài guì le! Piányi yìdiǎnr ba.",v:"Đắt quá! Bớt chút đi."},
    {r:"A",t:"一百二，最低了。",p:"Yìbǎi èr, zuì dī le.",v:"120, giá thấp nhất rồi."},
    {r:"B",t:"一百块，可以吗？",p:"Yìbǎi kuài, kěyǐ ma?",v:"100 tệ được không?",alt:["100块可以吗"]},
    {r:"A",t:"好吧，好吧。",p:"Hǎo ba, hǎo ba.",v:"Thôi được, thôi được."},
    {r:"B",t:"可以用微信支付吗？",p:"Kěyǐ yòng Wēixìn zhīfù ma?",v:"Trả bằng WeChat được không?"},
    {r:"A",t:"可以，扫这里。",p:"Kěyǐ, sǎo zhèlǐ.",v:"Được, quét ở đây."}],
   phrases:[
    {t:"这件衣服多少钱？",p:"Zhè jiàn yīfu duōshao qián?",v:"Cái áo này bao nhiêu tiền?"},
    {t:"太贵了！",p:"Tài guì le!",v:"Đắt quá!"},
    {t:"便宜一点儿吧。",p:"Piányi yìdiǎnr ba.",v:"Bớt chút đi."},
    {t:"可以用微信支付吗？",p:"Kěyǐ yòng Wēixìn zhīfù ma?",v:"Trả bằng WeChat được không?"}],
   notes:[
    {h:"老板 là “chủ shop”",b:"Gọi người bán là 老板 rất tự nhiên, kể cả khi họ không phải chủ."},
    {h:"块 là “đồng” trong văn nói",b:"Viết là 元, nói là 块. 一百二 là cách nói tắt của 一百二十 (120)."},
    {h:"吧 làm câu mềm hơn",b:"便宜一点儿吧 nghe như một lời đề nghị nhẹ nhàng, không gay gắt khi mặc cả."}]},
 { id:"zh-directions", title:"Hỏi đường", scene:"Bạn tìm ga tàu điện ngầm gần nhất.", partner:"路人",
   lines:[
    {r:"B",t:"你好，请问地铁站怎么走？",p:"Nǐ hǎo, qǐngwèn dìtiězhàn zěnme zǒu?",v:"Chào bạn, cho hỏi ga tàu điện ngầm đi thế nào?"},
    {r:"A",t:"一直往前走，到红绿灯往左拐。",p:"Yìzhí wǎng qián zǒu, dào hónglǜdēng wǎng zuǒ guǎi.",v:"Đi thẳng, đến đèn giao thông thì rẽ trái."},
    {r:"B",t:"远不远？",p:"Yuǎn bu yuǎn?",v:"Có xa không?"},
    {r:"A",t:"不远，走路五分钟。",p:"Bù yuǎn, zǒulù wǔ fēnzhōng.",v:"Không xa, đi bộ năm phút."},
    {r:"B",t:"太好了，谢谢你！",p:"Tài hǎo le, xièxie nǐ!",v:"Tốt quá, cảm ơn bạn!"},
    {r:"A",t:"不客气。",p:"Bú kèqi.",v:"Không có gì."}],
   phrases:[
    {t:"请问地铁站怎么走？",p:"Qǐngwèn dìtiězhàn zěnme zǒu?",v:"Cho hỏi ga tàu điện ngầm đi thế nào?"},
    {t:"一直往前走。",p:"Yìzhí wǎng qián zǒu.",v:"Đi thẳng."},
    {t:"往左拐。",p:"Wǎng zuǒ guǎi.",v:"Rẽ trái."},
    {t:"远不远？",p:"Yuǎn bu yuǎn?",v:"Có xa không?"}],
   notes:[
    {h:"请问 là “cho hỏi”",b:"Lời mở đầu lịch sự trước mọi câu hỏi với người lạ."},
    {h:"…怎么走？là “đi đến… thế nào?”",b:"Thay địa điểm vào: 机场怎么走？(sân bay), 酒店怎么走？(khách sạn)."},
    {h:"远不远 là câu hỏi “có… không”",b:"Lặp tính từ với 不 ở giữa là thành câu hỏi, không cần thêm 吗."}]},
 { id:"zh-hotel", title:"Nhận phòng khách sạn", scene:"Bạn nhận phòng đã đặt hai đêm.", partner:"前台",
   lines:[
    {r:"A",t:"您好，有预订吗？",p:"Nín hǎo, yǒu yùdìng ma?",v:"Xin chào, anh/chị có đặt phòng trước không?"},
    {r:"B",t:"有，我叫阮明，订了两个晚上。",p:"Yǒu, wǒ jiào Ruǎn Míng, dìngle liǎng ge wǎnshang.",v:"Có, tôi tên Nguyễn Minh, đặt hai đêm."},
    {r:"A",t:"请给我您的护照。",p:"Qǐng gěi wǒ nín de hùzhào.",v:"Xin cho tôi hộ chiếu của anh/chị."},
    {r:"B",t:"好的。早饭几点开始？",p:"Hǎo de. Zǎofàn jǐ diǎn kāishǐ?",v:"Vâng. Bữa sáng mấy giờ bắt đầu?"},
    {r:"A",t:"早上七点到十点。",p:"Zǎoshang qī diǎn dào shí diǎn.",v:"Từ bảy đến mười giờ sáng."},
    {r:"B",t:"房间有WiFi吗？",p:"Fángjiān yǒu WiFi ma?",v:"Phòng có WiFi không?"},
    {r:"A",t:"有，密码在房卡上。",p:"Yǒu, mìmǎ zài fángkǎ shang.",v:"Có, mật khẩu ở trên thẻ phòng."},
    {r:"B",t:"好的，谢谢！",p:"Hǎo de, xièxie!",v:"Vâng, cảm ơn!"}],
   phrases:[
    {t:"我订了两个晚上。",p:"Wǒ dìngle liǎng ge wǎnshang.",v:"Tôi đã đặt hai đêm."},
    {t:"早饭几点开始？",p:"Zǎofàn jǐ diǎn kāishǐ?",v:"Bữa sáng mấy giờ bắt đầu?"},
    {t:"房间有WiFi吗？",p:"Fángjiān yǒu WiFi ma?",v:"Phòng có WiFi không?"},
    {t:"好的，谢谢！",p:"Hǎo de, xièxie!",v:"Vâng, cảm ơn!"}],
   notes:[
    {h:"您 là “bạn” lịch sự",b:"Nhân viên khách sạn, nhà hàng thường dùng 您 (nín) thay cho 你 khi nói với khách."},
    {h:"了 sau động từ là “đã làm xong”",b:"订了 là đã đặt. 两个晚上 là hai buổi tối, tức hai đêm."},
    {h:"几点 là “mấy giờ”",b:"几 dùng để hỏi số lượng nhỏ. 几点开始？là mấy giờ bắt đầu, 几点结束？là mấy giờ kết thúc."}]},
 { id:"zh-phone", title:"Hẹn gặp qua điện thoại", scene:"Bạn gọi cho Tiểu Lý để rủ đi cà phê.", partner:"小李",
   lines:[
    {r:"A",t:"喂，你好！",p:"Wéi, nǐ hǎo!",v:"A lô, chào bạn!"},
    {r:"B",t:"小李，我是阿明。你这个周六有空吗？",p:"Xiǎo Lǐ, wǒ shì Ā Míng. Nǐ zhège zhōuliù yǒu kòng ma?",v:"Tiểu Lý, mình là A Minh đây. Thứ Bảy này bạn rảnh không?"},
    {r:"A",t:"有空。什么事？",p:"Yǒu kòng. Shénme shì?",v:"Rảnh. Có chuyện gì thế?"},
    {r:"B",t:"我们一起去喝咖啡吧。",p:"Wǒmen yìqǐ qù hē kāfēi ba.",v:"Mình cùng đi uống cà phê nhé."},
    {r:"A",t:"好啊！几点见？",p:"Hǎo a! Jǐ diǎn jiàn?",v:"Được đấy! Mấy giờ gặp?"},
    {r:"B",t:"上午十点，怎么样？",p:"Shàngwǔ shí diǎn, zěnmeyàng?",v:"Mười giờ sáng, được không?",alt:["上午10点怎么样"]},
    {r:"A",t:"没问题。在哪儿见？",p:"Méi wèntí. Zài nǎr jiàn?",v:"Không vấn đề gì. Gặp ở đâu?"},
    {r:"B",t:"在公园旁边的咖啡馆见。",p:"Zài gōngyuán pángbiān de kāfēiguǎn jiàn.",v:"Gặp ở quán cà phê cạnh công viên."},
    {r:"A",t:"好的，周六见！",p:"Hǎo de, zhōuliù jiàn!",v:"Được, thứ Bảy gặp nhé!"}],
   phrases:[
    {t:"你这个周六有空吗？",p:"Nǐ zhège zhōuliù yǒu kòng ma?",v:"Thứ Bảy này bạn rảnh không?"},
    {t:"我们一起去喝咖啡吧。",p:"Wǒmen yìqǐ qù hē kāfēi ba.",v:"Mình cùng đi uống cà phê nhé."},
    {t:"上午十点，怎么样？",p:"Shàngwǔ shí diǎn, zěnmeyàng?",v:"Mười giờ sáng, được không?",alt:["上午10点怎么样"]},
    {t:"在公园旁边的咖啡馆见。",p:"Zài gōngyuán pángbiān de kāfēiguǎn jiàn.",v:"Gặp ở quán cà phê cạnh công viên."}],
   notes:[
    {h:"喂 (wéi) khi nghe điện thoại",b:"Nhấc máy thì nói 喂 hoặc 喂，你好. Khi gọi cho người khác, xưng tên ngay: 我是 + tên."},
    {h:"有空 là “rảnh”",b:"有空吗？là bạn rảnh không. Trả lời: 有空 (rảnh) hoặc 没空 (không rảnh)."},
    {h:"……，怎么样？để đề xuất",b:"Đưa ra ý kiến rồi thêm 怎么样 để hỏi người kia thấy thế nào: 明天去，怎么样？"}]},
 { id:"zh-doctor", title:"Đi khám bệnh", scene:"Bạn bị đau đầu, đau họng và đi khám.", partner:"医生",
   lines:[
    {r:"A",t:"你哪儿不舒服？",p:"Nǐ nǎr bù shūfu?",v:"Bạn thấy khó chịu ở đâu?"},
    {r:"B",t:"我头疼，嗓子也疼。",p:"Wǒ tóu téng, sǎngzi yě téng.",v:"Tôi đau đầu, họng cũng đau."},
    {r:"A",t:"发烧吗？",p:"Fāshāo ma?",v:"Có sốt không?"},
    {r:"B",t:"有一点儿发烧。",p:"Yǒu yìdiǎnr fāshāo.",v:"Hơi sốt một chút."},
    {r:"A",t:"什么时候开始的？",p:"Shénme shíhou kāishǐ de?",v:"Bắt đầu từ khi nào?"},
    {r:"B",t:"昨天早上开始的。",p:"Zuótiān zǎoshang kāishǐ de.",v:"Bắt đầu từ sáng hôm qua."},
    {r:"A",t:"你感冒了。这个药一天吃三次。",p:"Nǐ gǎnmào le. Zhège yào yì tiān chī sān cì.",v:"Bạn bị cảm rồi. Thuốc này ngày uống ba lần."},
    {r:"B",t:"饭后吃吗？",p:"Fàn hòu chī ma?",v:"Uống sau bữa ăn ạ?"},
    {r:"A",t:"对，饭后吃。多喝水，多休息。",p:"Duì, fàn hòu chī. Duō hē shuǐ, duō xiūxi.",v:"Đúng, uống sau bữa ăn. Uống nhiều nước, nghỉ ngơi nhiều."},
    {r:"B",t:"好的，谢谢医生。",p:"Hǎo de, xièxie yīshēng.",v:"Vâng, cảm ơn bác sĩ."}],
   phrases:[
    {t:"我头疼。",p:"Wǒ tóu téng.",v:"Tôi đau đầu."},
    {t:"嗓子也疼。",p:"Sǎngzi yě téng.",v:"Họng cũng đau."},
    {t:"有一点儿发烧。",p:"Yǒu yìdiǎnr fāshāo.",v:"Hơi sốt một chút."},
    {t:"饭后吃吗？",p:"Fàn hòu chī ma?",v:"Uống sau bữa ăn ạ?"}],
   notes:[
    {h:"Bộ phận + 疼 là “đau chỗ đó”",b:"头疼 (đau đầu), 肚子疼 (đau bụng), 牙疼 (đau răng). Hỏi chung: 你哪儿不舒服？"},
    {h:"有一点儿 là “hơi, một chút”",b:"Dùng cho cảm giác không dễ chịu: 有一点儿累 (hơi mệt), 有一点儿贵 (hơi đắt)."},
    {h:"Cách nói liều thuốc",b:"一天吃三次 là ngày uống ba lần. Tiếng Trung dùng 吃 (ăn) cho cả việc uống thuốc."}]},
 { id:"zh-taxi", title:"Đi taxi", scene:"Bạn bắt taxi ra sân bay và đang vội.", partner:"司机",
   lines:[
    {r:"B",t:"师傅，去机场。",p:"Shīfu, qù jīchǎng.",v:"Bác tài, ra sân bay."},
    {r:"A",t:"好的。哪个航站楼？",p:"Hǎo de. Nǎge hángzhànlóu?",v:"Vâng. Nhà ga nào?"},
    {r:"B",t:"二号航站楼。要多长时间？",p:"Èr hào hángzhànlóu. Yào duō cháng shíjiān?",v:"Nhà ga số hai. Mất bao lâu ạ?",alt:["2号航站楼要多长时间"]},
    {r:"A",t:"不堵车的话，半个小时。",p:"Bù dǔchē de huà, bàn ge xiǎoshí.",v:"Nếu không tắc đường thì nửa tiếng."},
    {r:"B",t:"我有点儿急，能开快一点儿吗？",p:"Wǒ yǒudiǎnr jí, néng kāi kuài yìdiǎnr ma?",v:"Tôi hơi vội, bác đi nhanh hơn chút được không?"},
    {r:"A",t:"好，我尽量。",p:"Hǎo, wǒ jǐnliàng.",v:"Được, tôi sẽ cố."},
    {r:"A",t:"到了，一共八十块。",p:"Dào le, yígòng bāshí kuài.",v:"Đến rồi, tổng cộng tám mươi tệ."},
    {r:"B",t:"可以扫码吗？",p:"Kěyǐ sǎomǎ ma?",v:"Quét mã trả tiền được không?"},
    {r:"A",t:"可以。",p:"Kěyǐ.",v:"Được."},
    {r:"B",t:"谢谢师傅！",p:"Xièxie shīfu!",v:"Cảm ơn bác tài!"}],
   phrases:[
    {t:"师傅，去机场。",p:"Shīfu, qù jīchǎng.",v:"Bác tài, ra sân bay."},
    {t:"要多长时间？",p:"Yào duō cháng shíjiān?",v:"Mất bao lâu?"},
    {t:"能开快一点儿吗？",p:"Néng kāi kuài yìdiǎnr ma?",v:"Đi nhanh hơn chút được không?"},
    {t:"可以扫码吗？",p:"Kěyǐ sǎomǎ ma?",v:"Quét mã trả tiền được không?"}],
   notes:[
    {h:"师傅 là cách gọi tài xế",b:"师傅 dùng để gọi người làm nghề có tay nghề: tài xế, thợ sửa xe, đầu bếp. Rất tự nhiên và lịch sự."},
    {h:"不……的话 là “nếu không…”",b:"……的话 đặt sau điều kiện: 下雨的话 (nếu trời mưa), 不堵车的话 (nếu không tắc đường)."},
    {h:"扫码 là quét mã",b:"Ở Trung Quốc hầu như mọi nơi đều trả tiền bằng quét mã WeChat hoặc Alipay."}]},
 { id:"zh-interview", title:"Phỏng vấn xin việc", scene:"Bạn phỏng vấn cho vị trí thực tập.", partner:"面试官",
   lines:[
    {r:"A",t:"请坐。请你先介绍一下自己。",p:"Qǐng zuò. Qǐng nǐ xiān jièshào yíxià zìjǐ.",v:"Mời ngồi. Bạn giới thiệu một chút về bản thân trước nhé."},
    {r:"B",t:"好的。我叫阮明，是大学生。",p:"Hǎo de. Wǒ jiào Ruǎn Míng, shì dàxuéshēng.",v:"Vâng. Tôi tên Nguyễn Minh, là sinh viên đại học."},
    {r:"A",t:"你为什么想来我们公司？",p:"Nǐ wèishénme xiǎng lái wǒmen gōngsī?",v:"Vì sao bạn muốn đến công ty chúng tôi?"},
    {r:"B",t:"我想在专业的团队里学习。",p:"Wǒ xiǎng zài zhuānyè de tuánduì lǐ xuéxí.",v:"Tôi muốn học hỏi trong một đội ngũ chuyên nghiệp."},
    {r:"A",t:"你的优点是什么？",p:"Nǐ de yōudiǎn shì shénme?",v:"Ưu điểm của bạn là gì?"},
    {r:"B",t:"我很努力，学东西也很快。",p:"Wǒ hěn nǔlì, xué dōngxi yě hěn kuài.",v:"Tôi rất chăm chỉ, học cái gì cũng nhanh."},
    {r:"A",t:"你有什么问题吗？",p:"Nǐ yǒu shénme wèntí ma?",v:"Bạn có câu hỏi gì không?"},
    {r:"B",t:"请问，这个工作每天主要做什么？",p:"Qǐngwèn, zhège gōngzuò měitiān zhǔyào zuò shénme?",v:"Cho hỏi, công việc này hằng ngày chủ yếu làm gì ạ?"},
    {r:"A",t:"好问题。下周我们会通知你。",p:"Hǎo wèntí. Xià zhōu wǒmen huì tōngzhī nǐ.",v:"Câu hỏi hay. Tuần sau chúng tôi sẽ báo cho bạn."},
    {r:"B",t:"谢谢您的时间。",p:"Xièxie nín de shíjiān.",v:"Cảm ơn ông/bà đã dành thời gian."}],
   phrases:[
    {t:"我想在专业的团队里学习。",p:"Wǒ xiǎng zài zhuānyè de tuánduì lǐ xuéxí.",v:"Tôi muốn học hỏi trong một đội ngũ chuyên nghiệp."},
    {t:"我很努力，学东西也很快。",p:"Wǒ hěn nǔlì, xué dōngxi yě hěn kuài.",v:"Tôi rất chăm chỉ, học cái gì cũng nhanh."},
    {t:"这个工作每天主要做什么？",p:"Zhège gōngzuò měitiān zhǔyào zuò shénme?",v:"Công việc này hằng ngày chủ yếu làm gì?"},
    {t:"谢谢您的时间。",p:"Xièxie nín de shíjiān.",v:"Cảm ơn ông/bà đã dành thời gian."}],
   notes:[
    {h:"介绍一下 với 一下",b:"Thêm 一下 sau động từ làm câu nhẹ nhàng hơn: 介绍一下 (giới thiệu chút), 等一下 (đợi chút)."},
    {h:"优点 và 缺点",b:"优点 là ưu điểm, 缺点 là nhược điểm. Hai từ này rất hay gặp trong phỏng vấn."},
    {h:"Dùng 您 với người phỏng vấn",b:"Khi cảm ơn hay hỏi người phỏng vấn, dùng 您 (ngài) thay cho 你 để thể hiện sự tôn trọng."}]},
 { id:"zh-hobby", title:"Nói về sở thích", scene:"Bạn trò chuyện với Tiểu Mỹ về chuyện cuối tuần.", partner:"小美",
   lines:[
    {r:"A",t:"你周末一般做什么？",p:"Nǐ zhōumò yìbān zuò shénme?",v:"Cuối tuần bạn thường làm gì?"},
    {r:"B",t:"我一般和朋友打羽毛球。",p:"Wǒ yìbān hé péngyou dǎ yǔmáoqiú.",v:"Mình thường chơi cầu lông với bạn bè."},
    {r:"A",t:"真不错！你多长时间打一次？",p:"Zhēn búcuò! Nǐ duō cháng shíjiān dǎ yí cì?",v:"Hay đấy! Bao lâu bạn chơi một lần?"},
    {r:"B",t:"一个星期两次。你呢？",p:"Yí ge xīngqī liǎng cì. Nǐ ne?",v:"Một tuần hai lần. Còn bạn?"},
    {r:"A",t:"我喜欢看书和做饭。",p:"Wǒ xǐhuan kàn shū hé zuò fàn.",v:"Mình thích đọc sách và nấu ăn."},
    {r:"B",t:"是吗？你会做什么菜？",p:"Shì ma? Nǐ huì zuò shénme cài?",v:"Thật à? Bạn biết nấu món gì?"},
    {r:"A",t:"我会做中国菜，不过做得不太好。",p:"Wǒ huì zuò Zhōngguó cài, búguò zuò de bú tài hǎo.",v:"Mình biết nấu món Trung Quốc, nhưng nấu chưa ngon lắm."},
    {r:"B",t:"下次我想尝尝！",p:"Xià cì wǒ xiǎng chángchang!",v:"Lần sau mình muốn ăn thử!"},
    {r:"A",t:"好啊，下个周末来我家吧！",p:"Hǎo a, xià ge zhōumò lái wǒ jiā ba!",v:"Được thôi, cuối tuần sau đến nhà mình nhé!"}],
   phrases:[
    {t:"你周末一般做什么？",p:"Nǐ zhōumò yìbān zuò shénme?",v:"Cuối tuần bạn thường làm gì?"},
    {t:"我一般和朋友打羽毛球。",p:"Wǒ yìbān hé péngyou dǎ yǔmáoqiú.",v:"Mình thường chơi cầu lông với bạn bè."},
    {t:"一个星期两次。",p:"Yí ge xīngqī liǎng cì.",v:"Một tuần hai lần.",alt:["一个星期2次"]},
    {t:"下次我想尝尝！",p:"Xià cì wǒ xiǎng chángchang!",v:"Lần sau mình muốn ăn thử!"}],
   notes:[
    {h:"一般 là “thường thường”",b:"Đặt trước động từ: 我一般七点起床 (mình thường dậy lúc bảy giờ)."},
    {h:"Hỏi tần suất: 多长时间……一次？",b:"Trả lời theo mẫu: 一个星期两次 (một tuần hai lần), 一个月一次 (một tháng một lần)."},
    {h:"Lặp động từ: 尝尝, 看看, 试试",b:"Lặp lại động từ một âm tiết làm nghĩa nhẹ đi: thử một chút. 尝尝 là nếm thử, 看看 là xem thử."}]},
 { id:"zh-family", title:"Nói về gia đình", scene:"Tiểu Trương hỏi thăm về gia đình bạn.", partner:"小张",
   lines:[
    {r:"A",t:"你家有几口人？",p:"Nǐ jiā yǒu jǐ kǒu rén?",v:"Nhà bạn có mấy người?"},
    {r:"B",t:"我家有五口人：爸爸、妈妈、姐姐、弟弟和我。",p:"Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, jiějie, dìdi hé wǒ.",v:"Nhà mình có năm người: bố, mẹ, chị gái, em trai và mình.",alt:["我家有5口人爸爸妈妈姐姐弟弟和我"]},
    {r:"A",t:"你姐姐做什么工作？",p:"Nǐ jiějie zuò shénme gōngzuò?",v:"Chị bạn làm nghề gì?"},
    {r:"B",t:"她是护士，在河内的医院工作。",p:"Tā shì hùshi, zài Hénèi de yīyuàn gōngzuò.",v:"Chị ấy là y tá, làm ở bệnh viện tại Hà Nội."},
    {r:"A",t:"你弟弟多大了？",p:"Nǐ dìdi duō dà le?",v:"Em trai bạn bao nhiêu tuổi rồi?"},
    {r:"B",t:"他十五岁，还在上高中。",p:"Tā shíwǔ suì, hái zài shàng gāozhōng.",v:"Em ấy mười lăm tuổi, vẫn đang học cấp ba.",alt:["他15岁还在上高中"]},
    {r:"A",t:"你和父母一起住吗？",p:"Nǐ hé fùmǔ yìqǐ zhù ma?",v:"Bạn sống cùng bố mẹ à?"},
    {r:"B",t:"不，我住在学校的宿舍。",p:"Bù, wǒ zhù zài xuéxiào de sùshè.",v:"Không, mình ở ký túc xá của trường."}],
   phrases:[
    {t:"你家有几口人？",p:"Nǐ jiā yǒu jǐ kǒu rén?",v:"Nhà bạn có mấy người?"},
    {t:"我家有五口人。",p:"Wǒ jiā yǒu wǔ kǒu rén.",v:"Nhà mình có năm người.",alt:["我家有5口人"]},
    {t:"她是护士。",p:"Tā shì hùshi.",v:"Chị ấy là y tá."},
    {t:"我住在学校的宿舍。",p:"Wǒ zhù zài xuéxiào de sùshè.",v:"Mình ở ký túc xá của trường."}],
   notes:[
    {h:"几口人 dùng lượng từ 口",b:"Khi đếm người trong gia đình dùng 口: 五口人. Đếm người nói chung thì dùng 个: 五个人."},
    {h:"多大了 là hỏi tuổi",b:"Hỏi người ngang tuổi hoặc nhỏ hơn: 你多大了？ Hỏi trẻ nhỏ: 你几岁了？ Hỏi người lớn tuổi: 您多大年纪了？"},
    {h:"住在 + nơi ở",b:"我住在河内 (mình sống ở Hà Nội). 在 đứng sau 住 để chỉ nơi chốn."}]},
 { id:"zh-routine", title:"Thói quen hằng ngày", scene:"Tiểu Mỹ hỏi về một ngày bình thường của bạn.", partner:"小美",
   lines:[
    {r:"A",t:"你每天几点起床？",p:"Nǐ měitiān jǐ diǎn qǐchuáng?",v:"Mỗi ngày bạn dậy lúc mấy giờ?"},
    {r:"B",t:"我六点半起床。",p:"Wǒ liù diǎn bàn qǐchuáng.",v:"Mình dậy lúc sáu rưỡi.",alt:["我6点半起床"]},
    {r:"A",t:"真早！早上你做什么？",p:"Zhēn zǎo! Zǎoshang nǐ zuò shénme?",v:"Sớm thế! Buổi sáng bạn làm gì?"},
    {r:"B",t:"我洗澡、吃早饭，然后去上课。",p:"Wǒ xǐzǎo, chī zǎofàn, ránhòu qù shàngkè.",v:"Mình tắm, ăn sáng, rồi đi học."},
    {r:"A",t:"你几点下课？",p:"Nǐ jǐ diǎn xiàkè?",v:"Mấy giờ bạn tan học?"},
    {r:"B",t:"下午四点左右。下课以后我去健身房。",p:"Xiàwǔ sì diǎn zuǒyòu. Xiàkè yǐhòu wǒ qù jiànshēnfáng.",v:"Khoảng bốn giờ chiều. Tan học xong mình đi tập gym.",alt:["下午4点左右下课以后我去健身房"]},
    {r:"A",t:"晚上呢？",p:"Wǎnshang ne?",v:"Còn buổi tối?"},
    {r:"B",t:"晚上我做作业，十一点睡觉。",p:"Wǎnshang wǒ zuò zuòyè, shíyī diǎn shuìjiào.",v:"Buổi tối mình làm bài tập, mười một giờ đi ngủ.",alt:["晚上我做作业11点睡觉"]}],
   phrases:[
    {t:"你每天几点起床？",p:"Nǐ měitiān jǐ diǎn qǐchuáng?",v:"Mỗi ngày bạn dậy lúc mấy giờ?"},
    {t:"我六点半起床。",p:"Wǒ liù diǎn bàn qǐchuáng.",v:"Mình dậy lúc sáu rưỡi.",alt:["我6点半起床"]},
    {t:"然后去上课。",p:"Ránhòu qù shàngkè.",v:"Rồi đi học."},
    {t:"我十一点睡觉。",p:"Wǒ shíyī diǎn shuìjiào.",v:"Mình đi ngủ lúc mười một giờ.",alt:["我11点睡觉"]}],
   notes:[
    {h:"Thời gian đứng trước động từ",b:"Khác tiếng Việt: 我六点半起床 (tôi sáu rưỡi dậy). Không nói 我起床六点半."},
    {h:"然后 là “sau đó, rồi”",b:"Dùng để kể các việc theo thứ tự: 先……，然后…… (trước tiên…, sau đó…)."},
    {h:"左右 là “khoảng”",b:"Đặt sau con số: 四点左右 (khoảng bốn giờ), 一百块左右 (khoảng một trăm tệ)."}]},
 { id:"zh-weather", title:"Nói chuyện thời tiết", scene:"Bạn nói chuyện phiếm với đồng nghiệp.", partner:"同事",
   lines:[
    {r:"A",t:"今天真热啊！",p:"Jīntiān zhēn rè a!",v:"Hôm nay nóng thật đấy!"},
    {r:"B",t:"是啊，太热了！明天天气怎么样？",p:"Shì a, tài rè le! Míngtiān tiānqì zěnmeyàng?",v:"Đúng thế, nóng quá! Mai thời tiết thế nào?"},
    {r:"A",t:"听说明天会下雨。",p:"Tīngshuō míngtiān huì xià yǔ.",v:"Nghe nói mai sẽ mưa."},
    {r:"B",t:"真的吗？那我得带伞。",p:"Zhēn de ma? Nà wǒ děi dài sǎn.",v:"Thật à? Vậy mình phải mang ô."},
    {r:"A",t:"你喜欢雨季吗？",p:"Nǐ xǐhuan yǔjì ma?",v:"Bạn có thích mùa mưa không?"},
    {r:"B",t:"不太喜欢。我喜欢凉快的天气。",p:"Bú tài xǐhuan. Wǒ xǐhuan liángkuai de tiānqì.",v:"Không thích lắm. Mình thích thời tiết mát mẻ."},
    {r:"A",t:"我也是。我最喜欢秋天。",p:"Wǒ yě shì. Wǒ zuì xǐhuan qiūtiān.",v:"Mình cũng vậy. Mình thích nhất là mùa thu."},
    {r:"B",t:"我也最喜欢秋天！",p:"Wǒ yě zuì xǐhuan qiūtiān!",v:"Mình cũng thích mùa thu nhất!"}],
   phrases:[
    {t:"明天天气怎么样？",p:"Míngtiān tiānqì zěnmeyàng?",v:"Mai thời tiết thế nào?"},
    {t:"那我得带伞。",p:"Nà wǒ děi dài sǎn.",v:"Vậy mình phải mang ô."},
    {t:"我喜欢凉快的天气。",p:"Wǒ xǐhuan liángkuai de tiānqì.",v:"Mình thích thời tiết mát mẻ."},
    {t:"我也是。",p:"Wǒ yě shì.",v:"Mình cũng vậy."}],
   notes:[
    {h:"天气怎么样？",b:"Câu hỏi thời tiết quen thuộc nhất. Trả lời: 晴天 (nắng), 阴天 (âm u), 下雨 (mưa), 刮风 (có gió)."},
    {h:"会 + động từ để dự đoán",b:"明天会下雨 (mai sẽ mưa). 会 ở đây là khả năng sẽ xảy ra, không phải “biết làm”."},
    {h:"得 (děi) là “phải”",b:"Văn nói hay dùng 得 thay cho 必须: 我得走了 (mình phải đi rồi). Chú ý đọc là děi."}]},
 { id:"zh-return", title:"Đổi trả hàng", scene:"Chiếc áo bạn mua bị chật và có lỗ thủng.", partner:"店员",
   lines:[
    {r:"B",t:"你好，这件衬衫我想退。",p:"Nǐ hǎo, zhè jiàn chènshān wǒ xiǎng tuì.",v:"Chào bạn, chiếc áo sơ mi này tôi muốn trả lại."},
    {r:"A",t:"好的，有什么问题吗？",p:"Hǎo de, yǒu shénme wèntí ma?",v:"Vâng, áo có vấn đề gì ạ?"},
    {r:"B",t:"太小了，而且这里有个洞。",p:"Tài xiǎo le, érqiě zhèlǐ yǒu ge dòng.",v:"Chật quá, mà chỗ này còn bị thủng."},
    {r:"A",t:"真不好意思。小票带了吗？",p:"Zhēn bù hǎoyìsi. Xiǎopiào dài le ma?",v:"Thật xin lỗi. Bạn có mang hóa đơn không?"},
    {r:"B",t:"带了，给你。",p:"Dài le, gěi nǐ.",v:"Có mang, đây ạ."},
    {r:"A",t:"你想退钱还是换一件？",p:"Nǐ xiǎng tuì qián háishi huàn yí jiàn?",v:"Bạn muốn hoàn tiền hay đổi cái khác?"},
    {r:"B",t:"可以换大一号的吗？",p:"Kěyǐ huàn dà yí hào de ma?",v:"Đổi sang cỡ to hơn một số được không?"},
    {r:"A",t:"当然可以。这是中号的。",p:"Dāngrán kěyǐ. Zhè shì zhōng hào de.",v:"Tất nhiên được. Đây là cỡ M."},
    {r:"B",t:"太好了，谢谢！",p:"Tài hǎo le, xièxie!",v:"Tốt quá, cảm ơn!"}],
   phrases:[
    {t:"这件衬衫我想退。",p:"Zhè jiàn chènshān wǒ xiǎng tuì.",v:"Chiếc áo sơ mi này tôi muốn trả lại."},
    {t:"太小了。",p:"Tài xiǎo le.",v:"Chật quá."},
    {t:"带了，给你。",p:"Dài le, gěi nǐ.",v:"Có mang, đây ạ."},
    {t:"可以换大一号的吗？",p:"Kěyǐ huàn dà yí hào de ma?",v:"Đổi sang cỡ to hơn được không?"}],
   notes:[
    {h:"退 và 换",b:"退 là trả hàng (退钱 là hoàn tiền), 换 là đổi sang món khác."},

function pItem(str, lang){
  const eq = str.indexOf("=");
  const left = eq < 0 ? str : str.slice(0, eq), v = eq < 0 ? "" : str.slice(eq+1);
  if(lang === "zh"){ const sp = left.indexOf(" "); return {t:left.slice(0, sp), p:left.slice(sp+1), v}; }
  return {t:left, v};
}
/* Mỗi âm là một bài riêng. pt ghi cặp dễ nhầm nào luyện cho âm nào (số thứ tự âm trong nhóm). */
const PRON_GROUPS = {}, PRON = {};
for(const lang of ["en","zh"]){
  PRON_GROUPS[lang] = PRON_RAW[lang];
  PRON[lang] = [];
  PRON_RAW[lang].forEach(g => {
    const pairs = g.pairs.map(p => p.split("|").map(x => pItem(x, lang)));
    const tags = (g.pt || "").split(" ");
    const gspeak = g.speak.map(x => pItem(x, lang));
    g.sounds.forEach((snd0, k) => {
      const ex = snd0.ex.map(e => pItem(e, lang));
      let mine = pairs.filter((_, n) => (tags[n] || "").includes(String(k)));
      if(mine.length < 3) mine = mine.concat(pairs.filter(p => !mine.includes(p))).slice(0, 4);
      PRON[lang].push({
        id: `${g.id}-${k}`, group: g.id, groupTitle: g.title,
        title: snd0.s, sub: snd0.vn, hz: lang === "zh" ? ex[0] : null,
        sounds: [Object.assign({}, snd0, {ex})],
        mistake: g.mistake, pairs: mine,
        speak: lang === "en" ? ex.concat(gspeak.filter(x => x.t.includes(" "))) : gspeak
      });
    });
  });
}

const POMO_PRESETS = [

];
const POMO_LIMITS = {focus:[5,120], short:[1,30], long:[5,60], rounds:[2,8]};
function pomoMin(m){ return store.pomo.cfg[m]; }
function todayStr(){ const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
store.pomo = Object.assign({mode:"focus", running:false, endAt:0, left:25*60, done:0, cycle:0, day:todayStr(), showCfg:false}, store.pomo || {});
store.pomo.cfg = Object.assign({focus:25, short:5, long:15, rounds:4}, store.pomo.cfg || {});
if(store.pomo.day !== todayStr()){ store.pomo.day = todayStr(); store.pomo.done = 0; }
const Pomo = {
  left(){ const s = store.pomo; return s.running ? Math.max(0, Math.ceil((s.endAt - Date.now())/1000)) : s.left; },
  fmt(sec){ return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0"); },
  start(){ const s = store.pomo; if(s.running) return; s.endAt = Date.now() + s.left*1000; s.running = true; saveStore(); },
  pause(){ const s = store.pomo; if(!s.running) return; s.left = this.left(); s.running = false; saveStore(); },
  setMode(m){ const s = store.pomo; s.mode = m; s.running = false; s.left = pomoMin(m)*60; saveStore(); },
  setCfg(cfg){
    const s = store.pomo, wasFull = !s.running && s.left === pomoMin(s.mode)*60;
    for(const k in cfg){ const [lo,hi] = POMO_LIMITS[k]; const v = Math.round(+cfg[k]); if(!isNaN(v)) s.cfg[k] = Math.min(hi, Math.max(lo, v)); }
    if(wasFull) s.left = pomoMin(s.mode)*60;
    saveStore();
  },
  reset(){ this.setMode(store.pomo.mode); },
  finish(){
    const s = store.pomo;
    if(s.mode === "focus"){
      s.done++; s.cycle++;
      const longBreak = s.cycle % s.cfg.rounds === 0;
      ui.pomoMsg = longBreak ? `Xong ${s.cfg.rounds} lượt rồi! Nghỉ dài ${s.cfg.long} phút nhé.` : `Xong một lượt! Nghỉ ${s.cfg.short} phút nhé.`;
      this.setMode(longBreak ? "long" : "short");
    } else {
      ui.pomoMsg = "Hết giờ nghỉ. Quay lại học thôi!";
      this.setMode("focus");
    }
    this.start();
    this.beep();
    ui.pomoOpen = true;
    render();
  },
  beep(){
    try{
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
      const ctx = new C();
      [0, 0.4, 0.8].forEach(t => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        const at = ctx.currentTime + t;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);
        o.start(at); o.stop(at + 0.32);
      });
    }catch(e){}
  },
  tick(){
    const s = store.pomo;
    if(s.day !== todayStr()){ s.day = todayStr(); s.done = 0; saveStore(); }
    if(s.running && this.left() <= 0){ this.finish(); return; }
    const t = this.fmt(this.left());
    document.querySelectorAll("[data-pomo-time]").forEach(el => { if(el.textContent !== t) el.textContent = t; });
    document.title = s.running ? `${t} · ${POMO_MODES[s.mode].name} · Study for yourself` : "Study for yourself";
  }
};
setInterval(() => Pomo.tick(), 1000);
