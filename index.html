 {id:"zh-w-hr-interview",title:"Phỏng vấn ứng viên",scene:"Bạn là nhân viên nhân sự, phỏng vấn ứng viên cho vị trí kế toán.",partner:"应聘者",ind:"hr",work:true,lines:[{r:"A",t:"早上好，我来参加面试。",p:"Zǎoshang hǎo, wǒ lái cānjiā miànshì.",v:"Chào buổi sáng, tôi đến phỏng vấn."},{r:"B",t:"欢迎，请坐。请先介绍一下自己。",p:"Huānyíng, qǐng zuò. Qǐng xiān jièshào yíxià zìjǐ.",v:"Chào mừng, mời ngồi. Mời bạn giới thiệu bản thân trước."},{r:"A",t:"我两年前金融专业毕业，现在在银行工作。",p:"Wǒ liǎng nián qián jīnróng zhuānyè bìyè, xiànzài zài yínháng gōngzuò.",v:"Tôi tốt nghiệp ngành tài chính hai năm trước, hiện làm ở ngân hàng."},{r:"B",t:"你为什么想换工作？",p:"Nǐ wèishénme xiǎng huàn gōngzuò?",v:"Vì sao bạn muốn đổi việc?"},{r:"A",t:"我想多学习公司会计。",p:"Wǒ xiǎng duō xuéxí gōngsī kuàijì.",v:"Tôi muốn học thêm về kế toán doanh nghiệp."},{r:"B",t:"能说一个你在工作中解决问题的例子吗？",p:"Néng shuō yí ge nǐ zài gōngzuò zhōng jiějué wèntí de lìzi ma?",v:"Bạn kể một ví dụ giải quyết vấn đề trong công việc được không?"},{r:"A",t:"我发现报告里有错误，然后改进了流程。",p:"Wǒ fāxiàn bàogào li yǒu cuòwù, ránhòu gǎijìnle liúchéng.",v:"Tôi phát hiện lỗi trong báo cáo, sau đó cải tiến quy trình."},{r:"B",t:"很好。你希望工资是多少？",p:"Hěn hǎo. Nǐ xīwàng gōngzī shì duōshao?",v:"Tốt lắm. Bạn mong muốn mức lương bao nhiêu?"},{r:"A",t:"每个月八千左右。",p:"Měi ge yuè bāqiān zuǒyòu.",v:"Khoảng tám nghìn mỗi tháng."},{r:"B",t:"谢谢，我们一周内通知你。",p:"Xièxie, wǒmen yì zhōu nèi tōngzhī nǐ.",v:"Cảm ơn, chúng tôi sẽ báo bạn trong vòng một tuần."}],phrases:[{t:"欢迎，请坐。请先介绍一下自己。",p:"Huānyíng, qǐng zuò. Qǐng xiān jièshào yíxià zìjǐ.",v:"Chào mừng, mời ngồi. Mời bạn giới thiệu bản thân trước."},{t:"你为什么想换工作？",p:"Nǐ wèishénme xiǎng huàn gōngzuò?",v:"Vì sao bạn muốn đổi việc?"},{t:"能说一个你在工作中解决问题的例子吗？",p:"Néng shuō yí ge nǐ zài gōngzuò zhōng jiějué wèntí de lìzi ma?",v:"Bạn kể một ví dụ giải quyết vấn đề trong công việc được không?"},{t:"很好。你希望工资是多少？",p:"Hěn hǎo. Nǐ xīwàng gōngzī shì duōshao?",v:"Tốt lắm. Bạn mong muốn mức lương bao nhiêu?"}],notes:[{h:"一下 làm câu mềm hơn",b:"介绍一下 là \"giới thiệu một chút\", nghe nhẹ nhàng hơn chỉ nói 介绍."},{h:"内 là \"trong vòng\"",b:"一周内 là trong vòng một tuần, 三天内 là trong vòng ba ngày."}]},
 {id:"zh-w-hr-meeting",title:"Họp nhóm phân công việc",scene:"Bạn là trưởng nhóm, chia việc cho dự án mới.",partner:"同事",ind:"hr",work:true,lines:[{r:"A",t:"这个星期我们做什么？",p:"Zhège xīngqī wǒmen zuò shénme?",v:"Tuần này mình làm gì?"},{r:"B",t:"星期五以前要完成客户调查。",p:"Xīngqīwǔ yǐqián yào wánchéng kèhù diàochá.",v:"Trước thứ Sáu phải hoàn thành khảo sát khách hàng."},{r:"A",t:"我负责什么？",p:"Wǒ fùzé shénme?",v:"Tôi phụ trách gì?"},{r:"B",t:"你能设计问题吗？小美负责发给客户。",p:"Nǐ néng shèjì wèntí ma? Xiǎo Měi fùzé fā gěi kèhù.",v:"Anh thiết kế câu hỏi được không? Tiểu Mỹ phụ trách gửi cho khách hàng."},{r:"A",t:"可以，什么时候要？",p:"Kěyǐ, shénme shíhou yào?",v:"Được, khi nào cần?"},{r:"B",t:"最好星期三以前，然后我再看一下。",p:"Zuìhǎo xīngqīsān yǐqián, ránhòu wǒ zài kàn yíxià.",v:"Tốt nhất trước thứ Tư, sau đó tôi xem lại."},{r:"A",t:"如果我需要帮忙呢？",p:"Rúguǒ wǒ xūyào bāngmáng ne?",v:"Nếu tôi cần giúp thì sao?"},{r:"B",t:"随时告诉我。星期四我们开个短会。",p:"Suíshí gàosu wǒ. Xīngqīsì wǒmen kāi ge duǎn huì.",v:"Cứ báo tôi bất cứ lúc nào. Thứ Năm mình họp ngắn nhé."},{r:"A",t:"好的。",p:"Hǎo de.",v:"Được."}],phrases:[{t:"星期五以前要完成客户调查。",p:"Xīngqīwǔ yǐqián yào wánchéng kèhù diàochá.",v:"Trước thứ Sáu phải hoàn thành khảo sát khách hàng."},{t:"你能设计问题吗？小美负责发给客户。",p:"Nǐ néng shèjì wèntí ma? Xiǎo Měi fùzé fā gěi kèhù.",v:"Anh thiết kế câu hỏi được không? Tiểu Mỹ phụ trách gửi cho khách hàng."},{t:"最好星期三以前，然后我再看一下。",p:"Zuìhǎo xīngqīsān yǐqián, ránhòu wǒ zài kàn yíxià.",v:"Tốt nhất trước thứ Tư, sau đó tôi xem lại."},{t:"随时告诉我。星期四我们开个短会。",p:"Suíshí gàosu wǒ. Xīngqīsì wǒmen kāi ge duǎn huì.",v:"Cứ báo tôi bất cứ lúc nào. Thứ Năm mình họp ngắn nhé."}],notes:[{h:"负责 là phụ trách",b:"谁负责？ là ai phụ trách. 我负责… là tôi phụ trách…"},{h:"最好 để nói mong muốn mềm",b:"最好星期三以前 là \"tốt nhất trước thứ Tư\", mềm hơn ra lệnh."}]},
 {id:"zh-w-hr-leave",title:"Xin nghỉ phép",scene:"Bạn xin quản lý nghỉ phép vài ngày.",partner:"经理",ind:"hr",work:true,lines:[{r:"A",t:"有什么事吗？",p:"Yǒu shénme shì ma?",v:"Có chuyện gì không?"},{r:"B",t:"经理，我下周想请三天假。",p:"Jīnglǐ, wǒ xià zhōu xiǎng qǐng sān tiān jià.",v:"Anh ơi, tuần sau em muốn xin nghỉ ba ngày."},{r:"A",t:"哪几天？",p:"Nǎ jǐ tiān?",v:"Những ngày nào?"},{r:"B",t:"星期三到星期五。我姐姐结婚。",p:"Xīngqīsān dào xīngqīwǔ. Wǒ jiějie jiéhūn.",v:"Thứ Tư đến thứ Sáu. Chị gái em lấy chồng."},{r:"A",t:"恭喜！你的工作谁来做？",p:"Gōngxǐ! Nǐ de gōngzuò shéi lái zuò?",v:"Chúc mừng! Việc của em ai làm thay?"},{r:"B",t:"小王会帮我回邮件，报告我走以前做完。",p:"Xiǎo Wáng huì bāng wǒ huí yóujiàn, bàogào wǒ zǒu yǐqián zuòwán.",v:"Tiểu Vương sẽ trả lời email giúp em, báo cáo em làm xong trước khi nghỉ."},{r:"A",t:"很好，在系统里提交请假申请吧。",p:"Hěn hǎo, zài xìtǒng li tíjiāo qǐngjià shēnqǐng ba.",v:"Tốt, em gửi đơn xin nghỉ trên hệ thống nhé."},{r:"B",t:"好的，谢谢经理。",p:"Hǎo de, xièxie jīnglǐ.",v:"Vâng, cảm ơn anh."}],phrases:[{t:"经理，我下周想请三天假。",p:"Jīnglǐ, wǒ xià zhōu xiǎng qǐng sān tiān jià.",v:"Anh ơi, tuần sau em muốn xin nghỉ ba ngày."},{t:"星期三到星期五。我姐姐结婚。",p:"Xīngqīsān dào xīngqīwǔ. Wǒ jiějie jiéhūn.",v:"Thứ Tư đến thứ Sáu. Chị gái em lấy chồng."},{t:"小王会帮我回邮件，报告我走以前做完。",p:"Xiǎo Wáng huì bāng wǒ huí yóujiàn, bàogào wǒ zǒu yǐqián zuòwán.",v:"Tiểu Vương sẽ trả lời email giúp em, báo cáo em làm xong trước khi nghỉ."},{t:"好的，谢谢经理。",p:"Hǎo de, xièxie jīnglǐ.",v:"Vâng, cảm ơn anh."}],notes:[{h:"请假 là xin nghỉ",b:"请三天假: 假 tách khỏi 请 và số ngày nằm giữa. 请病假 là xin nghỉ ốm."},{h:"谁来做？",b:"Hỏi \"ai sẽ làm\" khi phân công. 来 ở đây chỉ việc đảm nhận."}]},
 {id:"zh-w-it-standup",title:"Họp nhanh đầu ngày",scene:"Nhóm phần mềm họp nhanh mỗi sáng. Bạn là lập trình viên.",partner:"组长",ind:"it",work:true,lines:[{r:"A",t:"大家早，开始站会吧。小林？",p:"Dàjiā zǎo, kāishǐ zhànhuì ba. Xiǎo Lín?",v:"Chào cả nhóm, bắt đầu họp đứng nhé. Tiểu Lâm?"},{r:"B",t:"昨天我做完了登录页面。",p:"Zuótiān wǒ zuòwánle dēnglù yèmiàn.",v:"Hôm qua em làm xong trang đăng nhập."},{r:"A",t:"好，今天做什么？",p:"Hǎo, jīntiān zuò shénme?",v:"Được, hôm nay làm gì?"},{r:"B",t:"今天我要把它连到数据库。",p:"Jīntiān wǒ yào bǎ tā lián dào shùjùkù.",v:"Hôm nay em sẽ kết nối nó với cơ sở dữ liệu."},{r:"A",t:"有什么问题吗？",p:"Yǒu shénme wèntí ma?",v:"Có vướng gì không?"},{r:"B",t:"有，我还没有测试服务器的权限。",p:"Yǒu, wǒ hái méiyǒu cèshì fúwùqì de quánxiàn.",v:"Có ạ, em chưa có quyền vào máy chủ thử nghiệm."},{r:"A",t:"我上午让管理员给你开权限。",p:"Wǒ shàngwǔ ràng guǎnlǐyuán gěi nǐ kāi quánxiàn.",v:"Sáng nay anh bảo quản trị cấp quyền cho em."},{r:"B",t:"谢谢，那我明天可以部署到测试环境。",p:"Xièxie, nà wǒ míngtiān kěyǐ bùshǔ dào cèshì huánjìng.",v:"Cảm ơn anh, vậy mai em có thể triển khai lên môi trường thử nghiệm."}],phrases:[{t:"昨天我做完了登录页面。",p:"Zuótiān wǒ zuòwánle dēnglù yèmiàn.",v:"Hôm qua em làm xong trang đăng nhập."},{t:"今天我要把它连到数据库。",p:"Jīntiān wǒ yào bǎ tā lián dào shùjùkù.",v:"Hôm nay em sẽ kết nối nó với cơ sở dữ liệu."},{t:"有，我还没有测试服务器的权限。",p:"Yǒu, wǒ hái méiyǒu cèshì fúwùqì de quánxiàn.",v:"Có ạ, em chưa có quyền vào máy chủ thử nghiệm."},{t:"谢谢，那我明天可以部署到测试环境。",p:"Xièxie, nà wǒ míngtiān kěyǐ bùshǔ dào cèshì huánjìng.",v:"Cảm ơn anh, vậy mai em có thể triển khai lên môi trường thử nghiệm."}],notes:[{h:"Ba ý trong buổi họp đứng",b:"昨天做了什么 (hôm qua làm gì), 今天要做什么 (hôm nay làm gì), 有什么问题 (có vướng gì)."},{h:"把 + đồ vật + động từ",b:"把它连到数据库 là \"đem nó nối vào cơ sở dữ liệu\". 把 đưa tân ngữ lên trước động từ."}]},
 {id:"zh-w-it-support",title:"Hỗ trợ kỹ thuật",scene:"Một đồng nghiệp gọi vì không vào được email. Bạn ở bộ phận IT.",partner:"同事",ind:"it",work:true,lines:[{r:"A",t:"你好，我的邮箱登录不了。",p:"Nǐ hǎo, wǒ de yóuxiāng dēnglù bù liǎo.",v:"Chào anh, em không đăng nhập được hộp thư."},{r:"B",t:"好，屏幕上显示什么错误？",p:"Hǎo, píngmù shang xiǎnshì shénme cuòwù?",v:"Được, trên màn hình báo lỗi gì?"},{r:"A",t:"说密码不对。",p:"Shuō mìmǎ bú duì.",v:"Báo mật khẩu sai."},{r:"B",t:"你最近改过密码吗？",p:"Nǐ zuìjìn gǎiguo mìmǎ ma?",v:"Gần đây em có đổi mật khẩu không?"},{r:"A",t:"改过，昨天改的。",p:"Gǎiguo, zuótiān gǎi de.",v:"Có, hôm qua em đổi."},{r:"B",t:"请重启电脑，再试一下新密码。",p:"Qǐng chóngqǐ diànnǎo, zài shì yíxià xīn mìmǎ.",v:"Em khởi động lại máy tính rồi thử lại mật khẩu mới nhé."},{r:"A",t:"还是不行。",p:"Háishi bù xíng.",v:"Vẫn không được."},{r:"B",t:"好，我帮你重置。请看手机上的验证码。",p:"Hǎo, wǒ bāng nǐ chóngzhì. Qǐng kàn shǒujī shang de yànzhèngmǎ.",v:"Được, anh đặt lại cho em. Em xem mã xác minh trên điện thoại."},{r:"A",t:"收到了，现在可以了，谢谢！",p:"Shōudào le, xiànzài kěyǐ le, xièxie!",v:"Nhận được rồi, giờ được rồi, cảm ơn anh!"}],phrases:[{t:"好，屏幕上显示什么错误？",p:"Hǎo, píngmù shang xiǎnshì shénme cuòwù?",v:"Được, trên màn hình báo lỗi gì?"},{t:"你最近改过密码吗？",p:"Nǐ zuìjìn gǎiguo mìmǎ ma?",v:"Gần đây em có đổi mật khẩu không?"},{t:"请重启电脑，再试一下新密码。",p:"Qǐng chóngqǐ diànnǎo, zài shì yíxià xīn mìmǎ.",v:"Em khởi động lại máy tính rồi thử lại mật khẩu mới nhé."},{t:"好，我帮你重置。请看手机上的验证码。",p:"Hǎo, wǒ bāng nǐ chóngzhì. Qǐng kàn shǒujī shang de yànzhèngmǎ.",v:"Được, anh đặt lại cho em. Em xem mã xác minh trên điện thoại."}],notes:[{h:"Động từ + 不了",b:"登录不了 là không đăng nhập được. Mẫu này dùng nhiều khi báo lỗi: 打不开 (không mở được)."},{h:"还是不行",b:"\"Vẫn không được\". 还是 là vẫn, 不行 là không được."}]},
 {id:"zh-w-it-require",title:"Trao đổi yêu cầu với khách hàng",scene:"Bạn là trưởng dự án, hỏi khách hàng về yêu cầu cho ứng dụng.",partner:"客户",ind:"it",work:true,lines:[{r:"A",t:"我们想做一个让客户预约的应用。",p:"Wǒmen xiǎng zuò yí ge ràng kèhù yùyuē de yìngyòng.",v:"Chúng tôi muốn làm một ứng dụng để khách đặt lịch hẹn."},{r:"B",t:"好的。谁用这个应用？用什么设备？",p:"Hǎo de. Shéi yòng zhège yìngyòng? Yòng shénme shèbèi?",v:"Vâng. Ai dùng ứng dụng này? Dùng thiết bị gì?"},{r:"A",t:"我们的客户，主要用手机。",p:"Wǒmen de kèhù, zhǔyào yòng shǒujī.",v:"Khách hàng của chúng tôi, chủ yếu dùng điện thoại."},{r:"B",t:"需要在应用里在线支付吗？",p:"Xūyào zài yìngyòng li zàixiàn zhīfù ma?",v:"Có cần thanh toán trực tuyến trong ứng dụng không?"},{r:"A",t:"需要，不过可以以后再做。",p:"Xūyào, búguò kěyǐ yǐhòu zài zuò.",v:"Cần, nhưng để sau làm cũng được."},{r:"B",t:"好。第一个版本我们先做预约和提醒。",p:"Hǎo. Dì yī ge bǎnběn wǒmen xiān zuò yùyuē hé tíxǐng.",v:"Vâng. Phiên bản đầu bên em làm đặt lịch và nhắc lịch trước."},{r:"A",t:"要多长时间？",p:"Yào duō cháng shíjiān?",v:"Mất bao lâu?"},{r:"B",t:"大概三个月。这个星期我发给您时间表和报价。",p:"Dàgài sān ge yuè. Zhège xīngqī wǒ fā gěi nín shíjiānbiǎo hé bàojià.",v:"Khoảng ba tháng. Tuần này em gửi anh lịch trình và báo giá."}],phrases:[{t:"好的。谁用这个应用？用什么设备？",p:"Hǎo de. Shéi yòng zhège yìngyòng? Yòng shénme shèbèi?",v:"Vâng. Ai dùng ứng dụng này? Dùng thiết bị gì?"},{t:"需要在应用里在线支付吗？",p:"Xūyào zài yìngyòng li zàixiàn zhīfù ma?",v:"Có cần thanh toán trực tuyến trong ứng dụng không?"},{t:"好。第一个版本我们先做预约和提醒。",p:"Hǎo. Dì yī ge bǎnběn wǒmen xiān zuò yùyuē hé tíxǐng.",v:"Vâng. Phiên bản đầu bên em làm đặt lịch và nhắc lịch trước."},{t:"大概三个月。这个星期我发给您时间表和报价。",p:"Dàgài sān ge yuè. Zhège xīngqī wǒ fā gěi nín shíjiānbiǎo hé bàojià.",v:"Khoảng ba tháng. Tuần này em gửi anh lịch trình và báo giá."}],notes:[{h:"先…再…",b:"先做预约，以后再做支付: làm đặt lịch trước, thanh toán sau. Cách chia việc theo giai đoạn."},{h:"让 + người + làm gì",b:"让客户预约 là để khách hàng đặt lịch."}]},
 {id:"zh-w-hosp-checkin",title:"Lễ tân nhận phòng",scene:"Bạn là lễ tân khách sạn, làm thủ tục nhận phòng cho khách.",partner:"客人",ind:"hosp",work:true,lines:[{r:"A",t:"你好，我预订了房间，我姓陈。",p:"Nǐ hǎo, wǒ yùdìngle fángjiān, wǒ xìng Chén.",v:"Chào bạn, tôi đã đặt phòng, tôi họ Trần."},{r:"B",t:"欢迎光临！请出示一下您的护照。",p:"Huānyíng guānglín! Qǐng chūshì yíxià nín de hùzhào.",v:"Chào mừng quý khách! Xin cho xem hộ chiếu của anh."},{r:"A",t:"给你。",p:"Gěi nǐ.",v:"Đây."},{r:"B",t:"谢谢。您住三个晚上，双人间。",p:"Xièxie. Nín zhù sān ge wǎnshang, shuāngrénjiān.",v:"Cảm ơn. Anh ở ba đêm, phòng đôi."},{r:"A",t:"对。早饭几点？",p:"Duì. Zǎofàn jǐ diǎn?",v:"Đúng. Bữa sáng mấy giờ?"},{r:"B",t:"早上六点半到十点，在二楼。",p:"Zǎoshang liù diǎn bàn dào shí diǎn, zài èr lóu.",v:"Sáu rưỡi đến mười giờ sáng, ở tầng hai."},{r:"A",t:"WiFi密码是多少？",p:"WiFi mìmǎ shì duōshao?",v:"Mật khẩu WiFi là gì?"},{r:"B",t:"在房卡上。您的房间是五一二，祝您入住愉快！",p:"Zài fángkǎ shang. Nín de fángjiān shì wǔ yāo èr, zhù nín rùzhù yúkuài!",v:"Ở trên thẻ phòng. Phòng của anh là 512, chúc anh lưu trú vui vẻ!"}],phrases:[{t:"欢迎光临！请出示一下您的护照。",p:"Huānyíng guānglín! Qǐng chūshì yíxià nín de hùzhào.",v:"Chào mừng quý khách! Xin cho xem hộ chiếu của anh."},{t:"谢谢。您住三个晚上，双人间。",p:"Xièxie. Nín zhù sān ge wǎnshang, shuāngrénjiān.",v:"Cảm ơn. Anh ở ba đêm, phòng đôi."},{t:"早上六点半到十点，在二楼。",p:"Zǎoshang liù diǎn bàn dào shí diǎn, zài èr lóu.",v:"Sáu rưỡi đến mười giờ sáng, ở tầng hai."},{t:"在房卡上。您的房间是五一二，祝您入住愉快！",p:"Zài fángkǎ shang. Nín de fángjiān shì wǔ yāo èr, zhù nín rùzhù yúkuài!",v:"Ở trên thẻ phòng. Phòng của anh là 512, chúc anh lưu trú vui vẻ!"}],notes:[{h:"一 đọc là yāo trong số phòng",b:"Khi đọc số phòng, số điện thoại, 一 thường đọc là yāo để không nhầm với 七."},{h:"出示 là xuất trình",b:"Lễ tân dùng 请出示… (xin xuất trình…) thay cho 给我 cho lịch sự."}]},
 {id:"zh-w-hosp-order",title:"Phục vụ gọi món",scene:"Bạn là phục vụ nhà hàng, nhận gọi món từ khách.",partner:"客人",ind:"hosp",work:true,lines:[{r:"A",t:"服务员，看一下菜单。",p:"Fúwùyuán, kàn yíxià càidān.",v:"Em ơi, cho xem thực đơn."},{r:"B",t:"好的，给您。先喝点儿什么？",p:"Hǎo de, gěi nín. Xiān hē diǎnr shénme?",v:"Vâng, đây ạ. Anh chị uống gì trước không?"},{r:"A",t:"两杯冰茶。你推荐什么菜？",p:"Liǎng bēi bīngchá. Nǐ tuījiàn shénme cài?",v:"Hai cốc trà đá. Em gợi ý món gì?"},{r:"B",t:"我们的烤鱼很受欢迎，配米饭和沙拉。",p:"Wǒmen de kǎoyú hěn shòu huānyíng, pèi mǐfàn hé shālā.",v:"Cá nướng bên em rất được ưa chuộng, ăn kèm cơm và salad."},{r:"A",t:"辣不辣？",p:"Là bu là?",v:"Có cay không?"},{r:"B",t:"有一点儿辣，不要辣也可以。",p:"Yǒu yìdiǎnr là, bú yào là yě kěyǐ.",v:"Hơi cay ạ, không lấy cay cũng được."},{r:"A",t:"不要辣。再要一碗牛肉面。",p:"Bú yào là. Zài yào yì wǎn niúròumiàn.",v:"Không cay. Thêm một bát mì bò."},{r:"B",t:"一份烤鱼不要辣，一碗牛肉面，两杯冰茶。",p:"Yí fèn kǎoyú bú yào là, yì wǎn niúròumiàn, liǎng bēi bīngchá.",v:"Một phần cá nướng không cay, một bát mì bò, hai trà đá."},{r:"A",t:"对。",p:"Duì.",v:"Đúng."}],phrases:[{t:"好的，给您。先喝点儿什么？",p:"Hǎo de, gěi nín. Xiān hē diǎnr shénme?",v:"Vâng, đây ạ. Anh chị uống gì trước không?"},{t:"我们的烤鱼很受欢迎，配米饭和沙拉。",p:"Wǒmen de kǎoyú hěn shòu huānyíng, pèi mǐfàn hé shālā.",v:"Cá nướng bên em rất được ưa chuộng, ăn kèm cơm và salad."},{t:"有一点儿辣，不要辣也可以。",p:"Yǒu yìdiǎnr là, bú yào là yě kěyǐ.",v:"Hơi cay ạ, không lấy cay cũng được."},{t:"一份烤鱼不要辣，一碗牛肉面，两杯冰茶。",p:"Yí fèn kǎoyú bú yào là, yì wǎn niúròumiàn, liǎng bēi bīngchá.",v:"Một phần cá nướng không cay, một bát mì bò, hai trà đá."}],notes:[{h:"受欢迎 là được ưa chuộng",b:"很受欢迎 là rất được yêu thích, phục vụ hay dùng khi gợi ý món."},{h:"Đọc lại món",b:"Phục vụ luôn đọc lại món để tránh nhầm. 份 là lượng từ cho một suất ăn."}]},
 {id:"zh-w-hosp-tour",title:"Hướng dẫn viên du lịch",scene:"Bạn là hướng dẫn viên, giới thiệu lịch trình tour phố cổ.",partner:"游客",ind:"hosp",work:true,lines:[{r:"A",t:"早上好！今天怎么安排？",p:"Zǎoshang hǎo! Jīntiān zěnme ānpái?",v:"Chào buổi sáng! Hôm nay sắp xếp thế nào?"},{r:"B",t:"早上好！今天我们在老城区走三个小时左右。",p:"Zǎoshang hǎo! Jīntiān wǒmen zài lǎo chéngqū zǒu sān ge xiǎoshí zuǒyòu.",v:"Chào buổi sáng! Hôm nay mình đi bộ trong khu phố cổ khoảng ba tiếng."},{r:"A",t:"能看到什么？",p:"Néng kàndào shénme?",v:"Có thể xem gì?"},{r:"B",t:"先去还剑湖，然后去一座古庙和一个市场。",p:"Xiān qù Huánjiàn Hú, ránhòu qù yí zuò gǔ miào hé yí ge shìchǎng.",v:"Đầu tiên đến hồ Hoàn Kiếm, sau đó đến một ngôi đền cổ và một khu chợ."},{r:"A",t:"能吃当地小吃吗？",p:"Néng chī dāngdì xiǎochī ma?",v:"Có được ăn đồ ăn vặt địa phương không?"},{r:"B",t:"能！我们会喝鸡蛋咖啡，吃春卷。",p:"Néng! Wǒmen huì hē jīdàn kāfēi, chī chūnjuǎn.",v:"Được! Mình sẽ uống cà phê trứng và ăn nem."},{r:"A",t:"在这儿过马路安全吗？",p:"Zài zhèr guò mǎlù ānquán ma?",v:"Qua đường ở đây có an toàn không?"},{r:"B",t:"慢慢走，不要停，摩托车会绕过您。",p:"Mànmàn zǒu, bú yào tíng, mótuōchē huì ràoguò nín.",v:"Đi chậm thôi, đừng dừng lại, xe máy sẽ đi vòng qua."},{r:"A",t:"好主意！走吧。",p:"Hǎo zhǔyi! Zǒu ba.",v:"Ý hay! Đi thôi."}],phrases:[{t:"早上好！今天我们在老城区走三个小时左右。",p:"Zǎoshang hǎo! Jīntiān wǒmen zài lǎo chéngqū zǒu sān ge xiǎoshí zuǒyòu.",v:"Chào buổi sáng! Hôm nay mình đi bộ trong khu phố cổ khoảng ba tiếng."},{t:"先去还剑湖，然后去一座古庙和一个市场。",p:"Xiān qù Huánjiàn Hú, ránhòu qù yí zuò gǔ miào hé yí ge shìchǎng.",v:"Đầu tiên đến hồ Hoàn Kiếm, sau đó đến một ngôi đền cổ và một khu chợ."},{t:"能！我们会喝鸡蛋咖啡，吃春卷。",p:"Néng! Wǒmen huì hē jīdàn kāfēi, chī chūnjuǎn.",v:"Được! Mình sẽ uống cà phê trứng và ăn nem."},{t:"慢慢走，不要停，摩托车会绕过您。",p:"Mànmàn zǒu, bú yào tíng, mótuōchē huì ràoguò nín.",v:"Đi chậm thôi, đừng dừng lại, xe máy sẽ đi vòng qua."}],notes:[{h:"先…然后…",b:"Giới thiệu lịch trình theo thứ tự: 先 (trước tiên), 然后 (sau đó), 最后 (cuối cùng)."},{h:"座 là lượng từ cho công trình",b:"一座庙 (một ngôi đền), 一座山 (một ngọn núi), 一座桥 (một cây cầu)."}]},
 {id:"zh-w-med-nurse",title:"Tiếp nhận bệnh nhân",scene:"Bạn là điều dưỡng, hỏi thông tin bệnh nhân mới đến.",partner:"病人",ind:"med",work:true,lines:[{r:"A",t:"你好，我约了李医生。",p:"Nǐ hǎo, wǒ yuēle Lǐ yīshēng.",v:"Xin chào, tôi có hẹn với bác sĩ Lý."},{r:"B",t:"您好，请告诉我您的姓名和出生日期。",p:"Nín hǎo, qǐng gàosu wǒ nín de xìngmíng hé chūshēng rìqī.",v:"Chào anh, cho tôi biết họ tên và ngày sinh."},{r:"A",t:"王大明，一九九零年五月三号。",p:"Wáng Dàmíng, yī jiǔ jiǔ líng nián wǔyuè sān hào.",v:"Vương Đại Minh, ngày 3 tháng 5 năm 1990."},{r:"B",t:"谢谢。您今天哪里不舒服？",p:"Xièxie. Nín jīntiān nǎli bù shūfu?",v:"Cảm ơn. Hôm nay anh thấy khó chịu ở đâu?"},{r:"A",t:"我咳嗽一个星期了。",p:"Wǒ késou yí ge xīngqī le.",v:"Tôi ho một tuần nay rồi."},{r:"B",t:"您对什么药过敏吗？",p:"Nín duì shénme yào guòmǐn ma?",v:"Anh có dị ứng với thuốc nào không?"},{r:"A",t:"我对青霉素过敏。",p:"Wǒ duì qīngméisù guòmǐn.",v:"Tôi dị ứng penicillin."},{r:"B",t:"好，我记下来。我先给您量一下体温和血压。",p:"Hǎo, wǒ jì xiàlai. Wǒ xiān gěi nín liáng yíxià tǐwēn hé xuèyā.",v:"Vâng, tôi ghi lại. Để tôi đo nhiệt độ và huyết áp cho anh trước."}],phrases:[{t:"您好，请告诉我您的姓名和出生日期。",p:"Nín hǎo, qǐng gàosu wǒ nín de xìngmíng hé chūshēng rìqī.",v:"Chào anh, cho tôi biết họ tên và ngày sinh."},{t:"谢谢。您今天哪里不舒服？",p:"Xièxie. Nín jīntiān nǎli bù shūfu?",v:"Cảm ơn. Hôm nay anh thấy khó chịu ở đâu?"},{t:"您对什么药过敏吗？",p:"Nín duì shénme yào guòmǐn ma?",v:"Anh có dị ứng với thuốc nào không?"},{t:"好，我记下来。我先给您量一下体温和血压。",p:"Hǎo, wǒ jì xiàlai. Wǒ xiān gěi nín liáng yíxià tǐwēn hé xuèyā.",v:"Vâng, tôi ghi lại. Để tôi đo nhiệt độ và huyết áp cho anh trước."}],notes:[{h:"哪里不舒服？",b:"Câu hỏi tự nhiên, lịch sự để hỏi bệnh nhân khó chịu ở đâu."},{h:"对…过敏",b:"Cấu trúc dị ứng: 对 + thứ gây dị ứng + 过敏. 我对海鲜过敏 là tôi dị ứng hải sản."}]},
 {id:"zh-w-med-doctor",title:"Bác sĩ khám và dặn dò",scene:"Bạn là bác sĩ, khám và dặn dò bệnh nhân bị viêm họng.",partner:"病人",ind:"med",work:true,lines:[{r:"A",t:"医生，我嗓子很疼。",p:"Yīshēng, wǒ sǎngzi hěn téng.",v:"Bác sĩ ơi, họng tôi đau lắm."},{r:"B",t:"我看一下，张开嘴，说\"啊\"。",p:"Wǒ kàn yíxià, zhāngkāi zuǐ, shuō \"a\".",v:"Để tôi xem, há miệng ra, nói \"a\"."},{r:"A",t:"啊。",p:"A.",v:"A."},{r:"B",t:"嗓子又红又肿，是咽炎。",p:"Sǎngzi yòu hóng yòu zhǒng, shì yānyán.",v:"Họng vừa đỏ vừa sưng, là viêm họng."},{r:"A",t:"严重吗？",p:"Yánzhòng ma?",v:"Có nghiêm trọng không?"},{r:"B",t:"不严重。我给您开一些消炎药。",p:"Bù yánzhòng. Wǒ gěi nín kāi yìxiē xiāoyányào.",v:"Không nghiêm trọng. Tôi kê cho anh ít thuốc kháng viêm."},{r:"A",t:"怎么吃？",p:"Zěnme chī?",v:"Uống thế nào?"},{r:"B",t:"一天三次，一次一片，饭后吃，吃七天。",p:"Yì tiān sān cì, yí cì yí piàn, fàn hòu chī, chī qī tiān.",v:"Ngày ba lần, mỗi lần một viên, uống sau ăn, uống bảy ngày."},{r:"A",t:"谢谢医生。",p:"Xièxie yīshēng.",v:"Cảm ơn bác sĩ."},{r:"B",t:"多喝水，三天还不好的话再来。",p:"Duō hē shuǐ, sān tiān hái bù hǎo dehuà zài lái.",v:"Uống nhiều nước, ba ngày chưa đỡ thì quay lại."}],phrases:[{t:"我看一下，张开嘴，说\"啊\"。",p:"Wǒ kàn yíxià, zhāngkāi zuǐ, shuō \"a\".",v:"Để tôi xem, há miệng ra, nói \"a\"."},{t:"嗓子又红又肿，是咽炎。",p:"Sǎngzi yòu hóng yòu zhǒng, shì yānyán.",v:"Họng vừa đỏ vừa sưng, là viêm họng."},{t:"一天三次，一次一片，饭后吃，吃七天。",p:"Yì tiān sān cì, yí cì yí piàn, fàn hòu chī, chī qī tiān.",v:"Ngày ba lần, mỗi lần một viên, uống sau ăn, uống bảy ngày."},{t:"多喝水，三天还不好的话再来。",p:"Duō hē shuǐ, sān tiān hái bù hǎo dehuà zài lái.",v:"Uống nhiều nước, ba ngày chưa đỡ thì quay lại."}],notes:[{h:"又…又…",b:"嗓子又红又肿 là vừa đỏ vừa sưng. Dùng để nói hai đặc điểm cùng lúc."},{h:"开药 là kê thuốc",b:"Động từ 开 dùng cho kê đơn: 开药, 开处方."}]},
 {id:"zh-w-med-pharmacy",title:"Tư vấn tại nhà thuốc",scene:"Bạn là dược sĩ, tư vấn thuốc cho khách bị cảm.",partner:"顾客",ind:"med",work:true,lines:[{r:"A",t:"你好，我感冒了，吃什么药好？",p:"Nǐ hǎo, wǒ gǎnmào le, chī shénme yào hǎo?",v:"Chào chị, tôi bị cảm, uống thuốc gì thì tốt?"},{r:"B",t:"您发烧吗？嗓子疼吗？",p:"Nín fāshāo ma? Sǎngzi téng ma?",v:"Anh có sốt không? Có đau họng không?"},{r:"A",t:"嗓子疼，流鼻涕，不发烧。",p:"Sǎngzi téng, liú bítì, bù fāshāo.",v:"Đau họng, sổ mũi, không sốt."},{r:"B",t:"我推荐这个含片和这个感冒药。",p:"Wǒ tuījiàn zhège hánpiàn hé zhège gǎnmàoyào.",v:"Tôi gợi ý viên ngậm này và thuốc cảm này."},{r:"A",t:"吃了会困吗？",p:"Chīle huì kùn ma?",v:"Uống vào có buồn ngủ không?"},{r:"B",t:"可能会，吃药以后不要开车。",p:"Kěnéng huì, chī yào yǐhòu bú yào kāichē.",v:"Có thể có, uống thuốc xong đừng lái xe."},{r:"A",t:"一天吃几片？",p:"Yì tiān chī jǐ piàn?",v:"Một ngày uống mấy viên?"},{r:"B",t:"一天不超过四片。如果更严重了，请去看医生。",p:"Yì tiān bù chāoguò sì piàn. Rúguǒ gèng yánzhòng le, qǐng qù kàn yīshēng.",v:"Một ngày không quá bốn viên. Nếu nặng hơn, anh nên đi khám bác sĩ."},{r:"A",t:"谢谢，多少钱？",p:"Xièxie, duōshao qián?",v:"Cảm ơn, bao nhiêu tiền?"}],phrases:[{t:"您发烧吗？嗓子疼吗？",p:"Nín fāshāo ma? Sǎngzi téng ma?",v:"Anh có sốt không? Có đau họng không?"},{t:"我推荐这个含片和这个感冒药。",p:"Wǒ tuījiàn zhège hánpiàn hé zhège gǎnmàoyào.",v:"Tôi gợi ý viên ngậm này và thuốc cảm này."},{t:"可能会，吃药以后不要开车。",p:"Kěnéng huì, chī yào yǐhòu bú yào kāichē.",v:"Có thể có, uống thuốc xong đừng lái xe."},{t:"一天不超过四片。如果更严重了，请去看医生。",p:"Yì tiān bù chāoguò sì piàn. Rúguǒ gèng yánzhòng le, qǐng qù kàn yīshēng.",v:"Một ngày không quá bốn viên. Nếu nặng hơn, anh nên đi khám bác sĩ."}],notes:[{h:"不超过 là không vượt quá",b:"一天不超过四片 là liều tối đa, dược sĩ luôn nói rõ."},{h:"会 chỉ khả năng xảy ra",b:"吃了会困吗？ là uống vào có bị buồn ngủ không. 可能会 là có thể sẽ."}]},
 {id:"zh-w-ins-sell",title:"Tư vấn bảo hiểm sức khỏe",scene:"Một khách hàng muốn mua bảo hiểm sức khỏe cho gia đình. Bạn là tư vấn viên.",partner:"客户",ind:"ins",work:true,lines:[{r:"A",t:"我想给家人买健康保险。",p:"Wǒ xiǎng gěi jiārén mǎi jiànkāng bǎoxiǎn.",v:"Tôi muốn mua bảo hiểm sức khỏe cho gia đình."},{r:"B",t:"好的。您想给几个人买？",p:"Hǎo de. Nín xiǎng gěi jǐ ge rén mǎi?",v:"Vâng. Anh muốn mua cho mấy người?"},{r:"A",t:"四个人，我、我太太和两个孩子。",p:"Sì ge rén, wǒ, wǒ tàitai hé liǎng ge háizi.",v:"Bốn người, tôi, vợ tôi và hai con."},{r:"B",t:"我们的家庭险包括住院、手术和看医生。",p:"Wǒmen de jiātíngxiǎn bāokuò zhùyuàn, shǒushù hé kàn yīshēng.",v:"Bảo hiểm gia đình bên em bao gồm nằm viện, phẫu thuật và khám bác sĩ."},{r:"A",t:"保费是多少？",p:"Bǎofèi shì duōshao?",v:"Phí bảo hiểm bao nhiêu?"},{r:"B",t:"四个人每个月大概一千五百块。",p:"Sì ge rén měi ge yuè dàgài yìqiān wǔbǎi kuài.",v:"Bốn người mỗi tháng khoảng một nghìn rưỡi tệ."},{r:"A",t:"有等待期吗？",p:"Yǒu děngdàiqī ma?",v:"Có thời gian chờ không?"},{r:"B",t:"生病有三十天等待期，意外从第一天就保。",p:"Shēngbìng yǒu sānshí tiān děngdàiqī, yìwài cóng dì yī tiān jiù bǎo.",v:"Bệnh có ba mươi ngày chờ, tai nạn được bảo hiểm ngay từ ngày đầu."},{r:"A",t:"我能先看看合同吗？",p:"Wǒ néng xiān kànkan hétong ma?",v:"Tôi xem hợp đồng trước được không?"},{r:"B",t:"当然，我今天发给您。",p:"Dāngrán, wǒ jīntiān fā gěi nín.",v:"Tất nhiên, hôm nay em gửi anh."}],phrases:[{t:"好的。您想给几个人买？",p:"Hǎo de. Nín xiǎng gěi jǐ ge rén mǎi?",v:"Vâng. Anh muốn mua cho mấy người?"},{t:"我们的家庭险包括住院、手术和看医生。",p:"Wǒmen de jiātíngxiǎn bāokuò zhùyuàn, shǒushù hé kàn yīshēng.",v:"Bảo hiểm gia đình bên em bao gồm nằm viện, phẫu thuật và khám bác sĩ."},{t:"四个人每个月大概一千五百块。",p:"Sì ge rén měi ge yuè dàgài yìqiān wǔbǎi kuài.",v:"Bốn người mỗi tháng khoảng một nghìn rưỡi tệ."},{t:"生病有三十天等待期，意外从第一天就保。",p:"Shēngbìng yǒu sānshí tiān děngdàiqī, yìwài cóng dì yī tiān jiù bǎo.",v:"Bệnh có ba mươi ngày chờ, tai nạn được bảo hiểm ngay từ ngày đầu."}],notes:[{h:"险 là viết tắt của 保险",b:"家庭险 là bảo hiểm gia đình, 车险 là bảo hiểm xe, 寿险 là bảo hiểm nhân thọ."},{h:"包括 là bao gồm",b:"我们的家庭险包括… là bảo hiểm gia đình bên em bao gồm…"}]},
 {id:"zh-w-ins-claim",title:"Hướng dẫn làm hồ sơ bồi thường",scene:"Khách hàng gọi để yêu cầu bồi thường sau khi nằm viện.",partner:"客户",ind:"ins",work:true,lines:[{r:"A",t:"你好，我上周住院了，怎么申请理赔？",p:"Nǐ hǎo, wǒ shàng zhōu zhùyuàn le, zěnme shēnqǐng lǐpéi?",v:"Chào chị, tuần trước tôi nằm viện, xin bồi thường thế nào?"},{r:"B",t:"很抱歉。请告诉我您的保单号。",p:"Hěn bàoqiàn. Qǐng gàosu wǒ nín de bǎodānhào.",v:"Rất tiếc. Anh cho tôi số hợp đồng bảo hiểm."},{r:"A",t:"H二零五八。",p:"H èr líng wǔ bā.",v:"H2058."},{r:"B",t:"谢谢。请把医院发票和出院小结发给我们。",p:"Xièxie. Qǐng bǎ yīyuàn fāpiào hé chūyuàn xiǎojié fā gěi wǒmen.",v:"Cảm ơn. Anh gửi bên tôi hóa đơn viện phí và giấy ra viện."},{r:"A",t:"可以在网上发吗？",p:"Kěyǐ zài wǎngshang fā ma?",v:"Gửi trên mạng được không?"},{r:"B",t:"可以，在我们的应用里上传照片就行。",p:"Kěyǐ, zài wǒmen de yìngyòng li shàngchuán zhàopiàn jiù xíng.",v:"Được, chỉ cần tải ảnh lên ứng dụng của bên tôi."},{r:"A",t:"要多长时间？",p:"Yào duō cháng shíjiān?",v:"Mất bao lâu?"},{r:"B",t:"一般十个工作日，钱会打到您的银行账户。",p:"Yìbān shí ge gōngzuòrì, qián huì dǎ dào nín de yínháng zhànghù.",v:"Thường mười ngày làm việc, tiền sẽ chuyển vào tài khoản ngân hàng của anh."}],phrases:[{t:"很抱歉。请告诉我您的保单号。",p:"Hěn bàoqiàn. Qǐng gàosu wǒ nín de bǎodānhào.",v:"Rất tiếc. Anh cho tôi số hợp đồng bảo hiểm."},{t:"谢谢。请把医院发票和出院小结发给我们。",p:"Xièxie. Qǐng bǎ yīyuàn fāpiào hé chūyuàn xiǎojié fā gěi wǒmen.",v:"Cảm ơn. Anh gửi bên tôi hóa đơn viện phí và giấy ra viện."},{t:"可以，在我们的应用里上传照片就行。",p:"Kěyǐ, zài wǒmen de yìngyòng li shàngchuán zhàopiàn jiù xíng.",v:"Được, chỉ cần tải ảnh lên ứng dụng của bên tôi."},{t:"一般十个工作日，钱会打到您的银行账户。",p:"Yìbān shí ge gōngzuòrì, qián huì dǎ dào nín de yínháng zhànghù.",v:"Thường mười ngày làm việc, tiền sẽ chuyển vào tài khoản ngân hàng của anh."}],notes:[{h:"理赔 là bồi thường bảo hiểm",b:"申请理赔 là nộp yêu cầu bồi thường."},{h:"就行",b:"上传照片就行 là \"chỉ cần tải ảnh lên là được\". 就行 nhấn mạnh việc đơn giản."}]},
 {id:"zh-w-ins-car",title:"Bảo hiểm xe sau tai nạn",scene:"Khách hàng báo bị va chạm xe. Bạn là nhân viên giám định.",partner:"客户",ind:"ins",work:true,lines:[{r:"A",t:"今天早上有人撞了我的车。",p:"Jīntiān zǎoshang yǒu rén zhuàngle wǒ de chē.",v:"Sáng nay có người đâm vào xe tôi."},{r:"B",t:"您没事吧？有人受伤吗？",p:"Nín méi shì ba? Yǒu rén shòushāng ma?",v:"Anh không sao chứ? Có ai bị thương không?"},{r:"A",t:"没有，我没事。但是车后面坏了。",p:"Méiyǒu, wǒ méi shì. Dànshì chē hòumiàn huài le.",v:"Không, tôi không sao. Nhưng đuôi xe hỏng rồi."},{r:"B",t:"您拍照了吗？有对方司机的信息吗？",p:"Nín pāizhào le ma? Yǒu duìfāng sījī de xìnxī ma?",v:"Anh chụp ảnh chưa? Có thông tin người lái xe kia không?"},{r:"A",t:"有，我有他的名字、电话和车牌号。",p:"Yǒu, wǒ yǒu tā de míngzi, diànhuà hé chēpáihào.",v:"Có, tôi có tên, số điện thoại và biển số xe của anh ta."},{r:"B",t:"好。请把车开到我们的合作修理厂。",p:"Hǎo. Qǐng bǎ chē kāi dào wǒmen de hézuò xiūlǐchǎng.",v:"Tốt. Anh lái xe đến xưởng sửa chữa đối tác của bên tôi."},{r:"A",t:"我要付钱吗？",p:"Wǒ yào fù qián ma?",v:"Tôi có phải trả tiền không?"},{r:"B",t:"如果不是您的责任，对方的保险会付修理费。",p:"Rúguǒ bú shì nín de zérèn, duìfāng de bǎoxiǎn huì fù xiūlǐfèi.",v:"Nếu không phải trách nhiệm của anh, bảo hiểm bên kia sẽ trả phí sửa xe."}],phrases:[{t:"您没事吧？有人受伤吗？",p:"Nín méi shì ba? Yǒu rén shòushāng ma?",v:"Anh không sao chứ? Có ai bị thương không?"},{t:"您拍照了吗？有对方司机的信息吗？",p:"Nín pāizhào le ma? Yǒu duìfāng sījī de xìnxī ma?",v:"Anh chụp ảnh chưa? Có thông tin người lái xe kia không?"},{t:"好。请把车开到我们的合作修理厂。",p:"Hǎo. Qǐng bǎ chē kāi dào wǒmen de hézuò xiūlǐchǎng.",v:"Tốt. Anh lái xe đến xưởng sửa chữa đối tác của bên tôi."},{t:"如果不是您的责任，对方的保险会付修理费。",p:"Rúguǒ bú shì nín de zérèn, duìfāng de bǎoxiǎn huì fù xiūlǐfèi.",v:"Nếu không phải trách nhiệm của anh, bảo hiểm bên kia sẽ trả phí sửa xe."}],notes:[{h:"您没事吧？",b:"Hỏi thăm trước: \"Anh không sao chứ?\" 吧 thể hiện sự quan tâm, mong câu trả lời là không sao."},{h:"责任 là trách nhiệm, lỗi",b:"不是您的责任 là không phải lỗi của anh. 全责 là chịu toàn bộ trách nhiệm."}]},
 {id:"zh-w-log-ship",title:"Đặt lịch vận chuyển hàng",scene:"Bạn liên hệ công ty vận tải để gửi một lô hàng sang Úc.",partner:"货代",ind:"log",work:true,lines:[{r:"A",t:"你好，环球货运，请问有什么可以帮您？",p:"Nǐ hǎo, Huánqiú Huòyùn, qǐngwèn yǒu shénme kěyǐ bāng nín?",v:"Chào anh, Vận tải Toàn Cầu xin nghe, tôi giúp gì được ạ?"},{r:"B",t:"你好，我想把两个集装箱的家具运到悉尼。",p:"Nǐ hǎo, wǒ xiǎng bǎ liǎng ge jízhuāngxiāng de jiājù yùn dào Xīní.",v:"Chào chị, tôi muốn chở hai container đồ nội thất sang Sydney."},{r:"A",t:"好的，是四十尺柜吗？",p:"Hǎo de, shì sìshí chǐ guì ma?",v:"Vâng, là container bốn mươi feet ạ?"},{r:"B",t:"对。下一班船什么时候从海防出发？",p:"Duì. Xià yì bān chuán shénme shíhou cóng Hǎifáng chūfā?",v:"Đúng. Chuyến tàu tiếp theo khi nào khởi hành từ Hải Phòng?"},{r:"A",t:"十二号有一班，大概十八天到。",p:"Shí'èr hào yǒu yì bān, dàgài shíbā tiān dào.",v:"Ngày mười hai có một chuyến, khoảng mười tám ngày thì đến."},{r:"B",t:"好。包括港口费，一共多少钱？",p:"Hǎo. Bāokuò gǎngkǒufèi, yígòng duōshao qián?",v:"Được. Tính cả phí cảng, tổng cộng bao nhiêu tiền?"},{r:"A",t:"每个柜大概三千美元，我把报价发给您。",p:"Měi ge guì dàgài sānqiān Měiyuán, wǒ bǎ bàojià fā gěi nín.",v:"Mỗi container khoảng ba nghìn đô, tôi gửi báo giá cho anh."},{r:"B",t:"谢谢。也请告诉我需要哪些单证。",p:"Xièxie. Yě qǐng gàosu wǒ xūyào nǎxiē dānzhèng.",v:"Cảm ơn. Chị cũng cho tôi biết cần những chứng từ gì."}],phrases:[{t:"你好，我想把两个集装箱的家具运到悉尼。",p:"Nǐ hǎo, wǒ xiǎng bǎ liǎng ge jízhuāngxiāng de jiājù yùn dào Xīní.",v:"Chào chị, tôi muốn chở hai container đồ nội thất sang Sydney."},{t:"对。下一班船什么时候从海防出发？",p:"Duì. Xià yì bān chuán shénme shíhou cóng Hǎifáng chūfā?",v:"Đúng. Chuyến tàu tiếp theo khi nào khởi hành từ Hải Phòng?"},{t:"好。包括港口费，一共多少钱？",p:"Hǎo. Bāokuò gǎngkǒufèi, yígòng duōshao qián?",v:"Được. Tính cả phí cảng, tổng cộng bao nhiêu tiền?"},{t:"谢谢。也请告诉我需要哪些单证。",p:"Xièxie. Yě qǐng gàosu wǒ xūyào nǎxiē dānzhèng.",v:"Cảm ơn. Chị cũng cho tôi biết cần những chứng từ gì."}],notes:[{h:"柜 là cách nói tắt của container",b:"四十尺柜 là container 40 feet, 二十尺柜 là 20 feet. Từ đầy đủ là 集装箱."},{h:"班 là lượng từ cho chuyến",b:"下一班船 là chuyến tàu tiếp theo, 一班飞机 là một chuyến bay."}]},
 {id:"zh-w-log-customs",title:"Làm thủ tục hải quan",scene:"Lô hàng nhập khẩu bị giữ ở hải quan. Bạn gọi cho nhân viên đại lý hải quan.",partner:"报关员",ind:"log",work:true,lines:[{r:"A",t:"你好，您的货被海关扣了。",p:"Nǐ hǎo, nín de huò bèi hǎiguān kòu le.",v:"Chào anh, hàng của anh bị hải quan giữ lại rồi."},{r:"B",t:"啊？有什么问题？",p:"À? Yǒu shénme wèntí?",v:"Hả? Có vấn đề gì vậy?"},{r:"A",t:"发票金额和装箱单不一致。",p:"Fāpiào jīn'é hé zhuāngxiāngdān bù yízhì.",v:"Số tiền trên hóa đơn và phiếu đóng gói không khớp nhau."},{r:"B",t:"明白了，我今天让供应商发一张改好的发票。",p:"Míngbai le, wǒ jīntiān ràng gōngyìngshāng fā yì zhāng gǎihǎo de fāpiào.",v:"Tôi hiểu rồi, hôm nay tôi bảo nhà cung cấp gửi một hóa đơn đã sửa."},{r:"A",t:"好。另外还需要原产地证。",p:"Hǎo. Lìngwài hái xūyào yuánchǎndìzhèng.",v:"Được. Ngoài ra còn cần giấy chứng nhận xuất xứ."},{r:"B",t:"这个我们有。关税是多少？",p:"Zhège wǒmen yǒu. Guānshuì shì duōshao?",v:"Cái đó bên tôi có. Thuế quan là bao nhiêu?"},{r:"A",t:"百分之五，还有百分之十的增值税。",p:"Bǎi fēn zhī wǔ, hái yǒu bǎi fēn zhī shí de zēngzhíshuì.",v:"Năm phần trăm, còn có mười phần trăm thuế giá trị gia tăng."},{r:"B",t:"好的，什么时候能提货？",p:"Hǎo de, shénme shíhou néng tíhuò?",v:"Được, khi nào lấy hàng được?"},{r:"A",t:"收到新发票后两天。",p:"Shōudào xīn fāpiào hòu liǎng tiān.",v:"Hai ngày sau khi nhận hóa đơn mới."}],phrases:[{t:"啊？有什么问题？",p:"À? Yǒu shénme wèntí?",v:"Hả? Có vấn đề gì vậy?"},{t:"明白了，我今天让供应商发一张改好的发票。",p:"Míngbai le, wǒ jīntiān ràng gōngyìngshāng fā yì zhāng gǎihǎo de fāpiào.",v:"Tôi hiểu rồi, hôm nay tôi bảo nhà cung cấp gửi một hóa đơn đã sửa."},{t:"这个我们有。关税是多少？",p:"Zhège wǒmen yǒu. Guānshuì shì duōshao?",v:"Cái đó bên tôi có. Thuế quan là bao nhiêu?"},{t:"好的，什么时候能提货？",p:"Hǎo de, shénme shíhou néng tíhuò?",v:"Được, khi nào lấy hàng được?"}],notes:[{h:"被 + người làm + động từ",b:"货被海关扣了 là hàng bị hải quan giữ. 被 dùng cho câu bị động, thường mang nghĩa không mong muốn."},{h:"一致 là khớp, thống nhất",b:"不一致 là không khớp. Hải quan rất hay kiểm tra số liệu giữa các chứng từ."}]},
 {id:"zh-w-log-warehouse",title:"Quản lý kho hàng",scene:"Bạn là quản lý kho, trao đổi với nhân viên về đơn hàng cần xuất.",partner:"仓库员工",ind:"log",work:true,lines:[{r:"A",t:"今天有五十个订单要发货。",p:"Jīntiān yǒu wǔshí ge dìngdān yào fāhuò.",v:"Hôm nay có năm mươi đơn cần giao."},{r:"B",t:"好，先拣急单。",p:"Hǎo, xiān jiǎn jídān.",v:"Được, lấy hàng các đơn gấp trước."},{r:"A",t:"有些货缺货了。",p:"Yǒuxiē huò quēhuò le.",v:"Một số hàng hết rồi."},{r:"B",t:"查一下系统，告诉我是哪些。",p:"Chá yíxià xìtǒng, gàosu wǒ shì nǎxiē.",v:"Kiểm tra hệ thống, báo tôi là mặt hàng nào."},{r:"A",t:"M号的蓝色T恤。",p:"M hào de lánsè T xù.",v:"Áo phông xanh cỡ M."},{r:"B",t:"星期四会到货，请给这些客户发邮件说明延迟。",p:"Xīngqīsì huì dàohuò, qǐng gěi zhèxiē kèhù fā yóujiàn shuōmíng yánchí.",v:"Thứ Năm có hàng về, em gửi email báo chậm cho các khách này."},{r:"A",t:"好的，现在打印快递单吗？",p:"Hǎo de, xiànzài dǎyìn kuàidìdān ma?",v:"Vâng, bây giờ in phiếu chuyển phát luôn ạ?"},{r:"B",t:"对，打包以前再检查一遍地址。",p:"Duì, dǎbāo yǐqián zài jiǎnchá yí biàn dìzhǐ.",v:"Đúng, trước khi đóng gói kiểm tra lại địa chỉ một lượt."}],phrases:[{t:"好，先拣急单。",p:"Hǎo, xiān jiǎn jídān.",v:"Được, lấy hàng các đơn gấp trước."},{t:"查一下系统，告诉我是哪些。",p:"Chá yíxià xìtǒng, gàosu wǒ shì nǎxiē.",v:"Kiểm tra hệ thống, báo tôi là mặt hàng nào."},{t:"星期四会到货，请给这些客户发邮件说明延迟。",p:"Xīngqīsì huì dàohuò, qǐng gěi zhèxiē kèhù fā yóujiàn shuōmíng yánchí.",v:"Thứ Năm có hàng về, em gửi email báo chậm cho các khách này."},{t:"对，打包以前再检查一遍地址。",p:"Duì, dǎbāo yǐqián zài jiǎnchá yí biàn dìzhǐ.",v:"Đúng, trước khi đóng gói kiểm tra lại địa chỉ một lượt."}],notes:[{h:"缺货 và 到货",b:"缺货 là hết hàng, 到货 là hàng về. 补货 là nhập bổ sung hàng."},{h:"再…一遍",b:"再检查一遍 là kiểm tra lại một lần nữa. 遍 là lượng từ cho số lần làm từ đầu đến cuối."}]},
 {id:"zh-w-ecom-listing",title:"Đăng sản phẩm lên sàn",scene:"Bạn hướng dẫn nhân viên mới đăng sản phẩm lên sàn thương mại điện tử.",partner:"新同事",ind:"ecom",work:true,lines:[{r:"A",t:"怎么在店里上新产品？",p:"Zěnme zài diàn li shàng xīn chǎnpǐn?",v:"Đăng sản phẩm mới lên cửa hàng thế nào ạ?"},{r:"B",t:"先上传至少五张白底的清楚照片。",p:"Xiān shàngchuán zhìshǎo wǔ zhāng báidǐ de qīngchu zhàopiàn.",v:"Trước tiên tải lên ít nhất năm ảnh rõ nét nền trắng."},{r:"A",t:"标题呢？",p:"Biāotí ne?",v:"Còn tiêu đề?"},{r:"B",t:"把主要关键词放在前面，比如\"女士跑步鞋\"。",p:"Bǎ zhǔyào guānjiàncí fàng zài qiánmiàn, bǐrú \"nǚshì pǎobùxié\".",v:"Đặt từ khóa chính lên đầu, ví dụ \"giày chạy bộ nữ\"."},{r:"A",t:"描述要写很长吗？",p:"Miáoshù yào xiě hěn cháng ma?",v:"Mô tả có cần viết dài không?"},{r:"B",t:"写短一点，写清楚尺寸、材料和用法。",p:"Xiě duǎn yìdiǎn, xiě qīngchu chǐcùn, cáiliào hé yòngfǎ.",v:"Viết ngắn thôi, ghi rõ kích cỡ, chất liệu và cách dùng."},{r:"A",t:"价格怎么定？",p:"Jiàgé zěnme dìng?",v:"Định giá thế nào?"},{r:"B",t:"先看看竞争对手，第一周定得便宜一点。",p:"Xiān kànkan jìngzhēng duìshǒu, dì yī zhōu dìng de piányi yìdiǎn.",v:"Xem đối thủ trước, tuần đầu đặt giá rẻ hơn một chút."}],phrases:[{t:"先上传至少五张白底的清楚照片。",p:"Xiān shàngchuán zhìshǎo wǔ zhāng báidǐ de qīngchu zhàopiàn.",v:"Trước tiên tải lên ít nhất năm ảnh rõ nét nền trắng."},{t:"把主要关键词放在前面，比如\"女士跑步鞋\"。",p:"Bǎ zhǔyào guānjiàncí fàng zài qiánmiàn, bǐrú \"nǚshì pǎobùxié\".",v:"Đặt từ khóa chính lên đầu, ví dụ \"giày chạy bộ nữ\"."},{t:"写短一点，写清楚尺寸、材料和用法。",p:"Xiě duǎn yìdiǎn, xiě qīngchu chǐcùn, cáiliào hé yòngfǎ.",v:"Viết ngắn thôi, ghi rõ kích cỡ, chất liệu và cách dùng."},{t:"先看看竞争对手，第一周定得便宜一点。",p:"Xiān kànkan jìngzhēng duìshǒu, dì yī zhōu dìng de piányi yìdiǎn.",v:"Xem đối thủ trước, tuần đầu đặt giá rẻ hơn một chút."}],notes:[{h:"上新 là đăng sản phẩm mới",b:"Từ thường dùng trên các sàn như Taobao: 上新 (lên hàng mới), 下架 (gỡ sản phẩm)."},{h:"Động từ + 得 + tính từ",b:"定得便宜一点 là đặt (giá) rẻ hơn một chút. 得 nối động từ với mức độ."}]},
