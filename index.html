<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<title>Study for yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: logo trái, ngôn ngữ + chế độ đêm phải; tiêu đề giữa; bài học lưới 2 cột bám lề trái */
  --bg:#faf1d9;
  --surface:#e5f2df;
  --ink:#123524;
  --muted:#4d6d5b;
  --line:#d2e4cc;
  --accent:#1a7a40;
  --accent-soft:#c8e8c6;
  --btn:#a5e6bc;
  --btn-ink:#0c3d21;
  --sun:#f4b400;
  --good:#15803d;
  --good-soft:#dcf3e4;
  --warn:#a86500;
  --warn-soft:#fff1d2;
  --bad:#c93a32;
  --bad-soft:#fde6e4;
  --font-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-zh:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --radius:14px;
  color-scheme: only light;
}
:root[data-theme="dark"]{
  --bg:#0b1410; --surface:#15281d; --ink:#e4f1e8; --muted:#97b0a1; --line:#25402f;
  --accent:#6ee39a; --accent-soft:#1d4a30; --btn:#2f7a4c; --btn-ink:#eafff1; --sun:#fbbf24;
  --good:#4ade80; --good-soft:#153524; --warn:#f0b24a; --warn-soft:#3a2d12;
  --bad:#ff7a70; --bad-soft:#3d1b1a; color-scheme: only dark;
}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg button,.themebtn{white-space:nowrap}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.themebtn svg{width:16px;height:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.zh{font-family:var(--font-zh)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{--gut:clamp(16px,3vw,40px);--edge:24px;padding:20px var(--edge) 64px;display:flex;flex-direction:column;gap:22px}
.page{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.page.wide{max-width:1200px;align-self:center}
.list.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.list.grid2{grid-template-columns:1fr}}
.voicepick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.voicepick select{border:0;background:transparent;color:var(--ink);font:inherit;max-width:190px;padding:3px 2px}

/* Header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.top .brand{justify-self:start;white-space:nowrap}
.top-main{display:contents}
.top-main .section-title{grid-column:2;margin:0;font-size:clamp(18px,1.9vw,24px);font-weight:800;letter-spacing:-.02em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (min-width:861px){.top-main .topright{flex-wrap:nowrap}}
.top-main .topright{grid-column:3;justify-self:end}
@media (max-width:860px){
  .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
  .top-main .topright{order:2}
  .top-main .section-title{order:3;flex-basis:100%;text-align:center}
}
.layout{position:relative;padding-top:18px}
/* Trang chủ trên máy tính: Mục lục nằm ngay dưới logo, nút Lịch đứng cạnh logo. Các trang khác giữ như cũ. */
@media (min-width:861px){
  .is-home .top .brand{position:relative}
  .is-home .top .brand .side{position:absolute;left:0;top:calc(100% + 8px);z-index:60}
}
/* Mục lục: nút trên thanh đầu trang, bấm vào thả danh sách xuống theo chiều dọc */
.side{position:relative;flex:none}
.side .side-toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;letter-spacing:0}
.side .side-toggle:hover{border-color:var(--accent)}
.side .side-toggle svg{width:16px;height:16px}
.side .side-toggle .chev{width:13px;height:13px;transition:transform .25s ease;opacity:.7}
.side .side-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.side-list{position:absolute;left:0;top:calc(100% + 8px);z-index:70;width:max-content;min-width:290px;max-width:min(360px,calc(100vw - 24px));background:linear-gradient(var(--surface),var(--surface)),var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 48px -18px rgba(0,0,0,.45);padding:8px;visibility:hidden;opacity:0;transform:translateY(-8px);transform-origin:top left;transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
.side-list.open{visibility:visible;opacity:1;transform:none;transition:opacity .18s ease,transform .22s cubic-bezier(.3,1.3,.5,1),visibility 0s}
.side-inner{display:flex;flex-direction:column;gap:2px}
.side-inner button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 10px;border-radius:11px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;opacity:0;transform:translateY(-10px)}
.side-inner button:hover{background:var(--accent-soft)}
.side-inner button[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.side-inner .si{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.side-inner button[aria-current="page"] .si{background:rgba(255,255,255,.22);color:inherit}
.side-inner .si svg{width:18px;height:18px}
.side-inner .st{flex:1;min-width:0}
.side-list.open .side-inner button{animation:dropIn .32s cubic-bezier(.3,1.3,.5,1) forwards;animation-delay:calc(var(--i) * 35ms)}
@keyframes dropIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.side-list,.side-inner button{transition:none;animation:none!important;opacity:1;transform:none}}
.side .soon{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.pback{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px 7px 10px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.pback:hover{border-color:var(--accent)}
.pback svg{width:15px;height:15px;transform:rotate(180deg)}
.main{min-width:0;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.main > .page{align-self:center}

.coming{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:640px}
.coming h2{margin:0 0 6px;font-size:22px}
.coming p{margin:0 0 14px;color:var(--muted)}
@media (max-width:860px){ .wrap{padding-left:var(--gut);padding-right:var(--gut)} }
/* Logo SFY: 3 lớp ảnh (chữ SFY, mầm lá, dòng chữ) để tạo chuyển động nhẹ: mầm lá đung đưa, chữ hiện dần lúc mở trang, ánh sáng lướt qua định kỳ */

.logo{position:relative;display:block;flex:none;height:48px;width:calc(48px * 372 / 80)}
.logo i{position:absolute;top:0;left:0;height:100%;width:calc(48px * 372 / 80);background:center/100% 100% no-repeat}
.lg-mark{background-image:var(--lgm)!important}
.lg-sprout{background-image:var(--lgs)!important;transform-origin:var(--lgo);animation:lgSway 4.8s ease-in-out infinite}
.lg-text{background-image:var(--lgt)!important}
.lg-text::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.75) 50%,transparent 58%) no-repeat;background-size:260% 100%;background-position:160% 0;-webkit-mask:var(--lgt) center/100% 100% no-repeat;mask:var(--lgt) center/100% 100% no-repeat;animation:lgShine 8s 2s ease-in-out infinite}
.logo.intro{animation:lgIn .7s ease-out both}
.logo.intro .lg-text{animation:lgReveal 1.2s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes lgSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}}
@keyframes lgShine{0%,72%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes lgReveal{from{clip-path:inset(0 64% 0 36%)}to{clip-path:inset(0 0 0 0)}}
@keyframes lgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (max-width:640px){.logo{height:42px;width:calc(42px * 372 / 80 * .37);overflow:visible}.logo i{width:calc(42px * 372 / 80)}.lg-text{display:none}}
@media (prefers-reduced-motion:reduce){.logo,.logo i,.lg-text::after{animation:none!important}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark{min-width:34px;padding:0 8px;font-size:14px;letter-spacing:.04em;height:34px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

.intro{text-align:center;max-width:1200px;width:100%;align-self:center;padding:8px 0 4px}
.intro .intro-h{font-size:clamp(24px,3.2vw,34px);line-height:1.25;margin:0 0 8px;text-wrap:balance;letter-spacing:-.02em}
.intro p{margin:0 auto;color:var(--muted);max-width:80ch;text-wrap:balance}

/* Lesson list */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.num{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.card h3{margin:0;font-size:17px}
.card .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.tip{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--muted);font-size:14px}

/* Lesson */
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.lesson-head h2{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.lesson-head p{margin:4px 0 0;color:var(--muted)}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.steps button .n{font-size:12px;font-weight:700}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.steps button.done .n::after{content:" ✓";color:var(--good)}
.steps button:disabled{opacity:.5;cursor:not-allowed}
.card.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.4)}.card.locked:hover{transform:none;box-shadow:none}
.phr.locked{color:var(--muted);font-size:14px;border-style:dashed;background:transparent}
.need{font-size:13px;color:#b45309;margin:4px 0}
.result .fb{display:block;margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.55);color:var(--ink);font-size:14px;line-height:1.5}
.pa{display:block;margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.65);color:var(--ink)}
.pa-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.pa-i{padding:8px 0;border-top:1px dashed var(--line)}.pa-i:first-of-type{border-top:0;padding-top:2px}
.pa-w{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.pa-w b{font-size:16px}
.pa-ph{font-size:13px;color:var(--accent);font-family:inherit}.pa-ph.bad{color:#b42318}
.pa-m{font-size:14px;line-height:1.55;margin:3px 0 2px}
.mic-live{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--accent)}
.mic-lv{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.mic-lv i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#16a34a);transition:width .08s}
.mic-txt{font-size:14px;color:var(--ink)}.mic-warn{font-size:13px;color:#b45309}
.result .fb.good{color:var(--accent);font-weight:600}
.next .need{margin-right:auto;align-self:center}
.btn.finish{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px -6px var(--accent)}
.lprog{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:74px}
.lprog-b{display:block;width:74px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}.lprog-b i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.lprog small{font-size:12px;font-weight:700;color:var(--muted)}.lprog.full small{color:var(--accent)}
.num.ok{background:var(--accent)!important;color:#fff!important}
.btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed}
.sfy-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:120;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.sfy-toast.on{opacity:1;transform:translate(-50%,0)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn{white-space:nowrap;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.status{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.you{align-self:flex-end;flex-direction:row-reverse}
.who{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
.msg.you .bubble{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble.playing{box-shadow:0 0 0 3px var(--sun)}
.t{font-size:17px;font-weight:600}
.t.zh{font-size:20px;font-weight:500}
.py{font-size:14px;color:var(--accent);margin-top:2px}
.vi{font-size:14px;color:var(--muted);margin-top:4px}
.play{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}

/* Phrase cards */
.phr{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.mic{border:0;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.mic svg{width:16px;height:16px}
.mic.listening{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,58,50,.45)}100%{box-shadow:0 0 0 12px rgba(201,58,50,0)}}
@media (prefers-reduced-motion: reduce){.mic.listening{animation:none}}
.result{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.result.good{background:var(--good-soft)}
.result.warn{background:var(--warn-soft)}
.result.bad{background:var(--bad-soft)}
.result .score{font-weight:800;font-size:15px}
.diff span{padding:0 1px;border-radius:3px}
.diff .ok{color:var(--good);font-weight:700}

<script>
/* ===================== NỘI DUNG BÀI HỌC ===================== */
/* LESSONS, UNITS, LESSON_ORDER: xem data/lessons.js */

/* ===================== NỘI DUNG PHÁT ÂM =====================
   Ví dụ viết gọn: tiếng Anh "từ=nghĩa"; tiếng Trung "chữ bính_âm=nghĩa".
   Cặp dễ nhầm: "A|B". */
/* snd, PRON_RAW, pItem, PRON_GROUPS, PRON, PSTEP_NAMES: xem data/pron.js */

/* ===================== TỪ VỰNG SAU MỖI BÀI LUYỆN NÓI =====================
   Viết gọn: tiếng Anh "từ=nghĩa", tiếng Trung "chữ bính_âm=nghĩa", các từ cách nhau bằng "|". */
/* VOCAB_RAW, VOCAB_LV, WORK_INDS, WORK_EN, WORK_ZH, WORK_VOCAB: xem data/vocab-work.js */
const VOCAB = {};
function vocabOf(id){
  if(VOCAB[id]) return VOCAB[id];
  const raw = VOCAB_RAW[id]; if(!raw) return [];
  const lang = id.slice(0, 2);
  const lv = VOCAB_LV[id] || "";
  return VOCAB[id] = raw.split("|").map((x, i) => { const it = pItem(x, lang); if(lv[i] !== undefined) it.lv = +lv[i]; if(id.includes("-w-")) it.work = true; return it; });
}
function lvTag(item, lang){
  if(item.lv === undefined) return "";
  const n = item.lv, txt = n === 0 ? (item.work ? "Chuyên ngành" : "Chủ đề") : lang === "zh" ? (n >= 7 ? "HSK 7+" : "HSK " + n) : ["","A1","A2","B1","B2","C1"][n];
  const core = n > 0 && n <= (lang === "zh" ? 3 : 2);
  return `<span class="lv ${core ? "core" : "hi"}" title="${core ? "Từ cơ bản trong chuẩn" : n === 0 ? "Tên riêng hoặc từ chủ đề, ngoài danh sách chuẩn" : "Vượt cấp cơ bản nhưng cần cho tình huống này"}">${txt}</span>`;
}

const LANG_INFO = {
  en:{name:"Tiếng Anh", tts:"en-US", rec:"en-US", dict:"en"},
  zh:{name:"Tiếng Trung", tts:"zh-CN", rec:"zh-CN", dict:"zh"}
};
const STEP_NAMES = ["Nghe hội thoại","Câu then chốt","Đóng vai","Vì sao nói vậy?","Từ vựng"];

/* ===================== LƯU TIẾN ĐỘ ===================== */
const STORE_KEY = "noingay.v1";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
let store = loadStore();
store.progress = store.progress || {};
store.prefs = Object.assign({lang:"en", slow:false, showVi:true, showPy:true, showIpa:true, theme:"light"}, store.prefs || {});
function applyTheme(){
  const dark = store.prefs.theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const m = document.querySelector('meta[name="color-scheme"]'); if(m) m.setAttribute("content", dark ? "only dark" : "only light");
}
applyTheme();

/* ===================== CHUÔNG BÁO POMODORO =====================
   Âm thanh do web tự tổng hợp (Web Audio), không cần tải file. */
const CHIMES = [
  {id:"bell", name:"Chuông ngân"}, {id:"temple", name:"Chuông chùa"}, {id:"wind", name:"Chuông gió"},
  {id:"marimba", name:"Marimba"}, {id:"musicbox", name:"Hộp nhạc"}, {id:"birds", name:"Chim hót"},
  {id:"digital", name:"Bíp điện tử"}, {id:"alarm", name:"Báo thức"}, {id:"none", name:"Không chuông"}
];
const Chime = {
  ready(){ return Sound.ensure(); },
  /* một nốt: nhiều họa âm, tắt dần theo hàm mũ */
  note(out, f, at, dur, parts, type){
    const ctx = Sound.ctx;
    parts.forEach(([m, a]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = f * m; o.connect(g); g.connect(out);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(a, at + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur * (m > 1 ? 0.6 : 1));
      o.start(at); o.stop(at + dur + 0.05);

    };

  }

/* ===================== CHẤM ĐIỂM ===================== */
function expandEn(s){
  return s.toLowerCase()
    .replace(/[’`]/g,"'")
    .replace(/\bcan't\b/g,"can not").replace(/\bwon't\b/g,"will not")
    .replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are")
    .replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/'d\b/g," would")
    .replace(/'s\b/g," is");
}
function tokensEn(s){ return expandEn(s).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean); }
function isHan(ch){ return /[㐀-鿿]/.test(ch); }
function tokensZh(s){ return Array.from(s.toLowerCase()).filter(ch => isHan(ch) || /[a-z0-9]/.test(ch)); }
function stripTones(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ü/g,"u").replace(/v/g,"u").toLowerCase(); }
function lettersPy(s){ return Array.from(stripTones(s).replace(/[^a-z0-9]/g,"")); }
function lcsInfo(a, b){
  const n=a.length, m=b.length, dp=[];
  for(let i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); }
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const matched = new Array(n).fill(false);
  let i=n, j=m;
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  return {len: dp[n][m], matched};
}
function scoreOne(targetToks, heardToks){
  if(!targetToks.length || !heardToks.length) return {score:0, matched:new Array(targetToks.length).fill(false)};
  const r = lcsInfo(targetToks, heardToks);
  return {score: Math.round(200 * r.len / (targetToks.length + heardToks.length)), matched: r.matched};
}
/* Trả về {score, heard, html} — html là câu mẫu tô màu chỗ khớp/thiếu */
function evaluate(item, lang, texts, typed){
  const cands = (texts || []).filter(Boolean);
  if(!cands.length) return {score:0, heard:"", html:esc(item.t), empty:true};
  const targets = [item.t].concat(item.alt || []);
  let best = {score:-1};
  /* tiếng Trung: chữ đồng âm (cùng bính âm, cùng thanh) với chữ trong câu mẫu thì coi như đọc đúng */
  const zhFix = h => { try{ const al = pyAlign(item.t, item.p); if(!al) return h; const M = paZhMap(), byPy = {};
      for(const [c, py] of al) if(py && isHan(c)) byPy[py.toLowerCase()] = c;
      return Array.from(h).map(c => isHan(c) && !item.t.includes(c) && M[c] ? ([...M[c]].map(x => byPy[x]).find(Boolean) || c) : c).join(""); }catch(e){ return h; } };
  /* tiếng Anh: từ đồng âm (cùng phiên âm, ví dụ meet/meat) với từ trong câu mẫu thì coi như đọc đúng */
  const enFix = h => { try{ const tw = item.t.toLowerCase().split(/\s+/).map(w => w.replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "")).filter(Boolean), byIpa = {};
      for(const w of tw){ const r = ipaOf(w); if(r) byIpa[r.join("").replace(/[ˈˌ]/g, "")] = w; }
      return h.split(/\s+/).map(w => { const c = w.toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, ""); if(!c || tw.includes(c)) return w; const r = ipaOf(c); const m = r && byIpa[r.join("").replace(/[ˈˌ]/g, "")]; return m || w; }).join(" "); }catch(e){ return h; } };
  for(const h0 of cands){
    const h = lang === "zh" ? (/[㐀-鿿]/.test(h0) ? zhFix(h0) : h0) : enFix(h0);
    const pinyinTyped = lang==="zh" && typed && !/[㐀-鿿]/.test(h);
    for(const t of targets){
      let r;
      if(pinyinTyped){ r = scoreOne(lettersPy(item.p || ""), lettersPy(h)); r.pinyin = true; }
      else r = scoreOne(lang==="en" ? tokensEn(t) : tokensZh(t), lang==="en" ? tokensEn(h) : tokensZh(h));
      if(r.score > best.score) best = Object.assign({heard:h0, isMain: t===item.t}, r);
    }
  }
  let html = esc(item.t), miss = [];
  if(!best.pinyin && best.isMain){ html = diffHtml(item.t, lang, best.matched); miss = missWords(item.t, lang, best.matched); }
  const heardLen = lang === "en" ? tokensEn(best.heard || "").length : tokensZh(best.heard || "").length, wantLen = lang === "en" ? tokensEn(item.t).length : tokensZh(item.t).length;
  let detail = [];
  if(best.score < 100 && !best.pinyin && best.isMain){ try{ detail = lang === "en" ? analyzeEn(item.t, best.heard) : analyzeZh(item, best.heard); }catch(e){ detail = []; } }
  return {score: best.score, heard: best.heard, html, pinyin: !!best.pinyin, tip: speakTip(best.score, lang, miss, heardLen, wantLen, !!best.pinyin), detail};
}

   - Tiếng Anh: ghép từng từ của câu mẫu với từ máy nghe được, đổi cả hai sang phiên âm IPA (CMUdict có sẵn),

function paLesson(lang, title){ const L = PRON[lang] || []; const f = L.find(x => x.title === title); return f ? f.id : null; }
/* căn hai dãy (Levenshtein); cost(a, b) trả 0..1 cho phép thay; trả mảng thao tác */
function paAlign(A, B, cost){
  const n = A.length, m = B.length, D = [];
  for(let i = 0; i <= n; i++){ D.push(new Array(m + 1).fill(0)); D[i][0] = i; }
  for(let j = 0; j <= m; j++) D[0][j] = j;
  for(let i = 1; i <= n; i++) for(let j = 1; j <= m; j++) D[i][j] = Math.min(D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + cost(A[i-1], B[j-1]));
  const ops = []; let i = n, j = m;
  while(i > 0 || j > 0){
    if(i > 0 && j > 0 && D[i][j] === D[i-1][j-1] + cost(A[i-1], B[j-1])){ ops.push({t:cost(A[i-1], B[j-1]) === 0 ? "m" : "s", a:A[i-1], b:B[j-1], i:i-1}); i--; j--; }
    else if(i > 0 && D[i][j] === D[i-1][j] + 1){ ops.push({t:"d", a:A[i-1], i:i-1}); i--; }
    else { ops.push({t:"i", b:B[j-1], i}); j--; }
  }
  return ops.reverse();
}
/* từ không có trong từ điển (máy nghe ra từ lạ): đoán phiên âm gần đúng theo cách viết */
function paG2P(w){
  const R = [["tch","tʃ"],["sh","ʃ"],["ch","tʃ"],["th","θ"],["ph","f"],["ng","ŋ"],["ck","k"],["qu","kw"],["ee","iː"],["ea","iː"],["oo","uː"],["ou","aʊ"],["ow","aʊ"],["ai","eɪ"],["ay","eɪ"],["oa","əʊ"],["oi","ɔɪ"],["oy","ɔɪ"],["er","ər"],
    ["a","æ"],["e","e"],["i","ɪ"],["o","ɒ"],["u","ʌ"],["y","j"],["c","k"],["x","ks"],["j","dʒ"],["b","b"],["d","d"],["f","f"],["g","g"],["h","h"],["k","k"],["l","l"],["m","m"],["n","n"],["p","p"],["r","r"],["s","s"],["t","t"],["v","v"],["w","w"],["z","z"]];
  const out = []; let i = 0; w = w.toLowerCase();
  while(i < w.length){ const r = R.find(([g]) => w.startsWith(g, i)); if(!r){ i++; continue; }
    if(r[0] === "y" && i === w.length - 1) out.push("i"); else if(r[0] === "er") out.push("ə", "r"); else if(r[1] === "ks") out.push("k", "s"); else if(r[1] === "kw") out.push("k", "w"); else out.push(r[1]);
    i += r[0].length; }
  if(out.length > 1 && w.endsWith("e") && !w.endsWith("ee")) out.pop();
  return out;
}
const paPh = (w, guess) => { const r = ipaOf(w); return r ? r.map(x => x.replace(/[ˈˌ]/g, "")) : guess ? paG2P(w) : null; };
function paWordSim(a, b){
  if(a === b) return 1;
  const pa = paPh(a, true), pb = paPh(b, true);
  const A = pa || [...a], B = pb || [...b];
  const ops = paAlign(A, B, (x, y) => x === y ? 0 : 1), e = ops.filter(o => o.t !== "m").length;
  return Math.max(0, 1 - e / Math.max(A.length, B.length));
}
function analyzeEn(target, heard){
  const clean = w => w.toLowerCase().replace(/[’]/g, "'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
  const T = target.split(/\s+/).map(w => ({raw:w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ""), w:clean(w)})).filter(x => x.w);
  const H = (heard || "").split(/\s+/).map(clean).filter(Boolean);
  const ops = paAlign(T.map(x => x.w), H, (a, b) => { const s = paWordSim(a, b); return s >= 1 ? 0 : s >= 0.34 ? 1 - s * 0.5 : 2; });
  const out = [], extra = [];
  for(const o of ops){
    if(o.t === "m") continue;
    if(o.t === "i"){ extra.push(o.b); continue; }
    const tw = T[o.i], tp = paPh(tw.w);
    if(o.t === "d"){ out.push({w:tw.raw, tgt:tp ? tp.join("") : "", got:"", msg:`Máy không nghe thấy từ này. Hãy nói rõ cả từ “${tw.raw}”.`, ph:null}); continue; }
    const hp = paPh(o.b, true);
    if(!tp || !hp){ out.push({w:tw.raw, tgt:tp ? tp.join("") : "", got:o.b, msg:`Máy nghe thành “${o.b}”.`, ph:null}); continue; }
    const pops = paAlign(tp, hp, (x, y) => x === y ? 0 : 1).filter(p => p.t !== "m");
    const notes = []; let ph = null;
    for(const p of pops.slice(0, 2)){
      if(p.t === "s"){ ph = ph || p.a; notes.push(`Âm /${p.a}/ nghe thành /${p.b}/. ` + (PA_EN_PAIR[p.a + ">" + p.b] || ("Cách đọc /" + p.a + "/: " + (PA_EN[p.a] || "nghe mẫu và nói chậm lại."))));}
      else if(p.t === "d"){ ph = ph || p.a; const last = p.i === tp.length - 1;
        notes.push(`${last ? "Thiếu âm cuối" : "Thiếu âm"} /${p.a}/. ` + (last ? "Người Việt hay nuốt âm cuối; hãy đọc dứt khoát âm này. " : "") + (PA_EN[p.a] ? "Cách đọc: " + PA_EN[p.a] : "")); }
      else if(p.t === "i") notes.push(`Có thêm âm /${p.b}/ không cần thiết. Đọc gọn đúng các âm của từ.`);
    }
    out.push({w:tw.raw, tgt:tp.join(""), got:hp.join(""), heardWord:o.b, msg:notes.join(" ") || `Máy nghe thành “${o.b}”.`, ph});
  }
  if(extra.length) out.push({w:"", tgt:"", got:"", msg:`Máy nghe thêm: “${extra.slice(0, 5).join(" ")}”. Nói đúng câu mẫu, không thêm từ.`, ph:null});
  return out.map(x => Object.assign(x, {lesson:x.ph ? paLesson("en", "/" + x.ph + "/") : null, lessonName:x.ph ? "/" + x.ph + "/" : ""}));
}
/* bính âm: tách phụ âm đầu, vần, thanh */
function paPy(py){
  const n = py.normalize("NFD"); let tone = 5;
  if(/̄/.test(n)) tone = 1; else if(/́/.test(n)) tone = 2; else if(/̌/.test(n)) tone = 3; else if(/̀/.test(n)) tone = 4;
  const base = pyBase(py).replace(/ü/g, "ü");
  let ini = ""; for(const i of PY_INIT){ if(i && base.startsWith(i) && i.length > ini.length) ini = i; }
  let fin = base.slice(ini.length); if((ini === "j" || ini === "q" || ini === "x" || ini === "y") && fin.startsWith("u")) fin = "ü" + fin.slice(1);
  return {ini, fin, tone, base};
}
let PA_ZHMAP = null;
function paZhMap(){
  if(PA_ZHMAP) return PA_ZHMAP;
  const M = {}, put = (t, p) => { const al = p && pyAlign(t, p); if(!al) return; for(const [ch, py] of al) if(py && isHan(ch)){ (M[ch] = M[ch] || new Set()).add(py.toLowerCase()); } };
  try{ for(const les of LESSONS.zh){ for(const l of les.lines || []) put(l.t, l.p); for(const ph of les.phrases || []) put(ph.t, ph.p); } }catch(e){}
  try{ for(const T of VT_TOPICS) for(const part of ["b","a"]) for(const it of T.zh[part]) put(it.t, it.p); }catch(e){}
  try{ for(const id of Object.keys(VOCAB_RAW)) if(id.startsWith("zh")) for(const it of vocabOf(id)) put(it.t, it.p); }catch(e){}
  try{ for(const les of PRON.zh) for(const s of les.speak || []) put(s.t, s.p); }catch(e){}
  return PA_ZHMAP = M;
}
function analyzeZh(item, heard){
  const al = pyAlign(item.t, item.p); if(!al) return [];
  const T = al.filter(([ch, py]) => isHan(ch) && py), M = paZhMap();
  const H = Array.from(heard || "").filter(isHan);
  const same = (t, h) => t[0] === h || (M[h] && M[h].has(t[1].toLowerCase()));
  const ops = paAlign(T, H, (t, h) => same(t, h) ? 0 : 1);
  const out = [];
  for(const o of ops){
    if(o.t === "m" || o.t === "i") continue;
    const [ch, py] = o.a;
    if(o.t === "d"){ out.push({w:ch, tgt:py, got:"", msg:`Máy không nghe thấy chữ “${ch}”. Đọc rõ từng chữ, đừng nuốt chữ.`, lesson:null}); continue; }
    const hpys = M[o.b] ? [...M[o.b]] : [];
    const tp = paPy(py);
    if(!hpys.length){ out.push({w:ch, tgt:py, got:o.b, msg:`Máy nghe thành chữ “${o.b}”. Nghe mẫu và đọc lại chữ “${ch}” (${py}).`, lesson:null}); continue; }
    const hp = hpys.map(paPy).sort((x, y) => (y.ini === tp.ini) + (y.fin === tp.fin) - (x.ini === tp.ini) - (x.fin === tp.fin))[0];
    const notes = []; let lesson = null, lname = "";
    if(hp.ini !== tp.ini){ notes.push(PA_ZH_INIT[tp.ini + ">" + hp.ini] || `Phụ âm đầu “${tp.ini || "(không có)"}” nghe thành “${hp.ini || "(không có)"}”.`); lesson = paLesson("zh", tp.ini); lname = tp.ini; }
    if(hp.fin !== tp.fin){ notes.push(PA_ZH_FIN[tp.fin + ">" + hp.fin] || `Vần “${tp.fin}” nghe thành “${hp.fin}”.`); if(!lesson){ lesson = paLesson("zh", tp.fin); lname = tp.fin; } }
    if(hp.ini === tp.ini && hp.fin === tp.fin && hp.tone !== tp.tone){ notes.push(`Đúng âm nhưng sai thanh: thanh ${tp.tone === 5 ? "nhẹ" : tp.tone} bị nghe thành thanh ${hp.tone === 5 ? "nhẹ" : hp.tone}. ${PA_TONE[tp.tone]}`); lesson = PRON.zh[[0,0,1,2,3,4][tp.tone]] ? PRON.zh[[0,0,1,2,3,4][tp.tone]].id : null; lname = "thanh " + (tp.tone === 5 ? "nhẹ" : tp.tone); }
    out.push({w:ch, tgt:py, got:o.b + " (" + hpys[0] + ")", msg:notes.join(" ") || `Máy nghe thành “${o.b}”.`, lesson, lessonName:lname});
  }

}

/* những từ (tiếng Anh) hoặc chữ (tiếng Trung) chưa khớp */
function missWords(text, lang, matched){
  const out = []; let k = 0;
  if(lang === "en"){
    for(const w of text.split(/\s+/)){ const toks = tokensEn(w); if(!toks.length) continue; let ok = true; for(let x = 0; x < toks.length; x++) if(!matched[k+x]) ok = false; k += toks.length; if(!ok) out.push(w.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "")); }
  } else for(const ch of Array.from(text)){ if(isHan(ch) || /[a-z0-9]/i.test(ch)){ if(!matched[k]) out.push(ch); k++; } }
  return out.filter(Boolean);
}
/* Lời khen hoặc gợi ý cải thiện cho từng câu, dựa trên điểm và những từ chưa khớp */
function speakTip(score, lang, miss, heardLen, wantLen, pinyin){
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const q = miss.slice(0, 4).map(w => `“${w}”`).join(", ");
  if(score >= 90) return {good:true, text:pick(["Xuất sắc! Câu nói rõ ràng và chính xác.", "Rất tốt! Người bản xứ sẽ hiểu bạn ngay.", "Hoàn hảo, giữ phong độ này nhé!", "Tuyệt vời, phát âm rất chuẩn!"])};
  if(score >= 75) return {good:true, text:"Tốt lắm! " + (miss.length ? `Chỉ cần nói rõ hơn ${lang === "zh" ? "chữ" : "từ"} ${q}.` : "Thử nói liền mạch, tự nhiên hơn một chút.")};
  const parts = [];
  if(heardLen && heardLen < wantLen * 0.6) parts.push("Máy mới nghe được một phần câu. Hãy nói trọn cả câu, to và gần micro hơn.");
  else if(heardLen > wantLen * 1.5) parts.push("Bạn nói dư khá nhiều từ. Hãy nói đúng câu mẫu, không thêm bớt.");
  if(miss.length) parts.push(`${lang === "zh" ? "Các chữ" : "Các từ"} chưa rõ: ${q}${miss.length > 4 ? "…" : ""}.`);
  if(lang === "en"){
    if(miss.some(w => /[stdkpz]$|ed$|es$/i.test(w))) parts.push("Nhớ đọc rõ âm cuối (s, t, d, k…), người Việt hay nuốt mất âm này.");
    if(miss.some(w => /th/i.test(w))) parts.push("Âm “th”: đặt đầu lưỡi giữa hai hàm răng rồi thổi hơi.");
    if(miss.some(w => /^r|r[aeiou]/i.test(w))) parts.push("Âm “r” tiếng Anh: cong lưỡi lên, không rung như “r” tiếng Việt.");
  } else if(!pinyin) parts.push("Chú ý thanh điệu của những chữ chưa rõ; bật Bính âm để xem dấu thanh.");
  if(score < 50) parts.push("Bật “Đọc chậm”, nghe mẫu vài lần rồi nói theo từng cụm ngắn.");
  else parts.unshift("Khá ổn!");
  return {good:false, text:parts.join(" ")};
}
function diffHtml(text, lang, matched){
  let k = 0, out = "";
  if(lang === "en"){
    const words = text.split(/(\s+)/);
    for(const w of words){
      if(/^\s+$/.test(w)){ out += w; continue; }
      const toks = tokensEn(w);
      if(!toks.length){ out += esc(w); continue; }
      let ok = true; for(let x=0;x<toks.length;x++){ if(!matched[k+x]) ok=false; }
      k += toks.length;
      out += `<span class="${ok?"ok":"miss"}">${esc(w)}</span>`;
    }
  } else {
    for(const ch of Array.from(text)){
      if(isHan(ch) || /[a-z0-9]/i.test(ch)){ out += `<span class="${matched[k]?"ok":"miss"}">${esc(ch)}</span>`; k++; }
      else out += esc(ch);
    }
  }
  return out;
}

/* ===== Học theo trình tự =====
   Mỗi câu nói phải đạt từ PASS điểm mới mở câu sau; xong bước trước mới mở bước sau; xong bài trước mới mở bài sau.
   Bài đã học dở từ trước khi có quy định này vẫn mở được (lesStarted/pronStarted). */
const PASS = 50;
/* Đủ điều kiện (các bước bắt buộc đã xong) và đã xác nhận hoàn thành (người học bấm nút xác nhận ở cuối bài) */
function lesReady(les){ return [0,1,2].every(i => stepDone(les, i)); }
function pronReady(les){ return [0,1,2,3].every(i => pStepDone(les, i)); }
function lesDone(les){ const p = store.progress[les.id]; return !!(p && p.done); }
function pronDone(les){ const p = store.pron[les.id]; return !!(p && p.done); }
/* ===== Xác nhận từng bước =====
   Mỗi bước đủ điều kiện thì nút "Tiếp: …" đổi thành "✓ Xác nhận xong · Tiếp: …"; bấm để ghi nhận bước đó (p.conf[bước] = ngày).
   Tiến độ của bài = số bước đã xác nhận / tổng số bước (bài đã xác nhận hoàn thành = 100%). */
const LES_STEPS = 5, PRON_STEPS = 4;
function stepReady(les, kind, i){
  if(kind === "pron"){ if(i === 1){ const p = store.pron[les.id]; return !!(p && p.tips); } return pStepDone(les, i); }
  if(i <= 2) return stepDone(les, i);
  return !!prog(les.id).role;
}
function stepConf(les, kind, i){ const p = kind === "pron" ? store.pron[les.id] : store.progress[les.id]; return !!(p && (p.done || (p.conf && p.conf[i]))); }
function lesPct(les, kind){
  const p = kind === "pron" ? store.pron[les.id] : store.progress[les.id], n = kind === "pron" ? PRON_STEPS : LES_STEPS;
  if(!p) return 0; if(p.done) return 100;
  let c = 0; for(let i = 0; i < n; i++) if(p.conf && p.conf[i]) c++;
  return Math.round(c / n * 100);
}
function progBar(les, kind){
  const pc = lesPct(les, kind);
  return `<span class="lprog ${pc === 100 ? "full" : ""}" aria-label="Tiến độ ${pc}%"><span class="lprog-b"><i style="width:${pc}%"></i></span><small>${pc}%</small></span>`;
}
/* Đổi nút sang bước tiếp theo thành nút xác nhận khi bước hiện tại đủ điều kiện mà chưa xác nhận */
function confStepBtns(html, les, kind, cur){
  if(!stepReady(les, kind, cur) || stepConf(les, kind, cur)) return html;
  return html.replace(/<button class="btn( ghost)?" data-act="step" data-v="(\d)">([^<]*)<\/button>/g, (m, g, v, label) =>
    +v === cur + 1 ? `<button class="btn finish" data-act="stepconf" data-kind="${kind}" data-id="${les.id}" data-s="${cur}" data-v="${v}">✓ Xác nhận xong · ${label}</button>` : m);
}
/* Nút cuối bài: đủ điều kiện thì thành "Xác nhận hoàn thành bài", bấm để ghi nhận rồi sang bài tiếp theo */
function finishBtn(les, kind, nxt, fallback){
  const done = kind === "pron" ? pronDone(les) : lesDone(les), ready = kind === "pron" ? pronReady(les) : lesReady(les);
  const nextAttr = nxt ? `data-next="${nxt.id}"` : "";
  if(!done && ready) return `<button class="btn finish" data-act="lesfinish" data-kind="${kind}" data-id="${les.id}" ${nextAttr}>✓ Xác nhận hoàn thành bài${nxt ? " · sang bài tiếp theo →" : ""}</button>`;
  const go = nxt ? `<button class="btn ${done ? "" : "ghost"}" data-act="${kind === "pron" ? "popen" : "open"}" data-id="${nxt.id}">Bài tiếp theo: ${esc(nxt.title)} →</button>` : fallback;
  return (done ? `<span class="pill good">✓ Đã hoàn thành bài</span>` : `<span class="need">${kind === "pron" ? "Nghe đủ các âm, làm phần Phân biệt và nói thử từng từ" : "Nghe hết hội thoại, nói thử từng câu then chốt và đóng vai xong"} để xác nhận hoàn thành bài.</span>`) + go;
}
function lesList(les){ const l = les.id.slice(0, 2); return les.work ? LESSONS[l].filter(x => x.work && x.ind === les.ind) : lessonsOf(l); }
function pronList(les){ for(const l of ["en","zh"]) if(PRON[l].includes(les)) return PRON[l]; return [les]; }
function lesStarted(les){ const p = store.progress[les.id]; return !!(p && (p.listen || p.role || Object.keys(p.phrases || {}).length)); }
function pronStarted(les){ const p = store.pron[les.id]; return !!(p && (Object.keys(p.listen || {}).length || p.tips || p.quiz != null)); }
/* Bài nào cũng mở được (người học tự chọn bài); chỉ các bước và các câu bên trong một bài mới phải đi lần lượt */
function lesOpen(les){ return true; }
function pronOpen(les){ return true; }
function stepOpen(les, i){ for(let j = 0; j < Math.min(i, 3); j++) if(!stepDone(les, j)) return false; return true; }
function pStepOpen(les, i){ for(let j = 0; j < i; j++) if(!pStepDone(les, j)) return false; return true; }
function findLes(id){ for(const l of ["en","zh"]){ const f = LESSONS[l].find(x => x.id === id); if(f) return f; } return null; }
function findPron(id){ for(const l of ["en","zh"]){ const f = PRON[l].find(x => x.id === id); if(f) return f; } return null; }
function toast(msg){
  let t = document.getElementById("sfy-toast");
  if(!t){ t = document.createElement("div"); t.id = "sfy-toast"; t.className = "sfy-toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2800);
}
/* Khóa các nút chuyển bước (data-act="step") khi bước đó chưa mở */
function lockStepBtns(html, open){
  return html.replace(/data-act="step" data-v="(\d)"/g, (m, v) => open(+v) ? m : m + ' disabled title="Hoàn thành bước hiện tại để mở bước tiếp theo"');
}
function stepDone(lesson, i){
  const p = prog(lesson.id);
  if(i===0) return p.listen;
  if(i===1) return lesson.phrases.every((_,k) => p.phrases[k] != null);
  if(i===2) return p.role;
  if(i===3) return p.role;
  return false;
}

/* ===================== NGÔN NGỮ GIAO DIỆN =====================
   Giao diện viết bằng tiếng Việt. Khi chọn English hoặc 中文 trong Cài đặt, I18N.apply() thay chữ trên màn hình
   theo bảng I18N_DICT (khớp nguyên cả đoạn chữ) và I18N_RX (đoạn chữ có số, tên…).
   Nội dung bài học (hội thoại, nghĩa của từ, mô tả âm) vẫn giữ tiếng Việt.
   Thêm chữ mới: thêm một dòng "chữ tiếng Việt": ["English", "中文"]. */
const UI_LANGS = [
  {id:"vi", name:"Tiếng Việt", mark:"Vi"},
  {id:"en", name:"English", mark:"En"},
  {id:"zh", name:"中文", mark:"中"}
];
/* I18N_DICT, I18N_RX: xem i18n/strings.js */
const I18N_SECS = {"phát âm":["Pronunciation","发音"], "giao tiếp cơ bản":["Basic conversation","基础会话"], "giao tiếp công việc":["Work conversation","职场会话"], "từ vựng":["Vocabulary","词汇"]};
const I18N = {
  lang(){ return (store.prefs && store.prefs.ui) || "vi"; },
  sec(s, k){ const v = I18N_SECS[s.toLowerCase()]; return v ? v[k] : s; },
  /* dịch một đoạn chữ (trả lại nguyên văn nếu không có trong bảng) */
  t(s){
    const L = this.lang(); if(L === "vi" || !s) return s;
    const k = L === "en" ? 0 : 1, d = I18N_DICT[s];
    if(d) return d[k];
    for(const [rx, en, zh] of I18N_RX){
      const m = s.match(rx); if(!m) continue;
      if(typeof en === "function") return en(...m)[k];
      return s.replace(rx, k === 0 ? en : zh);
    }
    return s;
  },
  node(n){
    if(n.nodeType === 3){
      const v = n.nodeValue, s = v.trim(); if(!s || !/[a-zà-ỹđ]/i.test(s)) return;
      const t = this.t(s.replace(/\s+/g, " "));
      if(t !== s && t !== s.replace(/\s+/g, " ")) n.nodeValue = v.replace(s, t);
      return;
    }
    if(n.nodeType !== 1 || n.tagName === "SCRIPT" || n.tagName === "STYLE") return;
    for(const a of ["title", "placeholder", "aria-label"]){ const v = n.getAttribute(a); if(v){ const t = this.t(v); if(t !== v) n.setAttribute(a, t); } }
    for(let c = n.firstChild; c; c = c.nextSibling) this.node(c);
  },
  apply(root){ if(this.lang() === "vi") return; this.node(root || document.body); },
  start(){
    document.documentElement.lang = this.lang();
    if(this.obs) return;
    this.obs = new MutationObserver(recs => {
      if(this.lang() === "vi") return;
      for(const r of recs){ if(r.type === "characterData") this.node(r.target); else r.addedNodes.forEach(n => this.node(n)); }
      try{ placeBack(); fitMenu(); }catch(e){}
    });
    this.obs.observe(document.body, {childList:true, subtree:true, characterData:true});
  }
};

I18N.start();

/* ===================== TRA TỪ, DỊCH VÀ SỔ TỪ VỰNG =====================
   Dict.lookup(chữ, ngôn ngữ): lấy nghĩa và thông tin của từ.
     1) Dữ liệu sẵn trong web (từ vựng theo chủ đề, từ vựng theo bài): nghĩa tiếng Việt, bính âm, cấp độ.
     2) Phiên âm IPA từ CMUdict có sẵn (ipaOf).
     3) Trên mạng: Google Dịch (bản miễn phí, có từ loại và nghĩa khác), dự phòng MyMemory; tiếng Anh thêm Free Dictionary API
        (dictionaryapi.dev: từ loại, định nghĩa tiếng Anh, câu ví dụ, file phát âm).
   NB: sổ từ vựng, lưu ở store.notebook. WordPop: bảng nhỏ hiện ra khi bấm một từ hoặc bôi đen chữ. */
const Dict = {
  cache:{}, idx:null,
  detect(s){
    if(/[㐀-鿿]/.test(s)) return "zh";
    if(/[ăâđêôơưàáạảãầấậẩẫằắặẳẵèéẹẻẽềếệểễìíịỉĩòóọỏõồốộổỗờớợởỡùúụủũừứựửữỳýỵỷỹ]/i.test(s)) return "vi";
    return "en";
  },
  norm(s, lang){ s = String(s || "").trim().replace(/\s+/g, " "); return lang === "zh" ? s.replace(/[，。！？、；：“”‘’（）《》\s]/g, "") : s.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ""); },
  /* chỉ mục từ có sẵn trong web */
  index(){
    if(this.idx) return this.idx;
    const idx = {}, put = (lang, it, src) => { const k = lang + ":" + it.t.toLowerCase(); if(!idx[k]) idx[k] = Object.assign({src}, it); };
    try{ for(const T of VT_TOPICS) for(const lang of ["en","zh"]) for(const p of ["b","a"]) for(const it of (T[lang] && T[lang][p]) || []) put(lang, it, "topic"); }catch(e){}
    try{ for(const id of Object.keys(VOCAB_RAW)) for(const it of vocabOf(id)) put(id.slice(0, 2), it, "lesson"); }catch(e){}
    return this.idx = idx;
  },
  local(t, lang){ return this.index()[lang + ":" + t.toLowerCase()] || null; },
  tl(lang){ const u = I18N.lang(); return u === "vi" || u === lang ? "vi" : (u === "zh" ? "zh-CN" : "en"); },
  async gtx(q, sl, tl){
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&hl=${tl}&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(q)}`;
    const r = await fetch(u); if(!r.ok) throw new Error("gtx " + r.status);
    const d = await r.json();
    const parts = (d[0] || []).filter(x => x && typeof x[0] === "string");
    const rm = (d[0] || []).find(x => x && x[3]);
    return {tr:parts.map(x => x[0]).join(""), rom:rm ? rm[3] : "", alts:(d[1] || []).map(e => ({pos:e[0], terms:(e[1] || []).slice(0, 6)})), src:d[2] || sl};
  },
  async mymemory(q, sl, tl){
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${sl === "auto" ? "en" : sl}|${tl}`);
    const d = await r.json(); const tr = d && d.responseData && d.responseData.translatedText;
    if(!tr) throw new Error("mymemory"); return {tr, rom:"", alts:[], src:sl};
  },
  async translate(q, sl, tl){
    const k = `tr:${sl}:${tl}:${q}`; if(this.cache[k]) return this.cache[k];
    let res; try{ res = await this.gtx(q, sl, tl); }catch(e){ res = await this.mymemory(q, sl === "zh" ? "zh-CN" : sl, tl); }
    return this.cache[k] = res;
  },
  async enDict(w){
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w.toLowerCase())}`);
    if(!r.ok) return null;
    const d = await r.json(); if(!Array.isArray(d) || !d.length) return null;
    const ph = d.flatMap(e => e.phonetics || []), audio = (ph.find(p => p.audio && /-us\./.test(p.audio)) || ph.find(p => p.audio) || {}).audio || "";
    const defs = [];
    for(const e of d) for(const m of e.meanings || []){ const df = (m.definitions || [])[0]; if(df && defs.length < 4) defs.push({pos:m.partOfSpeech, d:df.definition, ex:df.example || ((m.definitions || []).find(x => x.example) || {}).example || ""}); }
    return {phonetic:d[0].phonetic || (ph.find(p => p.text) || {}).text || "", audio, defs};
  },
  /* thông tin đầy đủ của một từ/cụm từ */
  async lookup(raw, lang){
    lang = lang || this.detect(raw);
    const t = this.norm(raw, lang); if(!t) return null;
    const ck = `lk:${lang}:${t.toLowerCase()}:${this.tl(lang)}`; if(this.cache[ck]) return this.cache[ck];
    const loc = this.local(t, lang);
    const info = {lang, t:loc ? loc.t : t, p:loc && loc.p || "", ipa:"", v:loc && loc.v || "", lv:loc ? loc.lv : undefined, alts:[], defs:[], audio:"", local:!!loc, err:null};
    if(lang === "en"){ const words = t.split(/\s+/), ph = words.map(w => ipaOf(w)); if(ph.every(Boolean)) info.ipa = ph.map(x => x.join("")).join(" "); }
    const jobs = [this.translate(t, lang === "zh" ? "zh-CN" : lang, this.tl(lang)).then(r => {
        if(!info.v || this.tl(lang) !== "vi") info.v = r.tr;
        else if(r.tr && r.tr.toLowerCase() !== info.v.toLowerCase()) info.v2 = r.tr;
        info.alts = r.alts; if(lang === "zh" && !info.p && r.rom) info.p = r.rom;
      })];
    if(lang === "en" && !/\s/.test(t)) jobs.push(this.enDict(t).then(r => { if(!r) return; info.defs = r.defs; info.audio = r.audio; if(!info.ipa && r.phonetic) info.ipa = r.phonetic.replace(/^\/|\/$/g, ""); }));
    const res = await Promise.allSettled(jobs);
    if(res[0].status === "rejected" && !info.v) info.err = "Không tra được nghĩa trên mạng. Kiểm tra kết nối mạng rồi thử lại.";
    if(!info.err) this.cache[ck] = info;
    return info;
  },
  links(t, lang){
    const q = encodeURIComponent(t);
    return lang === "zh"
      ? [["MDBG", `https://www.mdbg.net/chinese/dictionary?page=worddict&wdqb=${q}`], ["Google", `https://www.google.com/search?q=${q}+nghĩa+là+gì`]]
      : [["Cambridge", `https://dictionary.cambridge.org/dictionary/english-vietnamese/${q.replace(/%20/g, "-")}`], ["Oxford", `https://www.oxfordlearnersdictionaries.com/search/english/?q=${q}`], ["Google", `https://www.google.com/search?q=${q}+nghĩa+là+gì`]];
  }
};
const NB = {
  list(){ return store.notebook = store.notebook || []; },
  find(lang, t){ const k = t.toLowerCase(); return this.list().find(x => x.lang === lang && x.t.toLowerCase() === k); },
  add(info){
    if(!info || !info.t || (info.lang !== "en" && info.lang !== "zh")) return null;
    const ex = this.find(info.lang, info.t); if(ex) return ex;
    const it = {id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), lang:info.lang, t:info.t, p:info.p || "", ipa:info.ipa || "", v:info.v || "",
      alts:(info.alts || []).slice(0, 3), defs:(info.defs || []).slice(0, 3), lv:info.lv, audio:info.audio || "", at:ymd(new Date()), known:false};
    this.list().unshift(it); saveStore(); Hist.add({kind:"word", key:"w:" + it.id, lang:it.lang, title:it.t, sub:it.v}); return it;
  },
  remove(id){ store.notebook = this.list().filter(x => x.id !== id); saveStore(); }
};
/* Phần hiển thị thông tin một từ: dùng chung cho bảng tra từ và sổ từ vựng */
/* Bảng chọn nơi lưu: sổ từ vựng hoặc một chủ đề người học đã tạo (hoặc tạo chủ đề mới) */
function saveMenu(info, saved, A, cur){
  const topics = NBT.list().filter(t => t.lang === info.lang).sort((a, b) => (b.id === cur) - (a.id === cur));
  const inT = id => saved && (saved.topics || []).includes(id);
  return `<div class="savemenu"><div class="dc-h">Lưu vào</div>
    ${saved ? "" : `<button class="sm-opt" ${A("saveto")} data-topic="">📒 Sổ từ vựng <small>(chưa xếp chủ đề)</small></button>`}
    ${topics.map(t => `<button class="sm-opt ${inT(t.id) ? "on" : ""}" ${A("saveto")} data-topic="${t.id}" ${inT(t.id) ? "disabled" : ""}>📁 ${esc(t.name)} <small>${inT(t.id) ? "✓ đã có" : `· ${NBT.count(t.id)} từ`}</small></button>`).join("")}
    <div class="sm-new"><input data-save-newt maxlength="40" placeholder="Tên chủ đề mới…" aria-label="Tên chủ đề mới"><button class="btn ghost" ${A("savenew")}>＋ Tạo và lưu</button></div></div>`;
}
/* Lưu từ vào sổ, nếu có topic thì xếp luôn vào chủ đề đó */
function nbSaveTo(info, topic){
  const w = NB.add(info); if(!w) return null;
  if(topic && NBT.get(topic)) w.topics = Array.from(new Set([...(w.topics || []), topic]));
  saveStore(); return w;
}
function dictCard(info, opt = {}){
  if(!info) return "";
  const A = n => opt.ctx === "nb" ? `data-act="nb${n}"` : `data-wp="${n}"`;
  const L = info.lang, saved = NB.find(L, info.t);
  const pron = L === "zh" ? (info.p ? `<span class="dc-ph">${esc(info.p)}</span>` : "") : (info.ipa ? `<span class="dc-ph">/${esc(info.ipa)}/</span>` : "");
  const lv = info.lv !== undefined ? lvTag(info, L) : "";
  const alts = (info.alts || []).slice(0, 3).map(a => `<div class="dc-alt"><i>${esc(a.pos)}</i> ${esc(a.terms.join(", "))}</div>`).join("");

/* Bảng nhỏ khi bấm một từ hoặc bôi đen chữ: Tra từ · Dịch · Lưu vào sổ */
const WordPop = {
  el:null, text:"", lang:"en", view:"menu", info:null, tr:null, busy:false, rect:null,
  ensure(){
    if(this.el) return this.el;
    const el = this.el = document.createElement("div"); el.className = "wpop"; el.setAttribute("role", "dialog"); el.hidden = true;
    document.body.appendChild(el);
    el.addEventListener("mousedown", e => { if(!e.target.closest("button,a")) e.stopPropagation(); });
    el.addEventListener("click", e => { const b = e.target.closest("[data-wp]"); if(!b) return; e.stopPropagation(); this.act(b.dataset.wp, b); });
    document.addEventListener("mousedown", e => { if(this.el && !this.el.hidden && !this.el.contains(e.target)) this.close(); }, true);
    document.addEventListener("keydown", e => { if(e.key === "Escape") this.close(); });
    el.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.matches("[data-save-newt]")){ e.preventDefault(); const b = el.querySelector('[data-wp="savenew"]'); if(b) this.act("savenew", b); } });
    window.addEventListener("scroll", () => { if(this.el && !this.el.hidden && this.view === "menu") this.close(); }, {passive:true});

  },
  open(text, rect, lang){

    if(lang !== "vi" && text.split(" ").length <= 4){ const n = Dict.norm(text, lang); if(n) text = n; }
    this.ensure(); this.text = text; this.lang = lang; this.view = "menu"; this.saveOpen = false; this.savedTo = ""; this.info = null; this.tr = null; this.rect = rect;
    this.paint();
  },
  close(){ if(this.el){ this.el.hidden = true; this.el.innerHTML = ""; } },
  isWord(){ return this.lang !== "vi" && (this.lang === "zh" ? this.text.length <= 8 : this.text.split(" ").length <= 4); },
  paint(){

    let body = "";
    if(this.view === "menu"){
      body = `<div class="wp-menu"><span class="wp-q ${this.lang}">${esc(short)}</span>

        ${this.isWord() ? (NB.find(this.lang, Dict.norm(this.text, this.lang)) ? `<span class="wp-ok">✓ Trong sổ</span>` : `<button data-wp="save">＋ Lưu vào sổ</button>`) : ""}</div>`;
    } else if(this.view === "info"){
      body = this.busy ? `<div class="wp-load">Đang tra “${esc(short)}”…</div>` : dictCard(this.info, {saveOpen:this.saveOpen});
    } else if(this.view === "trans"){
      body = this.busy ? `<div class="wp-load">Đang dịch…</div>` : this.tr && this.tr.err ? `<div class="dc-err">${esc(this.tr.err)}</div>`
        : `<div class="wp-tr"><div class="wp-src ${this.lang}">${esc(this.text)}</div>${this.tr && this.tr.rom ? `<div class="dc-ph">${esc(this.tr.rom)}</div>` : ""}<div class="wp-out">${esc(this.tr ? this.tr.tr : "")}</div>
          <div class="dc-foot">${this.lang !== "vi" ? `<button class="dc-say" data-wp="say" data-t="${esc(this.text)}" data-l="${this.lang}" title="Nghe" aria-label="Nghe">${ICON_PLAY}</button>` : ""}
          ${this.isWord() ? `<button class="btn ghost" data-wp="info">🔍 Tra từ</button>` : ""}
          ${this.isWord() && !NB.find(this.lang, Dict.norm(this.text, this.lang)) ? `<button class="btn dc-save" data-wp="save">＋ Lưu vào sổ</button>` : ""}</div></div>`;
    } else if(this.view === "saved"){
      body = `<div class="wp-menu"><span class="wp-ok">${this.savedTo ? `✓ Đã lưu “${esc(short)}” vào chủ đề 📁 ${esc(this.savedTo)}` : `✓ Đã lưu “${esc(short)}” vào sổ từ vựng`}</span><button data-wp="opennb">Mở sổ</button></div>`;
    }
    el.className = "wpop " + this.view; el.innerHTML = (this.view === "menu" || this.view === "saved" ? "" : `<button class="wp-x" data-wp="close" aria-label="Đóng">×</button>`) + body;
    el.hidden = false;
    this.place();
  },
  place(){
    const el = this.el, r = this.rect || {left:innerWidth / 2, top:innerHeight / 2, bottom:innerHeight / 2, width:0};

    if(a === "opennb"){ this.close(); ui.section = "vocab"; ui.view = "home"; ui.vt = {view:"notebook"}; render(); window.scrollTo(0, 0); return; }

      this.paint(); return;
    }
    if(a === "trans"){
      this.view = "trans"; this.busy = true; this.paint();
      const tl = this.lang === "vi" ? (store.prefs.lang === "zh" ? "zh-CN" : "en") : Dict.tl(this.lang);
      try{ this.tr = await Dict.translate(this.text, this.lang === "zh" ? "zh-CN" : this.lang, tl); }
      catch(e){ this.tr = {err:"Không dịch được. Kiểm tra kết nối mạng rồi thử lại."}; }

  rename(id, name){ const t = this.get(id); if(t){ t.name = name.slice(0, 40); saveStore(); } },

/* Bắt đầu ôn: src "sel" = các từ đã chọn, "rand" = ngẫu nhiên trong danh sách đang xem */
function nbStart(mode, src){
  const nb = nbState(), L = store.prefs.lang;
  let pool = src === "sel" ? NB.list().filter(x => x.lang === L && nb.sel[x.id]) : nbWords();
  pool = shuffle(pool.slice());
  if(src === "rand" && nb.qn) pool = pool.slice(0, nb.qn);
  if(!pool.length) return;
  if(mode === "cards"){ nb.study = {mode, ids:pool.map(x => x.id), i:0, flip:false, got:0}; return; }
  /* câu hỏi: nửa hỏi nghĩa của từ, nửa hỏi từ theo nghĩa; phương án sai lấy từ các từ khác trong sổ, thiếu thì lấy thêm từ có sẵn trong web */
  const extra = [];
  for(const w of NB.list().filter(x => x.lang === L)) extra.push({t:w.t, v:w.v});
  try{ for(const T of VT_TOPICS) for(const it of T[L].b) extra.push({t:it.t, v:it.v}); }catch(e){}
  const qs = pool.map((w, k) => {
    const rev = k % 2 === 1 && !!w.v, key = rev ? "t" : "v";
    const ans = w[key] || "(chưa có nghĩa)";
    const wrong = shuffle(extra.filter(e => e[key] && e[key] !== ans && e.t !== w.t)).reduce((a, e) => { if(a.length < 3 && !a.includes(e[key])) a.push(e[key]); return a; }, []);
    const opts = shuffle([ans, ...wrong]);
    return {id:w.id, rev, opts, ans:opts.indexOf(ans)};
  });
  nb.study = {mode, ids:pool.map(x => x.id), qs, i:0, picked:null, correct:0, wrong:[]};
}
function renderNbStudy(){

  if(s.mode === "cards"){
    if(s.i >= words.length) return head + `<div class="summary"><b>Xong một lượt thẻ!</b><span>Bạn đã ôn ${words.length} từ, nhớ ${s.got} từ.</span>
      <div class="row"><button class="btn" data-act="nbstudy" data-v="cards" data-src="again">Ôn lượt nữa</button><button class="btn ghost" data-act="nbstudy" data-v="quiz" data-src="again">Làm bài kiểm tra</button><button class="btn ghost" data-act="nbstop">Về sổ từ vựng</button></div></div></div>`;
    const w = words[s.i];
    return head + `<div class="vt-flash ${s.flip ? "flip" : ""}" style="width:100%;max-width:720px;margin:0 auto">
      <div class="vt-fprog">Thẻ ${s.i + 1}/${words.length}</div>
      <button class="vt-front nb-card" data-act="nbflip"><span class="vt-word ${w.lang}">${esc(w.t)}</span><span class="vt-ph">${nbPron(w)}</span>
        ${s.flip ? `<span class="vt-mean">${esc(w.v || "")}</span>${(w.defs || [])[0] ? `<span class="vt-hint">${esc(w.defs[0].d)}</span>` : ""}` : `<span class="vt-hint">Bấm để lật thẻ xem nghĩa</span>`}</button>
      <div class="row"><button class="btn ghost" data-act="nbsay" data-v="${w.id}">${ICON_PLAY} Nghe</button>
        ${s.flip ? `<button class="btn ghost" data-act="nbcard" data-v="0">😕 Chưa nhớ</button><button class="btn" data-act="nbcard" data-v="1">😊 Đã nhớ</button>` : `<button class="btn" data-act="nbflip">Lật thẻ</button>`}</div></div></div>`;
  }
  if(s.i >= s.qs.length){
    const pct = Math.round(s.correct / s.qs.length * 100);
    const wrongs = s.wrong.map(id => NB.list().find(x => x.id === id)).filter(Boolean);
    return head + `<div class="summary"><b>Kết quả: ${s.correct}/${s.qs.length} câu đúng (${pct}%)</b><span>+${s.correct * 10} XP. ${pct >= 80 ? "Rất tốt!" : "Ôn lại các từ sai rồi làm thêm một lượt nhé."}</span>
      ${wrongs.length ? `<div class="nb-wrong"><div class="dc-h">Các từ làm sai</div>${wrongs.map(x => `<div><b class="${x.lang}">${esc(x.t)}</b> <span class="dc-ph">${nbPron(x)}</span> · ${esc(x.v || "")}</div>`).join("")}</div>` : ""}
      <div class="row">${wrongs.length ? `<button class="btn" data-act="nbstudy" data-v="quiz" data-src="wrong">Kiểm tra lại ${wrongs.length} từ sai</button>` : ""}
        <button class="btn ${wrongs.length ? "ghost" : ""}" data-act="nbstudy" data-v="quiz" data-src="again">Làm lại cả bài</button><button class="btn ghost" data-act="nbstop">Về sổ từ vựng</button></div></div></div>`;
  }
  const q = s.qs[s.i], w = NB.list().find(x => x.id === q.id);
  if(!w){ s.i++; return renderNbStudy(); }
  return head + `<div class="vt-quiz" style="width:100%;max-width:720px;margin:0 auto"><div class="vt-fprog">Câu ${s.i + 1}/${s.qs.length} · đúng ${s.correct}</div>
    <div class="vt-qword">${q.rev ? `<span class="vt-mean" style="font-size:24px">${esc(w.v)}</span>` : `<span class="vt-word ${w.lang}">${esc(w.t)}</span><button class="dc-say" data-act="nbsay" data-v="${w.id}" aria-label="Nghe">${ICON_PLAY}</button>`}</div>
    <p class="vt-qask">${q.rev ? "Từ nào có nghĩa này?" : "Nghĩa của từ này là gì?"}</p>
    <div class="vt-opts">${q.opts.map((o, k) => { const cls = s.picked == null ? "" : k === q.ans ? "good" : k === s.picked ? "bad" : "";
      return `<button class="vt-opt ${cls} ${q.rev ? w.lang : ""}" data-act="nbpick" data-v="${k}" ${s.picked != null ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>
    ${s.picked != null ? `<div class="next"><span class="dc-ph">${esc(w.t)} ${nbPron(w)} · ${esc(w.v || "")}</span><button class="btn" data-act="nbnext">${s.i + 1 < s.qs.length ? "Câu tiếp →" : "Xem kết quả"}</button></div>` : ""}</div></div>`;
}
async function nbLookup(){
  const nb = nbState(), inp = document.querySelector("[data-nb-q]"); if(inp) nb.q = inp.value;
  clearTimeout(nbLookup.t);
  const q = (nb.q || "").trim(); if(!q){ nb.info = null; nb.lastQ = ""; render(); return; }
  if(q === nb.lastQ && (nb.info || nb.busy)) return;
  nb.lastQ = q;
  let lang = Dict.detect(q); if(lang === "vi") lang = store.prefs.lang;
  nb.busy = true; nb.saveOpen = false; render();
  const info = await Dict.lookup(q, lang); nb.busy = false;
  if((nbState().q || "").trim() === q){ nb.info = info; render(); }
}
function nbAct(act, el){
  const nb = nbState(), byId = id => NB.list().find(y => y.id === id);
  if(act === "nblook"){ nbLookup(); return true; }
  if(act === "nbsaveopen"){ nb.saveOpen = !nb.saveOpen; render(); return true; }
  if(act === "nbsaveto" || act === "nbsavenew"){
    let topic = el.dataset.topic || "";
    if(act === "nbsavenew"){ const i = document.querySelector(".nb-add [data-save-newt]"), name = (i ? i.value : "").trim(); if(!name){ if(i) i.focus(); return true; } topic = NBT.add(name, nb.info.lang).id; }
    if(nb.info && nbSaveTo(nb.info, topic)){ nb.q = ""; nb.lastQ = ""; nb.info = null; nb.saveOpen = false; if(topic) nb.topic = topic; const i = document.querySelector("[data-nb-q]"); if(i) i.value = ""; }
    render(); return true;
  }
  if(act === "nbadd"){ const w = nb.info && NB.add(nb.info); if(w){ if(nb.topic !== "all"){ w.topics = Array.from(new Set([...(w.topics || []), nb.topic])); saveStore(); } nb.q = ""; nb.lastQ = ""; nb.info = null; const i = document.querySelector("[data-nb-q]"); if(i) i.value = ""; } render(); return true; }
  if(act === "nbsayq"){ TTS.speak(el.dataset.t, el.dataset.l); return true; }
  if(act === "nbsay"){ const x = byId(el.dataset.v); if(x){ if(x.audio && x.lang === "en"){ try{ new Audio(x.audio).play(); return true; }catch(e){} } TTS.speak(x.t, x.lang); } return true; }
  if(act === "nbknow"){ const x = byId(el.dataset.v); if(x){ x.known = !x.known; saveStore(); render(); } return true; }
  if(act === "nbdel"){ NB.remove(el.dataset.v); delete nb.sel[el.dataset.v]; render(); return true; }
  if(act === "nbfilter"){ nb.filter = el.dataset.v; render(); return true; }
  /* chủ đề */
  if(act === "nbtopic"){ nb.topic = el.dataset.v; nb.edit = null; nb.delAsk = null; render(); return true; }
  if(act === "nbtnew"){ nb.edit = "new"; render(); setTimeout(() => { const i = document.querySelector("[data-nb-tname]"); if(i) i.focus(); }, 0); return true; }
  if(act === "nbtrename"){ nb.edit = nb.topic; render(); setTimeout(() => { const i = document.querySelector("[data-nb-tname]"); if(i){ i.focus(); i.select(); } }, 0); return true; }
  if(act === "nbtcancel"){ nb.edit = null; render(); return true; }
  if(act === "nbtsave"){
    const i = document.querySelector("[data-nb-tname]"), name = (i ? i.value : "").trim(); if(!name){ if(i) i.focus(); return true; }
    if(nb.edit === "new"){
      const t = NBT.add(name, store.prefs.lang);
      const ids = Object.keys(nb.sel).filter(id => nb.sel[id]);
      for(const id of ids){ const w = byId(id); if(w && w.lang === t.lang) w.topics = Array.from(new Set([...(w.topics || []), t.id])); }
      if(ids.length){ nb.sel = {}; saveStore(); }
      nb.topic = t.id;
    } else NBT.rename(nb.edit, name);
    if(i) i.value = ""; nb.edit = null; render(); return true;
  }
  if(act === "nbtdel"){ if(nb.delAsk === nb.topic){ NBT.remove(nb.topic); nb.topic = "all"; nb.delAsk = null; } else nb.delAsk = nb.topic; render(); return true; }
  /* chọn từ */
  if(act === "nbselall"){ for(const w of nbWords()) nb.sel[w.id] = true; render(); return true; }
  if(act === "nbselnone"){ nb.sel = {}; render(); return true; }
  if(act === "nbunt"){ for(const id of Object.keys(nb.sel)){ const w = nb.sel[id] && byId(id); if(w && w.topics) w.topics = w.topics.filter(x => x !== nb.topic); } nb.sel = {}; saveStore(); render(); return true; }
  /* ôn và kiểm tra */
  if(act === "nbstudy"){
    const src = el.dataset.src, mode = el.dataset.v, prev = nb.study;
    if((src === "again" || src === "wrong") && prev){
      const ids = src === "wrong" ? prev.wrong.slice() : prev.ids.slice();
      const keep = nb.sel; nb.sel = {}; for(const id of ids) nb.sel[id] = true; nbStart(mode, "sel"); nb.sel = keep;
    } else nbStart(mode, src);
    render(); window.scrollTo(0, 0); return true;
  }
  if(act === "nbstop"){ nb.study = null; render(); window.scrollTo(0, 0); return true; }
  if(act === "nbflip"){ nb.study.flip = !nb.study.flip; render(); return true; }
  if(act === "nbcard"){ const s = nb.study, w = byId(s.ids[s.i]); if(el.dataset.v === "1"){ s.got++; if(w && !w.known){ w.known = true; vtAddXP(2); } } else if(w) w.known = false; saveStore(); s.i++; s.flip = false; render(); return true; }
  if(act === "nbpick"){
    const s = nb.study, q = s.qs[s.i], w = byId(q.id); if(s.picked != null) return true;
    s.picked = +el.dataset.v;
    if(s.picked === q.ans){ s.correct++; if(w) w.ok = (w.ok || 0) + 1; vtAddXP(10); }
    else { s.wrong.push(q.id); if(w){ w.bad = (w.bad || 0) + 1; w.known = false; } }
    saveStore(); if(w && !q.rev) TTS.speak(w.t, w.lang); render(); return true;
  }
  if(act === "nbnext"){ const s = nb.study; s.i++; s.picked = null; if(s.i >= s.qs.length) Hist.add({kind:"nbquiz", key:"nq", lang:store.prefs.lang, title:"Sổ từ vựng", sub:`${s.correct}/${s.qs.length} câu đúng`}); render(); return true; }
  return false;
}
document.addEventListener("change", e => {
  const t = e.target; if(!t.matches) return;
  if(t.matches("[data-nb-sel]")){ const nb = nbState(); nb.sel[t.dataset.nbSel] = t.checked; render(); return; }

    const nb = nbState(), tid = t.value;
    for(const id of Object.keys(nb.sel)){ const w = nb.sel[id] && NB.list().find(y => y.id === id); if(w) w.topics = Array.from(new Set([...(w.topics || []), tid])); }
    nb.sel = {}; saveStore(); render();
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.matches && e.target.matches(".nb-add [data-save-newt]")){ e.preventDefault(); const b = document.querySelector('[data-act="nbsavenew"]'); if(b) b.click(); }

});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.matches && e.target.matches("[data-nb-q]")){ e.preventDefault(); nbLookup(); } });
document.addEventListener("input", e => {
  if(!e.target.matches || !e.target.matches("[data-nb-q]")) return;

});

/* Bài đọc luyện tập kiểu tin tức, SFY tự biên soạn (không phải tin thật). lv: cấp độ; sum: tóm tắt tiếng Việt. */
/* NEWS: xem data/news.js */

/* ===================== ĐỌC BÁO =====================
   Bài đọc kiểu tin tức (NEWS) và bài người học tự dán vào (store.news.mine).
   Bấm một từ → bảng tra nhanh (WordPop); bôi đen câu → Dịch; nút 🌐 dịch cả đoạn; 🔊 đọc to. */
function newsState(){ store.news = Object.assign({read:{}, mine:[]}, store.news || {}); return store.news; }
function newsUi(){ return ui.news = ui.news || {id:null, view:null, tr:{}, showTr:false}; }
function newsAll(){ return NEWS.concat(newsState().mine); }
function newsTokens(text, lang){
  if(lang === "zh"){
    let segs;
    try{ segs = [...new Intl.Segmenter("zh", {granularity:"word"}).segment(text)]; }catch(e){ segs = [...text].map(c => ({segment:c, isWordLike:/[㐀-鿿]/.test(c)})); }
    return segs.map(s => s.isWordLike && /[㐀-鿿]/.test(s.segment) ? `<span class="rw zh" data-act="rword" data-l="zh">${esc(s.segment)}</span>` : esc(s.segment)).join("");
  }
  return text.split(/([A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z])/).map((p, i) => i % 2 ? `<span class="rw" data-act="rword" data-l="en">${esc(p)}</span>` : esc(p)).join("");
}
function renderNews(){
  const nu = newsUi(), ns = newsState(), L = store.prefs.lang;

        <b class="news-t ${a.lang}">${esc(a.title)}</b>${a.sum ? `<small>${esc(a.sum)}</small>` : ""}</span></button>`;
  const mine = ns.mine.filter(a => a.lang === L);
  const links = L === "zh"
    ? [["BBC 中文", "https://www.bbc.com/zhongwen/simp"], ["人民网", "http://www.people.com.cn/"], ["Mandarin Bean (bài đọc theo cấp HSK)", "https://mandarinbean.com/"]]
    : [["BBC Learning English", "https://www.bbc.co.uk/learningenglish"], ["Breaking News English", "https://breakingnewsenglish.com/"], ["News in Levels", "https://www.newsinlevels.com/"], ["VOA Learning English", "https://learningenglish.voanews.com/"]];

    <div class="page wide">${voiceWarn(L)}
      <button class="nb-entry" data-act="newspaste"><span class="vt-ic" aria-hidden="true">📋</span><span class="vt-cb"><b>Đọc bài báo bạn tự tìm</b><small>Dán nội dung một bài báo ${L === "zh" ? "tiếng Trung" : "tiếng Anh"} bất kỳ vào đây để đọc với công cụ tra từ và dịch</small></span><span class="nb-entry-go">Dán bài →</span></button>
      ${mine.length ? `<h3 class="grp-h">Bài bạn đã dán</h3><div class="news-grid">${mine.map(card).join("")}</div>` : ""}
      <h3 class="grp-h">Bài luyện đọc</h3>
      <div class="news-grid">${NEWS.filter(a => a.lang === L).map(card).join("")}</div>
      <p class="vt-note">Các bài luyện đọc ở đây do SFY tự viết theo phong cách tin tức để luyện đọc, không phải tin thời sự thật.</p>
      <div class="tip">Muốn đọc tin thật? Thử các trang báo cho người học: ${links.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join(" · ")}. Đọc ở đó rồi chép đoạn bạn thích vào mục “Đọc bài báo bạn tự tìm”.</div>
    </div>`;

function renderNewsArticle(a){

function renderNewsPaste(){

function newsAct(act, el){
  const nu = newsUi(), ns = newsState();

  if(act === "newsopen"){ { const a = newsAll().find(x => x.id === el.dataset.v); if(a) Hist.add({kind:"news", key:"n:" + a.id, id:a.id, lang:a.lang, title:a.title, sub:a.lv}); } nu.id = el.dataset.v; nu.view = null; nu.showTr = false; render(); window.scrollTo(0, 0); return true; }
  if(act === "newshome"){ TTS.stop(); nu.id = null; nu.view = null; render(); window.scrollTo(0, 0); return true; }
  if(act === "newspaste"){ nu.view = "paste"; nu.id = null; render(); window.scrollTo(0, 0); return true; }

    ns.mine.unshift(a); ns.mine = ns.mine.slice(0, 30); saveStore();
    if(lang !== store.prefs.lang){ store.prefs.lang = lang; saveStore(); }

    nu.view = null; nu.id = a.id; render(); window.scrollTo(0, 0); return true;

  const a = art(); if(!a) return false;
  if(act === "newssay"){ TTS.stop(); TTS.speak(a.paras[+el.dataset.v], a.lang); return true; }
  if(act === "newssayall"){ TTS.stop(); const all = [a.title, ...a.paras]; let i = 0; const next = () => { if(i < all.length) TTS.speak(all[i++], a.lang, next); }; next(); return true; }
  const tr = async i => {
    const k = a.id + ":" + i; if(nu.tr[k] && (nu.tr[k].text || nu.tr[k].busy)) return;
    nu.tr[k] = Object.assign(nu.tr[k] || {}, {busy:true}); render();
    try{ const r = await Dict.translate(i === "t" ? a.title : a.paras[i], a.lang === "zh" ? "zh-CN" : "en", Dict.tl(a.lang)); nu.tr[k] = Object.assign(nu.tr[k], {busy:false, text:r.tr, err:null}); }
    catch(e){ nu.tr[k] = Object.assign(nu.tr[k], {busy:false, err:"Không dịch được. Kiểm tra kết nối mạng rồi thử lại."}); }
    render();
  };
  if(act === "newstr"){ const i = +el.dataset.v, k = a.id + ":" + i; nu.tr[k] = nu.tr[k] || {}; nu.tr[k].open = !nu.tr[k].open; if(nu.tr[k].err) nu.tr[k].err = null; render(); if(nu.tr[k].open) tr(i); return true; }
  if(act === "newstrall"){ nu.showTr = !nu.showTr; render(); if(nu.showTr){ tr("t"); a.paras.forEach((_, i) => tr(i)); } return true; }
  return false;
}

/* ===================== LỊCH SỬ HỌC =====================

const HIST_KINDS = {

const Hist = {
  list(){ return store.hist = store.hist || []; },

function routeVal(x, L){ return x && typeof x === "object" && !Array.isArray(x) && (x.en !== undefined || x.zh !== undefined) ? x[L] : x; }
function routeUnitLessons(units, L){
  const all = lessonsOf(L), out = []; let k = 0;
  UNITS.forEach((u, i) => { if(units.includes(i + 1)) out.push(...all.slice(k, k + u.n)); k += u.n; });
  return out;
}
function routeNews(st, L){ return NEWS.filter(a => a.lang === L && (st.lv ? (routeVal(st.lv, L) || []).includes(a.lv) : true) && (st.topics ? st.topics.includes(a.topic) : true)); }
/* tiến độ một bước: {done, total, unit, target} — target là bài/chủ đề nên mở tiếp */
function routeStep(st, L){
  if(st.t === "pron"){ const list = PRON[L].slice(routeVal(st.from, L) || 0, routeVal(st.n, L)); const done = list.filter(pronDone).length; return {done, total:list.length, unit:"bài", target:list.find(x => !pronDone(x))}; }
  if(st.t === "speak"){ const list = routeUnitLessons(st.units, L); const done = list.filter(lesDone).length; return {done, total:list.length, unit:"bài", target:list.find(x => !lesDone(x))}; }
  if(st.t === "vocab"){ const Ts = st.topics.map(id => VT_TOPICS.find(t => t.id === id)).filter(Boolean); const total = Ts.reduce((n, T) => n + T[L].b.length + T[L].a.length, 0), done = Ts.reduce((n, T) => n + vtTopicDone(L, T), 0);
    return {done, total, unit:"từ", target:Ts.find(T => vtTopicDone(L, T) < T[L].b.length + T[L].a.length)}; }
  if(st.t === "work"){ const inds = WORK_INDS[L].map(ind => LESSONS[L].filter(x => x.ind === ind.id)); const done = inds.filter(ls => ls.length && ls.every(lesDone)).length; return {done:Math.min(done, st.n), total:st.n, unit:"ngành", target:null}; }
  if(st.t === "news"){ const list = routeNews(st, L), rd = newsState().read; const done = list.filter(a => rd[a.id]).length; return {done, total:list.length, unit:"bài", target:list.find(a => !rd[a.id])}; }
  if(st.t === "nb"){ const n = NB.list().filter(x => x.lang === L).length; return {done:Math.min(n, st.words), total:st.words, unit:"từ", target:null}; }
  return {done:0, total:1, unit:""};
}
function routeHtml(){
  const L = store.prefs.lang, cur = ROUTES.find(r => r.id === store.prefs.route) || ROUTES[0];
  const pct = r => { const s = r.steps.map(st => routeStep(st, L)); return Math.round(s.reduce((n, x) => n + (x.total ? x.done / x.total : 0), 0) / s.length * 100); };
  const goals = ROUTES.map(r => `<button class="rt-goal ${r.id === cur.id ? "on" : ""}" data-act="routepick" data-v="${r.id}" aria-pressed="${r.id === cur.id}">
      <span class="rt-gi" aria-hidden="true">${r.icon}</span><b>${esc(r.name)}</b><small>${esc(r.desc)}</small><span class="rt-gp"><i style="width:${pct(r)}%"></i></span><em>${pct(r)}% · ${r.steps.length} bước</em></button>`).join("");
  let first = -1;
  const steps = cur.steps.map((st, i) => {
    const p = routeStep(st, L), done = p.total > 0 && p.done >= p.total;
    if(!done && first < 0) first = i;
    const state = done ? "done" : i === first ? "now" : "later";
    return `<li class="rt-step ${state}">
      <span class="rt-n">${done ? "✓" : i + 1}</span>
      <div class="rt-b"><b>${esc(st.name)}</b><small>${esc(routeVal(st.desc, L))}</small>
        <span class="rt-bar"><i style="width:${p.total ? Math.round(p.done / p.total * 100) : 0}%"></i></span><span class="rt-c">${p.done}/${p.total} ${p.unit}</span></div>
      ${state === "later" ? `<span class="rt-wait">Sau bước ${i}</span>` : `<button class="btn ${done ? "ghost" : ""}" data-act="routego" data-v="${i}">${done ? "Ôn lại" : p.done ? "Học tiếp →" : "Bắt đầu →"}</button>`}</li>`;
  }).join("");
  return `<h2 class="hsec">Gợi ý lộ trình</h2>
    <p class="rt-intro">Chọn mục tiêu của bạn. Mỗi lộ trình gồm các bước theo thứ tự, tiến độ tự cập nhật khi bạn học.</p>
    <div class="rt-goals">${goals}</div>
    <div class="rt-path"><div class="rt-head"><span aria-hidden="true">${cur.icon}</span><div><b>${esc(cur.name)}</b><small>${L === "zh" ? "Tiếng Trung" : "Tiếng Anh"} · ${cur.steps.length} bước</small></div></div>
      <ol class="rt-steps">${steps}</ol></div>`;
}
function routeAct(act, el){
  if(act === "routepick"){ store.prefs.route = el.dataset.v; saveStore(); render(); return true; }
  if(act === "routego"){
    const L = store.prefs.lang, cur = ROUTES.find(r => r.id === store.prefs.route) || ROUTES[0], st = cur.steps[+el.dataset.v]; if(!st) return true;
    const p = routeStep(st, L), go = (a, id) => { const b = document.createElement("button"); b.dataset.act = a; b.dataset.id = id; b.style.display = "none"; document.getElementById("app").appendChild(b); b.click(); };
    if(st.t === "pron"){ if(p.target) go("popen", p.target.id); else { ui.section = "pron"; ui.view = "home"; render(); window.scrollTo(0, 0); } return true; }
    if(st.t === "speak"){ if(p.target) go("open", p.target.id); else { ui.section = "speak"; ui.view = "home"; render(); window.scrollTo(0, 0); } return true; }
    if(st.t === "vocab"){ ui.section = "vocab"; ui.view = "home"; ui.vt = p.target ? {topic:p.target.id, part:"b", mode:"list"} : {topic:null, part:"b", mode:"list"}; render(); window.scrollTo(0, 0); return true; }
    if(st.t === "work"){ ui.section = "work"; ui.view = "home"; render(); window.scrollTo(0, 0); return true; }
    if(st.t === "news"){ ui.section = "news"; ui.view = "home"; ui.news = {id:p.target ? p.target.id : null, view:null, tr:{}, showTr:false}; render(); window.scrollTo(0, 0); return true; }
    if(st.t === "nb"){ ui.section = "vocab"; ui.view = "home"; ui.vt = {view:"notebook"}; render(); window.scrollTo(0, 0); return true; }
  }
  return false;
}

function menuClear(){
  const side = document.querySelector(".top .brand .side"), main = document.querySelector(".main"); if(!main) return 0;

function pomoTip(){

/* ===================== VIDEO KHẨU HÌNH (hoạt hình SFY tự vẽ) =====================
   Mỗi âm là một chuỗi khung hình: nghỉ → khẩu hình của âm → (nhả ra nguyên âm) → nghỉ.
   Hai góc nhìn: môi nhìn thẳng và mặt cắt nghiêng (môi, răng, lưỡi, vòm miệng, mũi).
   Thông số: jaw độ mở hàm, spread kéo khóe môi (-1 chu tròn … 1 kéo dẹt), protr chu môi ra trước,

/* ===================== TỪ VỰNG THEO CHỦ ĐỀ =====================
